terminal_mission:
  id: lazy-fortran-generated-compiler
  statement: >
    Deliver a specification-generated Fortran compiler whose cross-repository
    source-to-executable behavior is reproducible and independently verified.
  completion_requires:
    - every activated milestone has a PASS task and retained evidence
    - the final compiler path passes from a clean checkout
    - component revisions and interfaces are pinned centrally
    - each observable has an independent oracle

milestone_pass_requires:
  - pinned component revisions
  - positive fixture
  - invalid near-neighbor fixture
  - independent oracle
  - clean-checkout reproduction
  - regression-corpus entry
  - trace and artifact evidence

active_task: T-M3-e0181-residual-selection

