schema: 1

MAX_PARALLEL_WORKERS: 4

# A task is READY when it is OPEN and its declared dependencies, immutable
# inputs, verifier, output and ownership are all available.
ready_frontier:
  - T-L3-frontend-program-root-name-implementation

controller_ownership:
  owner: controller
  repository: lazy-fortran-new
  worktree: /home/ert/code/lazy-fortran-new
  reserved_writes:
    - STATUS.md
    - MILESTONES.md
    - TASK_POOL.yaml
    - repos.toml
    - contracts/**
    - tests/fixtures/**
    - tests/golden/**
    - artifacts/traces/**
    - artifacts/manifests/**
    - integration-merges

control_plane:
  repository: lazy-fortran-new
  entrypoint_files:
    - AGENTS.md
    - TASK_POOL.yaml
    - STATUS.md
    - MILESTONES.md
    - ROADMAP.md
    - docs/goal-mode.md
    - docs/delivery-method.md
