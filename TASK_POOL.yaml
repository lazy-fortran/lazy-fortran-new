tasks:
  - id: T-L0-replay-current
    milestone: L0
    title: Replay L0 from the current clean central checkout
    status: PASS
    prerequisites:
      - all component pins in repos.toml resolve to clean main checkouts
    verifier_command: scripts/run_e2e.sh
    evidence_paths:
      - tests/e2e/run-l0.sh
      - artifacts/manifests/l0-lexical-slice-v0.toml
      - artifacts/traces/l0-lexical-slice-v0.json
    retry_count: 2
    integration_cycle_trigger: milestone_pass
  - id: T-L0-contract-boundary
    milestone: L0
    title: Declare and verify L0 as a component-local generator boundary
    status: PASS
    prerequisites: [T-L0-replay-current]
    verifier_command: scripts/run_e2e.sh
    evidence_paths:
      - docs/component-contracts.md
      - artifacts/reports/L0/replay-boundary-v3-luna-scope.md
      - artifacts/reports/L0/replay-boundary-v3-luna-contract.md
      - artifacts/reports/L0/replay-boundary-v3-luna-oracle.md
      - artifacts/reports/L0/replay-boundary-v3-luna-reproducibility.md
      - tests/e2e/run-l0.sh
      - artifacts/traces/l0-lexical-slice-v0.json
    retry_count: 1
    integration_cycle_trigger: interface_change
  - id: T-L1-replay-current
    milestone: L1
    title: Replay L1 from the current clean central checkout
    status: PASS
    prerequisites: [T-L0-contract-boundary]
    verifier_command: tests/e2e/run-l1.sh
    evidence_paths:
      - tests/e2e/run-l1.sh
      - artifacts/manifests/l1-frontend-slice-v0.toml
      - artifacts/traces/l1-frontend-slice-v0.json
      - artifacts/reports/L1/replay-v1-luna-scope.md
      - artifacts/reports/L1/replay-v1-luna-contract.md
      - artifacts/reports/L1/replay-v2-luna-scope.md
      - artifacts/reports/L1/replay-v2-luna-contract.md
      - artifacts/reports/L1/replay-v2-luna-oracle.md
      - artifacts/reports/L1/replay-v2-luna-reproducibility.md
      - artifacts/reports/L1/replay-v1-luna-oracle.md
      - artifacts/reports/L1/replay-v1-luna-reproducibility.md
    retry_count: 1
    integration_cycle_trigger: milestone_pass
  - id: T-L2-vertical-slice
    milestone: L2
    title: Deliver the first frontend-witness-to-executable path
    status: OPEN
    prerequisites: [T-L1-replay-current]
    verifier_command: scripts/verify_active_milestone.sh
    evidence_paths:
      - tests/e2e/run-l2.sh
      - tests/e2e/oracle_l2.py
      - contracts/mir-v0.sxs
      - research/decisions/D0122-narrow-l2-boundary.md
    retry_count: 3
    integration_cycle_trigger: interface_change

integration_cycle:
  triggers:
    verified_deltas: 4
    no_progress_cycles: 3
    milestone_pass: true
    interface_change: true
  required_actions:
    - stop fast-cycle task selection
    - verify all pins and active contracts
    - rerun every relevant central verifier from a clean checkout
    - obtain the four independent Luna reviews
    - reconcile evidence and update STATUS.md/MILESTONES.md
    - commit central metadata only after the gates pass
  resume_rule: select the next dependency-ready OPEN task; do not stop at a local PASS
