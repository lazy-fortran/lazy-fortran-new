id: "E0123"
title: "Fresh bounded retry of residual semantic rows"
question: >
  Can a bounded fresh retry resolve the residual semantic constraint rows?
status: running          # draft | running | reported | abandoned
opened: "2026-08-14"
closed: ""
run_id: R000206

# Every commit the result depends on. Exact, not "main".
repos:
  lazy-fortran-new: "b90fae7"
  standard-new: "5c1d258e61c38336cfbb316b76ba8b33e4717b94"

# What goes in. Pinned artifacts by manifest name; profiles by ID.
inputs:
  standard: j3-24-007
  profile: "complete-core"
  predecessor: E0117/R000193
  predecessor_rows: .cache/runs/E0117/R000003-full/rows.jsonl
  canonical_text: .cache/runs/E0001/R000003/j3-24-007.canonical.txt
  page_index: .cache/runs/E0001/R000003/j3-24-007.pages.index
  semantic_schema: research/experiments/E0116-can-bounded-qwen-semantic-proposals-clos/semantic-schema.json
  post_run_merge_gate_commit: "28124d0"
  repair_policy: D0073

# The axes being varied. Omit the key if there is only one condition.
variables:
  model: [qwen36-35b-a3b]
  reasoning: [off, on-after-failure]
  selection: [unresolved-and-hard-failure-only]
  max_turns: [32]
  max_tokens: [4096]
  finalization_turns: [3]
  witness_mode: [required]

# Explain whether model names form a controlled family ladder or separate
# controls. Pin revisions and runtime settings before the first run.
model_selection: >
  One local Qwen 3.6 35B-A3B checkpoint through the verified upstream
  llama.cpp master build. This is a bounded residual retry, not a model
  comparison. Thinking is off first and is enabled only in a fresh episode
  after an unresolved or hard-failure result.

# Name these before running anything. Choosing a metric after seeing the data
# is how an experiment becomes a demonstration.
metrics:
  - denominator_rows
  - retry_rows
  - prior_accepted_controls
  - retry_accepted_rows
  - retry_unresolved_rows
  - retry_hard_failures
  - schema_source_gate_failures
  - witness_required_rejections
  - evidence_calls
  - submission_calls
  - tool_calls
  - model_calls
  - thinking_escalations
  - transport_retries
  - loop_recoveries
  - prompt_tokens
  - completion_tokens
  - total_tokens
  - wall_s_total
  - mutation_controls
  - merged_terminal_rows

# State the complete eligible set and exclusions before the first run. A rate
# over the successful subset is reported alongside the strict rate.
denominator: >
  All 287 E0117 row keys remain the experiment denominator. The retry cell
  processes exactly the 53 rows whose E0117 terminal status is unresolved or
  hard_failure; the other 234 rows are retained as immutable predecessor
  controls and are merged only by row key after validation. No row is dropped
  because the model abstains or fails.

# State the independent behavioral or structural oracle. Self-consistency is
# not an oracle.
independent_oracle: >
  The deterministic E0116 schema/source gate, canonical source hash, page
  index, row identity, prior accepted controls and witness validator. A model
  proposal or self-consistent witness is not an independent semantic oracle;
  no StandardIR fact is promoted by this retry.

# Record versions needed to reproduce each run.
toolchain:
  record_in_run: true
  fields: [compiler, fo, poppler, llama_cpp, model_sha256, service_profile]
  llama_cpp: "upstream master 885c5bbe8e04dc78db25beb911a2715312ad7b54 / build 1"
  model_sha256: "55983c5a75a1ab9698240777b3bb3de4146e82a9234072b48ad4e8f92ad3fe9f1"
  service_profile: >
    mailuefterl local Qwen 3.6 35B-A3B Q4_K_XL, 128K context, q8_0 KV,
    flash attention, no SSH tunnel, latest verified llama.cpp main, reasoning
    budget 4096.

# What result would disappoint you? If nothing would, this is not an experiment.
falsifiable_by: >
  A dropped or duplicated retry row, an accepted proposal without source
  evidence or required witness maps, malformed JSON that is not counted, a
  schema/source failure, an uncounted model/tool call, or a merged terminal
  row whose predecessor key is changed falsifies the protocol. Failure to
  improve the residual is also a valid result.

# The condition that closes the experiment and the evidence it must report.
gate: >
  Run E0116's bounded protocol with --retry-from the immutable E0117 rows,
  --require-witnesses and --escalate-thinking, retain both attempts and all
  trajectories, pass validate.py and witness.py, and merge only validated
  terminal rows by row key with merge-retry.py's exact unresolved/hard-failure
  replacement-set check. The 53-row retry and the 234 predecessor controls
  must account for all 287 rows; semantic promotions remain zero.

# Script that turns runs into the tables and figures in report.md.
analysis: >
  research/experiments/E0123-can-a-bounded-fresh-retry-resolve-the-re/
  analyse.sh; it invokes the pinned E0116 merge, validation and witness gates
  and writes report.json. Generated plots remain ignored.
preflight: >
  research/experiments/E0123-can-a-bounded-fresh-retry-resolve-the-re/
  preflight.sh; it performs one health/version check and never waits for
  service readiness.
selftest: >
  research/experiments/E0116-can-bounded-qwen-semantic-proposals-clos/test.sh
  and test-merge-retry.sh.
