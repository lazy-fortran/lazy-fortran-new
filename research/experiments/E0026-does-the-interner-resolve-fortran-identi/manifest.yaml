id: "E0026"
title: "Case-insensitive interner identity"
question: >
  Does the interner resolve Fortran identity once across case variants and
  table growth?
status: reported         # draft | running | reported | abandoned
opened: "2026-08-12"
closed: "2026-08-12"

# Every commit the result depends on. Exact, not "main".
repos:
  lazy-fortran-new: "bc3465d"
  standard-new: "649efcf"

# What goes in. Pinned artifacts by manifest name; profiles by ID.
inputs:
  implementation: standard-new interner
  test: standard-new/test/test_interner.f90

# The axes being varied. Omit the key if there is only one condition.
variables: {}

# Explain whether model names form a controlled family ladder or separate
# controls. Pin revisions and runtime settings before the first run.
model_selection: "No model calls; deterministic Fortran implementation and test."

# Name these before running anything. Choosing a metric after seeing the data
# is how an experiment becomes a demonstration.
metrics:
  - text_policy_self_test_status
  - text_policy_status
  - focused_test_status
  - full_pipeline_status
  - formatting_status
  - independent_oracle_mutation_status
  - case_variant_same_id
  - post_growth_identity_stable
  - canonical_key_status
  - empty_name_rejection_status

# State the complete eligible set and exclusions before the first run. A rate
# over the successful subset is reported alongside the strict rate.
denominator: >
  The complete slice consists of the interner, its fixed byte-name behavioral
  test and the standard-new full pipeline. Unicode normalization and lexical
  classification are excluded.

# State the independent behavioral or structural oracle. Self-consistency is
# not an oracle.
independent_oracle: >
  test_interner supplies fixed byte arrays for Foo, fOo, Bar and Baz and
  compares returned IDs, count and canonical key bytes with separately
  declared expected values. A four-slot table forces rehashing before Baz;
  changing the expected canonical Foo byte was run and had to fail before the
  accepted test was restored.

# Record versions needed to reproduce each run.
toolchain:
  record_in_run: true
  fields: [compiler, fo, poppler, oracle_versions]

# What result would disappoint you? If nothing would, this is not an experiment.
falsifiable_by: >
  A case variant may receive another ID, a post-growth lookup may lose its
  identity, the returned key may differ from the fixed oracle, an empty span
  may be accepted, or the mutated expected key may still pass.

# The condition that closes the experiment and the evidence it must report.
gate: >
  Pin the production commit, run the focused test including forced growth,
  observe the controlled key mutation fail, restore the oracle, and run
  text-policy, formatting and full fo gates successfully.

# Script that turns runs into the tables and figures in report.md.
analysis: research/experiments/E0026-does-the-interner-resolve-fortran-identi/analyse.sh
