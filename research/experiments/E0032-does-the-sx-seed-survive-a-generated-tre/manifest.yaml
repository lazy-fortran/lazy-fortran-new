id: "E0032"
title: "Generated SX tree and malformed-input corpus"
question: >
  Does the SX seed survive a generated-tree and malformed-input corpus?
status: reported         # draft | running | reported | abandoned
opened: "2026-08-12"
closed: "2026-08-12"

# Every commit the result depends on. Exact, not "main".
repos:
  lazy-fortran-new: "64f9d12"
  standard-new: "803f46f"

# What goes in. Pinned artifacts by manifest name; profiles by ID.
inputs:
  standard: j3-24-007
  implementation: standard-new recursive fortsx seed
  test: standard-new/test/test_fortsx_corpus.f90

# The axes being varied. Omit the key if there is only one condition.
variables: {}

# Explain whether model names form a controlled family ladder or separate
# controls. Pin revisions and runtime settings before the first run.
model_selection: "No model calls; deterministic generated trees and fixed malformed inputs."

# Name these before running anything. Choosing a metric after seeing the data
# is how an experiment becomes a demonstration.
metrics:
  - text_policy_self_test_status
  - text_policy_status
  - focused_test_status
  - full_pipeline_status
  - formatting_status
  - generated_tree_cases
  - generated_corpus_lines
  - generated_corpus_bytes
  - generated_corpus_sha256
  - malformed_cases_rejected
  - malformed_message_matches
  - independent_oracle_mutation_status

# State the complete eligible set and exclusions before the first run. A rate
# over the successful subset is reported alongside the strict rate.
denominator: >
  The complete slice consists of 64 deterministic generated SX trees with
  maximum recursion depth 4, the resulting line corpus, 10 fixed malformed
  inputs with expected diagnostics, and the standard-new full pipeline.
  Generated-reader replacement and larger schema-derived corpora remain
  excluded.

# State the independent behavioral or structural oracle. Self-consistency is
# not an oracle.
independent_oracle: >
  The generator reconstructs each generated tree independently from the
  serialized line and compares kind, child count and atom content; malformed
  inputs are checked against separately declared rejection messages. Changing
  one expected malformed message made the focused test fail before the
  accepted run.

# Record versions needed to reproduce each run.
toolchain:
  record_in_run: true
  fields: [compiler, fo, poppler, oracle_versions]

# What result would disappoint you? If nothing would, this is not an experiment.
falsifiable_by: >
  Any generated tree may fail to round-trip, a malformed input may be accepted,
  an expected diagnostic may differ, the corpus may not contain the declared
  number of lines, or any repository quality gate may fail.

# The condition that closes the experiment and the evidence it must report.
gate: >
  Pin the production commit, run the focused generated-tree and malformed-input
  test, observe the controlled diagnostic mutation fail, restore the fixture,
  verify the generated corpus count and hash, and pass text-policy, formatting
  and full fo gates.

# Script that turns runs into the tables and figures in report.md.
analysis: research/experiments/E0032-does-the-sx-seed-survive-a-generated-tre/analyse.sh
