# The axes being varied. Omit the key if there is only one condition.
variables:
  denominator_rows: 287
  retry_rows: 53
  immutable_controls: 234
  model_calls: 0

# Explain whether model names form a controlled family ladder or separate
# controls. Pin revisions and runtime settings before the first run.
model_selection: "No model execution. This audit replays retained E0123 outputs through deterministic merge, validation and witness gates."

# Name these before running anything. Choosing a metric after seeing the data
# is how an experiment becomes a demonstration.
metrics:
  - selected_rows
  - schema_accepted_rows
  - hard_failures
  - unresolved_rows
  - disputed_rows
  - unwitnessed_rows
  - not_applicable_rows
  - semantic_promotions
  - negative_controls

# State the complete eligible set and exclusions before the first run. A rate
# over the successful subset is reported alongside the strict rate.
denominator: >
  All 287 E0117 constraint row keys. The retained E0123 retry covers exactly
  53 unresolved or hard-failure rows and the other 234 rows remain immutable
  predecessor controls.

# State the independent behavioral or structural oracle. Self-consistency is
# not an oracle.
independent_oracle: >
  E0116 merge-retry.py, validate.py and witness.py independently enforce exact
  row replacement, source/schema validity, trajectory accounting, witness
  execution, mutation rejection and zero semantic promotions. The audit does
  not treat model self-consistency as semantic evidence.

# Record versions needed to reproduce each run.
toolchain:
  record_in_run: true
  fields: [compiler, fo, poppler, oracle_versions]

# What result would disappoint you? If nothing would, this is not an experiment.
falsifiable_by: >
  Any row loss or duplication, non-exact replacement set, source/schema or
  trajectory failure, mutation acceptance, or nonzero semantic promotion
  falsifies the audit. A terminal ledger with no disputed or unwitnessed rows
  would refute the retained blocker.

# The condition that closes the experiment and the evidence it must report.
gate: >
  Run E0123's exact deterministic analysis command against the pinned retained
  rows and trajectories, require the merge, validation and witness negative
  controls to fail as expected, and record the complete 287-row counts. The
  result is PASS only for the audit; it cannot promote semantic facts or close
  M3 while disputed or unwitnessed rows remain.

# Script that turns runs into the tables and figures in report.md.
analysis: >
  E0123_RETRY_ROWS=.cache/runs/E0123/R000001/rows.jsonl
  E0123_RETRY_TRAJECTORY=.cache/runs/E0123/R000001/trajectory.jsonl
  E0123_ANALYSIS_OUTDIR=.cache/runs/E0181/R000001/analysis
  research/experiments/E0123-can-a-bounded-fresh-retry-resolve-the-re/analyse.sh
run: >
