id: "E0036"
title: "Deterministic schema type declaration emission"
question: >
  Does deterministic schema generation emit stable Fortran type declarations?
status: reported         # draft | running | reported | abandoned
opened: "2026-08-12"
closed: "2026-08-12"

# Every commit the result depends on. Exact, not "main".
repos:
  lazy-fortran-new: "207d5a1"
  standard-new: "0c716e5"

# What goes in. Pinned artifacts by manifest name; profiles by ID.
inputs:
  standard: j3-24-007
  implementation: standard-new schema_codegen
  specification: standard-new/specs/schema-v0.sxs
  test: standard-new/test/test_schema_codegen.f90

# The axes being varied. Omit the key if there is only one condition.
variables: {}

# Explain whether model names form a controlled family ladder or separate
# controls. Pin revisions and runtime settings before the first run.
model_selection: "No model calls; deterministic schema parser and source emitter."

# Name these before running anything. Choosing a metric after seeing the data
# is how an experiment becomes a demonstration.
metrics:
  - text_policy_self_test_status
  - text_policy_status
  - schema_parser_status
  - codegen_test_status
  - runtime_checked_codegen_test_status
  - formatting_status
  - full_pipeline_status
  - declaration_forms_checked
  - expected_source_lines_checked
  - cyclic_dependency_cases_checked
  - independent_oracle_mutation_status

# State the complete eligible set and exclusions before the first run. A rate
# over the successful subset is reported alongside the strict rate.
denominator: >
  The complete slice consists of one schema specification exercising all six
  declaration forms, ten fixed expected generated-source lines, one cyclic
  dependency rejection, runtime-checked code generation, and the standard-new
  full pipeline. Generated readers, writers, validators, visitors, hashing and
  complete wiring remain excluded.

# State the independent behavioral or structural oracle. Self-consistency is
# not an oracle.
independent_oracle: >
  The test checks fixed source lines for the generated origin label, module,
  enum constants, record fields, list and optional storage, and module close.
  It separately expects a fixed cycle diagnostic. Changing the expected enum
  value made the focused test fail before the accepted run.

# Record versions needed to reproduce each run.
toolchain:
  record_in_run: true
  fields: [compiler, fo, poppler, oracle_versions]

# What result would disappoint you? If nothing would, this is not an experiment.
falsifiable_by: >
  A declaration may be emitted in the wrong order or with wrong identifiers or
  types, a generated line may differ, a cycle may be accepted, or any quality
  gate may fail.

# The condition that closes the experiment and the evidence it must report.
gate: >
  Pin standard-new 0c716e5, pass the fixed source-line and cycle tests with
  runtime checks, observe the controlled expected-line mutation fail, and pass
  text-policy, formatting and full fo gates.

# Script that turns runs into the tables and figures in report.md.
analysis: research/experiments/E0036-does-deterministic-schema-generation-emi/analyse.sh
