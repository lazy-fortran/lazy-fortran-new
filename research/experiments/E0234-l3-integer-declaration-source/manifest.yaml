variables:
  source_case: "one named free-form main program with one integer declaration"
  stages: "raw source | frontend-v0 | MIR-v0 | RV64 Linux executable"
  negative_case: "integer declaration with missing entity name"
  model_calls: 0
  semantic_promotions: 0

model_selection: >-
  No model call is part of implementation or replay. The production worker was
  medium-depth gpt-5.6-luna, but the deterministic central oracle is authoritative.

metrics:
  - exact positive and negative source hashes
  - frontend-v0 and MIR-v0 canonical output hashes
  - deterministic executable hash and runtime exit status
  - independent negative diagnostic and no-negative-MIR control
  - component revisions, toolchain and clean-checkout state
  - model calls and semantic promotions

denominator: >-
  One exact positive source, one malformed declaration neighbour, the frontend,
  MIR and executable stage chain, and the no-output negative control. General
  declaration parsing, typed symbol representation, expressions, I/O, modules,
  procedures, fixed form and semantic analysis are excluded.

independent_oracle: >-
  tests/e2e/validate_l3_declaration.py independently checks exact source bytes,
  accepted frontend-v0 and MIR-v0 golden observables, rejected diagnostic,
  absence of negative MIR, ELF64 RISC-V identity and a second qemu-riscv64
  execution. It does not import the fortfront, ffc or fortback implementations.

toolchain:
  record_in_run: true
  fields: [compiler, fo, poppler, oracle_versions]

falsifiable_by: >-
  Positive rejection, malformed-neighbour acceptance, changed canonical output,
  negative MIR or executable creation, nonzero runtime, pin mismatch, dirty
  checkout, trace mismatch, model call or semantic promotion.

gate: >-
  From a clean checkout run
  L3_EXPECTED_CENTRAL_COMMIT=<pinned-central>
  tests/e2e/run-l3-declaration.sh --fresh. The first bootstrap creates the
  committed trace; subsequent replays compare it byte for byte.

analysis: >-
  L3_EXPECTED_CENTRAL_COMMIT=<pinned-central>
  tests/e2e/run-l3-declaration.sh --fresh

