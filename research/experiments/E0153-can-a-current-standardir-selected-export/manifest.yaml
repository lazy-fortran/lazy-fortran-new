id: "E0153"
title: "Manual LFortran parser-target adjudication for the current StandardIR export"
question: >
  Can a current StandardIR selected export match LFortran parser quality without losing normative fidelity
status: reported         # draft | running | reported | abandoned
opened: "2026-08-15"
closed: "2026-08-15"

# Every commit the result depends on. Exact, not "main".
repos:
  lazy-fortran-new: "36b5570"
  standard-new: "dc75e7f4905e58d9b89d04c77f4f09223b57a579"
  oracle-lfortran: "caf87b660f803148f000046392a5da803f9fc630"

# What goes in. Pinned artifacts by manifest name; profiles by ID.
inputs:
  standard: j3-24-007
  profile: complete-core-selected-program
  generated_run: E0152/R000001
  previous_matrix: E0149/comparison-matrix.tsv
  references:
    - lfortran-parser-yy

# The axes being varied. Omit the key if there is only one condition.
variables:
  comparison_surface: [source-anchors, target-contract, parser-engineering]
  adjudication: [target_defect, projection_gap, target_specialization_gap, expected_difference, standardir_advantage, reference_advantage, method_gap]

# Explain whether model names form a controlled family ladder or separate
# controls. Pin revisions and runtime settings before the first run.
model_selection: >
  No model is used for the adjudication. The source-backed StandardIR and J3/24-007
  remain normative. LFortran is a pinned parser-engineering reference only. A
  separate Luna review is independent evidence and may report a defect but may not
  supply a production rule.

# Name these before running anything. Choosing a metric after seeing the data
# is how an experiment becomes a demonstration.
metrics:
  - source_anchor_rows
  - source_anchor_failures
  - generated_target_heads
  - generated_target_alternatives
  - generated_provenance_headers
  - lfortran_heads
  - lfortran_alternatives
  - generated_validator_status
  - bison_conflicts
  - feature_audit_rows
  - source_evidence_hashes
  - reference_advantages_recorded
  - standardir_advantages_recorded

# State the complete eligible set and exclusions before the first run. A rate
# over the successful subset is reported alongside the strict rate.
denominator: >
  The complete 26-row E0149 manual matrix is the inherited comparison
  baseline. This experiment adds a current 16-row matrix, rechecks the seven
  stale-critique anchors deterministically and records current selected-root,
  source-lineage, lexer, precedence, action, role-factoring and conflict-policy
  observations. Structural counts are generated by analyse.sh; classifications
  and source locations are manually adjudicated.

# State the independent behavioral or structural oracle. Self-consistency is
# not an oracle.
independent_oracle: >
  The exact J3/24-007 source spans and source-projection witness check the
  StandardIR anchors. Bison 3.8.2, ANTLR4 4.13.2 and tree-sitter 0.26.9 check
  target syntax. The pinned LFortran parser.yy is inspected as an independent
  parser-engineering reference and its declared Bison conflict budget is
  recorded. No reference grammar is a normative oracle.

# Record versions needed to reproduce each run.
toolchain:
  record_in_run: true
  fields: [compiler, fo, poppler, oracle_versions]

# What result would disappoint you? If nothing would, this is not an experiment.
falsifiable_by: >
  A named current source anchor is truncated, has a malformed token/reference
  classification, loses source lineage, fails a target validator, or the manual
  matrix claims an advantage that is not visible at its cited source location.
  The audit also fails if it silently turns a parser-shape difference into a
  normative correction or omits a genuine StandardIR advantage.

# The condition that closes the experiment and the evidence it must report.
gate: >
  All inherited E0149 anchors are rechecked against the current candidate, the
  deterministic anchor checks pass, the generated validators and source
  projection pass, and the matrix records both directions of advantage. The
  result may close the comparison audit but cannot close M2: language
  preservation, corpus behavior, parser conflict policy and lexer runtime remain
  separate gates.

# Script that turns runs into the tables and figures in report.md.
analysis: >
  Run
  `research/experiments/E0153-can-a-current-standardir-selected-export/analyse.sh
  <run-directory>`. It writes only to the ignored run directory and produces
  `anchor-check.tsv`, `feature-audit.tsv`, copied source evidence and
  `summary.json`; the manually adjudicated matrix is `comparison-matrix.tsv`.
