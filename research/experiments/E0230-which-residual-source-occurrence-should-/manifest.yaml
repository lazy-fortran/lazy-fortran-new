# The axes being varied. Omit the key if there is only one condition.
variables:
  pass_argument_state: "present | absent | unknown"
  dummy_name_relation: "matching | nonmatching | unknown"
  target_property: >-
    If PASS(arg-name) is present, the supplied interface state must contain a
    dummy argument whose name matches arg-name.

# Explain whether model names form a controlled family ladder or separate
# controls. Pin revisions and runtime settings before the first run.
model_selection: >-
  No model execution. Any Luna material remains labelled LLM intake and is not
  source authority, an expected-outcome oracle or a promotion mechanism.

# Name these before running anything. Choosing a metric after seeing the data
# is how an experiment becomes a demonstration.
metrics:
  - residual row count and status partition
  - first residual row and constraint ID
  - canonical source lines and exact byte span
  - printed-page, ledger-page, PDF and page-index coordinates
  - StandardIR rule, occurrence and source-span bindings
  - model calls and semantic promotions

# State the complete eligible set and exclusions before the first run. A rate
# over the successful subset is reported alongside the strict rate.
denominator: >-
  Every witness ledger row with status disputed or unwitnessed after excluding
  the bounded contracts C1106, C702, C601, C603, C721, C725, C718, C723,
  C729, C719, C738, C1579, C1586, C717, C720, C722, C724, C726, C731,
  C732, C733, C735, C743, C744, C745, C746, C747, C748, C749, C750, C751,
  C752, C754, C757, C759, C760, C761 and C762.

# State the independent behavioral or structural oracle. Self-consistency is
# not an oracle.
independent_oracle: >-
  Controller byte-offset and page-index recomputation against the pinned
  canonical text, normative PDF, page index and StandardIR. The selection
  report binds C763/R741 and its R742, R603 and R1534 representation witnesses
  independently of any candidate packet.

# Record versions needed to reproduce each run.
toolchain:
  record_in_run: true
  fields: [compiler, fo, poppler, oracle_versions]

# What result would disappoint you? If nothing would, this is not an experiment.
falsifiable_by: >-
  The partition is not 133 rows with 77 disputed and 56 unwitnessed, the first
  row is not C763@1, the source span or page binding fails, or the claimed
  StandardIR witnesses cannot be reproduced. Any model call or semantic
  promotion also fails this selection.

# The condition that closes the experiment and the evidence it must report.
gate: >-
  PASS only if the exact residual command yields 133 rows (77 disputed, 56
  unwitnessed) with C763@1 first, the canonical bytes and page coordinates
  bind to C763/R741, the existing StandardIR witnesses are present, and no
  model call or semantic promotion occurs. This selects a bounded contract
  target only; it does not accept C763 as a semantic fact.

# Script that turns runs into the tables and figures in report.md.
analysis: >-
  jq -s -c 'def promoted: ["C1106","C702","C601","C603","C721","C725","C718","C723","C729","C719","C738","C1579","C1586","C717","C720","C722","C724","C726","C731","C732","C733","C735","C743","C744","C745","C746","C747","C748","C749","C750","C751","C752","C754","C757","C759","C760","C761","C762"]; def is_promoted($id): any(promoted[]; . == $id); map(select((.status == "disputed" or .status == "unwitnessed") and (is_promoted(.constraint_id) | not))) | {rows: length, by_status: (group_by(.status) | map({status: .[0].status, count: length})), first_row: .[0].row_key, first_constraint: .[0].constraint_id, first_status: .[0].status}' .cache/runs/E0181/R000002/analysis/witness/witnesses.jsonl

