# The axes being varied. Omit the key if there is only one condition.
variables:
  residual_rows: 152
  disputed_rows: 88
  unwitnessed_rows: 64
  first_row: C732@1

# Explain whether model names form a controlled family ladder or separate
# controls. Pin revisions and runtime settings before the first run.
model_selection: "No model execution; retained model-origin rows are input only."

# Name these before running anything. Choosing a metric after seeing the data
# is how an experiment becomes a demonstration.
metrics:
  - residual row count
  - residual status partition
  - first residual row key
  - source binding
  - StandardIR binding
  - semantic promotions
  - model calls

# State the complete eligible set and exclusions before the first run. A rate
# over the successful subset is reported alongside the strict rate.
denominator: >-
  Every E0181/R000002 witness row whose status is disputed or unwitnessed and
  whose constraint_id is outside the exact nineteen-entry promoted set.

# State the independent behavioral or structural oracle. Self-consistency is
# not an oracle.
independent_oracle: >-
  The exact jq promoted-contract partition is recomputed from the pinned
  witnesses JSONL; canonical source/page and existing StandardIR bindings are
  checked mechanically. The retained model proposal is not an oracle.

# Record versions needed to reproduce each run.
toolchain:
  record_in_run: true
  fields: [compiler, fo, poppler, oracle_versions]

# What result would disappoint you? If nothing would, this is not an experiment.
falsifiable_by: >-
  The experiment fails if the partition is not 152 rows with 88 disputed, 64
  unwitnessed and C732@1 first, or if a model call or semantic promotion is
  observed.

# The condition that closes the experiment and the evidence it must report.
gate: >-
  Recompute the exact promoted-contract partition, inspect C732@1's pinned
  source and existing StandardIR shape, and select exactly one bounded
  source-backed property without model execution or semantic promotion.

# Script that turns runs into the tables and figures in report.md.
analysis: artifacts/reports/M3/m3-core0-next-property-selection-v7.md
