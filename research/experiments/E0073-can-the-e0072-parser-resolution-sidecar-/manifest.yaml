id: "E0073"
title: "E0072 parser-resolution sidecar target validation"
question: >
  Can the E0072 parser-resolution sidecar emit every target fragment without projecting semantic facts?
status: reported         # draft | running | reported | abandoned
opened: "2026-08-12"
closed: "2026-08-12"

# Every commit the result depends on. Exact, not "main".
repos:
  lazy-fortran-new: "c6c6d0e"
  standard-new: "c6cd889"

# What goes in. Pinned artifacts by manifest name; profiles by ID.
inputs:
  standard: j3-24-007
  d0019_composition: E0072-R000001
  decisions: [D0019, D0027, D0028, D0029]

# The axes being varied. Omit the key if there is only one condition.
variables:
  target: [ebnf, antlr4, bison, tree-sitter, direct-fortran]
  parser_projection: [aliases-and-lexical-facts-only]
  semantic_projection: [excluded]

# Explain whether model names form a controlled family ladder or separate
# controls. Pin revisions and runtime settings before the first run.
model_selection: "No experimental model calls; all target fragments are emitted mechanically from E0072 parser-projection.tsv."

# Name these before running anything. Choosing a metric after seeing the data
# is how an experiment becomes a demonstration.
metrics:
  - composite_fact_records
  - semantic_fact_records
  - parser_projection_records
  - target_fragment_records
  - target_provenance_records
  - semantic_target_leaks
  - ebnf_status
  - antlr_status
  - bison_status
  - treesitter_status
  - direct_fortran_status
  - independent_difference
  - negative_control

# State the complete eligible set and exclusions before the first run. A rate
# over the successful subset is reported alongside the strict rate.
denominator: >
  All 219 E0072 composite fact records are eligible for retention in the
  authoritative fact table. The 11 records with an explicit parser target are
  eligible for every target fragment. The 29 semantic-role records are not
  eligible for parser projection and must remain excluded.

# State the independent behavioral or structural oracle. Self-consistency is
# not an oracle.
independent_oracle: >
  E0072 is rerun and its two output hashes are checked. A separate normalized
  record traversal rebuilds target-safe names, counts every target fragment,
  checks source rule/page provenance, and scans for semantic-role leaks. ANTLR4,
  Bison and tree-sitter validate complete small target probes; gfortran
  validates the direct Fortran module; an EBNF structural traversal validates
  the canonical fragment. A controlled parser-target mutation must change the
  independent witness.

# Record versions needed to reproduce each run.
toolchain:
  record_in_run: true
  fields: [compiler, fo, poppler, oracle_versions]

# What result would disappoint you? If nothing would, this is not an experiment.
falsifiable_by: >
  The experiment fails if E0072 changes, any parser record is omitted from a
  target, provenance is lost, a semantic fact appears in a parser fragment, a
  target validator rejects its probe, or the mutation control does not fail.

# The condition that closes the experiment and the evidence it must report.
gate: >
  Reproduce E0072, emit all 11 parser-resolution records into EBNF, ANTLR4,
  Bison, tree-sitter and direct-Fortran probes, retain source provenance,
  compile or structurally validate every target, and report semantic leaks.

# Script that turns runs into the tables and figures in report.md.
analysis: research/experiments/E0073-can-the-e0072-parser-resolution-sidecar-/analyse.sh
