id: "E0118"
title: "Independent finite fact-case gate for typed semantic proposals"
question: >
  Can independently generated source-derived finite fact cases validate
  model-supplied typed predicates, with compiler behavior confirming the
  applicable cases where a faithful fixture and compiler are available?
status: draft            # draft | running | reported | abandoned
opened: "2026-08-14"
closed: ""

# Every commit the result depends on. Exact, not "main".
repos:
  lazy-fortran-new: "166a7d8"
  standard-new: "ae2ee71"

# What goes in. The E0117 files and active run artifacts are inputs only.
inputs:
  standard: j3-24-007
  profile: complete-core
  predecessor: E0117
  predecessor_manifest: research/experiments/E0117-can-source-backed-model-witnesses-make-t/manifest.yaml
  constraint_inventory: research/experiments/E0081-can-deterministic-source-patterns-invent/analyse.sh
  canonical_text: .cache/runs/E0001/R000003/j3-24-007.canonical.txt
  page_index: .cache/runs/E0001/R000003/j3-24-007.pages.index
  predicate_schema: research/experiments/E0116-can-bounded-qwen-semantic-proposals-clos/semantic-schema.json
  source_case_policy: source-derived finite-case policy below

# E0118 consumes the terminal E0117 proposal ledger. It makes no new model
# calls and gives no model output authority over case construction or outcome.
variables:
  proposal_source: [E0117-terminal-ledger]
  case_generation: [source-derived, predeclared, finite]
  model_expected_outcomes: [self-consistency-only]
  behavioral_oracles: [gfortran, flang-new, lfortran-when-installed]
  parser_projection: [none]
  promotion: [independent-oracle-required]

model_selection: >
  No model calls occur in E0118. The model-supplied typed predicates and
  model-supplied expected Booleans are frozen outputs from the pinned E0117
  terminal ledger. E0118 evaluates them as candidates and never lets them
  choose fact domains, expected outcomes, compiler applicability or promotion.

# Name these before running anything. Choosing a metric after seeing the data
# is how an experiment becomes a demonstration.
metrics:
  - eligible_constraint_rows
  - primary_rows
  - reference_only_rows
  - model_predicate_rows
  - no_model_predicate_rows
  - schema_source_accepted_rows
  - schema_source_rejected_rows
  - source_case_rows
  - source_case_positive
  - source_case_negative
  - source_case_boundary
  - source_case_neutral
  - source_case_oracle_matches
  - source_case_oracle_mismatches
  - source_case_oracle_unavailable
  - model_self_consistent_cases
  - model_self_inconsistent_cases
  - evaluator_errors
  - compiler_applicable_cells
  - compiler_invocations
  - compiler_agreements
  - compiler_disagreements
  - compiler_unavailable_cells
  - compiler_errors
  - mutation_controls
  - mutation_control_failures
  - provenance_matches
  - provenance_failures
  - missing_rows
  - duplicate_rows
  - missing_cases
  - duplicate_cases
  - parser_projection_records
  - semantic_promotions
  - model_calls
  - wall_s_total

# The row denominator is fixed before any case is generated. The case and
# compiler denominators are complete conditional matrices, not success sets.
denominator: >
  The primary denominator is all 287 Core 0 constraint occurrences emitted by
  E0081, including repeated occurrences and the one reference-only occurrence.
  The count is regenerated by the pinned E0081 analyse.sh command recorded in
  the E0081 manifest. Every row receives one terminal E0118 status. Rows with
  no schema/source-accepted E0117 predicate are retained as
  no_model_predicate. The reference-only row is retained and cannot be
  promoted. The case denominator is every independently materialized case for
  every row with an E0117 predicate, including cases that fail or disagree.
  The compiler denominator is every applicable case x compiler cell. Missing
  model output, unavailable finite case derivation, unavailable compiler,
  compiler error, timeout and disagreement are explicit statuses. No row or
  case is removed because its result is unfavorable.

# Cases are generated from the pinned source relation and fact domains. Model
# witness maps are retained for comparison but are never the case oracle.
finite_case_policy:
  materialization: >
    Freeze the complete row and predicate set, then materialize case IDs and
    expected outcomes before evaluating any candidate. The independent case
    generator may use only source-linked fact identifiers, declared types,
    source literals, finite source domains and typed boundary values. It may
    not copy a model witness map or expected Boolean. Every case records its
    construction class and the source relation that determines its expected
    outcome.
  finite_domains: >
    Enumerate every source-defined value when the pinned domain is finite. For
    a larger or non-enumerable domain, use the fixed constructor policy of one
    source value, one satisfying value, one failing value and each applicable
    typed boundary value. A case is oracle_unavailable when the source does
    not determine a finite fact suite without inventing a value or outcome.
  constructor_coverage: >
    Equality and membership cases include satisfying and failing values.
    Ordered relations include both sides of each source boundary. Implication
    and exception forms include every feasible antecedent/consequent truth
    combination. Quantified forms include a satisfying environment, a failing
    environment and an empty or neutral environment when the source permits
    one. Infeasible classes are recorded as not_applicable with their source
    reason.
  expected_outcome: >
    A separate source-derived oracle computes the expected Boolean from the
    pinned relation and fact map. The candidate evaluator is a separate
    implementation and receives the fact map without the expected Boolean.
    The model's expected Boolean is scored in a separate self-consistency
    column and cannot alter the source expectation.

# Independent oracle classes have distinct evidence and failure states. Model
# agreement is reported as a separate diagnostic.
independent_oracle:
  source_structural: >
    Reconstruct the row identity, source span, rule association, document
    hash, page and byte range. Validate the typed predicate against the pinned
    schema and verify that every fact, type, literal and constructor is
    supported by the cited source. A separate traversal recomputes row and
    case identity and rejects duplicate, missing or projected records.
  source_finite_behavioral: >
    Independently derive the finite fact cases and their expected Booleans from
    the pinned source relation. Execute the model predicate against those
    cases with a separate evaluator. A candidate must match every applicable
    source-derived case. A self-consistent model witness is evidence about
    the dialogue only and never supplies the expected result.
  compiler_behavioral: >
    When a case has a faithful standard-conforming Fortran fixture and a
    declared compiler is installed, compile or execute the fixture using the
    predeclared command. Record acceptance, rejection, runtime value and raw
    diagnostics as applicable. gfortran is a GPL behavioral oracle only. No
    GCC implementation source is read. Flang and LFortran results are separate
    implementations. Compiler disagreement is retained and blocks promotion
    of that row. If no applicable compiler is available, record the explicit
    unavailable status and rely on the source-finite oracle only.
  mutation: >
    Apply predeclared mutations to an operator or literal, a source hash, a
    fact value and an expected outcome. The independent gate must reject the
    provenance mutation, detect the changed semantic result and reject an
    expected-outcome substitution. A mutation control that survives is a
    protocol failure.
  model_self_consistency: >
    Compare each frozen model witness map and expected Boolean with the
    independently generated case result. Report self_consistent and
    self_inconsistent counts. This class is diagnostic only and cannot make a
    row promotion-eligible.

# Every candidate and every generated case carries enough data to reproduce
# both the source lookup and the behavioral check without trusting a cache.
provenance_requirements:
  candidate: >
    Record the E0117 run and row ID, model name, model file SHA-256, runtime
    build, predicate JSON, origin LLM, source document ID, clause or rule,
    page, byte start and end, canonical source hash, standard document hash,
    and all source evidence IDs.
  case: >
    Record a stable case ID, row ID, fact names and types, literal encodings,
    construction class, source relation citation, source span and hashes,
    expected Boolean, generator revision and origin MECHANICAL. Store the
    model witness result separately with origin LLM.
  compiler: >
    Record compiler name and version or commit, command line, fixture bytes
    and hash, source standard, case ID, exit status, runtime output and raw
    diagnostics. Mark cross-compiler comparisons DIFFERENTIAL. A missing
    executable is recorded as unavailable, never as agreement.
  run: >
    Record the exact repository commits, input hashes, case-set hash, schema
    hash, oracle revision, toolchain versions, terminal status and all raw
    outputs. Generated case tables and compiler results are run artifacts and
    are append-only.

toolchain:
  record_in_run: true
  fields: [compiler, flang_new, lfortran, fo, poppler, oracle_versions, llama_cpp, model_sha256]
  model_calls: 0
  gcc_source_policy: behavioral-only

# Falsifiability conditions are declared before execution.
falsifiable_by: >
  The protocol is falsified by a changed or incomplete 287-row denominator, a
  dropped no-model row, a case or expected outcome derived from model output,
  missing source provenance, a source-hash mismatch, an evaluator that shares
  the expected-outcome implementation, an accepted mutation, an uncounted
  compiler result, hidden compiler disagreement, parser projection, or any
  promotion justified by model self-consistency alone.

# This is a protocol-only draft. It defines eligibility and evidence, but it
# authorizes no runner, service, framework or direct StandardIR edit.
gate: >
  Before execution, pin the terminal E0117 run, all repository and source
  hashes, the compiler availability matrix and the finite-case generator
  revision. Materialize all 287 row statuses and all conditional case and
  compiler cells. Pass the independent source-structural and source-finite
  gates, preserve every self-consistency result, run every applicable compiler
  behavioral oracle, and pass all mutation controls with zero missing,
  duplicate or projected records. A row is promotion-eligible only when its
  source-derived case suite agrees completely, every applicable compiler
  oracle agrees or is explicitly not_applicable, provenance is complete and
  mutations are detected. Model self-consistency alone can never make a row
  promotion-eligible. This manifest produces no StandardIR promotion. Any
  later promotion must cite the E0118 independent result and pass the separate
  source, schema and behavioral gates.

# No runner, service or framework is part of this draft. An implementation and
# its deterministic analysis command must be pinned before status changes.
analysis: >
  Protocol-only draft. Before the first run, record the implementation commit,
  deterministic analysis command and append-only output paths in a successor
  run record. No runner, service or framework code is authorized here.
