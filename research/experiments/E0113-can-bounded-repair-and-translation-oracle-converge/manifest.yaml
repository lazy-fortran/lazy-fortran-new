fixed_protocol:
  retrieval: complete-canonical-text-generic-subject-definition-forms
  evidence_window_bytes: 768
  max_windows_per_row: 8
  output: pointer-only
  max_attempts_per_row: 3
  repair_attempts: 2
  seed: 1101
  temperature: 0
  top_p: 1
  reasoning: off-baseline
  abstention: valid-green-terminal

metrics:
  - residue_rows
  - accepted
  - abstentions
  - hard_failures
  - gate_green
  - gate_rejections
  - model_errors
  - total_model_calls
  - repair_iterations
  - wall_s_total
  - setup_wall_s
  - inference_wall_s
  - overlap_agreements
  - overlap_disagreements
  - novel_accepted
  - oracle_rows
  - oracle_exact_matches
  - oracle_wrong_accepts
  - oracle_abstentions
  - oracle_hard_failures
  - oracle_translation_accuracy

denominator: >
  All 127 E0106 residue rows. The six E0110 strict definitions are the
  frozen solved-translation oracle; the remaining 121 rows measure discovery.
  No row or failed attempt is dropped.

independent_oracle: >
  The deterministic gate recomputes canonical bytes, page containment,
  subject-position relation and source span from the selected window. E0110
  supplies the expected key for each solved row. The model cannot emit the
  target or citation in pointer-only mode.

reliability_gate: >
  A row is green only when it ends in accepted or explicit abstain. A run
  reports hard failure when a row remains malformed, rejected or errored
  after three calls. Translation quality is exact E0110-key agreement on all
  six oracle rows; discovery quality is separately reported on the other 121.

falsifiable_by: >
  Any source-span acceptance outside canonical bytes, wrong-page acceptance,
  omitted denominator row, uncounted failed call, unbounded repair, or
  disagreement between the independent gate and E0110 oracle falsifies the
  protocol claim.

analysis: research/experiments/E0111-can-qwen3-5-2b-propose-source-cited-loca/run-iterative.py
report: research/experiments/E0113-can-bounded-repair-and-translation-oracle-converge/REPORT.md
