id: "E0113"
title: "Full-document retrieval, bounded gate repair and solved-translation oracle"
question: >
  Does deterministic full-document retrieval plus at most two repairs let
  local, cloud and Codex Luna models safely identify source-backed residue,
  and how accurately do they translate definitions already solved mechanically?
status: running          # draft | running | reported | abandoned
opened: "2026-08-13"
closed: ""

