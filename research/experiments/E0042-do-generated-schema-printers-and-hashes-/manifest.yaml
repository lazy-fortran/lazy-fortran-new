id: "E0042"
title: "Generated schema printer and hash differential"
question: >
  Do generated schema printers and hashes preserve canonical bytes?
status: reported         # draft | running | reported | abandoned
opened: "2026-08-12"
closed: "2026-08-12"

# Every commit the result depends on. Exact, not "main".
repos:
  lazy-fortran-new: "b7dc5fd"
  standard-new: "c6cd889"

# What goes in. Pinned artifacts by manifest name; profiles by ID.
inputs:
  standard: j3-24-007
  implementation: standard-new generated printer and hash APIs
  specification: standard-new/specs/schema-v0.sxs
  fixtures: standard-new/test/test_schema_generated_api.f90

# The axes being varied. Omit the key if there is only one condition.
variables: {}

# Explain whether model names form a controlled family ladder or separate
# controls. Pin revisions and runtime settings before the first run.
model_selection: "No model calls; generated Fortran APIs and the independent generic codec."

# Name these before running anything. Choosing a metric after seeing the data
# is how an experiment becomes a demonstration.
metrics:
  - text_policy_status
  - schema_parser_status
  - schema_codegen_status
  - generated_api_status
  - runtime_checked_generated_api_status
  - generated_source_byte_identity_status
  - generated_formatting_status
  - lint_zero_warnings_status
  - full_pipeline_status
  - printer_cases_checked
  - hash_cases_checked

# State the complete eligible set and exclusions before the first run. A rate
# over the successful subset is reported alongside the strict rate.
denominator: >
  The complete slice consists of five generated printer cases and five generated
  hash cases over primitive, record, sum, list and optional values, the generic
  reference codec, one regenerated source file and the standard-new full
  pipeline. Visitor traversal and architecture wiring remain excluded.

# State the independent behavioral or structural oracle. Self-consistency is
# not an oracle.
independent_oracle: >
  Each generated printer is compared with the independent schema_value
  canonicalizer. Each generated hash is compared with a SHA-256 computed by the
  independent writer backend over the reference canonical bytes. Source
  regeneration is compared byte-for-byte with the checked-in generated source.

# Record versions needed to reproduce each run.
toolchain:
  record_in_run: true
  fields: [compiler, fo, poppler, oracle_versions]

# What result would disappoint you? If nothing would, this is not an experiment.
falsifiable_by: >
  A generated printer emits different bytes, a generated hash differs from the
  reference digest, a value cannot be processed, source regeneration changes,
  lint reports a warning or any quality gate fails.

# The condition that closes the experiment and the evidence it must report.
gate: >
  Pin standard-new c6cd889 and lab b7dc5fd, pass parser, generator and focused
  generated API tests with runtime checks, compare five printer and five hash
  cases against the independent codec, pass zero-warning lint, compare source
  bytes, pass formatting and the full fo pipeline.

# Script that turns runs into the tables and figures in report.md.
analysis: research/experiments/E0042-do-generated-schema-printers-and-hashes-/analyse.sh
