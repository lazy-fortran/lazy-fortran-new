# The axes being varied. Omit the key if there is only one condition.
variables:
  value_sign: [negative, nonnegative, unknown]
  representation_method: [absent, present, unknown]
  outcomes: [ACCEPTED, REJECTED, UNRESOLVED]

# Explain whether model names form a controlled family ladder or separate
# controls. Pin revisions and runtime settings before the first run.
model_selection: "No model calls. Candidate facts are human-authored fixtures; the oracle is mechanical."

# Name these before running anything. Choosing a metric after seeing the data
# is how an experiment becomes a demonstration.
metrics:
  - case_outcomes
  - source_binding
  - semantic_canonicalization
  - mutation_controls
  - model_calls
  - semantic_promotions

# State the complete eligible set and exclusions before the first run. A rate
# over the successful subset is reported alongside the strict rate.
denominator: >
  The complete nine-state product of typed value-sign and
  representation-method states for the bounded C724 relation. Source-binding
  mutations are separate.

# State the independent behavioral or structural oracle. Self-consistency is
# not an oracle.
independent_oracle: >
  The future tests/e2e/validate_m3_c724.py computes the outcome directly from
  the two typed states using known-violation precedence. It does not parse
  Fortran, evaluate constant expressions, inspect processor capabilities or
  consume model output.

# Record versions needed to reproduce each run.
toolchain:
  record_in_run: true
  fields: [compiler, fo, poppler, oracle_versions]

# What result would disappoint you? If nothing would, this is not an experiment.
falsifiable_by: >
  Any source, page, StandardIR, semantic-item or contract identity mutation is
  accepted; the nine-state table differs from the decision; or any model call
  or semantic promotion is observed.

# The condition that closes the experiment and the evidence it must report.
gate: >
  tests/e2e/run-m3-c724.sh --fresh must pass from clean central and
  standard-new checkouts, including source/page-index/StandardIR binding,
  complete nine-state outcomes, mutation rejection, exact trace comparison
  and zero model calls or semantic promotions.

# Script that turns runs into the tables and figures in report.md.
analysis: tests/e2e/validate_m3_c724.py
run: tests/e2e/run-m3-c724.sh --fresh
