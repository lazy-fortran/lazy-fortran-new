id: "E0080"
title: "Generated expression and precedence facade from the E0079 profile"
question: >
  Can the E0079 profile-owned facade extend to generated expression and precedence coverage?
status: reported         # draft | running | reported | abandoned
opened: "2026-08-12"
closed: "2026-08-12"

# Every commit the result depends on. Exact, not "main".
repos:
  lazy-fortran-new: "e69c54d"
  standard-new: "c6cd889"
  oracle-fortfront: "b8cb5926fd82ed299d00e8c50eaa41587f55237d"

# What goes in. Pinned artifacts by manifest name; profiles by ID.
inputs:
  standard: j3-24-007
  profile: E0078-R000001
  complete_parser: E0079-R000001
  expression_coverage: E0067-R000001

# The axes being varied. Omit the key if there is only one condition.
variables:
  profile_projection: ["no_parser_targets"]
  operation: ["generated-expression-and-precedence-facade"]
  model_calls: [zero]

# Explain whether model names form a controlled family ladder or separate
# controls. Pin revisions and runtime settings before the first run.
model_selection: "No experimental model calls; profile metadata, facade wiring and expression checks are mechanical."

# Name these before running anything. Choosing a metric after seeing the data
# is how an experiment becomes a demonstration.
metrics:
  - profile_rows
  - profile_parser_targets
  - expression_source_files
  - expression_witnesses
  - gfortran_accepted
  - internal_nodes
  - leaf_nodes
  - binary_nodes
  - unary_nodes
  - array_nodes
  - function_reference_nodes
  - name_nodes
  - literal_nodes
  - source_linked_nodes
  - subtree_parent_links
  - subtree_link_errors
  - tree_mismatches
  - coverage_query_hits
  - unknown_query_rejected
  - max_expression_depth
  - fortran_compile_status
  - runtime_test_status
  - unsupported_operator_rejected
  - independent_difference
  - negative_control

# State the complete eligible set and exclusions before the first run. A rate
# over the successful subset is reported alongside the strict rate.
denominator: >
  The nine expression witnesses across six pinned fortfront files declared by
  phase1-modern-fortran-expression-coverage-v0.json. Every witness has a
  predeclared source hash, span, root rule, total and per-kind node counts.
  The unsupported-operator mutation is excluded from the accepted denominator.

# State the independent behavioral or structural oracle. Self-consistency is
# not an oracle.
independent_oracle: >
  E0079 and E0067 are rerun. The E0078 profile is independently counted and
  hashed. The generated facade is compiled with warnings as errors and run
  against every expression witness. The corpus manifest checks source identity,
  expected precedence shape, node kinds, source references, parent links and
  known and unknown queries. GNU Fortran acceptance and the unsupported
  operator mutation provide behavioral checks.

# Record versions needed to reproduce each run.
toolchain:
  record_in_run: true
  fields: [compiler, fo, poppler, oracle_versions]

# What result would disappoint you? If nothing would, this is not an experiment.
falsifiable_by: >
  The profile changes or gains parser targets, a witness count or node kind
  differs, a source reference or parent link is missing, an unknown query is
  accepted, the facade fails to compile or run, or the unsupported operator is
  accepted.

# The condition that closes the experiment and the evidence it must report.
gate: >
  Generate the expression and precedence facade from the E0078 profile
  metadata, validate all nine declared witnesses and preserve the mutation
  failure. This does not claim complete expression semantics.

# Script that turns runs into the tables and figures in report.md.
analysis: research/experiments/E0080-can-the-e0079-profile-owned-facade-exten/analyse.sh
