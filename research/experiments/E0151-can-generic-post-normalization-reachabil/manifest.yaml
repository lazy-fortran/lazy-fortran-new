id: "E0151"
title: "Generic post-normalization reachability for selected parser targets"
question: >
  Can generic post-normalization reachability prune selected parser targets while preserving source lineage
status: running          # draft | running | reported | abandoned
opened: "2026-08-15"
closed: ""

# Every commit the result depends on. Exact, not "main".
repos:
  lazy-fortran-new: "5645a04"
  standard-new: "c955c23bd57a078c8fceb30de1df101280b25e2c"
  oracle-lfortran: "caf87b660f803148f000046392a5da803f9fc630"

# What goes in. Pinned artifacts by manifest name; profiles by ID.
inputs:
  standard: j3-24-007
  profile: complete-core-selected-program
  standardir_run: E0147/R000022
  current_bison: .cache/runs/E0147/R000022/fortran2023.y
  lfortran_parser: src/lfortran/parser/parser.yy

# The axes being varied. Omit the key if there is only one condition.
variables:
  target_scope: [selected-program]
  implementation: [baseline, generic-post-normalization-pruning]

# Explain whether model names form a controlled family ladder or separate
# controls. Pin revisions and runtime settings before the first run.
model_selection: >
  No model is used. The baseline and the candidate are deterministic target
  projections. LFortran is a parser-engineering reference only; it cannot
  supply production bodies or decide normative correctness.

# Name these before running anything. Choosing a metric after seeing the data
# is how an experiment becomes a demonstration.
metrics:
  - normalized_target_nonterminals
  - reachable_target_nonterminals
  - unreachable_target_nonterminals
  - unreachable_rules
  - retained_source_lineage_records
  - pruned_source_lineage_records
  - bison_useless_nonterminals
  - bison_useless_rules
  - mutation_reachability_control

# State the complete eligible set and exclusions before the first run. A rate
# over the successful subset is reported alongside the strict rate.
denominator: >
  Every normalized target production in the selected Bison export is included.
  The selected start symbol is standardir_start, whose generated body names
  the selected source root. No source production is eligible for deletion;
  only normalized target rules are eligible for target pruning.

# State the independent behavioral or structural oracle. Self-consistency is
# not an oracle.
independent_oracle: >
  A graph reachability calculation is checked against Bison's useless-symbol
  diagnostics and a mutation control that removes one retained graph edge.
  The source-projection audit and source lineage comments independently check
  that target rules still point to StandardIR. The pinned LFortran Bison file
  is a comparison reference, not a language oracle.

# Record versions needed to reproduce each run.
toolchain:
  record_in_run: true
  fields: [compiler, fo, poppler, oracle_versions]

# What result would disappoint you? If nothing would, this is not an experiment.
falsifiable_by: >
  The graph disagrees with Bison, pruning removes a rule that is reachable from
  the selected start, a retained or pruned target rule loses source lineage,
  or the mutation control fails to detect a removed edge.

# The condition that closes the experiment and the evidence it must report.
gate: >
  The baseline reproduces the four useless normalized symbols and seven rules.
  The candidate removes only graph-unreachable normalized rules, writes a
  machine-readable disposition/witness for every removed rule, retains all
  source lineage, and passes the mutation control and the four target validators.

# Script that turns runs into the tables and figures in report.md.
analysis: >
  Run `research/experiments/E0151-can-generic-post-normalization-reachabil/analyse.sh
  <run-directory>`. It writes only to the ignored run directory and produces
  reachability.tsv, summary.json and mutation.log. The production candidate
  is replayed after its commit is available; no model or reference production
  body is used.
