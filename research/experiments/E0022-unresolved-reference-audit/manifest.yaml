id: "E0022"
title: "Unresolved StandardIR reference audit"
question: >
  What are the unresolved StandardIR references, which rules refer to them,
  and which have evidence in the normative text or permitted comparison grammars?
status: running          # draft | running | reported | abandoned
opened: "2026-08-12"
closed: ""

# Every commit the result depends on. Exact, not "main".
repos:
  lazy-fortran-new: "8b09aa6"
  standard-new: "7344c65"
  oracle-standard: "160032a"
  oracle-kaby76: "ba846bb"

# What goes in. Pinned artifacts by manifest name; profiles by ID.
inputs:
  standard: j3-24-007
  profile: complete-core
  standardir: artifacts/runs/E0013/R000002-standardir.toml
  canonical_text: artifacts/runs/E0001/R000003-canonical-text.toml
  comparison_sources:
    - artifacts/grammars/standard-fortran2023-parser.toml
    - artifacts/grammars/kaby76-fortran2023-parser.toml

# The axes being varied. Omit the key if there is only one condition.
variables: {}

# Explain whether model names form a controlled family ladder or separate
# controls. Pin revisions and runtime settings before the first run.
model_selection: "No model calls; inventory only."

# Name these before running anything. Choosing a metric after seeing the data
# is how an experiment becomes a demonstration.
metrics:
  - unresolved_unique_names
  - unresolved_reference_occurrences
  - unresolved_referring_rules
  - unresolved_with_canonical_evidence
  - unresolved_in_standard_grammar
  - unresolved_in_kaby76_grammar
  - independent_difference

# State the complete eligible set and exclusions before the first run. A rate
# over the successful subset is reported alongside the strict rate.
denominator: >
  Every distinct (ref X) name in the pinned E0013 complete-core StandardIR
  input that has no matching StandardIR lhs. Source-only and comparison-only
  evidence is retained; no name is discarded because it lacks a match.

# State the independent behavioral or structural oracle. Self-consistency is
# not an oracle.
independent_oracle: >
  A primary awk traversal records each reference and referring rule. A separate
  grep/sed traversal recomputes the complete reference set and unresolved set;
  the sets and fixed witnesses must agree. Canonical-text and comparison-grammar
  hits are evidence inventories, not correctness decisions.

# Record versions needed to reproduce each run.
toolchain:
  record_in_run: true
  fields: [compiler, fo, oracle_versions]

# What result would disappoint you? If nothing would, this is not an experiment.
falsifiable_by: >
  The input or source pin fails, the two reference traversals differ, a fixed
  unresolved witness is missing, or the output cannot account for every
  unresolved name and referring rule.

# The condition that closes the experiment and the evidence it must report.
gate: >
  Verify the pinned StandardIR, canonical text and comparison grammar blobs;
  emit one row for every unresolved name with occurrences, referring rules and
  source/comparison evidence; independently reproduce the unresolved set; and
  retain the audit for later normative adjudication.

# Script that turns runs into the tables and figures in report.md.
analysis: research/experiments/E0022-unresolved-reference-audit/analyse.sh
