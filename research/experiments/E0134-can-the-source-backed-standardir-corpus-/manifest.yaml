id: "E0134"
title: "Source-backed corpus grammar export regression"
question: >
  Can the source-backed StandardIR corpus pass the batch grammar export boundary
status: reported        # draft | running | reported | abandoned
opened: "2026-08-14"
closed: "2026-08-14"
reported_run: R000245
reported_runs: [R000243, R000244, R000245]

# Every commit the result depends on. Exact, not "main".
repos:
  lazy-fortran-new: dac985d
  standard-new: 25486db92b0805201fa90104dc6f637ecce84942

# What goes in. Pinned artifacts by manifest name; profiles by ID.
inputs:
  standard: j3-24-007
  profile: accepted-composite-projection-v1

# The axes being varied. Omit the key if there is only one condition.
variables:
  inputs: [source_522_control, accepted_composite_519]
  formats: [ebnf, antlr4, bison, tree_sitter]
  controls: [lhs_mutation]

# Explain whether model names form a controlled family ladder or separate
# controls. Pin revisions and runtime settings before the first run.
model_selection: "none; deterministic existing StandardIR exporters only"

# Name these before running anything. Choosing a metric after seeing the data
# is how an experiment becomes a demonstration.
metrics:
  - source_record_count
  - composite_record_count
  - format_count
  - provenance_comment_count
  - output_nonempty
  - mutation_control
  - fo_warnings

# State the complete eligible set and exclusions before the first run. A rate
# over the successful subset is reported alongside the strict rate.
denominator: "The pinned E0013 source corpus of 522 records and the pinned E0055 accepted composite corpus of 519 records; the three intentionally deferred R401/R402/R403 templates remain a named source-only control."

# State the independent behavioral or structural oracle. Self-consistency is
# not an oracle.
independent_oracle: "Independent line counts, provenance-comment counts, source-hash presence and a controlled LHS mutation that must change the emitted output; no comparison grammar is an input."

# Record versions needed to reproduce each run.
toolchain:
  record_in_run: true
  fields: [compiler, fo, poppler, oracle_versions]

# What result would disappoint you? If nothing would, this is not an experiment.
falsifiable_by: "Any dropped composite record, missing format, missing provenance, unchanged mutation output, copied comparison grammar or nonzero warning."

# The condition that closes the experiment and the evidence it must report.
gate: "All four existing deterministic exporters consume the pinned 519-record composite corpus, preserve one provenance annotation per source record, and respond to the mutation control; the 522-record source denominator and three-record exclusion remain explicit."

# Script that turns runs into the tables and figures in report.md.
analysis: research/experiments/E0134-can-the-source-backed-standardir-corpus-/analyse.sh
