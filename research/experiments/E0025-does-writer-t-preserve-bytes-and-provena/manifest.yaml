id: "E0025"
title: "Multi-backend writer and SHA-256 boundary"
question: >
  Does writer_t preserve bytes and provenance hashes across file, memory, hash
  and counting backends?
status: reported         # draft | running | reported | abandoned
opened: "2026-08-12"
closed: "2026-08-12"

# Every commit the result depends on. Exact, not "main".
repos:
  lazy-fortran-new: "4f07565"
  standard-new: "ee61cfe"

# What goes in. Pinned artifacts by manifest name; profiles by ID.
inputs:
  implementation: standard-new writer and sha256
  test: standard-new/test/test_writer.f90

# The axes being varied. Omit the key if there is only one condition.
variables: {}

# Explain whether model names form a controlled family ladder or separate
# controls. Pin revisions and runtime settings before the first run.
model_selection: "No model calls; deterministic Fortran implementation and test."

# Name these before running anything. Choosing a metric after seeing the data
# is how an experiment becomes a demonstration.
metrics:
  - text_policy_self_test_status
  - text_policy_status
  - focused_test_status
  - full_pipeline_status
  - formatting_status
  - independent_oracle_mutation_status
  - file_bytes_status
  - memory_bytes_status
  - counting_size_status
  - sha256_empty_status
  - sha256_abc_status

# State the complete eligible set and exclusions before the first run. A rate
# over the successful subset is reported alongside the strict rate.
denominator: >
  The complete slice consists of writer_t, the pure-Fortran SHA-256 backend,
  their fixed behavioral test and the standard-new full pipeline. Interner and
  UTF-8 boundary behavior are excluded.

# State the independent behavioral or structural oracle. Self-consistency is
# not an oracle.
independent_oracle: >
  test_writer compares memory and file output with separately declared fixed
  byte arrays, checks counting output size, and compares hash output with the
  published empty and abc SHA-256 vectors. A controlled mutation of the abc
  digest was run and had to fail before the accepted test was restored.

# Record versions needed to reproduce each run.
toolchain:
  record_in_run: true
  fields: [compiler, fo, poppler, oracle_versions]

# What result would disappoint you? If nothing would, this is not an experiment.
falsifiable_by: >
  Any backend may alter bytes, report the wrong count, produce a wrong standard
  SHA-256 vector, fail to reject invalid state, or pass after the expected
  digest has been deliberately changed.

# The condition that closes the experiment and the evidence it must report.
gate: >
  Pin the production commit, run the focused test, observe the controlled hash
  oracle mutation fail, restore the oracle, and run text-policy, formatting and
  full fo gates successfully.

# Script that turns runs into the tables and figures in report.md.
analysis: research/experiments/E0025-does-writer-t-preserve-bytes-and-provena/analyse.sh
