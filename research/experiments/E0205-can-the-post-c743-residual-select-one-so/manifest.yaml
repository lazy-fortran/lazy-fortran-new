id: "E0205"
title: "Post-C743 residual bounded-property selection"
question: >
  Can the post-C743 residual select one source-backed bounded property?
status: running          # draft | running | reported | abandoned
opened: "2026-08-17"
closed: ""

# Every commit the result depends on. Exact, not "main".
repos:
  lazy-fortran-new: "e4e7edf8281050f3dc854a5a984baba80d9aab27"
  standard-new: "f94c4c51b51fce22b533b7eeda08741970320913"

# What goes in. Pinned artifacts by manifest name; profiles by ID.
inputs:
  standard: j3-24-007
  profile: "m3-core0-post-c743-residual-selection"
  witnesses: .cache/runs/E0181/R000002/analysis/witness/witnesses.jsonl
  witnesses_sha256: 77c6758a8b0fe5ffbdbe599b8f417b34e8e708ca495ce69b0753454cb144b20c
  predecessor: research/runs/2026-08.jsonl#R000534

# The axes being varied. Omit the key if there is only one condition.
variables:
  promoted_contract_set: [C1106, C702, C601, C603, C721, C725, C718, C723, C729, C719, C738, C1579, C1586, C717, C720, C722, C724, C726, C731, C732, C733, C735, C743]

# Explain whether model names form a controlled family ladder or separate
# controls. Pin revisions and runtime settings before the first run.
model_selection: "No model execution; retained model-origin rows are input only."

# Name these before running anything. Choosing a metric after seeing the data
# is how an experiment becomes a demonstration.
metrics:
  - residual row count
  - disputed and unwitnessed counts
  - first residual row and constraint
  - source and StandardIR binding for the selected row
  - model calls
  - semantic promotions

# State the complete eligible set and exclusions before the first run. A rate
# over the successful subset is reported alongside the strict rate.
denominator: >-
  Every disputed or unwitnessed row in the pinned E0181 witness ledger after
  the exact twenty-three-contract promoted set is excluded.

# State the independent behavioral or structural oracle. Self-consistency is
# not an oracle.
independent_oracle: >-
  The jq partition command independently recomputes the residual inventory
  from the pinned JSONL; no model-origin observation is an oracle.

# Record versions needed to reproduce each run.
toolchain:
  record_in_run: true
  fields: [compiler, fo, poppler, oracle_versions]

# What result would disappoint you? If nothing would, this is not an experiment.
falsifiable_by: >-
  The experiment fails if the partition is not 148 rows with 85 disputed and
  63 unwitnessed, C744@1 is not first, or model calls or semantic promotions
  occur.

# The condition that closes the experiment and the evidence it must report.
gate: >-
  The exact verifier command in TASK_POOL.yaml must pass, and the controller
  must inspect the pinned C744 source and StandardIR shape before selecting
  one bounded property. Do not broaden semantic work.

# Script that turns runs into the tables and figures in report.md.
analysis: >-
  Controller-owned selection report
  artifacts/reports/M3/m3-core0-next-property-selection-v11.md
