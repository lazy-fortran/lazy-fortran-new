id: "E0074"
title: "Full-syntax integration of accepted E0072 aliases"
question: >
  Can the accepted E0072 aliases integrate with the complete syntax projection and direct wiring while semantic facts remain separate?
status: draft            # draft | running | reported | abandoned
opened: "2026-08-12"
closed: ""

# Every commit the result depends on. Exact, not "main".
repos:
  lazy-fortran-new: "cfa8026"
  standard-new: "c6cd889"

# What goes in. Pinned artifacts by manifest name; profiles by ID.
inputs:
  standard: j3-24-007
  syntax: E0013-R000002
  d0019_composition: E0072-R000001
  sidecar_validation: E0073-R000001
  decisions: [D0019, D0027, D0028, D0029]

# The axes being varied. Omit the key if there is only one condition.
variables:
  syntax_projection: [complete-522-record-input]
  alias_projection: [three-accepted-name-aliases-only]
  semantic_projection: [separate-29-record-table]
  direct_wiring: [source-order-dispatch-skeleton]

# Explain whether model names form a controlled family ladder or separate
# controls. Pin revisions and runtime settings before the first run.
model_selection: "No experimental model calls; alias application, target export and direct wiring are deterministic."

# Name these before running anything. Choosing a metric after seeing the data
# is how an experiment becomes a demonstration.
metrics:
  - source_syntax_records
  - integrated_syntax_records
  - alias_records
  - alias_reference_rewrites
  - semantic_fact_records
  - semantic_alias_overlap
  - semantic_projection_leaks
  - unresolved_reference_occurrences
  - unresolved_unique_names
  - export_ebnf_status
  - export_antlr_status
  - export_bison_status
  - export_treesitter_status
  - antlr_validate_status
  - bison_validate_status
  - treesitter_validate_status
  - dispatch_rows
  - dispatch_provenance_rows
  - dispatch_label_collisions
  - direct_fortran_status
  - independent_difference
  - negative_control

# State the complete eligible set and exclusions before the first run. A rate
# over the successful subset is reported alongside the strict rate.
denominator: >
  All 522 E0013 syntax records are eligible. Exactly the three E0072 alias
  records are eligible for syntax rewriting; all 29 semantic-role records must
  remain in a separate table. A source term may have both an alias and a
  semantic fact; the fact class and provenance remain distinct. Every
  integrated syntax record is eligible for deterministic dispatch wiring.

# State the independent behavioral or structural oracle. Self-consistency is
# not an oracle.
independent_oracle: >
  E0072 is rerun and its parser and semantic fact hashes are checked. A
  separate source traversal counts syntax records and alias rewrites, records
  source-term overlap without merging fact classes, checks that no semantic
  fact key enters the parser projection, recomputes unresolved
  references from the integrated lhs set, and validates every dispatch
  provenance row and label. The four StandardIR exporters are run, target
  validators report their independent status, gfortran compiles the dispatch
  module, and an alias mutation must change the integrated syntax witness.

# Record versions needed to reproduce each run.
toolchain:
  record_in_run: true
  fields: [compiler, fo, poppler, oracle_versions]

# What result would disappoint you? If nothing would, this is not an experiment.
falsifiable_by: >
  The experiment fails if a syntax record is dropped, an alias is applied
  outside the accepted three, a semantic fact enters the alias map, source
  provenance is lost, dispatch labels collide, direct wiring does not compile,
  or the controlled alias mutation does not change the output. Target-parser
  rejection is a reported boundary when caused by retained unresolved names.

# The condition that closes the experiment and the evidence it must report.
gate: >
  Apply only the accepted E0072 aliases to all 522 syntax records, retain the
  29 semantic facts separately, emit EBNF/ANTLR4/Bison/tree-sitter syntax and a
  provenance-bearing direct dispatch skeleton, then report unresolved residue
  and target-validator statuses without guessing further relations.

# Script that turns runs into the tables and figures in report.md.
analysis: research/experiments/E0074-can-the-accepted-e0072-aliases-integrate/analyse.sh
