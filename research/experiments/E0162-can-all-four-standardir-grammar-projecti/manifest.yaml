id: "E0162"
title: "Four-format StandardIR and pinned-reference structural adjudication"
question: >
  Can all four StandardIR grammar projections match pinned reference structure without copying productions
status: reported        # draft | running | reported | abandoned
opened: "2026-08-15"
closed: "2026-08-15"

# Every commit the result depends on. Exact, not "main".
repos:
  lazy-fortran-new: "b7c61bdb68f45103e3163a66b23c3e4e8876a223"
  standard-new: "7d011f49e0e74e95b88a90c5894ea3358fc5ee82"
  oracle-standard: "962ee30acd806ada940beb1bf8baa95fcb7e814c"
  oracle-kaby76: "ba846bbdea9df98428d094137d2adbe156f86207"
  oracle-lfortran: "caf87b660f803148f000046392a5da803f9fc630"
  oracle-flang: "cff4ca2e51f89c992d8a1b6ce1067846ba680e2e"

# What goes in. Pinned artifacts by manifest name; profiles by ID.
inputs:
  standard: j3-24-007
  profile: selected-program
  baseline_run: E0161/R000338
  role_family_candidate: E0160/R000337
  corrected_baseline_audit: E0162/R000344
  corrected_candidate_audit: E0162/R000345
  reference_parser: E0162/reference/parser.yy

reference_sha256:
  house_antlr4: d8bb1b600e30be245a2d8c87e32660a3b4ad83aa94728cf50cebf37c1e8b67ce
  kaby76_antlr4: 8f1f55ee4f61f82d732d41bd9452917bc1ce293f64e19615649a5170fb2705a8
  lfortran_bison: 112ef0ce5078ccec630a893bc51b92232348c37742b1451c833928a422907936
  flang_parser_comments: abb4126d6c0c4e516628ba9836c428f83f0ccf883439e67cbfdd061aa42d83b9

# The axes being varied. Omit the key if there is only one condition.
variables:
  variants: [baseline, role-family-candidate]
  formats: [ebnf, antlr4, bison, tree-sitter]
  references: [house-antlr4, kaby76-antlr4, lfortran-bison, flang-rule-comments]

# Explain whether model names form a controlled family ladder or separate
# controls. Pin revisions and runtime settings before the first run.
model_selection: >
  No model was used for the deterministic inventory. The required minimal
  GPT-5.6 Luna adjudication is the already recorded E0157 R000322 review of
  the corrected audit output; it is not a source or grammar authority.

# Name these before running anything. Choosing a metric after seeing the data
# is how an experiment becomes a demonstration.
metrics:
  - raw_and_canonical_generated_heads
  - exact_internal_head_set_agreement
  - generated_lineage_and_validator_status
  - bison_helper_and_target_wrapper_counts
  - pinned_reference_head_counts_and_sha256
  - source_rule_id_comment_coverage
  - explicit_two_sided_structural_classification

# State the complete eligible set and exclusions before the first run. A rate
# over the successful subset is reported alongside the strict rate.
denominator: >
  Both generated variants, all four generated formats, all four pinned
  references, every parser head found by the independent inventory parser,
  and all source-backed lineage and validator rows. Reference head counts are
  not a language-equivalence denominator.

# State the independent behavioral or structural oracle. Self-consistency is
# not an oracle.
independent_oracle: >
  Corrected E0157 source-expression identity, lexical and target-generator
  reports; the E0162 independent head parser; SHA-256-pinned reference files;
  and the E0149 manual correspondence matrix. No reference production is
  copied into StandardIR.

# Record versions needed to reproduce each run.
toolchain:
  record_in_run: true
  fields: [compiler, fo, poppler, oracle_versions]

# What result would disappoint you? If nothing would, this is not an experiment.
falsifiable_by: >
  Any generated format loses a source lineage, differs from its claimed
  canonical internal head set, fails a required validator, uses a reference
  hash other than the pinned one, or is classified without an explicit
  target-scaffolding/reference-structure explanation.

# The condition that closes the experiment and the evidence it must report.
gate: >
  Corrected E0157 audits must pass first. Then E0162 must show equal EBNF and
  ANTLR4 canonical head sets, explain all Bison and tree-sitter additions as
  target scaffolding, preserve source identity in both variants, verify all
  reference hashes, and state explicitly that reference structure is not
  language equivalence.

# Script that turns runs into the tables and figures in report.md.
analysis: >
  research/experiments/E0162-can-all-four-standardir-grammar-projecti/analyse.py
  <baseline-run> <baseline-audit> <candidate-run> <candidate-audit>
  <house.g4> <kaby.g4> <lfortran.yy> <flang.cpp> <output-dir> writes
  head-inventory.tsv, internal-comparison.tsv, reference-comparison.tsv and
  summary.json.

replays:
  - run: R000341
    kind: corrected-E0157-baseline-inventory
    audit: E0162/R000341
  - run: R000342
    kind: corrected-E0157-role-family-inventory
    audit: E0162/R000342
  - run: R000344
    kind: corrected-E0157-baseline-pinned-reference-inventory
    audit: E0162/R000344
  - run: R000345
    kind: corrected-E0157-role-family-pinned-reference-inventory
    audit: E0162/R000345
  - run: R000346
    kind: independent-four-format-reference-adjudication
    report: E0162/R000346
