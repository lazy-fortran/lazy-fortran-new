id: "E0088"
title: "Cross-clause normative prohibition adjudication"
question: >
  Can independent normative prohibition witnesses adjudicate C734
status: reported         # draft | running | reported | abandoned
opened: "2026-08-13"
closed: "2026-08-13"

# Every commit the result depends on. Exact, not "main".
repos:
  lazy-fortran-new: "f67d9b9"
  standard-new: "c6cd889"

# What goes in. Pinned artifacts by manifest name; profiles by ID.
inputs:
  standard: j3-24-007
  constraint_inventory: E0081-R000001
  composite_ledger: E0087-R000001
  witness_policy: research/experiments/E0088-can-independent-normative-prohibition-wi/witness-policy.tsv
  independent_oracle: research/experiments/E0088-can-independent-normative-prohibition-wi/independent-oracle.tsv
  decisions: [D0007, D0028, D0035, D0036, D0037]

# The axes being varied. Omit the key if there is only one condition.
variables:
  adjudication: [not-or, retain-disputed]
  model_calls: [zero]
  parser_projection: [none]

# Explain whether model names form a controlled family ladder or separate
# controls. Pin revisions and runtime settings before the first run.
model_selection: "No model calls. The candidate and witness relation are
predeclared in source-controlled tables."

# Name these before running anything. Choosing a metric after seeing the data
# is how an experiment becomes a demonstration.
metrics:
  - eligible_constraints
  - target_rows
  - witness_rows
  - source_hash_matches
  - target_source_evidence_matches
  - witness_source_evidence_matches
  - selected_candidate
  - disputed_remaining
  - independent_oracle_difference
  - behavioral_compilers
  - behavioral_valid_accepts
  - behavioral_invalid_rejects
  - behavioral_difference
  - parser_projection_records
  - model_calls
  - negative_control

# State the complete eligible set and exclusions before the first run. A rate
# over the successful subset is reported alongside the strict rate.
denominator: >
  The one disputed C734 row in the E0087 composite ledger, plus exactly three
  independently recorded normative witness clauses: C752, C824 and C952. No
  other semantic constraint is adjudicated or emitted as a parser relation.

# State the independent behavioral or structural oracle. Self-consistency is
# not an oracle.
independent_oracle: >
  A separately maintained oracle table names the target, all three witness
  clauses, their canonical source phrases, source locations and the selected
  predicate. An independent traversal checks that the IDs are distinct, every
  phrase occurs in the pinned canonical text, the target is C734, and the
  candidate is the not-or form. Two installed compiler frontends provide a
  secondary behavioral check over one valid derived type name and two invalid
  intrinsic-type names; compiler behavior is not treated as normative evidence.

# Record versions needed to reproduce each run.
toolchain:
  record_in_run: true
  fields: [compiler, flang, fo, poppler, oracle_versions]

# What result would disappoint you? If nothing would, this is not an experiment.
falsifiable_by: >
  A witness phrase is absent or has the wrong source hash, the witness IDs are
  not distinct, the target source does not match the recorded C734 row, the
  independent oracle disagrees, the selected predicate is the alternate scope,
  an accepted parser projection is emitted, a model call occurs, or either
  compiler accepts an intrinsic type name while accepting the ordinary control.

# The condition that closes the experiment and the evidence it must report.
gate: >
  Rerun the E0081 inventory, locate C734 exactly once, verify all three
  source-linked witness clauses and their hash, select the not-or predicate,
  pass the independent oracle and mutation controls, and emit zero parser
  projections and zero model calls. The two compiler frontends must accept the
  ordinary derived type and reject both intrinsic-name controls.

# Script that turns runs into the tables and figures in report.md.
analysis: research/experiments/E0088-can-independent-normative-prohibition-wi/analyse.sh
