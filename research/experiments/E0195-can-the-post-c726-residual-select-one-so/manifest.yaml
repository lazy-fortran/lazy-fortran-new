independent_oracle: >-
  The exact jq promoted-contract partition is recomputed from the pinned
  witnesses JSONL; canonical source byte offsets, page boundaries and the
  existing StandardIR R721 record are checked mechanically. The retained
  model proposal is not an oracle.

# Record versions needed to reproduce each run.
toolchain:
  record_in_run: true
  fields: [compiler, fo, poppler, oracle_versions]

# What result would disappoint you? If nothing would, this is not an experiment.
falsifiable_by: >-
  The experiment fails if the exact partition is not 153 rows with 88
  disputed, 65 unwitnessed and C731@1 first; if the source span is not
  219036:167 on page 85; if R721 or any pinned source hash differs; or if a
  model call or semantic promotion occurs.

# The condition that closes the experiment and the evidence it must report.
gate: >-
  Run the exact jq partition, row inspection, canonical source and
  StandardIR-binding commands in the selection report; retain their result and
  update the central task only on exact agreement.

