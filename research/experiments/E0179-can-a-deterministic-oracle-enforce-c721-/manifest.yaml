id: "E0179"
title: "Deterministic C721 exponent-letter oracle"
question: >
  Can a deterministic oracle enforce C721 exponent-letter legality
status: draft            # draft | running | reported | abandoned
opened: "2026-08-17"
closed: ""

# Every commit the result depends on. Exact, not "main".
repos:
  lazy-fortran-new: "62682695ab30c446c2709244b511875f8de71e0d"
  standard-new: "f94c4c51b51fce22b533b7eeda08741970320913"

# What goes in. Pinned artifacts by manifest name; profiles by ID.
inputs:
  standard: j3-24-007
  profile: m3-c721-source-backed-v0
  normative_source_sha256: 7371e889f231cfb0316d30365d5083fb5af34cbb6d5f7cb1e01855c73021bfa2
  canonical_text: .cache/runs/E0001/R000003/j3-24-007.canonical.txt
  canonical_text_sha256: 1cf538329c57e4f617adb36f2c7cd91a5a5561c78bcce16ec96f7ff1a9979f9e
  standardir_source: .cache/runs/E0171/R000433-provenance-replay/standardir.sx
  standardir_source_sha256: 106389186689ae819783ab6742ba4a469f8d1a84ce3bbf25e9baf98a32cf25c2
  semantic_items: tests/fixtures/m3-c721-semantic-items.sx

# The axes being varied. Omit the key if there is only one condition.
variables:
  property: exponent-letter-legality
  outcomes: [ACCEPTED, REJECTED, UNRESOLVED]

# Explain whether model names form a controlled family ladder or separate
# controls. Pin revisions and runtime settings before the first run.
model_selection: "No model calls. Candidate facts are human-authored fixtures; the oracle is mechanical."

# Name these before running anything. Choosing a metric after seeing the data
# is how an experiment becomes a demonstration.
metrics:
  - case_outcomes
  - source_binding
  - semantic_canonicalization
  - mutation_controls
  - model_calls
  - semantic_promotions

# State the complete eligible set and exclusions before the first run. A rate
# over the successful subset is reported alongside the strict rate.
denominator: >
  Every case in tests/fixtures/m3-c721-source-backed-v0.json: one constrained
  positive, one vacuous positive, one negative neighbour and one unknown-state
  unresolved control. Mutation controls are a separate source-binding
  denominator.

# State the independent behavioral or structural oracle. Self-consistency is
# not an oracle.
independent_oracle: >
  tests/e2e/validate_m3_c721.py computes C721 from typed kind-parameter and
  exponent-letter states independently of expected labels. It checks only the
  bounded implication over the R714/R716 shape; it does not parse real
  literals, evaluate constants or inspect processor representations.

# Record versions needed to reproduce each run.
toolchain:
  record_in_run: true
  fields: [compiler, fo, poppler, oracle_versions]

# What result would disappoint you? If nothing would, this is not an experiment.
falsifiable_by: >
  Any source hash, source span, rule identity or semantic-item provenance
  mutation is accepted; the canonical semantic-items output changes; a
  present-kind/D candidate is accepted; a present-kind/E candidate is
  rejected; an absent-kind/D candidate is rejected; an unknown state is
  classified other than UNRESOLVED; or any model call or semantic promotion is
  observed.

# The condition that closes the experiment and the evidence it must report.
gate: >
  tests/e2e/run-m3-c721.sh .cache/runs/E0179/R000001 must pass from clean
  central and standard-new checkouts, including standard-new sxsemantic
  canonicalization, normative PDF/canonical-text/StandardIR hash and witness
  checks, four independently computed outcomes, five observed mutation
  failures, exact committed trace comparison and zero model calls or semantic
  promotions.

# Script that turns runs into the tables and figures in report.md.
analysis: tests/e2e/validate_m3_c721.py
run: tests/e2e/run-m3-c721.sh .cache/runs/E0179/R000001
