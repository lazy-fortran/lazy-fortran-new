# The axes being varied. Omit the key if there is only one condition.
variables:
  pointer_or_allocatable_attribute: [absent, present, unknown]
  component_array_spec: [deferred-shape-list, explicit-shape-list, unknown]
  context: [component-def-stmt, other, unknown]
  complete_states: 27
  model_calls: [zero]

# Explain whether model names form a controlled family ladder or separate
# controls. Pin revisions and runtime settings before the first run.
model_selection: "No model execution; deterministic oracle and HUMAN expected-outcome table only."

# Name these before running anything. Choosing a metric after seeing the data
# is how an experiment becomes a demonstration.
metrics:
  - complete 27-state typed product
  - ACCEPTED/REJECTED/UNRESOLVED outcome counts
  - mutation controls rejected
  - source/page/StandardIR identity
  - semantic canonicalization
  - model calls
  - semantic promotions

# State the complete eligible set and exclusions before the first run. A rate
# over the successful subset is reported alongside the strict rate.
denominator: >-
  Every combination of the three attribute states, three component-array-spec
  states and three contexts appears exactly once. One present/deferred/
  component-def-stmt state is accepted, one present/explicit/component-def-stmt
  neighbour is rejected, and the remaining 25 states are unresolved. Twelve
  source, page-index, StandardIR, contract and semantic-identity mutations are
  negative controls.

# State the independent behavioral or structural oracle. Self-consistency is
# not an oracle.
independent_oracle: >-
  The validator independently checks the pinned normative source, exact UTF-8
  byte span, unique page-index containment, both existing StandardIR witnesses,
  semantic canonicalization, the complete product, twelve mutations and a
  separately authored HUMAN expected-outcome table. No model output is used.

# Record versions needed to reproduce each run.
toolchain:
  record_in_run: true
  fields: [compiler, fo, poppler, oracle_versions]

# What result would disappoint you? If nothing would, this is not an experiment.
falsifiable_by: >-
  Any missing state, changed expected table, accepted mutation, changed source
  binding, nonzero model call or semantic promotion fails the experiment.

# The condition that closes the experiment and the evidence it must report.
gate: >-
  From a clean checkout, run tests/e2e/run-m3-c750.sh --fresh. The validator,
  source and contract gates, semantic canonicalization, committed trace and
  final clean state must all pass.

# Script that turns runs into the tables and figures in report.md.
analysis: >-
  Controller-owned bounded C750 replay report
  artifacts/reports/M3/m3-c750-source-backed-v0.md
