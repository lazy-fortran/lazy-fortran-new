id: "E0093"
title: "Generated source-linked diagnostic operation"
question: >
  Can the generic evaluator feed a generated source-linked diagnostic operation
status: reported         # draft | running | reported | abandoned
opened: "2026-08-13"
closed: "2026-08-13"

# Every commit the result depends on. Exact, not "main".
repos:
  lazy-fortran-new: "9eae2b8"
  standard-new: "c6cd889"

# What goes in. Pinned artifacts by manifest name; profiles by ID.
inputs:
  standard: j3-24-007
  predecessor: E0092-R000001
  diagnostic_oracle: research/experiments/E0093-can-the-generic-evaluator-feed-a-generat/diagnostic-oracle.tsv

# The axes being varied. Omit the key if there is only one condition.
variables:
  predecessor_evaluator: [E0092]
  operation_rule_ids: [none]
  model_calls: [zero]
  parser_projection: [none]

# Explain whether model names form a controlled family ladder or separate
# controls. Pin revisions and runtime settings before the first run.
model_selection: "No model calls. The operation is generated from the pinned
E0092 evaluator and selected rule table."

# Name these before running anything. Choosing a metric after seeing the data
# is how an experiment becomes a demonstration.
metrics:
  - predecessor_evaluator_cases
  - diagnostic_records
  - accepted_records
  - error_records
  - diagnostic_oracle_difference
  - standard_source_links
  - source_file_hashes
  - predicate_records
  - generic_operation_without_rule_ids
  - parser_projection_records
  - model_calls
  - negative_control

# State the complete eligible set and exclusions before the first run. A rate
# over the successful subset is reported alongside the strict rate.
denominator: >
  The six E0092 witnesses: one accepted and one rejected source for each of
  C601, C603 and C719. The 265 unresolved E0089 rows remain excluded. The
  generated diagnostic operation must be generic over the selected table and
  must not contain any selected constraint ID.

# State the independent behavioral or structural oracle. Self-consistency is
# not an oracle.
independent_oracle: >
  A separately maintained six-row diagnostic oracle fixes status, severity,
  source location and message. The analyzer also checks nonempty source-file
  hashes and predicate records. Removing a diagnostic message is a negative
  control, and the operation's source is searched for C601, C603 and C719.

# Record versions needed to reproduce each run.
toolchain:
  record_in_run: true
  fields: [compiler, fo, poppler, oracle_versions]

# What result would disappoint you? If nothing would, this is not an experiment.
falsifiable_by: >
  The E0092 predecessor changes, any witness differs from its diagnostic
  oracle, a record loses StandardIR location, standard hash, predicate or
  source-file hash, or the generated operation contains a selected constraint
  ID. A message mutation that still passes would also falsify the result.

# The condition that closes the experiment and the evidence it must report.
gate: >
  Rerun E0092, invoke one generated operation for all six witnesses, compare
  its structured records with the independent diagnostic oracle, retain all
  source and predicate links, and observe failure after a message mutation.
  The run must have zero parser projections and zero model calls.

# Script that turns runs into the tables and figures in report.md.
analysis: research/experiments/E0093-can-the-generic-evaluator-feed-a-generat/analyse.sh
