id: "E0137"
title: "Fact-gated grammar frontier"
question: >
  Can generic grammar facts gate bounded frontier transitions over abstract tokens
status: reported        # draft | running | reported | abandoned
opened: "2026-08-14"
closed: "2026-08-14"
reported_run: R000248
reported_runs: [R000248]

# Every commit the result depends on. Exact, not "main".
repos:
  lazy-fortran-new: "890131e"
  fortfront-new: "d27f2bbc6cde7dc351320e4f3de82a61a8f435d6"

# What goes in. Pinned artifacts by manifest name; profiles by ID.
inputs:
  standard: j3-24-007
  profile: standardir-grammar-v0

# The axes being varied. Omit the key if there is only one condition.
variables:
  inputs: [abstract_token_streams, malformed_streams]
  grammar_states: [unique, rejected, ambiguous, unresolved]

# Explain whether model names form a controlled family ladder or separate
# controls. Pin revisions and runtime settings before the first run.
model_selection: "No model calls; deterministic parser-state mechanism only."

# Name these before running anything. Choosing a metric after seeing the data
# is how an experiment becomes a demonstration.
metrics:
  - accepted/rejected/ambiguous/unresolved outcomes
  - preserved rule identity and ordered frontier states
  - malformed, capacity and output-clearing controls
  - full fo warning count

# State the complete eligible set and exclusions before the first run. A rate
# over the successful subset is reported alongside the strict rate.
denominator: "A fixed matrix of abstract token streams over unique, rejected, ambiguous and unresolved grammar witnesses, plus malformed and capacity controls."

# State the independent behavioral or structural oracle. Self-consistency is
# not an oracle.
independent_oracle: "A separately implemented bounded state-transition oracle over the same abstract grammar witnesses; self-consistency is not sufficient."

# Record versions needed to reproduce each run.
toolchain:
  record_in_run: true
  fields: [compiler, fo, poppler, oracle_versions]

# What result would disappoint you? If nothing would, this is not an experiment.
falsifiable_by: "Fortran token names or dispatch in the generic layer, lost frontier order/provenance, hidden ambiguity, accepted unresolved grammar, accepted malformed input, uncleared output, or nonzero fo warning."

# The condition that closes the experiment and the evidence it must report.
gate: "The generic frontier uses available nullable/FIRST facts, passes the complete fixed witness matrix and full fo while preserving unresolved and ambiguous states, and adds no language-specific policy."

# Script that turns runs into the tables and figures in report.md.
analysis: research/experiments/E0137-can-generic-grammar-facts-drive-a-bounde/analyse.sh
