id: "E0105"
title: "Larger-model citation of E0102 residue"
question: >
  Can a larger cited model resolve the remaining E0102 abstentions?
status: running          # draft | running | reported | abandoned
opened: "2026-08-13"
closed: ""

# Every commit the result depends on. Exact, not "main".
repos:
  lazy-fortran-new: "6fac3f3"

# What goes in. Pinned artifacts by manifest name; profiles by ID.
inputs:
  standard: j3-24-007
  profile: complete-core
  e0100_classifications: .cache/runs/E0100/R000001/classifications.tsv
  e0100_candidate_spans: .cache/runs/E0100/R000001/candidate-spans.tsv
  residue_package: .cache/runs/E0101/R000002/residue.jsonl

# The axes being varied. Omit the key if there is only one condition.
variables:
  model: [gpt-5.6-sol]
  reasoning: [medium]
  execution: [one-shot]

# Explain whether model names form a controlled family ladder or separate
# controls. Pin revisions and runtime settings before the first run.
model_selection: >
  One bounded gpt-5.6-sol run at medium reasoning with the committed prompt in
  model-prompt.md. The model must abstain when retained evidence is
  insufficient. The E0101 strict citation harness is the acceptance gate.

# Name these before running anything. Choosing a metric after seeing the data
# is how an experiment becomes a demonstration.
metrics:
  - residue_rows
  - retained_normative_spans
  - model_calls
  - accepted_relations
  - unresolved_or_abstained
  - rejected_outputs
  - alias_promotions
  - new_relations_over_e0102

# State the complete eligible set and exclusions before the first run. A rate
# over the successful subset is reported alongside the strict rate.
denominator: >
  All 127 E0100 residue rows are emitted exactly once so the strict harness can
  validate completeness. The incremental result is the subset of accepted
  relations among the 120 rows that E0102 abstained on.

# State the independent behavioral or structural oracle. Self-consistency is
# not an oracle.
independent_oracle: >
  E0101's citation validator independently checks every relation against a
  retained E0100 normative span, requires all residue names exactly once, and
  rejects unsupported fields, uncited relations and malformed JSONL. E0102's
  accepted seven-row set is compared separately; it is not used as a citation
  source.

# Record versions needed to reproduce each run.
toolchain:
  record_in_run: true
  fields: [compiler, fo, poppler, oracle_versions]

# What result would disappoint you? If nothing would, this is not an experiment.
falsifiable_by: >
  Any missing or duplicate row, unsupported field, citation not present in the
  retained spans, model execution failure, or alias without an exact citation
  fails the run. A result with no new accepted relation is valid evidence.

# The condition that closes the experiment and the evidence it must report.
gate: >
  Run exactly one pinned larger-model invocation, validate complete JSONL
  output through E0101, report total and incremental accepted relations, and
  promote nothing into StandardIR.

# Script that turns runs into the tables and figures in report.md.
analysis: research/experiments/E0101-can-a-strictly-cited-model-resolve-e0100/analyse.sh
