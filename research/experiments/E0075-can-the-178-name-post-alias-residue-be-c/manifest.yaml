id: "E0075"
title: "Deterministic classification of post-alias parser residue"
question: >
  Can the 178-name post-alias residue be classified without guessing parser aliases?
status: draft            # draft | running | reported | abandoned
opened: "2026-08-12"
closed: ""

# Every commit the result depends on. Exact, not "main".
repos:
  lazy-fortran-new: "0fccc28"
  standard-new: "c6cd889"

# What goes in. Pinned artifacts by manifest name; profiles by ID.
inputs:
  standard: j3-24-007
  integrated_syntax: E0074-R000001
  composite_facts: E0072-R000001
  decisions: [D0019, D0028, D0035]

# The axes being varied. Omit the key if there is only one condition.
variables:
  residue_class: [semantic-role, lexical-class, metavariable, unresolved]
  parser_aliases_added: [none]
  model_calls: [zero]

# Explain whether model names form a controlled family ladder or separate
# controls. Pin revisions and runtime settings before the first run.
model_selection: "No experimental model calls; residue extraction, fact joining and classification are deterministic."

# Name these before running anything. Choosing a metric after seeing the data
# is how an experiment becomes a demonstration.
metrics:
  - residue_records
  - semantic_role_records
  - lexical_class_records
  - metavariable_records
  - unresolved_records
  - missing_fact_records
  - additional_alias_records
  - source_hash_matches
  - source_evidence_records
  - semantic_projection_leaks
  - independent_difference
  - negative_control

# State the complete eligible set and exclusions before the first run. A rate
# over the successful subset is reported alongside the strict rate.
denominator: >
  The eligible set is the 178 unique unresolved names remaining after the three
  accepted E0072 aliases are applied to the 522-record syntax projection. Every
  name must receive exactly one classification from the existing
  source-provenanced E0072 fact table. No new parser alias is eligible.

# State the independent behavioral or structural oracle. Self-consistency is
# not an oracle.
independent_oracle: >
  E0074 and E0072 are rerun and their pinned hashes are checked. A separate
  traversal recomputes the unresolved-name set from lhs definitions and refs,
  joins it to the composite facts by source term, checks source fields and
  classification counts, and rejects alias rows or semantic parser targets. A
  controlled semantic-to-alias mutation must fail the validator.

# Record versions needed to reproduce each run.
toolchain:
  record_in_run: true
  fields: [compiler, fo, poppler, oracle_versions]

# What result would disappoint you? If nothing would, this is not an experiment.
falsifiable_by: >
  The experiment fails if a residue name is missing, duplicated, source-less or
  assigned a class absent from its source fact, if a new alias is introduced,
  if the independent residue set differs, or if the negative control passes.

# The condition that closes the experiment and the evidence it must report.
gate: >
  Classify all 178 names, preserve source provenance, report semantic-role,
  lexical-class, metavariable and unresolved counts, add no parser aliases,
  and pass the independent join and mutation checks.

# Script that turns runs into the tables and figures in report.md.
analysis: research/experiments/E0075-can-the-178-name-post-alias-residue-be-c/analyse.sh
