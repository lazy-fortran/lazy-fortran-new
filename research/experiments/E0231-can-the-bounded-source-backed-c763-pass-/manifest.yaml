  pages_index_sha256: 49406a5aecf423555662643f07f6c2bdf72dd3df3954862231afa31505e18929
  standardir: .cache/runs/E0171/R000433-provenance-replay/standardir.sx
  standardir_sha256: 106389186689ae819783ab6742ba4a469f8d1a84ce3bbf25e9baf98a32cf25c2
  normative_pdf: .cache/j3-24-007.pdf
  normative_pdf_sha256: 7371e889f231cfb0316d30365d5083fb5af34cbb6d5f7cb1e01855c73021bfa2
  implementation_commit: 7d93cd1e46105a62ea759071c10c7c083d7ed551

# The axes being varied. Omit the key if there is only one condition.
variables:
  pass_argument_state: "present | absent | unknown"
  dummy_name_relation: "matching | nonmatching | unknown"
  mutation_controls: 15

# Explain whether model names form a controlled family ladder or separate
# controls. Pin revisions and runtime settings before the first run.
model_selection: >-
  One medium-depth gpt-5.6-luna worker produced labelled LLM intake fixtures;
  the expected table, validator and promotion decision are controller-owned
  and mechanical. No model output can promote a semantic fact.

# Name these before running anything. Choosing a metric after seeing the data
# is how an experiment becomes a demonstration.
metrics:
  - typed state count and outcome partition
  - source, page, PDF and StandardIR correspondence
  - rejected mutation-control count
  - trace and validator hashes
  - model calls and semantic promotions

# State the complete eligible set and exclusions before the first run. A rate
# over the successful subset is reported alongside the strict rate.
denominator: >-
  The complete 3-by-3 product of pass-argument state and dummy-name relation,
  plus all fifteen declared source, provenance, schema, fixture and
  semantic-item mutation controls.

# State the independent behavioral or structural oracle. Self-consistency is
# not an oracle.
independent_oracle: >-
  The validator independently checks the pinned source bytes, page-index
  record, PDF identity, StandardIR rows, SX semantic-item replay and contract
  correspondence. Its finite decision procedure is separate from the
  mechanically authored expected-outcomes JSON.

# Record versions needed to reproduce each run.
toolchain:
  record_in_run: true
  fields: [compiler, fo, poppler, oracle_versions]

# What result would disappoint you? If nothing would, this is not an experiment.
falsifiable_by: >-
  Any valid state receives a wrong outcome, a declared mutation is accepted,
  the source or StandardIR binding changes, the committed trace differs, the
  clean-checkout gate fails, a model call occurs during replay, or a semantic
  fact is promoted.

# The condition that closes the experiment and the evidence it must report.
gate: >-
  Run M3_C763_EXPECTED_CENTRAL_COMMIT=<pinned-central>
  C763_EVIDENCE_ROOT=<evidence-root> STANDARD_NEW_ROOT=<standard-new-root>
  tests/e2e/run-m3-c763.sh --fresh from a clean checkout. It must pass the
  contract registry, standard-new canonicalization, complete nine-state table,
  fifteen rejected mutation controls, committed trace comparison, final clean
  state, zero model calls and zero semantic promotions.

# Script that turns runs into the tables and figures in report.md.
analysis: >-
  M3_C763_EXPECTED_CENTRAL_COMMIT=6a00610181b99b828b8468d9f287465b5c6a832a
  C763_EVIDENCE_ROOT=/home/ert/code/lazy-fortran-new
  STANDARD_NEW_ROOT=/home/ert/code/standard-new
  tests/e2e/run-m3-c763.sh --fresh

