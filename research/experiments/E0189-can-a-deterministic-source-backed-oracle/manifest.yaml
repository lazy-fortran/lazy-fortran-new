# The axes being varied. Omit the key if there is only one condition.
variables:
  kind_value: [negative, nonnegative, unknown]
  representation_method: [absent, present, unknown]
  outcomes: [ACCEPTED, REJECTED, UNRESOLVED]

# Explain whether model names form a controlled family ladder or separate
# controls. Pin revisions and runtime settings before the first run.
model_selection: "No model calls. Candidate facts are human-authored fixtures; the oracle is mechanical."

# Name these before running anything. Choosing a metric after seeing the data
# is how an experiment becomes a demonstration.
metrics:
  - case_outcomes
  - source_binding
  - semantic_canonicalization
  - mutation_controls
  - model_calls
  - semantic_promotions

# State the complete eligible set and exclusions before the first run. A rate
# over the successful subset is reported alongside the strict rate.
denominator: >
  The complete typed witness table for the bounded C717 conjunction: valid
  nonnegative and processor-supported, negative value, absent representation
  method, and unknown state controls. Source-binding mutations are separate.

# State the independent behavioral or structural oracle. Self-consistency is
# not an oracle.
independent_oracle: >
  tests/e2e/validate_m3_c717.py independently computes the outcome from the
  typed kind-value and representation-method states. It does not parse
  Fortran, evaluate expressions, inspect processor capabilities or consume
  model output.

# Record versions needed to reproduce each run.
toolchain:
  record_in_run: true
  fields: [compiler, fo, poppler, oracle_versions]

# What result would disappoint you? If nothing would, this is not an experiment.
falsifiable_by: >
  Any source hash, page boundary, canonical-line, R706 metadata, semantic-item
  identity or contract mutation is accepted; a negative value or absent method
  is accepted; an unknown state is not UNRESOLVED; or any model call or
  semantic promotion is observed.

# The condition that closes the experiment and the evidence it must report.
gate: >
  tests/e2e/run-m3-c717.sh --fresh must pass from clean central and
  standard-new checkouts, including source/page-index/StandardIR binding,
  typed witness outcomes, mutation rejection, exact trace comparison and
  zero model calls or semantic promotions.

# Script that turns runs into the tables and figures in report.md.
analysis: tests/e2e/validate_m3_c717.py
run: tests/e2e/run-m3-c717.sh --fresh

