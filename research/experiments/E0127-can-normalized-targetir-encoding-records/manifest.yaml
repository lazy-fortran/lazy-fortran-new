id: "E0127"
title: "Validated normalized TargetIR encoding table"
question: >
  Can normalized TargetIR encoding records be accumulated into a validated bounded table suitable for generated codec data?
status: running          # draft | running | reported | abandoned
opened: "2026-08-14"
closed: ""

# Every commit the result depends on. Exact, not "main".
repos:
  lazy-fortran-new: 06a9859
  fortback-new: c68bf54844fbdbb79f012c5e5e977dacc6301ce2

# What goes in. Pinned artifacts by manifest name; profiles by ID.
inputs:
  standard: j3-24-007
  profile: targetir-normalized-encoding-witnesses

# The axes being varied. Omit the key if there is only one condition.
variables:
  source_families: [riscv, aarch64, mixed]
  controls: [malformed, duplicate, capacity, wrong_target]

# Explain whether model names form a controlled family ladder or separate
# controls. Pin revisions and runtime settings before the first run.
model_selection: "none; deterministic TargetIR table only"

# Name these before running anything. Choosing a metric after seeing the data
# is how an experiment becomes a demonstration.
metrics:
  - insertion_order_preserved
  - source_identity_preserved
  - lookup_matches_existing_codec
  - failure_clearing
  - fo_warnings

# State the complete eligible set and exclusions before the first run. A rate
# over the successful subset is reported alongside the strict rate.
denominator: "Every normalized record in the fixed RISC-V/AArch64 positive set and every declared malformed, duplicate, capacity and target control."

# State the independent behavioral or structural oracle. Self-consistency is
# not an oracle.
independent_oracle: "Independently authored expected table order, source refs, candidate indices and rejection states; existing generic codec is a differential oracle, not the sole oracle."

# Record versions needed to reproduce each run.
toolchain:
  record_in_run: true
  fields: [compiler, fo, poppler, oracle_versions]

# What result would disappoint you? If nothing would, this is not an experiment.
falsifiable_by: "Any ISA-specific dispatch branch, reordered record, lost source identity, duplicate acceptance, partial table retention or nonzero warning."

# The condition that closes the experiment and the evidence it must report.
gate: "The bounded table validates and preserves all positive records, rejects every negative control with cleared outputs, agrees with the existing generic codec, and passes full fo with zero warnings."

# Script that turns runs into the tables and figures in report.md.
analysis: "research/experiments/E0127-can-normalized-targetir-encoding-records/analyse.sh"
