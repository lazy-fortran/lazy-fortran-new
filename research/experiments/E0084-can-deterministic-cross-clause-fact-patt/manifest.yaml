id: "E0084"
title: "Deterministic cross-clause fact patterns"
question: >
  Can deterministic cross-clause fact patterns formalize a broader Core 0 constraint slice without parser-specific branches?
status: draft            # draft | running | reported | abandoned
opened: "2026-08-13"
closed: ""

# Every commit the result depends on. Exact, not "main".
repos:
  lazy-fortran-new: "9e0a08c"
  standard-new: "c6cd889"

# What goes in. Pinned artifacts by manifest name; profiles by ID.
inputs:
  standard: j3-24-007
  profile: E0014-R000001
  constraint_inventory: E0082-R000001
  predicate_slice: research/experiments/E0084-can-deterministic-cross-clause-fact-patt/cross-clause-policy.tsv
  independent_oracle: research/experiments/E0084-can-deterministic-cross-clause-fact-patt/independent-oracle.tsv
  decisions: [D0007, D0019, D0028, D0035, D0036]

# The axes being varied. Omit the key if there is only one condition.
variables:
  fact_patterns: [accessible-membership, conditional-membership, alternative-membership, order-or-association, uniqueness]
  model_calls: [zero]
  parser_projection: [none]

# Explain whether model names form a controlled family ladder or separate
# controls. Pin revisions and runtime settings before the first run.
model_selection: "No model calls. The policy and independent oracle are source-controlled before execution."

# Name these before running anything. Choosing a metric after seeing the data
# is how an experiment becomes a demonstration.
metrics:
  - eligible_constraints
  - selected_constraints
  - normalized_predicates
  - resolved_constraints
  - unresolved_constraints
  - disputed_constraints
  - source_hash_matches
  - source_evidence_matches
  - required_fact_records
  - provided_fact_records
  - dependency_edges
  - topological_order_difference
  - independent_normalization_difference
  - parser_projection_records
  - model_calls
  - negative_control

# State the complete eligible set and exclusions before the first run. A rate
# over the successful subset is reported alongside the strict rate.
denominator: >
  All 287 Core 0-associated numbered constraints emitted by E0081 and retained
  by E0082. Six constraints are eligible for cross-clause deterministic
  patterns. The remaining 281 constraints retain unresolved status. No parser
  projection is in the denominator or output.

# State the independent behavioral or structural oracle. Self-consistency is
# not an oracle.
independent_oracle: >
  A separately traversed oracle table carries the expected selected IDs,
  source phrases, normalized predicates and fact sets. It compares every
  output field, recomputes the selected and unresolved partition, checks source
  hashes, checks every dependency edge against a topological order, and rejects
  controlled mutations of a source phrase and a normalized predicate.

# Record versions needed to reproduce each run.
toolchain:
  record_in_run: true
  fields: [compiler, fo, poppler, oracle_versions]

# What result would disappoint you? If nothing would, this is not an experiment.
falsifiable_by: >
  A selected constraint is absent, duplicated, source-less, assigned an
  unlisted cross-clause fact pattern, given a wrong source hash, assigned the
  wrong required or provided fact, placed after a dependent fact, or accepted
  after either controlled mutation. Any of the other 281 constraints receives
  resolved status, or any parser projection or model call is emitted.

# The condition that closes the experiment and the evidence it must report.
gate: >
  Rerun E0081, match all 287 constraint IDs exactly once, emit six resolved
  cross-clause predicate records and 281 unresolved records, derive and check
  the dependency graph, pass the independent oracle and mutation checks, and
  emit zero parser projections and zero model calls.

# Script that turns runs into the tables and figures in report.md.
analysis: research/experiments/E0084-can-deterministic-cross-clause-fact-patt/analyse.sh
