id: "E0106"
title: "Deterministic source-structure index against the semantic residue"
question: >
  Can the deterministic source-structure index reduce the E0100/E0104 residue without semantic inference?
status: reported        # draft | running | reported | abandoned
opened: "2026-08-13"
closed: "2026-08-13"

# Every commit the result depends on. Exact, not "main".
repos:
  lazy-fortran-new: "767807e"
  standard-new: "ae2ee71c42d2da4cfea28c0093408e375317987b"

# What goes in. Pinned artifacts by manifest name; profiles by ID.
inputs:
  standard: j3-24-007
  profile: complete-core
  e0100_classifications: .cache/runs/E0100/R000001/classifications.tsv
  canonical_text: .cache/runs/E0001/R000003/j3-24-007.canonical.txt
  page_index: .cache/runs/E0001/R000003/j3-24-007.pages.index

# The axes being varied. Omit the key if there is only one condition.
variables:
  structure_kinds: [section-heading, rule-block-start, rule-continuation, cross-reference-block]
  model_calls: [zero]

# Explain whether model names form a controlled family ladder or separate
# controls. Pin revisions and runtime settings before the first run.
model_selection: "No model calls; the indexer and residue matching are deterministic."

# Name these before running anything. Choosing a metric after seeing the data
# is how an experiment becomes a demonstration.
metrics:
  - e0100_residue_rows
  - structure_records
  - structure_records_by_kind
  - unique_residue_candidates
  - ambiguous_residue_candidates
  - no_residue_candidates
  - model_calls
  - semantic_promotions

# State the complete eligible set and exclusions before the first run. A rate
# over the successful subset is reported alongside the strict rate.
denominator: >
  The 127 E0100 rows not classified as mechanically-supported candidates;
  E0104 independently retained the same 127-row residue. No other names are
  included in the strict rate.

# State the independent behavioral or structural oracle. Self-consistency is
# not an oracle.
independent_oracle: >
  A separate validator recomputes the canonical SHA-256, page byte ranges and
  every emitted record's UTF-8 text from the canonical bytes without trusting
  the indexer's text. It also checks each structure record's page and origin.
  A second residue traversal independently recomputes the set of names with
  exact structural-text candidates.

# Record versions needed to reproduce each run.
toolchain:
  record_in_run: true
  fields: [compiler, fo, poppler, oracle_versions]

# What result would disappoint you? If nothing would, this is not an experiment.
falsifiable_by: >
  Any missing or duplicated residue row, invalid source span, source/page
  mismatch, disagreement between traversals, accepted tampered source hash or
  malformed page index, model call, or semantic promotion.

# The condition that closes the experiment and the evidence it must report.
gate: >
  Run the pinned standard-new structure index, validate all source spans and
  hashes independently, classify all 127 residue rows, compare the second
  traversal, and make tampered-source and malformed-index controls fail.

# Script that turns runs into the tables and figures in report.md.
analysis: research/experiments/E0106-can-the-deterministic-source-structure-i/analyse.sh
