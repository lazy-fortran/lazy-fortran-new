id: "E0058"
title: "Source-linked parser diagnostic lookup"
question: >
  Can accepted composite records generate source-linked parser diagnostics
status: reported         # draft | running | reported | abandoned
opened: "2026-08-12"
closed: "2026-08-12"

# Every commit the result depends on. Exact, not "main".
repos:
  lazy-fortran-new: "09cb306"
  standard-new: "c6cd889"

# What goes in. Pinned artifacts by manifest name; profiles by ID.
inputs:
  standard: j3-24-007
  profile: accepted-composite-projection-v1
  predecessor: E0057-R000001
  decisions: [D0018, D0021, D0023, D0028, D0029]

# The axes being varied. Omit the key if there is only one condition.
variables:
  lookup: [lhs-and-rule, unknown-rejection]
  representation: [generated-fortran-table]

# Explain whether model names form a controlled family ladder or separate
# controls. Pin revisions and runtime settings before the first run.
model_selection: "No model calls. Diagnostic records and lookup code are emitted mechanically from E0055 composite-input.sx."

# Name these before running anything. Choosing a metric after seeing the data
# is how an experiment becomes a demonstration.
metrics:
  - composite_syntax_records
  - diagnostic_rows
  - source_span_rows
  - known_lookup
  - unknown_lookup_rejected
  - fortran_compile_status
  - runtime_test_status
  - negative_control

# State the complete eligible set and exclusions before the first run. A rate
# over the successful subset is reported alongside the strict rate.
denominator: >
  All 519 E0055 composite syntax records are eligible. Every row must retain
  its source rule, page, byte start, byte length and source-document hash.

# State the independent behavioral or structural oracle. Self-consistency is
# not an oracle.
independent_oracle: >
  E0055 is rerun and its composite-input hash is checked. A separate
  source-driven traversal reconstructs every diagnostic row and checks fixed
  R501 and unknown-rule witnesses. The generated Fortran lookup module is
  compiled and executed by a test program. A source-span mutation must alter
  the diagnostic witness.

# Record versions needed to reproduce each run.
toolchain:
  record_in_run: true
  fields: [compiler, fo, poppler, oracle_versions]

# What result would disappoint you? If nothing would, this is not an experiment.
falsifiable_by: >
  The experiment fails if a row lacks source identity or span data, a known
  lookup returns the wrong source, an unknown lookup is accepted, the generated
  module does not compile or run, or the mutation control passes.

# The condition that closes the experiment and the evidence it must report.
gate: >
  Report whether generated diagnostic lookup can preserve source identity and
  exact spans for every accepted composite syntax record. This validates the
  diagnostic data path, not parser acceptance or semantic checking.

# Script that turns runs into the tables and figures in report.md.
analysis: research/experiments/E0058-can-accepted-composite-records-generate-/analyse.sh
