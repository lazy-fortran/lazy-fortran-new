id: "E0125"
title: "Batch source-backed StandardIR grammar production"
question: >
  Can the source-backed StandardIR grammar producer scale to an ordered record batch without losing provenance or transactional failure semantics?
status: running          # draft | running | reported | abandoned
opened: "2026-08-14"
closed: ""

# Every commit the result depends on. Exact, not "main".
repos:
  lazy-fortran-new: 06a9859
  standard-new: 4b7b0650db93b32636398e33f6be86c89c685d5e

# What goes in. Pinned artifacts by manifest name; profiles by ID.
inputs:
  standard: j3-24-007
  profile: source-parser-witnesses

# The axes being varied. Omit the key if there is only one condition.
variables:
  input_order: [single, multi_alternative, mixed_valid]
  failure_controls: [incomplete, malformed, capacity]

# Explain whether model names form a controlled family ladder or separate
# controls. Pin revisions and runtime settings before the first run.
model_selection: "none; deterministic production only"

# Name these before running anything. Choosing a metric after seeing the data
# is how an experiment becomes a demonstration.
metrics:
  - ordered_output_count
  - alternative_order_preserved
  - provenance_preserved
  - transactional_failure_clearing
  - fo_warnings

# State the complete eligible set and exclusions before the first run. A rate
# over the successful subset is reported alongside the strict rate.
denominator: "Every supplied production in the fixed positive witness set and each declared negative control."

# State the independent behavioral or structural oracle. Self-consistency is
# not an oracle.
independent_oracle: "Independently authored expected rule order, node structure, provenance and empty-output state for failures."

# Record versions needed to reproduce each run.
toolchain:
  record_in_run: true
  fields: [compiler, fo, poppler, oracle_versions]

# What result would disappoint you? If nothing would, this is not an experiment.
falsifiable_by: "Any reordered, duplicated, partially retained or provenance-corrupted output, or any nonzero warning, rejects the batch slice."

# The condition that closes the experiment and the evidence it must report.
gate: "The batch API preserves the single-record producer's output exactly for every positive witness, clears all outputs on any negative control, and passes full fo with zero warnings."

# Script that turns runs into the tables and figures in report.md.
analysis: "research/experiments/E0125-can-the-source-backed-standardir-grammar/analyse.sh"
