id: "E0087"
title: "Composite semantic ledger and adjudication gate"
question: >
  Can one composite semantic ledger preserve resolved disputed and unresolved formalizations with an explicit adjudication gate?
status: draft            # draft | running | reported | abandoned
opened: "2026-08-13"
closed: ""

# Every commit the result depends on. Exact, not "main".
repos:
  lazy-fortran-new: "afb7d8a"
  standard-new: "c6cd889"

# What goes in. Pinned artifacts by manifest name; profiles by ID.
inputs:
  standard: j3-24-007
  profile: E0014-R000001
  inventories: [E0083-R000001, E0084-R000001, E0085-R000001, E0086-R000001]
  composite_policy: research/experiments/E0087-can-one-composite-semantic-ledger-preser/composite-policy.tsv
  independent_oracle: research/experiments/E0087-can-one-composite-semantic-ledger-preser/independent-oracle.tsv
  decisions: [D0007, D0019, D0035, D0036]

# The axes being varied. Omit the key if there is only one condition.
variables:
  outcomes: [resolved, disputed, unresolved]
  adjudication_gate: [accepted, pending, not-ready]
  model_calls: [zero]
  parser_projection: [none]

# Explain whether model names form a controlled family ladder or separate
# controls. Pin revisions and runtime settings before the first run.
model_selection: "No model calls. The composite policy and independent oracle are fixed before the run."

# Name these before running anything. Choosing a metric after seeing the data
# is how an experiment becomes a demonstration.
metrics:
  - eligible_constraints
  - selected_rows
  - resolved_constraints
  - disputed_constraints
  - unresolved_constraints
  - accepted_predicates
  - competing_candidate_records
  - source_hash_matches
  - source_evidence_matches
  - independent_oracle_agreement
  - adjudication_gate_violations
  - required_fact_records
  - provided_fact_records
  - dependency_edges
  - topological_order_difference
  - independent_normalization_difference
  - parser_projection_records
  - model_calls
  - negative_control

# State the complete eligible set and exclusions before the first run. A rate
# over the successful subset is reported alongside the strict rate.
denominator: >
  All 287 Core 0-associated numbered constraints from E0081. The four prior
  formalization slices contribute 23 disjoint selected rows: 21 resolved, one
  disputed row retaining two predicate candidates, and one source-linked
  unresolved row whose two-column extraction has no contiguous evidence. The
  remaining 264 rows are outside the selected policy and
  remain unresolved in the composite ledger.

# State the independent behavioral or structural oracle. Self-consistency is
# not an oracle.
independent_oracle: >
  A separately traversed composite oracle records every selected status, form,
  source phrase, predicate candidate, fact set and adjudication state. It is
  compared field-by-field with the generated ledger. Source hashes and every
  available selected evidence phrase are checked against the canonical text.
  Accepted dependency edges are generated only from resolved rows and checked against a
  deterministic topological order. Mutating a source phrase, candidate,
  status, or predicate must fail the gate.

# Record versions needed to reproduce each run.
toolchain:
  record_in_run: true
  fields: [compiler, fo, poppler, oracle_versions]

# What result would disappoint you? If nothing would, this is not an experiment.
falsifiable_by: >
  Any selected row is missing or duplicated, a resolved row lacks exactly one
  candidate or source witness, a disputed row loses either candidate or emits
  an accepted dependency, an unresolved row emits a predicate, an independent
  oracle field differs, a source hash or evidence witness differs, the graph is
  cyclic or misordered, or a parser projection or model call is emitted.

# The condition that closes the experiment and the evidence it must report.
gate: >
  Rerun E0081 and match all 287 constraints exactly once. Emit 23 selected
  rows with 21 resolved, one disputed and one unresolved outcome; preserve all
  source evidence and hashes; accept dependencies only from the 21 resolved
  rows; pass the independent composite oracle, source and predicate mutations,
  and the adjudication-state mutation; emit zero parser projections and zero
  model calls.

# Script that turns runs into the tables and figures in report.md.
analysis: research/experiments/E0087-can-one-composite-semantic-ledger-preser/analyse.sh
