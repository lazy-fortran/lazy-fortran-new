id: "E0021"
title: "Grouped syntax export consumability"
question: >
  After repeated StandardIR lhs records are grouped deterministically, do the
  ANTLR4, Bison and tree-sitter projections pass their target tool validators?
status: reported         # draft | running | reported | abandoned
opened: "2026-08-12"
closed: "2026-08-12"

# Every commit the result depends on. Exact, not "main".
repos:
  lazy-fortran-new: "8d57573"
  standard-new: "7344c65"

# What goes in. Pinned artifacts by manifest name; profiles by ID.
inputs:
  standard: j3-24-007
  profile: complete-core
  standardir: artifacts/runs/E0013/R000002-standardir.toml

# The axes being varied. Omit the key if there is only one condition.
variables: {}

# Explain whether model names form a controlled family ladder or separate
# controls. Pin revisions and runtime settings before the first run.
model_selection: ""

# Name these before running anything. Choosing a metric after seeing the data
# is how an experiment becomes a demonstration.
metrics:
  - syntax_records
  - unique_lhs
  - duplicate_lhs_records
  - antlr_duplicate_definitions
  - bison_duplicate_definitions
  - treesitter_duplicate_definitions
  - antlr_status
  - bison_status
  - treesitter_status
  - antlr_unresolved_rule_names
  - bison_unresolved_symbol_names
  - treesitter_first_unresolved_symbol

# State the complete eligible set and exclusions before the first run. A rate
# over the successful subset is reported alongside the strict rate.
denominator: >
  Every syntax record in the pinned E0013 complete-core StandardIR input, plus
  each of the three named target-tool validation commands. The generated
  outputs remain ignored cache files; only their summary is pinned.

# State the independent behavioral or structural oracle. Self-consistency is
# not an oracle.
independent_oracle: >
  Independent awk traversals count source lhs records and generated rule
  definitions. ANTLR4, Bison and tree-sitter each independently validate the
  corresponding generated syntax rather than comparing the output to itself.

# Record versions needed to reproduce each run.
toolchain:
  record_in_run: true
  fields: [compiler, fo, antlr4, bison, tree_sitter, oracle_versions]

# What result would disappoint you? If nothing would, this is not an experiment.
falsifiable_by: >
  A duplicate generated definition remains after grouping, an expected
  validator is missing, the recorded command statuses do not match the logs,
  or the independent source/generated counts disagree.

# The condition that closes the experiment and the evidence it must report.
gate: >
  Regenerate all four syntax exports at the pinned standard-new commit, prove
  duplicate lhs definitions are absent, run all three installed target-tool
  validators, and retain any unresolved lexical or full-source references as
  failures rather than treating a partial grammar as consumable.

# Script that turns runs into the tables and figures in report.md.
analysis: research/experiments/E0021-are-grouped-syntax-exports-consumable/analyse.sh
