id: "E0029"
title: "SX canonical and malformed-input boundary"
question: >
  Does the SX seed preserve canonical trees and reject malformed inputs?
status: reported         # draft | running | reported | abandoned
opened: "2026-08-12"
closed: "2026-08-12"

# Every commit the result depends on. Exact, not "main".
repos:
  lazy-fortran-new: "84cb39a"
  standard-new: "f19c2ca"

# What goes in. Pinned artifacts by manifest name; profiles by ID.
inputs:
  implementation: standard-new fortsx
  test: standard-new/test/test_fortsx_robustness.f90

# The axes being varied. Omit the key if there is only one condition.
variables: {}

# Explain whether model names form a controlled family ladder or separate
# controls. Pin revisions and runtime settings before the first run.
model_selection: "No model calls; deterministic Fortran implementation and test."

# Name these before running anything. Choosing a metric after seeing the data
# is how an experiment becomes a demonstration.
metrics:
  - text_policy_self_test_status
  - text_policy_status
  - focused_test_status
  - full_pipeline_status
  - formatting_status
  - independent_oracle_mutation_status
  - canonical_fixture_status
  - parse_write_parse_status
  - malformed_cases_rejected
  - bounded_atom_and_list_rejections

# State the complete eligible set and exclusions before the first run. A rate
# over the successful subset is reported alongside the strict rate.
denominator: >
  The complete slice consists of the canonical and malformed SX robustness
  test and the standard-new full pipeline. Arena storage, SX hashing and fuzz
  generation are excluded and remain open in ROADMAP.md.

# State the independent behavioral or structural oracle. Self-consistency is
# not an oracle.
independent_oracle: >
  The test compares canonical writer bytes with an independently declared
  fixture, compares the recursively parsed tree after write/read with the
  original tree, and checks exact expected messages for malformed, overlong
  atom and overfull list inputs. Changing the canonical fixture was run and
  had to fail before the accepted test was restored.

# Record versions needed to reproduce each run.
toolchain:
  record_in_run: true
  fields: [compiler, fo, poppler, oracle_versions]

# What result would disappoint you? If nothing would, this is not an experiment.
falsifiable_by: >
  Canonical bytes may differ, parse/write/parse may change a node, any declared
  malformed case may be accepted or produce another message, or the mutated
  canonical fixture may still pass.

# The condition that closes the experiment and the evidence it must report.
gate: >
  Pin the production commit, run the focused robustness test, observe the
  controlled fixture mutation fail, restore the fixture, and run text-policy,
  formatting and full fo gates successfully.

# Script that turns runs into the tables and figures in report.md.
analysis: research/experiments/E0029-does-the-sx-seed-preserve-canonical-tree/analyse.sh
