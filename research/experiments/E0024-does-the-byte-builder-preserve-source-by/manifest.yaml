id: "E0024"
title: "Byte builder append boundary"
question: >
  Does the byte builder preserve source bytes across ASCII, span and newline
  appends?
status: reported         # draft | running | reported | abandoned
opened: "2026-08-12"
closed: "2026-08-12"

# Every commit the result depends on. Exact, not "main".
repos:
  lazy-fortran-new: "e60ab62"
  standard-new: "99c84f4"

# What goes in. Pinned artifacts by manifest name; profiles by ID.
inputs:
  implementation: standard-new byte_builder
  test: standard-new/test/test_byte_builder.f90

# The axes being varied. Omit the key if there is only one condition.
variables: {}

# Explain whether model names form a controlled family ladder or separate
# controls. Pin revisions and runtime settings before the first run.
model_selection: "No model calls; deterministic Fortran implementation and test."

# Name these before running anything. Choosing a metric after seeing the data
# is how an experiment becomes a demonstration.
metrics:
  - text_policy_self_test_status
  - text_policy_status
  - focused_test_status
  - full_pipeline_status
  - formatting_status
  - independent_oracle_mutation_status

# State the complete eligible set and exclusions before the first run. A rate
# over the successful subset is reported alongside the strict rate.
denominator: >
  The complete slice consists of byte_builder, its fixed-byte behavioral test,
  the text-policy gate and the standard-new full pipeline. Integer formatting,
  writer backends, interning and UTF-8 validation are excluded.

# State the independent behavioral or structural oracle. Self-consistency is
# not an oracle.
independent_oracle: >
  test_byte_builder feeds a separately declared source span and ASCII boundary
  input, then compares the produced bytes with an independently declared
  expected array. A controlled mutation of the expected first byte was run
  and had to fail before the accepted test was restored.

# Record versions needed to reproduce each run.
toolchain:
  record_in_run: true
  fields: [compiler, fo, poppler, oracle_versions]

# What result would disappoint you? If nothing would, this is not an experiment.
falsifiable_by: >
  The focused test, its controlled oracle mutation, text-policy checks or the
  full standard-new pipeline may fail, or the builder may alter a byte while
  appending an ASCII value, span or newline.

# The condition that closes the experiment and the evidence it must report.
gate: >
  Pin the production commit, run the focused test, observe the controlled
  expected-byte mutation fail, restore the oracle, and run the text-policy
  checks plus the full fo pipeline with clean formatting.

# Script that turns runs into the tables and figures in report.md.
analysis: research/experiments/E0024-does-the-byte-builder-preserve-source-by/analyse.sh
