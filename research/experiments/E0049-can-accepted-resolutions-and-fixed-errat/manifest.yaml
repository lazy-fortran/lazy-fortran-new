id: "E0049"
title: "Unified partial composite input and resolution-overlap audit"
question: >
  Can accepted resolutions and fixed errata compose into one partial parser input while retaining the D0024 expansion boundary?
status: reported         # draft | running | reported | abandoned
opened: "2026-08-12"
closed: "2026-08-12"

# Every commit the result depends on. Exact, not "main".
repos:
  lazy-fortran-new: "9d9c5e1"
  standard-new: "c6cd889"

# What goes in. Pinned artifacts by manifest name; profiles by ID.
inputs:
  standard: j3-24-007
  profile: "complete-core-partial-composite-v1"
  syntax: E0013-R000002
  canonical_text: E0001-R000003
  accepted_resolution: E0046-R000001
  expansion_inventory: E0048-R000001
  base_errata: research/errata/j3-24-007.json
  errata_extension: research/errata/j3-24-007-r1123.json

# The axes being varied. Omit the key if there is only one condition.
variables:
  accepted_projection: [D0019-r402-lexical]
  fixed_overlay: [D0025-eight-source-repairs]
  deferred_family: [D0024-R401-R403]

# Explain whether model names form a controlled family ladder or separate
# controls. Pin revisions and runtime settings before the first run.
model_selection: "No model calls. E0046 and E0048 are rerun mechanically; this slice only composes their accepted records and measures overlap."

# Name these before running anything. Choosing a metric after seeing the data
# is how an experiment becomes a demonstration.
metrics:
  - source_resolution_records
  - normalized_reference_names
  - errata_records
  - errata_repairs
  - resolved_projection_records
  - projection_reference_replacements
  - expansion_records
  - r401_records
  - r403_records
  - unresolved_expansion_records
  - family_resolution_conflicts
  - conflict_set_difference
  - final_syntax_records
  - source_hash_matches
  - independent_difference
  - representation_selection
  - composition_status
  - negative_control
  - partial_input_sha256
  - partial_grammar_sha256

# State the complete eligible set and exclusions before the first run. A rate
# over the successful subset is reported alongside the strict rate.
denominator: >
  The eligible input is the 182-record accepted D0019 resolution table from
  E0046, the 100-name R401/R403 inventory from E0048, all eight accepted D0025
  source repairs, and all 522 complete-core StandardIR syntax records. The
  candidate composition must preserve source terms and report overlaps. The
  80 R401 and 20 R403 family records remain deferred to D0024; this experiment
  does not choose their representation.

# State the independent behavioral or structural oracle. Self-consistency is
# not an oracle.
independent_oracle: >
  E0046 and E0048 are rerun and their output hashes are checked. A separate
  traversal reconstructs the three overlap terms directly from the predecessor
  tables and compares that set with the composed conflict table. Independent
  occurrence checks verify every erratum, every accepted alias/token
  projection, and every retained unresolved expansion. The candidate is
  generated by standard-new's deterministic SX emitter, and a family mutation
  must fail.

# Record versions needed to reproduce each run.
toolchain:
  record_in_run: true
  fields: [compiler, fo, poppler, oracle_versions]

# What result would disappoint you? If nothing would, this is not an experiment.
falsifiable_by: >
  A predecessor hash changes, a source term is duplicated or dropped, an
  erratum lacks its source occurrence, a projected source reference remains,
  an expansion disappears without being in the conflict set, the overlap set
  differs, the generated candidate changes its 522-record denominator, or the
  negative control does not fail.

# The condition that closes the experiment and the evidence it must report.
gate: >
  Produce the candidate partial composite input and grammar with 182 source
  resolution records, 179 normalized names, eight errata repairs, 70 accepted
  projections, 100 expansion-family records, 522 syntax records, and 182
  source-hash matches. Record the exact three-term R402/R403 overlap as a
  verification failure, retain 97 non-overlapping expansion refs unresolved,
  and do not claim a complete parser input.

# Script that turns runs into the tables and figures in report.md.
analysis: research/experiments/E0049-can-accepted-resolutions-and-fixed-errat/analyse.sh
