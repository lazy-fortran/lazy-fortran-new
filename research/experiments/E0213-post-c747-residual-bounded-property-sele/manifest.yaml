# The axes being varied. Omit the key if there is only one condition.
variables:
  promoted_contracts: 27
  residual_rows: 144
  disputed_rows: 83
  unwitnessed_rows: 61

# Explain whether model names form a controlled family ladder or separate
# controls. Pin revisions and runtime settings before the first run.
model_selection: "No model execution; deterministic ledger partition and source inspection only."

# Name these before running anything. Choosing a metric after seeing the data
# is how an experiment becomes a demonstration.
metrics:
  - residual row count and status partition
  - first residual row and constraint
  - exact source span and page-index containment
  - reusable StandardIR witness
  - model calls
  - semantic promotions

# State the complete eligible set and exclusions before the first run. A rate
# over the successful subset is reported alongside the strict rate.
denominator: >-
  Every witness with status disputed or unwitnessed after excluding exactly the
  twenty-seven promoted bounded contracts is eligible. The exact pinned
  partition must retain all 144 rows and identify C748@1 first.

# State the independent behavioral or structural oracle. Self-consistency is
# not an oracle.
independent_oracle: >-
  The jq partition command is deterministic over the pinned witness ledger;
  source inspection independently checks the canonical C748 line, byte span,
  canonical page-index containment and the R737 StandardIR witness. No model
  output is consumed.

# Record versions needed to reproduce each run.
toolchain:
  record_in_run: true
  fields: [compiler, fo, poppler, oracle_versions]

# What result would disappoint you? If nothing would, this is not an experiment.
falsifiable_by: >-
  Any changed row count, status count, first row, source span, page-index
  containment, StandardIR binding, model call or semantic promotion fails the
  selection.

# The condition that closes the experiment and the evidence it must report.
gate: >-
  Run the exact jq command recorded in
  artifacts/reports/M3/m3-core0-next-property-selection-v17.md from the pinned
  witness ledger, inspect C748's source and R737, and record the result in one
  append-only run.

# Script that turns runs into the tables and figures in report.md.
analysis: >-
  Controller-owned bounded-property selection report
  artifacts/reports/M3/m3-core0-next-property-selection-v17.md
