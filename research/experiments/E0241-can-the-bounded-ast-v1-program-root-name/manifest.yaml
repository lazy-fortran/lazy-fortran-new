id: "E0241"
title: "Bounded source-derived AST v1 program-root name"
question: >
  Can the bounded AST v1 program-root name be derived from source and matched at END PROGRAM
status: running          # draft | running | reported | abandoned
opened: "2026-08-18"
closed: ""

# Every commit the result depends on. Exact, not "main".
repos:
  lazy-fortran-new: "7e8dfe3f83e4f9b86267be69a1afcd9d9d473e02"
  fortfront-new: "157236b11540d6a55676e159062e6f9423577a0d"

# What goes in. Pinned artifacts by manifest name; profiles by ID.
inputs:
  standard: j3-24-007
  profile: frontend-ast-v1-program-root-name

# The axes being varied. Omit the key if there is only one condition.
variables:
  cases: [main, unit]
  negative: [mismatched-end]

# Explain whether model names form a controlled family ladder or separate
# controls. Pin revisions and runtime settings before the first run.
model_selection: "No model calls in the producer replay or oracle; the contract and expected table are labelled LLM because Luna generated them."

# Name these before running anything. Choosing a metric after seeing the data
# is how an experiment becomes a demonstration.
metrics:
  - source_name_acceptance
  - matching_end_name_acceptance
  - mismatched_end_rejection
  - preserved_integer_variable_record
  - repeated_output_identity
  - independent_oracle_status
  - model_calls
  - semantic_promotions

# State the complete eligible set and exclusions before the first run. A rate
# over the successful subset is reported alongside the strict rate.
denominator: "Two source-name cases and one mismatched END PROGRAM negative, all pinned in tests/fixtures/frontend-ast-v1-program-root-name-contract.toml."

# State the independent behavioral or structural oracle. Self-consistency is
# not an oracle.
independent_oracle: "tests/e2e/validate_frontend_ast_v1_program_root_name.py and tests/e2e/validate_frontend_ast_v1_program_root_name_contract.py; neither imports or invokes the producer."

# Record versions needed to reproduce each run.
toolchain:
  record_in_run: true
  fields: [compiler, fo, poppler, oracle_versions]

# What result would disappoint you? If nothing would, this is not an experiment.
falsifiable_by: "Either source name is rejected, either AST root/declaration name differs, the mismatched end is accepted, the existing integer variable record changes, repeated output differs, or any model call or semantic promotion occurs."

# The condition that closes the experiment and the evidence it must report.
gate: "AST_EXPECTED_CENTRAL_COMMIT=<central> tests/e2e/run-frontend-ast-v1-program-root-name.sh --fresh from a clean checkout, followed by two independent focused reviews."

# Script that turns runs into the tables and figures in report.md.
analysis: "The controller records the exact replay and review runs in research/runs/2026-08.jsonl; no successful-subset rate is substituted for the strict gate."
