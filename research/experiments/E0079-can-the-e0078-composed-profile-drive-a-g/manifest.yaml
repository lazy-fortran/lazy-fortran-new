id: "E0079"
title: "Generated complete-parser operation from the E0078 profile"
question: >
  Can the E0078 composed profile drive a generated complete parser over real source with AST and diagnostics?
status: draft            # draft | running | reported | abandoned
opened: "2026-08-12"
closed: ""

# Every commit the result depends on. Exact, not "main".
repos:
  lazy-fortran-new: "3bf01a6"
  fortfront: "b8cb5926fd82ed299d00e8c50eaa41587f55237d"
  standard-new: "c6cd889"

# What goes in. Pinned artifacts by manifest name; profiles by ID.
inputs:
  standard: j3-24-007
  profile: E0078-R000001
  complete_source: E0068-R000001
  ast_source: E0063-R000001

# The axes being varied. Omit the key if there is only one condition.
variables:
  profile_projection: ["no_parser_targets"]
  parser_operation: ["generated_facade_over_complete_and_ast_operations"]
  model_calls: [zero]

# Explain whether model names form a controlled family ladder or separate
# controls. Pin revisions and runtime settings before the first run.
model_selection: "No experimental model calls; the profile, facade wiring and checks are mechanical."

# Name these before running anything. Choosing a metric after seeing the data
# is how an experiment becomes a demonstration.
metrics:
  - profile_rows
  - profile_parser_targets
  - profile_sha256
  - complete_source_files
  - complete_accepted_records
  - complete_source_linked_records
  - ast_source_files
  - ast_nodes
  - ast_source_linked_nodes
  - ast_parent_links
  - ast_child_links
  - ast_link_errors
  - diagnostic_records
  - diagnostic_source_linked
  - gfortran_complete_accepted
  - gfortran_ast_accepted
  - fortran_compile_status
  - runtime_test_status
  - independent_difference
  - negative_control

# State the complete eligible set and exclusions before the first run. A rate
# over the successful subset is reported alongside the strict rate.
denominator: >
  The five files in the pinned complete-source corpus and the five files in the
  pinned AST corpus are eligible. The complete-source corpus contributes 72
  expected accepted records. The AST corpus contributes 73 expected nodes.
  The one generated mutation is excluded from the accepted denominator and is
  used only as a negative control.

# State the independent behavioral or structural oracle. Self-consistency is
# not an oracle.
independent_oracle: >
  E0078 is rerun and its 151-row composition is independently counted and
  hashed. E0068 and E0063 are rerun over their pinned real-source corpora. The
  generated facade is compiled and executed against the manifest's expected
  records, source spans, source hash, AST links and diagnostic mutation. GNU
  Fortran syntax-only checks provide behavioral acceptance for both corpora and
  reject the mutation. No compiler implementation source is read.

# Record versions needed to reproduce each run.
toolchain:
  record_in_run: true
  fields: [compiler, fo, poppler, oracle_versions]

# What result would disappoint you? If nothing would, this is not an experiment.
falsifiable_by: >
  The experiment fails if the profile is altered or enters parser projection,
  a complete-source record or AST node loses source identity, AST links differ
  from the pinned corpus, the generated facade fails to compile or run, the
  mutation is accepted, or either independent comparison differs.

# The condition that closes the experiment and the evidence it must report.
gate: >
  Generate the facade from the E0078 profile metadata, run it over both pinned
  real-source corpora, preserve source-linked diagnostics for the mutation,
  and report the complete-source, AST and profile metrics.

# Script that turns runs into the tables and figures in report.md.
analysis: research/experiments/E0079-can-the-e0078-composed-profile-drive-a-g/analyse.sh
