id: "E0142"
title: "Qwen 3.8 27B replication of the bounded semantic protocol stack"
question: >
  Does Qwen 3.8 27B reproduce the bounded semantic protocol stack
status: draft            # draft | running | reported | abandoned
opened: "2026-08-14"
closed: ""

# Every commit the result depends on. Exact, not "main".
repos:
  lazy-fortran-new: "d465ad2"

# What goes in. Pinned artifacts by manifest name; profiles by ID.
inputs:
  standard: j3-24-007
  profile: complete-core
  prior_protocols: [E0112, E0113, E0114, E0115, E0116, E0117, E0123]
  model_profiles: research/model-profiles.toml

# The axes being varied. Omit the key if there is only one condition.
variables:
  model: [qwen38-27b]
  text_protocol: [fixed-window, full-retrieval, bounded-tools]
  semantic_protocol: [typed-predicate, required-witness, residual-retry]
  reasoning: [off, on-after-failure]
  row_set: [residue-127-plus-oracle-6, constraints-287, retry-53-plus-controls-234]
  visual_protocol: [visual-first-page, not-applicable-if-no-image-capability]

# Explain whether model names form a controlled family ladder or separate
# controls. Pin revisions and runtime settings before the first run.
model_selection: >
  One local Qwen 3.8 27B model selected through the committed default profile.
  Qwen 3.6 35B-A3B remains a historical comparison control; no cloud or
  Codex model is part of this replication.

# Name these before running anything. Choosing a metric after seeing the data
# is how an experiment becomes a demonstration.
metrics:
  - terminal rows and strict resolution rate
  - oracle exact matches and witness acceptance
  - schema/source/provenance gate failures
  - abstentions, hard failures, malformed tool calls and retries
  - evidence calls, submissions, thinking escalations and total model calls
  - prompt/completion/total tokens and total wall time
  - model/server/runtime identity recorded by preflight
  - explicit not_applicable visual cells when image capability is absent

# State the complete eligible set and exclusions before the first run. A rate
# over the successful subset is reported alongside the strict rate.
denominator: >
  Every applicable cell in the declared text and semantic matrix. Text cells
  contain all 127 residue rows and six solved-oracle rows; typed-predicate and
  witness cells contain all 287 constraint rows; residual retry contains the
  exact 53 unresolved/hard-failure rows plus 234 immutable controls. Visual
  capability is determined by preflight and otherwise receives a terminal
  not_applicable record rather than being silently omitted.

# State the independent behavioral or structural oracle. Self-consistency is
# not an oracle.
independent_oracle: >
  The existing deterministic source/provenance gates, pinned canonical text,
  prior controls, typed predicate schema, replay validators, finite materializer
  and witness gate from the referenced protocols. Model output is never its own
  oracle.

# Record versions needed to reproduce each run.
toolchain:
  record_in_run: true
  fields: [compiler, fo, poppler, llama_cpp, model_sha256, service_profile]

# What result would disappoint you? If nothing would, this is not an experiment.
falsifiable_by: >
  A changed denominator, missing cell, hidden model/service reconfiguration,
  unrecorded failure or timing, accepted proposal without evidence or witness,
  visual result without declared image capability, or non-replayable trajectory
  falsifies the replication.

# The condition that closes the experiment and the evidence it must report.
gate: >
  Materialize the complete applicable matrix before execution, run every cell
  with the existing bounded protocols, retain all terminal artifacts, replay
  deterministic validators and witnesses, and report Qwen 3.8 results beside
  the historical Qwen 3.6 control. This manifest records a plan only; no run
  is started by its creation.

# Script that turns runs into the tables and figures in report.md.
analysis: >
  Reuse the pinned E0115/E0116/E0117/E0123 analysis gates and add a successor
  assembly before execution; no report exists until every applicable cell is
  terminal.
