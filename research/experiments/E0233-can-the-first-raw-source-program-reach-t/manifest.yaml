# What goes in. Pinned artifacts by manifest name; profiles by ID.
inputs:
  standard: j3-24-007
  profile: l3-raw-program-v0
  decision: research/decisions/D0173-pivot-to-raw-source-executable-slice.md
  contract_schema: contracts/l3-raw-program-v0.sxs
  contract_witness: contracts/fixtures/l3-raw-program-v0.sx
