  validator: tests/e2e/validate_l3.py
  trace: artifacts/traces/l3-raw-program-v0.json

# The axes being varied. Omit the key if there is only one condition.
variables:
  source_case: "one named free-form main program"
  stages: "raw source | frontend-v0 | MIR-v0 | RV64 Linux executable"
  negative_case: "mismatched end-program name"
  model_calls: 0
  semantic_promotions: 0

# Explain whether model names form a controlled family ladder or separate
# controls. Pin revisions and runtime settings before the first run.
model_selection: >-
  No model call is part of the implementation or replay. The production
  frontend worker is medium-depth gpt-5.6-luna, but its code is reviewed and
  the deterministic central oracle is authoritative.

# Name these before running anything. Choosing a metric after seeing the data
# is how an experiment becomes a demonstration.
metrics:
  - exact positive and negative source hashes
  - frontend-v0 and MIR-v0 canonical output hashes
  - deterministic executable hash and runtime exit status
  - independent negative diagnostic and no-negative-MIR control
  - component revisions, toolchain and clean-checkout state
  - model calls and semantic promotions

# State the complete eligible set and exclusions before the first run. A rate
# over the successful subset is reported alongside the strict rate.
denominator: >-
  The one declared positive raw source case, its one mismatched-end negative
  neighbour, the frontend/MIR/executable stage chain, and the no-output
  negative control. No declarations, expressions, I/O, modules, procedures,
  fixed-form source or broader CXXX inventory is eligible in this experiment.

# State the independent behavioral or structural oracle. Self-consistency is
# not an oracle.
independent_oracle: >-
  tests/e2e/validate_l3.py independently checks exact source bytes, the
  accepted frontend-v0 and MIR-v0 golden observables, the rejected diagnostic,
  absence of negative MIR, ELF64 RISC-V identity and a second qemu-riscv64
  execution. It does not import the fortfront, ffc or fortback implementations.

# Record versions needed to reproduce each run.
toolchain:
  record_in_run: true
  fields: [compiler, fo, poppler, oracle_versions]

# What result would disappoint you? If nothing would, this is not an experiment.
falsifiable_by: >-
  Any positive source rejection, negative-neighbour acceptance, changed
  canonical output, negative MIR or executable creation, nonzero runtime,
  component pin mismatch, dirty clean-checkout gate, trace mismatch, model
  call or semantic promotion.

# The condition that closes the experiment and the evidence it must report.
gate: >-
  From a clean checkout run
  tests/e2e/run-l3.sh --fresh. The first bootstrap creates the committed trace
  under the explicit L3_BOOTSTRAP_TRACE=1 controller action; subsequent replay
  uses the exact command without bootstrap and must compare the trace byte for
  byte.

# Script that turns runs into the tables and figures in report.md.
analysis: >-
  L3_EXPECTED_CENTRAL_COMMIT=<pinned-central>
  tests/e2e/run-l3.sh --fresh

