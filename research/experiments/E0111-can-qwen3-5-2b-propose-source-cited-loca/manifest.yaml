id: "E0111"
title: "Qwen3.5-2B source-cited residue proposals"
question: >
  Can Qwen3.5-2B propose source-cited local semantic facts for the E0106
  residue that survive the same strict validator, including overlap with the
  final deterministic pass?
status: running          # draft | running | reported | abandoned
opened: "2026-08-13"
closed: ""

# Every commit the result depends on. Exact, not "main".
repos:
  lazy-fortran-new: "9373e18"
  standard-new: "ae2ee71"

# What goes in. Pinned artifacts by manifest name; profiles by ID.
inputs:
  standard: j3-24-007
  profile: complete-core
  e0106_residue: .cache/runs/E0106/R000001/residue-classifications.tsv
  e0110_output: .cache/runs/E0110/R000001/classifications.tsv
  canonical_text: .cache/runs/E0001/R000003/j3-24-007.canonical.txt
  page_index: .cache/runs/E0001/R000003/j3-24-007.pages.index

# The axes being varied. Omit the key if there is only one condition.
variables:
  model: [Qwen/Qwen3.5-2B]
  quantization: [Q4_K_M]
  provider: [llama.cpp]
  decoding: [temperature-0, top-p-1, seed-fixed]
  attempts_per_candidate: [1]
  repair_attempts: [0]
  model_calls: [one-bounded-run]

# Explain whether model names form a controlled family ladder or separate
# controls. Pin revisions and runtime settings before the first run.
model_selection: >
  Qwen/Qwen3.5-2B is the predeclared small local model. The reproducible
  runtime uses the Apache-2.0 Q4_K_M GGUF derivative
  enacimie/Qwen3.5-2B-Q4_K_M-GGUF, file qwen3.5-2b-q4_k_m.gguf, served by the
  pinned llama.cpp binary already used locally. MTP is disabled: this 2B GGUF
  has no declared draft head and speculative overhead is not justified for a
  bounded citation task. Larger Qwen3.5/Qwen3.6 models are escalation controls
  for a later experiment, not hidden substitutions here.

# Name these before running anything. Choosing a metric after seeing the data
# is how an experiment becomes a demonstration.
metrics:
  - residue_rows
  - prompts_sent
  - proposals_returned
  - strict_validator_accepts
  - strict_validator_rejects
  - abstentions
  - overlap_rows
  - overlap_agreements
  - overlap_disagreements
  - model_errors
  - semantic_promotions

# State the complete eligible set and exclusions before the first run. A rate
# over the successful subset is reported alongside the strict rate.
denominator: >
  All 127 E0106 residue rows, each presented once with bounded source windows.
  The model may abstain. No proposal is a StandardIR fact until deterministic
  citation validation and independent comparison complete.

# State the independent behavioral or structural oracle. Self-consistency is
# not an oracle.
independent_oracle: >
  The E0110 source-normalization output plus a separate citation validator
  recompute canonical bytes, page containment, source hash, allowed form and
  subject position. Overlap is compared by normalized candidate, relation and
  exact source span, not by model wording.

# Record versions needed to reproduce each run.
toolchain:
  record_in_run: true
  fields: [compiler, fo, poppler, oracle_versions]

# What result would disappoint you? If nothing would, this is not an experiment.
falsifiable_by: >
  Any output accepted without an exact source citation, any architecture or
  wiring proposal, nondeterministic rerun under the pinned settings, missing
  denominator row, or no measurable advantage over abstention falsifies the
  usefulness claim.

# The condition that closes the experiment and the evidence it must report.
gate: >
  Run one reproducible Qwen3.5-2B pass, retain prompt and response artifacts
  outside git, validate every returned proposal, compare all overlapping rows
  with E0110, and promote zero rows automatically. Any later promotion needs
  a separate decision and run record.

# Script that turns runs into the tables and figures in report.md.
analysis: research/experiments/E0111-can-qwen3-5-2b-propose-source-cited-loca/analyse.sh
