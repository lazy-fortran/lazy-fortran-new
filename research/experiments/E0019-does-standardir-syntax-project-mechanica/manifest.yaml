id: "E0019"
title: "StandardIR to tree-sitter grammar.js projection"
question: >
  Does StandardIR syntax project mechanically to a provenance-bearing tree-sitter grammar.js?
status: draft            # draft | running | reported | abandoned
opened: "2026-08-12"
closed: ""

# Every commit the result depends on. Exact, not "main".
repos:
  lazy-fortran-new: "7db476a"
  standard-new: "27406a7"

# What goes in. Pinned artifacts by manifest name; profiles by ID.
inputs:
  standard: j3-24-007
  profile: complete-core
  standardir: artifacts/runs/E0013/R000002-standardir.toml

# The axes being varied. Omit the key if there is only one condition.
variables: {}

# Explain whether model names form a controlled family ladder or separate
# controls. Pin revisions and runtime settings before the first run.
model_selection: ""

# Name these before running anything. Choosing a metric after seeing the data
# is how an experiment becomes a demonstration.
metrics:
  - syntax_records
  - treesitter_productions
  - provenance_comments
  - source_hash_matches
  - lhs_mapping_difference
  - fixed_witnesses
  - output_bytes

# State the complete eligible set and exclusions before the first run. A rate
# over the successful subset is reported alongside the strict rate.
denominator: >
  Every complete-core StandardIR syntax record in the pinned E0013 input
  artifact. The StandardIR header is excluded from the production count.

# State the independent behavioral or structural oracle. Self-consistency is
# not an oracle.
independent_oracle: >
  An awk pass extracts ordered rule and source metadata from the input and
  independently maps lhs names to tree-sitter-safe identifiers before comparing
  them with generated comments and declarations. Fixed R401 and R501 witnesses
  check sequence and repetition projection.

# Record versions needed to reproduce each run.
toolchain:
  record_in_run: true
  fields: [compiler, fo, poppler, oracle_versions]

# What result would disappoint you? If nothing would, this is not an experiment.
falsifiable_by: >
  Any syntax record fails to produce exactly one tree-sitter rule and
  provenance comment, metadata or lhs order differs, a source hash is lost, a
  fixed witness is absent, or the generator rejects a complete-core expression.

# The condition that closes the experiment and the evidence it must report.
gate: >
  Generate deterministic grammar.js syntax output from the pinned StandardIR
  with zero model calls; prove ordered provenance and lhs agreement
  independently; record output hash and size; and keep the generated grammar
  ignored. Parser acceptance is a later comparison gate.

# Script that turns runs into the tables and figures in report.md.
analysis: research/experiments/E0019-does-standardir-syntax-project-mechanica/analyse.sh
