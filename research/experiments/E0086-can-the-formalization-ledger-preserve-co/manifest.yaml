id: "E0086"
title: "Disputed formalization preservation"
question: >
  Can the formalization ledger preserve competing deterministic interpretations as disputed without selecting parser structure?
status: draft            # draft | running | reported | abandoned
opened: "2026-08-13"
closed: ""

# Every commit the result depends on. Exact, not "main".
repos:
  lazy-fortran-new: "0527548"
  standard-new: "c6cd889"

# What goes in. Pinned artifacts by manifest name; profiles by ID.
inputs:
  standard: j3-24-007
  profile: E0014-R000001
  constraint_inventory: E0082-R000001
  normalization_policy: research/experiments/E0086-can-the-formalization-ledger-preserve-co/dispute-policy.tsv
  independent_oracle: research/experiments/E0086-can-the-formalization-ledger-preserve-co/independent-oracle.tsv
  decisions: [D0007, D0019, D0028, D0035, D0036]

# The axes being varied. Omit the key if there is only one condition.
variables:
  outcomes: [resolved, disputed, unresolved]
  model_calls: [zero]
  parser_projection: [none]

# Explain whether model names form a controlled family ladder or separate
# controls. Pin revisions and runtime settings before the first run.
model_selection: "No model calls. Candidate interpretations and adjudication status are predeclared."

# Name these before running anything. Choosing a metric after seeing the data
# is how an experiment becomes a demonstration.
metrics:
  - eligible_constraints
  - policy_rows
  - resolved_constraints
  - disputed_constraints
  - unresolved_constraints
  - normalized_predicates
  - source_hash_matches
  - source_evidence_matches
  - required_fact_records
  - provided_fact_records
  - dependency_edges
  - topological_order_difference
  - independent_normalization_difference
  - competing_candidate_records
  - parser_projection_records
  - model_calls
  - negative_control

# State the complete eligible set and exclusions before the first run. A rate
# over the successful subset is reported alongside the strict rate.
denominator: >
  All 287 Core 0-associated numbered constraints from E0081. Three longer
  clauses are selected. Two have one accepted normalized predicate. One has two
  competing deterministic normalizations and is retained as disputed. The
  remaining 284 constraints remain unresolved.

# State the independent behavioral or structural oracle. Self-consistency is
# not an oracle.
independent_oracle: >
  A separately traversed oracle table carries every selected status, source
  phrase, candidate predicate and fact set. It compares all output fields,
  checks source hashes and evidence, excludes disputed candidates from the
  accepted dependency graph, checks topological order, and rejects controlled
  mutations of a source phrase and one candidate predicate.

# Record versions needed to reproduce each run.
toolchain:
  record_in_run: true
  fields: [compiler, fo, poppler, oracle_versions]

# What result would disappoint you? If nothing would, this is not an experiment.
falsifiable_by: >
  A disputed clause is silently selected, a candidate is dropped, an accepted
  clause is source-less, a source hash differs, a dependency is ordered
  wrongly, either mutation is accepted, or any parser projection or model call
  is emitted.

# The condition that closes the experiment and the evidence it must report.
gate: >
  Rerun E0081, match all 287 constraints exactly once, emit two resolved rows,
  one disputed row carrying both candidates, and 284 unresolved rows. Preserve
  source evidence and hashes, derive dependencies only for resolved rows, pass
  the independent oracle and mutations, and emit zero parser projections and
  zero model calls.

# Script that turns runs into the tables and figures in report.md.
analysis: research/experiments/E0086-can-the-formalization-ledger-preserve-co/analyse.sh
