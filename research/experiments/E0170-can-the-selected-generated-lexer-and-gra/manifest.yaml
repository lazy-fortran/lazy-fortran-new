id: "E0170"
title: "Broad generated lexer and grammar runtime corpus gate"
question: >
  Can the selected generated lexer and grammar runtime pass a broad independent
  positive/negative corpus gate without changing the source-backed contract?
status: reported        # draft | running | reported | abandoned
opened: "2026-08-15"
closed: "2026-08-15"
reported_run: R000386

# Every commit the result depends on. Exact, not "main".
repos:
  lazy-fortran-new: "b88b054"
  standard-new: "fb6590c4885a38b0106f63112f6e024c20b927b5"
  fortfront-new: "41908855f26b28f95619faf96d33cb1d27f80273"

# What goes in. Pinned artifacts by manifest name; profiles by ID.
inputs:
  standard: j3-24-007
  profile: selected-program
  contract: .cache/runs/E0164/R000363-standardir-grammar-v0-selected.sx
  generated_formats: .cache/runs/E0164/R000385-four-format-regeneration
  lexical_facts: .cache/runs/E0164/R000385-four-format-regeneration/input/lexical-facts-v0.sx
  language_family_roots: .cache/runs/E0164/R000348/baseline/language-family-report.json

# The axes being varied. Omit the key if there is only one condition.
variables:
  runtime_input: [single-token-mode, single-load-batch-mode]
  roots: [program, data-ref, generated-language-family-roots]

# Explain whether model names form a controlled family ladder or separate
# controls. Pin revisions and runtime settings before the first run.
model_selection: "No model calls. Luna is a production-sidecar reviewer only."

# Name these before running anything. Choosing a metric after seeing the data
# is how an experiment becomes a demonstration.
metrics:
  - contract_load_status
  - corpus_cases
  - positive_cases
  - negative_cases
  - expected_outcome_mismatches
  - runtime_malformed_cases
  - runtime_unresolved_cases
  - runtime_ambiguous_cases
  - peak_rss
  - elapsed_seconds
  - runtime_token_map
  - fo_status
  - warning_count
  - model_calls

# State the complete eligible set and exclusions before the first run. A rate
# over the successful subset is reported alongside the strict rate.
denominator: >
  The complete bounded E0161-style corpus: the retained language-family roots
  except the separately reported data-ref root, plus the data-ref root itself,
  at depth 8, four terminal tokens, 256 words, 64 negative mutations and
  repeat limit 1. The exact positive/negative counts are emitted by
  run-broad-runtime-gate.sh; no case is removed after inspection.

# State the independent behavioral or structural oracle. Self-consistency is
# not an oracle.
independent_oracle: >
  The corpus's expected outcomes are generated and checked by the independent
  E0161 compare_language.py recognizer over the emitted EBNF. The runtime is
  then checked in a separate process against those outcomes after the generic
  source-lexical-term to generated-target-token map is applied from the pinned
  lexical-facts source. Contract loading, token adaptation and outcome parsing
  are independently checked by the batch-gate script.

# Record versions needed to reproduce each run.
toolchain:
  record_in_run: true
  fields: [compiler, fo, poppler, oracle_versions]

# What result would disappoint you? If nothing would, this is not an experiment.
falsifiable_by: >
  Any source-contract or four-format gate is not PASS, any case is missing or
  duplicated, a runtime acceptance decision differs from the independent
  expectation, a malformed/unresolved/capacity outcome appears, the runtime
  cannot load the contract once, fo reports a warning or failure, or the
  production checkout changes outside its recorded commit. An `ambiguous`
  outcome is retained and counted separately because the selected GLR runtime
  is required to preserve multiple parses; it accepts for the boolean language
  comparison but is not silently treated as an unambiguous success.

# The condition that closes the experiment and the evidence it must report.
gate: >
  The pinned contract loads once per root batch, all cases emitted by the
  declared recognizer bounds produce exactly one
  expected acceptance decision, there are zero acceptance mismatches and zero
  malformed/unresolved/capacity outcomes, and the report includes the complete
  ambiguity count. The existing E0164 source and four-format gates remain PASS,
  and fortfront-new passes its focused and bare fo gates without warnings. This
  closes only deterministic lexer/runtime behavior; semantic, LLM, backend and
  model work remain closed.

# Script that turns runs into the tables and figures in report.md.
analysis: >
  Run research/experiments/E0170-can-the-selected-generated-lexer-and-gra/
  run-broad-runtime-gate.sh with the pinned E0164 contract, generated formats,
  lexical facts, retained language-family root report and
  --root-timeout-seconds 180. The script regenerates both corpora from the
  exact E0164 EBNF, adapts source lexical terms to generated target tokens
  mechanically, and records the mapping, commands, hashes, timing, memory and
  per-case outcomes in its run directory.
