id: "E0085"
title: "Continuation-aware deterministic constraint normalization"
question: >
  Can continuation-aware deterministic normalization formalize longer referenced constraints while retaining an implicit-typing residue?
status: reported         # draft | running | reported | abandoned
opened: "2026-08-13"
closed: "2026-08-13"

# Every commit the result depends on. Exact, not "main".
repos:
  lazy-fortran-new: "16cdd90"
  standard-new: "c6cd889"

# What goes in. Pinned artifacts by manifest name; profiles by ID.
inputs:
  standard: j3-24-007
  profile: E0014-R000001
  constraint_inventory: E0082-R000001
  normalization_policy: research/experiments/E0085-can-continuation-aware-deterministic-nor/continuation-policy.tsv
  independent_oracle: research/experiments/E0085-can-continuation-aware-deterministic-nor/independent-oracle.tsv
  decisions: [D0007, D0019, D0028, D0035, D0036]

# The axes being varied. Omit the key if there is only one condition.
variables:
  source_normalization: [hyphenated-line-join, whitespace-collapse]
  model_calls: [zero]
  parser_projection: [none]

# Explain whether model names form a controlled family ladder or separate
# controls. Pin revisions and runtime settings before the first run.
model_selection: "No model calls. Continuation policy and independent oracle are source-controlled before execution."

# Name these before running anything. Choosing a metric after seeing the data
# is how an experiment becomes a demonstration.
metrics:
  - eligible_constraints
  - policy_rows
  - resolved_constraints
  - unresolved_constraints
  - disputed_constraints
  - normalized_predicates
  - source_hash_matches
  - source_evidence_matches
  - required_fact_records
  - provided_fact_records
  - dependency_edges
  - topological_order_difference
  - independent_normalization_difference
  - parser_projection_records
  - model_calls
  - negative_control

# State the complete eligible set and exclusions before the first run. A rate
# over the successful subset is reported alongside the strict rate.
denominator: >
  All 287 Core 0-associated numbered constraints from E0081. Six continuation
  policy rows are predeclared. Five are eligible for deterministic predicate
  normalization after joining canonical line continuations. One implicit
  typing rule is retained unresolved because the current fact vocabulary does
  not represent implied type parameters. The remaining 281 constraints remain
  unresolved.

# State the independent behavioral or structural oracle. Self-consistency is
# not an oracle.
independent_oracle: >
  A separately traversed oracle table carries the status, source phrase,
  normalized predicate and fact sets for every policy row. It compares all
  resolved outputs, checks every policy phrase in the continuation-normalized
  canonical text, checks source hashes and dependency order, and rejects a
  controlled source mutation and a controlled predicate mutation.

# Record versions needed to reproduce each run.
toolchain:
  record_in_run: true
  fields: [compiler, fo, poppler, oracle_versions]

# What result would disappoint you? If nothing would, this is not an experiment.
falsifiable_by: >
  A continuation is joined incorrectly, a policy row is absent or duplicated,
  a resolved predicate lacks source evidence or facts, an unresolved row is
  silently resolved, a source hash differs, a dependency is ordered wrongly,
  either mutation is accepted, or any parser projection or model call is
  emitted.

# The condition that closes the experiment and the evidence it must report.
gate: >
  Rerun E0081, match all 287 constraints exactly once, normalize five
  continuation-aware predicates, retain one selected row and 281 other
  constraints unresolved, preserve source evidence and hashes, pass the
  independent oracle and mutation checks, and emit zero parser projections and
  zero model calls.

# Script that turns runs into the tables and figures in report.md.
analysis: research/experiments/E0085-can-continuation-aware-deterministic-nor/analyse.sh
