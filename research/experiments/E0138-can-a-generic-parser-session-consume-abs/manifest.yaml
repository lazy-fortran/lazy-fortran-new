id: "E0138"
title: "Incremental generic parser session"
question: >
  Can a generic parser session consume abstract tokens incrementally
status: reported        # draft | running | reported | abandoned
opened: "2026-08-14"
closed: "2026-08-14"
reported_run: R000250
reported_runs: [R000250]

# Every commit the result depends on. Exact, not "main".
repos:
  lazy-fortran-new: "824fafa"
  fortfront-new: "268e312"

# What goes in. Pinned artifacts by manifest name; profiles by ID.
inputs:
  standard: j3-24-007
  profile: standardir-grammar-v0

# The axes being varied. Omit the key if there is only one condition.
variables:
  streams: [accepted, rejected, ambiguous, unresolved, malformed]
  operation: [incremental, finalization]

# Explain whether model names form a controlled family ladder or separate
# controls. Pin revisions and runtime settings before the first run.
model_selection: "No model calls; deterministic generic parser session only."

# Name these before running anything. Choosing a metric after seeing the data
# is how an experiment becomes a demonstration.
metrics:
  - per-token and final accepted/rejected/ambiguous/unresolved outcomes
  - ordered frontier and provenance preservation
  - malformed, capacity and output-clearing controls
  - full fo warning count

# State the complete eligible set and exclusions before the first run. A rate
# over the successful subset is reported alongside the strict rate.
denominator: "A fixed matrix of abstract token streams and grammar witnesses, exercised both incrementally and at finalization, plus malformed and capacity controls."

# State the independent behavioral or structural oracle. Self-consistency is
# not an oracle.
independent_oracle: "A separately authored bounded transition trace for each abstract stream; implementation self-consistency is not sufficient."

# Record versions needed to reproduce each run.
toolchain:
  record_in_run: true
  fields: [compiler, fo, poppler, oracle_versions]

# What result would disappoint you? If nothing would, this is not an experiment.
falsifiable_by: "Fortran token policy or dispatch, changed final outcomes between incremental and batch paths, lost order/provenance, hidden ambiguity, accepted unresolved input, uncleared failure output, or nonzero fo warning."

# The condition that closes the experiment and the evidence it must report.
gate: "The generic session agrees with the independent transition traces, preserves explicit outcomes, and passes full fo without changing a contract or adding language-specific parser wiring."

# Script that turns runs into the tables and figures in report.md.
analysis: research/experiments/E0138-can-a-generic-parser-session-consume-abs/analyse.sh
