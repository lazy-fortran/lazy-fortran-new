id: "E0015"
title: "Core 0 feature eligibility projection"
question: >
  Can Core 0 feature eligibility prune excluded alternatives while preserving a closed generated syntax projection?
status: running          # draft | running | reported | abandoned
opened: "2026-08-12"
closed: ""

# Every commit the result depends on. Exact, not "main".
repos:
  lazy-fortran-new: "d5d9499"
  standard-new: "17487dd"

# What goes in. Pinned artifacts by manifest name; profiles by ID.
inputs:
  standard: j3-24-007
  profile: core0-v1
  dependency_graph: artifacts/runs/E0014/R000001-dependencies.toml
  exclusions: research/experiments/E0015-can-core-0-feature-eligibility-prune-exc/exclusions.jsonl

# The axes being varied. Omit the key if there is only one condition.
variables:
  projection: [retain, prune-explicitly-excluded-lhs]
  unresolved_policy: retain-and-classify

# Explain whether model names form a controlled family ladder or separate
# controls. Pin revisions and runtime settings before the first run.
model_selection: ""

# Name these before running anything. Choosing a metric after seeing the data
# is how an experiment becomes a demonstration.
metrics:
  - source_records
  - closure_rules
  - declared_excluded_lhs
  - excluded_rules_reached
  - retained_rules
  - pruned_edges
  - unresolved_edges
  - unresolved_names
  - unresolved_notation
  - unresolved_needs_adjudication
  - nonclosed_references
  - independent_projection_difference

# State the complete eligible set and exclusions before the first run. A rate
# over the successful subset is reported alongside the strict rate.
denominator: >
  Every dependency record in the pinned E0014 closure, and every reference in
  each retained record. Exclusions are the predeclared HUMAN records in
  exclusions.jsonl. Rules and references are never deleted from the normative
  StandardIR corpus.

# State the independent behavioral or structural oracle. Self-consistency is
# not an oracle.
independent_oracle: >
  The projection script emits one retained dependency record per eligible
  rule. A separate awk pass recomputes the retained rule set, removed edges,
  unresolved references and closure condition from the same input. The two
  results must agree. The E0014 dependency checker remains the upstream graph
  oracle.

# Record versions needed to reproduce each run.
toolchain:
  record_in_run: true
  fields: [compiler, fo, poppler, oracle_versions]

# What result would disappoint you? If nothing would, this is not an experiment.
falsifiable_by: >
  A declared root is excluded, a retained reference points to an excluded or
  absent rule without being classified as unresolved, the independent pass
  differs, or the projection cannot produce a closed eligible graph.

# The condition that closes the experiment and the evidence it must report.
gate: >
  Produce a pinned projected dependency SX, classify every removed edge and
  unresolved reference, prove that every retained rule reference resolves to
  another retained rule or an explicitly retained terminal name, and record
  any policy boundary that cannot be decided from the existing Core 0 prose.

# Script that turns runs into the tables and figures in report.md.
analysis: research/experiments/E0015-can-core-0-feature-eligibility-prune-exc/analyse.sh
