id: "E0117"
title: "Model-supplied fact witnesses for typed semantic proposals"
question: >
  Can source-backed model witnesses make typed semantic proposals independently testable?
status: running          # draft | running | reported | abandoned
opened: "2026-08-14"
closed: ""

# Every commit the result depends on. Exact, not "main".
repos:
  lazy-fortran-new: "16cfbe6"
  standard-new: "ae2ee71"

# What goes in. Pinned artifacts by manifest name; profiles by ID.
inputs:
  standard: j3-24-007
  profile: "complete-core"
  predecessor: E0116/R000015
  canonical_text: .cache/runs/E0001/R000003/j3-24-007.canonical.txt
  constraint_inventory: research/experiments/E0081-can-deterministic-source-patterns-invent/analyse.sh

# The axes being varied. Omit the key if there is only one condition.
variables:
  model: [qwen36-35b-a3b]
  reasoning: [off]
  witnesses: [required]
  max_turns: [24]

# Explain whether model names form a controlled family ladder or separate
# controls. Pin revisions and runtime settings before the first run.
model_selection: >
  One local Qwen 3.6 35B-A3B checkpoint through the pinned upstream llama.cpp
  runtime. This is a protocol pilot, not a cross-model comparison.

# Name these before running anything. Choosing a metric after seeing the data
# is how an experiment becomes a demonstration.
metrics:
  - eligible_rows
  - accepted_rows
  - unresolved_rows
  - hard_failures
  - witness_required_rejections
  - model_witness_rows
  - self_consistent_rows
  - disputed_rows
  - unwitnessed_rows
  - witness_case_count
  - model_calls
  - total_tokens
  - wall_s_total

# State the complete eligible set and exclusions before the first run. A rate
# over the successful subset is reported alongside the strict rate.
denominator: >
  All 287 E0081 Core 0 constraint occurrences, including the one
  reference-only occurrence. Primary accepted proposals must contain one to
  eight concrete fact maps with expected Boolean outcomes. No row is removed
  because a model cannot supply a witness.

# State the independent behavioral or structural oracle. Self-consistency is
# not an oracle.
independent_oracle: >
  The deterministic source/schema gate and a separate evaluator execute every
  submitted fact map. This experiment deliberately does not call those maps
  an independent semantic oracle: self-consistency is reported separately and
  promotion remains blocked until a source-derived or compiler-behavior oracle
  agrees.

# Record versions needed to reproduce each run.
toolchain:
  record_in_run: true
  fields: [compiler, fo, poppler, llama_cpp, model_sha256, service_profile]
  llama_cpp: "upstream master 650913862 / build 10427"
  service_profile: "mailuefterl Qwen 3.6 35B-A3B Q4_K_XL; reasoning off"

# What result would disappoint you? If nothing would, this is not an experiment.
falsifiable_by: >
  A missing witness on an accepted primary row, a malformed fact map, an
  evaluator disagreement, a dropped row, a schema/source failure, or any
  promotion inferred from self-consistency falsifies the protocol.

# The condition that closes the experiment and the evidence it must report.
gate: >
  Run the bounded E0116 protocol with required witness maps, retain every
  rejection and terminal state, execute witness.py, and report accepted,
  self-consistent, disputed and unwitnessed rows separately. Emit zero
  StandardIR promotions.

# Script that turns runs into the tables and figures in report.md.
analysis: >
  research/experiments/E0116-can-bounded-qwen-semantic-proposals-clos/
  run-semantic.py with --require-witnesses, followed by validate.py and
  witness.py; generated plots remain ignored.
