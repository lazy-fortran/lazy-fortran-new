id: "E0243"
title: "Bounded source-derived AST v1 DOUBLE PRECISION type-spec"
question: >
  Can a bounded AST v1 DOUBLE PRECISION type-spec be derived from source without broadening the frontend
status: reported          # draft | running | reported | abandoned
opened: "2026-08-18"
closed: "2026-08-18"

# Every commit the result depends on. Exact, not "main".
repos:
  lazy-fortran-new: "82bed395cc743e5f3f2a0a8139aa46b05b8d4308"
  fortfront-new: "c3647c4ba3d8740afcf2b96af0ea0cdf39dfad19"

# What goes in. Pinned artifacts by manifest name; profiles by ID.
inputs:
  standard: j3-24-007
  profile: frontend-ast-v1-double-precision

# The axes being varied. Omit the key if there is only one condition.
variables:
  cases: [double-precision, real-control]
  negative: [missing-entity]

# Explain whether model names form a controlled family ladder or separate
# controls. Pin revisions and runtime settings before the first run.
model_selection: "No model calls in the producer replay or oracle; Luna generates only labelled contract candidates and cannot promote semantic facts."

# Name these before running anything. Choosing a metric after seeing the data
# is how an experiment becomes a demonstration.
metrics:
  - double_precision_acceptance
  - changed_type_control_acceptance
  - malformed_declaration_rejection
  - source_and_provenance_binding
  - repeated_output_identity
  - independent_oracle_status
  - model_calls
  - semantic_promotions

# State the complete eligible set and exclusions before the first run. A rate
# over the successful subset is reported alongside the strict rate.
denominator: "One DOUBLE PRECISION source case, one REAL changed-type control, and one malformed DOUBLE PRECISION declaration, all pinned in the contract manifest."

# State the independent behavioral or structural oracle. Self-consistency is
# not an oracle.
independent_oracle: "The central contract and replay validators; neither imports or invokes fortfront-new."

# Record versions needed to reproduce each run.
toolchain:
  record_in_run: true
  fields: [compiler, fo, poppler, oracle_versions]

# What result would disappoint you? If nothing would, this is not an experiment.
falsifiable_by: "The DOUBLE PRECISION case is rejected, the REAL control changes type, the malformed declaration is accepted, source/provenance bindings differ, repeated output differs, or any model call or semantic promotion occurs."

# The condition that closes the experiment and the evidence it must report.
gate: "The exact contract oracle and central gates pass from a clean pushed checkout, followed by the isolated fortfront component gate, central replay, and two independent focused reviews."

# Script that turns runs into the tables and figures in report.md.
analysis: "The controller records exact contract, implementation replay and review runs in research/runs/2026-08.jsonl; no successful-subset rate substitutes for the strict gate."
