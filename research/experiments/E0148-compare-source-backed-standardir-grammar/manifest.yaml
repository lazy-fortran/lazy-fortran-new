id: "E0148"
title: "Compare source-backed StandardIR grammar bodies with the pinned LFortran Bison grammar"
question: >
  Can an independently pinned Bison grammar expose source-to-target lexical or
  projection defects that the E0147 source-span and parser-generator gates do
  not detect?
status: running           # draft | running | reported | abandoned
opened: "2026-08-15"
closed: ""

# Every commit the result depends on. Exact, not "main".
repos:
  lazy-fortran-new: "356e2e225ee120a1a799f668a5e47f4241b8a67d"
  standard-new: "1cdd9490375199d93c755fb3c36bc9dcf2c285e6"
  oracle-lfortran: "caf87b660f803148f000046392a5da803f9fc630"

# What goes in. Pinned artifacts by manifest name; profiles by ID.
inputs:
  standard: j3-24-007
  profile: complete-core
  standardir_run: E0147/R000016
  lfortran_path: src/lfortran/parser/parser.yy
  lfortran_artifact: lfortran-parser-yy

# The axes being varied. Omit the key if there is only one condition.
variables:
  target: [lfortran_bison, standardir_bison_all_roots, standardir_bison_program_root]
  adjudication: [defect, projection_gap, expected_difference, stale_prior_finding]

# Explain whether model names form a controlled family ladder or separate
# controls. Pin revisions and runtime settings before the first run.
model_selection: >
  No model calls. The comparison is deterministic plus a manually recorded
  adjudication against the exact pinned LFortran source. Luna review is a
  separate required review of the resulting evidence, not a grammar oracle.

# Name these before running anything. Choosing a metric after seeing the data
# is how an experiment becomes a demonstration.
metrics:
  - pinned_source_hash
  - standardir_unicode_token_occurrences
  - lfortran_canonical_terminal_evidence
  - duplicate_source_occurrence_groups
  - standardir_all_root_conflicts
  - standardir_selected_root_conflicts
  - standardir_selected_root_useless_rules
  - lfortran_conflicts
  - classified_findings
  - stale_prior_findings

# State the complete eligible set and exclusions before the first run. A rate
# over the successful subset is reported alongside the strict rate.
denominator: >
  Every syntax record and token in E0147/R000016, every repeated source
  occurrence with an identical normalized body, the complete pinned LFortran
  Bison source, and the selected-root validator output. Expected differences
  are retained in the denominator and classified rather than removed.

# State the independent behavioral or structural oracle. Self-consistency is
# not an oracle.
independent_oracle: >
  The exact BSD-3-Clause LFortran parser.yy blob at the pinned commit, its
  declared terminal spellings and Bison replay, plus the source-backed E0147
  grammar exports and a separate Bison replay with r_program as start symbol.
  LFortran is a comparison implementation, never a source for StandardIR.

# Record versions needed to reproduce each run.
toolchain:
  record_in_run: true
  fields: [compiler, fo, poppler, bison, oracle_versions, pinned_commits]

# What result would disappoint you? If nothing would, this is not an experiment.
falsifiable_by: >
  The pinned LFortran blob cannot be reproduced, a source glyph is emitted as
  a target spelling that cannot represent valid Fortran source, a duplicate
  occurrence is collapsed without lineage, a selected-root export contains
  unexplained unreachable output, or a comparison disagreement is left
  unclassified. A Bison accept result alone cannot falsify the source audit.

# The condition that closes the experiment and the evidence it must report.
gate: >
  The analysis reproduces both Bison inputs and logs, inventories every
  non-ASCII syntax token and duplicate occurrence, records selected-root
  reachability and conflict evidence, and classifies every observed
  disagreement as defect, projection gap, expected difference or stale prior
  finding. This experiment reports the defects; it does not close M1 or M2.

# Script that turns runs into the tables and figures in report.md.
analysis: >
  Run
  research/experiments/E0148-compare-source-backed-standardir-grammar/analyse.sh
  <run-directory>. It writes only to the ignored run directory and produces
  summary.json, findings.tsv, glyphs.tsv, duplicate-occurrences.tsv and the
  Bison replay logs. The manual adjudication is in findings.md.
