id: "E0119"
title: "Generated frontend vertical slice from a closed StandardIR profile"
question: >
  Can a closed StandardIR syntax profile generate a verified frontend vertical slice without handwritten wiring
status: draft            # draft | running | reported | abandoned
opened: "2026-08-14"
closed: ""

# Every commit the result depends on. Exact, not "main".
repos:
  lazy-fortran-new: "44d4beb49d12e0d772e43c8800d6abc22c8d169c"
  standard-new: "27329a701575f32776281f235290e465c5588105"
  fortfront-new: "b2a792ff605038745cd512a72fb4e7a1c28e37bc"
  ffc-new: "28c1469ba5b8821993b8da70d4bf457dd335fe57"

# What goes in. Pinned artifacts by manifest name; profiles by ID.
inputs:
  standard: j3-24-007
  profile: complete-core
  syntax_profile_measurement: research/experiments/E0098-can-the-current-complete-standardir-proj/analyse.sh
  frontend_contract: contracts/frontend-v0.sxs
  frontend_fixture: contracts/fixtures/frontend-v0.sx

# The axes being varied. Omit the key if there is only one condition.
variables:
  wiring: [generated-only]
  parser_strategy: [selected-direct-parser]
  semantic_scope: [program-declaration]

# Explain whether model names form a controlled family ladder or separate
# controls. Pin revisions and runtime settings before the first run.
model_selection: >
  No model calls. This is a deterministic generation experiment; any local
  implementation hole must be recorded separately and cannot add dispatch,
  callers or compiler-wide modules.

# Name these before running anything. Choosing a metric after seeing the data
# is how an experiment becomes a demonstration.
metrics:
  - syntax_records_consumed
  - generated_lexer_records
  - generated_parser_productions
  - generated_ast_types
  - generated_wiring_entries
  - generated_source_files
  - generated_source_bytes
  - language_specific_handwritten_files
  - language_specific_handwritten_lines
  - provenance_complete_records
  - contract_validation_pass
  - sx_fixture_roundtrip_pass
  - source_linked_diagnostic_pass
  - program_declaration_acceptance
  - program_declaration_rejection
  - unsupported_constructs_explicit
  - independent_oracle_agreements
  - independent_oracle_disagreements
  - wall_s_total

# State the complete eligible set and exclusions before the first run. A rate
# over the successful subset is reported alongside the strict rate.
denominator: >
  Every syntax record in the pinned complete-core profile that the generator
  declares eligible for the selected program-declaration slice, plus every
  fixed frontend-v0 contract fixture and every independently declared positive
  and negative program-declaration witness. No generated record, rejected
  witness or unsupported construct may be removed from the denominator.

# State the independent behavioral or structural oracle. Self-consistency is
# not an oracle.
independent_oracle: >
  The source-side StandardIR record set is checked against its pinned source
  references and schema validators. Generated source is then tested against
  fixed SX bytes and independently authored positive and negative Fortran
  witnesses whose expected root, declaration, span and diagnostic facts are
  frozen before generation. Agreement between generated files alone is not an
  oracle. The frontend-v0 fixture round-trip and the independent witness
  expectations are separate checks.

# Record versions needed to reproduce each run.
toolchain:
  record_in_run: true
  fields: [compiler, fo, poppler, oracle_versions]

# What result would disappoint you? If nothing would, this is not an experiment.
falsifiable_by: >
  The experiment fails if any eligible record lacks generated representation or
  provenance, if wiring is manually authored, if a generated parser accepts an
  invalid witness or rejects a valid witness, if the generated AST or
  diagnostic facts disagree with the frozen oracle, if unsupported constructs
  are silently accepted, or if a local implementation fragment adds a module,
  caller or dispatch convention.

# The condition that closes the experiment and the evidence it must report.
gate: >
  Generate the complete selected source tree from the pinned StandardIR and
  frontend schemas; pass source, schema, contract, fixture, negative-witness
  and full production Fortran gates; report every denominator and origin label;
  and demonstrate that the generated wiring contains no language-specific
  handwritten caller or dispatch. The experiment is reported even when the
  slice fails.

# Script that turns runs into the tables and figures in report.md.
analysis: >
  Before status becomes running, add the committed E0119 analyse.sh and a
  report.md template that regenerate the declared metrics from append-only run
  records. No plot or generated build directory is committed.
