id: "E0139"
title: "Generic TargetIR feature query"
question: >
  Can TargetIR-v0 feature metadata be queried generically
status: running          # draft | running | reported | abandoned
opened: "2026-08-14"
closed: ""

# Every commit the result depends on. Exact, not "main".
repos:
  lazy-fortran-new: "824fafa"
  fortback-new: "403a1ba"

# What goes in. Pinned artifacts by manifest name; profiles by ID.
inputs:
  standard: not-applicable
  profile: targetir-v0

# The axes being varied. Omit the key if there is only one condition.
variables:
  feature_values: [riscv_i, aarch64_base, unknown]
  controls: [duplicate, malformed, capacity]

# Explain whether model names form a controlled family ladder or separate
# controls. Pin revisions and runtime settings before the first run.
model_selection: "No model calls; deterministic TargetIR-v0 metadata query only."

# Name these before running anything. Choosing a metric after seeing the data
# is how an experiment becomes a demonstration.
metrics:
  - feature match count and insertion order
  - source and origin preservation
  - unknown, duplicate, malformed and capacity outcomes
  - full fo warning count

# State the complete eligible set and exclusions before the first run. A rate
# over the successful subset is reported alongside the strict rate.
denominator: "Every feature-bearing instruction in the fixed TargetIR-v0 witness matrix, plus unknown-feature, duplicate, malformed and capacity controls."

# State the independent behavioral or structural oracle. Self-consistency is
# not an oracle.
independent_oracle: "A separately authored expected index/source/origin table over the fixed TargetIR-v0 witnesses."

# Record versions needed to reproduce each run.
toolchain:
  record_in_run: true
  fields: [compiler, fo, poppler, oracle_versions]

# What result would disappoint you? If nothing would, this is not an experiment.
falsifiable_by: "Feature-specific dispatch branches, lost source/origin identity, reordered matches, silent unknown acceptance, uncleared failure output, or nonzero fo warning."

# The condition that closes the experiment and the evidence it must report.
gate: "A generic TargetIR-v0 feature query agrees with the independent table and full fo without changing the SX schema or adding ISA-specific logic."

# Script that turns runs into the tables and figures in report.md.
analysis: ""
