id: "E0035"
title: "V0 SX schema parser and validator"
question: >
  Does the v0 SX schema parser validate all declared schema forms?
status: reported         # draft | running | reported | abandoned
opened: "2026-08-12"
closed: "2026-08-12"

# Every commit the result depends on. Exact, not "main".
repos:
  lazy-fortran-new: "694c12f"
  standard-new: "6b435b3"

# What goes in. Pinned artifacts by manifest name; profiles by ID.
inputs:
  standard: j3-24-007
  implementation: standard-new schema_ir
  specification: standard-new/specs/schema-v0.sxs
  test: standard-new/test/test_schema_ir.f90

# The axes being varied. Omit the key if there is only one condition.
variables: {}

# Explain whether model names form a controlled family ladder or separate
# controls. Pin revisions and runtime settings before the first run.
model_selection: "No model calls; fixed SX schema fixtures and deterministic validation."

# Name these before running anything. Choosing a metric after seeing the data
# is how an experiment becomes a demonstration.
metrics:
  - text_policy_self_test_status
  - text_policy_status
  - schema_test_status
  - runtime_checked_schema_test_status
  - formatting_status
  - full_pipeline_status
  - forms_checked
  - malformed_cases_checked
  - independent_oracle_mutation_status

# State the complete eligible set and exclusions before the first run. A rate
# over the successful subset is reported alongside the strict rate.
denominator: >
  The complete slice consists of one schema specification containing all six
  declaration forms (primitive, record, sum, list, optional and enum), one
  inline schema fixture, four fixed malformed schemas, the runtime-checked
  focused test, and the standard-new full pipeline. Schema source-tree
  generation and StandardIR/ImplIR production schemas remain excluded.

# State the independent behavioral or structural oracle. Self-consistency is
# not an oracle.
independent_oracle: >
  The test has fixed expected declaration kinds, names, member types, targets,
  and counts rather than comparing two schema parsers. It separately checks
  four fixed malformed inputs and their expected diagnostics. The committed
  schema-v0.sxs file is parsed as an additional source fixture. Changing the
  expected declaration count made the focused test fail before restoration.

# Record versions needed to reproduce each run.
toolchain:
  record_in_run: true
  fields: [compiler, fo, poppler, oracle_versions]

# What result would disappoint you? If nothing would, this is not an experiment.
falsifiable_by: >
  Any supported declaration form may be rejected or represented incorrectly,
  an unknown reference or duplicate may be accepted, an expected diagnostic
  may differ, the runtime-checked test may fail, or any production gate may
  fail.

# The condition that closes the experiment and the evidence it must report.
gate: >
  Pin standard-new 6b435b3, pass the fixed schema and malformed-input tests
  with runtime checks, observe the controlled expected-value mutation fail,
  pass text-policy and formatting gates, and pass the full fo pipeline.

# Script that turns runs into the tables and figures in report.md.
analysis: research/experiments/E0035-does-the-v0-sx-schema-parser-validate-al/analyse.sh
