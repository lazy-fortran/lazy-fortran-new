id: "E0120"
title: "Deterministic normative constraint-form extraction"
question: >
  Can deterministic normative constraint-form extraction expand the independent
  source-oracle coverage beyond the eight exact E0083 rows without model calls
  or candidate-specific branches?
status: reported         # draft | running | reported | abandoned
opened: "2026-08-14"
closed: "2026-08-14"
reported_run: R000195

# Every commit the result depends on. Exact, not "main".
repos:
  lazy-fortran-new: "1cd1308"

# What goes in. Pinned artifacts by manifest name; profiles by ID.
inputs:
  standard: j3-24-007
  canonical_text: .cache/runs/E0001/R000003/j3-24-007.canonical.txt
  page_index: .cache/runs/E0001/R000003/j3-24-007.pages.index
  constraint_inventory: .cache/runs/E0081/R000001/constraint-spans.tsv
  structure_artifacts:
    structure: .cache/runs/E0106/R000001/structure.jsonl
    residue: .cache/runs/E0106/R000001/residue-classifications.tsv
  independent_oracle: research/experiments/E0083-can-deterministic-predicate-patterns-for/independent-oracle.tsv
  source_hash: "7371e889f231cfb0316d30365d5083fb5af34cbb6d5f7cb1e01855c73021bfa2"
  canonical_hash: "1cf538329c57e4f617adb36f2c7cd91a5a5561c78bcce16ec96f7ff1a9979f9e"
  page_index_hash: "49406a5aecf423555662643f07f6c2bdf72dd3df3954862231afa31505e18929"
  constraint_inventory_hash: "d91018ffc4b777131f5e7cea6206cb41e27909d5a3cb91f869c568c84c1bdc44"
  structure_hash: "e356c022053de28b1186690c02e6ec7888deb92bdb8498db2b2b5746d5335ff9"
  residue_hash: "a8f01a00df7aa9013807ca53e005a3ed1688de9ae33c6191ad371dfa79e1c6a8"
  independent_oracle_hash: "4b3288383fb36b7a1b619fcae7c7affecdbc805d7ba55878feee5d90c3fd2fba"

# The axes being varied. Omit the key if there is only one condition.
variables:
  predicate_forms: [bounded-inequality, finite-membership, implication,
    conjunction-type-membership, presence-absence, exclusion, cardinality]
  model_calls: [zero]
  candidate_branches: [zero]

# Explain whether model names form a controlled family ladder or separate
# controls. Pin revisions and runtime settings before the first run.
model_selection: "No model calls. Generic regular-expression templates only."

# Name these before running anything. Choosing a metric after seeing the data
# is how an experiment becomes a demonstration.
metrics:
  - eligible_constraints
  - accepted_records
  - baseline_records
  - expanded_records
  - ambiguous_records
  - unsupported_records
  - no_match_records
  - source_hash_matches
  - page_containment_matches
  - structure_context_matches
  - oracle_predicate_matches
  - model_calls
  - mutation_controls

# State the complete eligible set and exclusions before the first run. A rate
# over the successful subset is reported alongside the strict rate.
denominator: >
  All 287 Core 0-associated constraint rows emitted by the pinned E0081
  constraint inventory. Every row is retained exactly once with accepted,
  ambiguous, unsupported or no-match status. The strict expansion count is
  accepted rows whose IDs are absent from the eight-row E0083 oracle.

# State the independent behavioral or structural oracle. Self-consistency is
# not an oracle.
independent_oracle: >
  The analyzer independently reconstructs each accepted source span from
  canonical bytes, page-index byte ranges, the source document hash, the C and
  R identities, and a second generic predicate pass. It compares every E0083
  baseline ID, source phrase and normalized predicate. E0106 structure records
  are checked for canonical provenance and nearby rule context. Mutated
  source bytes, inventory hashes and baseline predicates must be rejected.

# Record versions needed to reproduce each run.
toolchain:
  record_in_run: true
  fields: [compiler, fo, poppler, oracle_versions]

# What result would disappoint you? If nothing would, this is not an experiment.
falsifiable_by: >
  A changed 287-row denominator, duplicate or dropped inventory row, accepted
  source/hash/page mutation, missing C/R identity, predicate not reproduced by
  the generic pass, baseline mismatch, candidate-specific branch, or model
  call falsifies the run. Zero expansion is a valid result.

# The condition that closes the experiment and the evidence it must report.
gate: >
  Run the analyzer over all 287 rows, retain every non-accepted status, emit
  source-linked accepted records with MECHANICAL origin, match the eight E0083
  predicates independently, report the expansion count, and pass all mutation
  controls with zero model calls. The canonical text, page index, constraint
  inventory, structure index, residue table and baseline oracle hashes are all
  enforced before extraction.

# Script that turns runs into the tables and figures in report.md.
analysis: >
  research/experiments/E0120-can-deterministic-normative-constraint-f/analyse.sh
  regenerates the committed source-oracle.tsv and ignored run summaries.
