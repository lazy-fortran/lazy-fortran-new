id: "E0107"
title: "Exact normative definition forms over the E0106 unique candidates"
question: >
  Can exact normative definition forms mechanically resolve the E0106 unique candidates?
status: draft            # draft | running | reported | abandoned
opened: "2026-08-13"
closed: ""

# Every commit the result depends on. Exact, not "main".
repos:
  lazy-fortran-new: "fdc2bdc"
  standard-new: "ae2ee71"

# What goes in. Pinned artifacts by manifest name; profiles by ID.
inputs:
  standard: j3-24-007
  profile: complete-core
  e0106_structure: .cache/runs/E0106/R000001/structure.jsonl
  e0106_residue: .cache/runs/E0106/R000001/residue-classifications.tsv
  canonical_text: .cache/runs/E0001/R000003/j3-24-007.canonical.txt
  page_index: .cache/runs/E0001/R000003/j3-24-007.pages.index

# The axes being varied. Omit the key if there is only one condition.
variables:
  definition_forms: [is, is-one-of, means, consists-of, explicit-name-heading]
  model_calls: [zero]

# Explain whether model names form a controlled family ladder or separate
# controls. Pin revisions and runtime settings before the first run.
model_selection: "No model calls; only exact source forms and deterministic span validation are used."

# Name these before running anything. Choosing a metric after seeing the data
# is how an experiment becomes a demonstration.
metrics:
  - e0106_unique_candidates
  - strict_definitions
  - ambiguous_definitions
  - unsupported_definitions
  - exact_source_citations
  - model_calls
  - semantic_promotions

# State the complete eligible set and exclusions before the first run. A rate
# over the successful subset is reported alongside the strict rate.
denominator: >
  Exactly the 60 E0106 rows classified as unique structural candidates. The
  66 ambiguous and one unsupported E0106 rows are excluded from this strict
  experiment and remain unresolved.

# State the independent behavioral or structural oracle. Self-consistency is
# not an oracle.
independent_oracle: >
  A separate traversal recomputes each accepted candidate's source bytes,
  page containment, source hash, form and normalized name from the canonical
  text and page index without reading the primary classification result.

# Record versions needed to reproduce each run.
toolchain:
  record_in_run: true
  fields: [compiler, fo, poppler, oracle_versions]

# What result would disappoint you? If nothing would, this is not an experiment.
falsifiable_by: >
  Any candidate without an exact normative form, any source span or page/hash
  mismatch, any duplicate or dropped denominator row, any model call, or any
  semantic promotion fails the experiment.

# The condition that closes the experiment and the evidence it must report.
gate: >
  Classify all 60 unique candidates into strict definition, ambiguous or
  unsupported; validate exact citations independently; retain all residue;
  and report zero model calls and zero semantic promotions.

# Script that turns runs into the tables and figures in report.md.
analysis: research/experiments/E0107-can-exact-normative-definition-forms-mec/analyse.sh
