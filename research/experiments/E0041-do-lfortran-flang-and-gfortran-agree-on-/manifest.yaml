id: "E0041"
title: "LFortran Flang gfortran parser behavior differential"
question: >
  Do LFortran, Flang and gfortran agree on the pinned parser-behavior corpus?
status: reported         # draft | running | reported | abandoned
opened: "2026-08-12"
closed: "2026-08-12"

# Every commit the result depends on. Exact, not "main".
repos:
  lazy-fortran-new: "4f063c8"
  standard-new: "531e590"
  oracle-lfortran: "caf87b6"
  oracle-flang: "cff4ca2"
  oracle-gcc: "395e3d8"

# What goes in. Pinned artifacts by manifest name; profiles by ID.
inputs:
  standard: j3-24-007
  profile: complete-core
  corpus: research/corpora/parser-behavior-v0.toml
  syntax_exports:
    - artifacts/runs/E0017/R000001-antlr.toml
    - artifacts/runs/E0018/R000001-bison.toml
    - artifacts/runs/E0019/R000001-treesitter.toml

# The axes being varied. Omit the key if there is only one condition.
variables: {}

# Explain whether model names form a controlled family ladder or separate
# controls. Pin revisions and runtime settings before the first run.
model_selection: "No model calls; three independent compiler frontends run fixed temporary fixtures."

# Name these before running anything. Choosing a metric after seeing the data
# is how an experiment becomes a demonstration.
metrics:
  - cases_declared
  - compiler_invocations
  - lfortran_accepted
  - flang_accepted
  - gfortran_accepted
  - all_three_agree_cases
  - disagreement_cases
  - raw_status_difference_cases
  - missing_results
  - diagnostic_files

# State the complete eligible set and exclusions before the first run. A rate
# over the successful subset is reported alongside the strict rate.
denominator: >
  The ten named fixtures in parser-behavior-v0, each run once through LFortran,
  Flang and gfortran. The matrix records accepted and rejected outcomes without
  deleting disagreements or treating any compiler as normative.

# State the independent behavioral or structural oracle. Self-consistency is
# not an oracle.
independent_oracle: >
  LFortran, Flang and gfortran are separate parser or frontend implementations.
  LFortran is invoked in AST-emission mode, while Flang and gfortran use their
  syntax-only modes. The result is a behavior matrix. gfortran is used only as
  a GPL behavioral oracle and no GCC implementation source is read.

# Record versions needed to reproduce each run.
toolchain:
  record_in_run: true
  fields: [compiler, fo, poppler, oracle_versions]

# What result would disappoint you? If nothing would, this is not an experiment.
falsifiable_by: >
  Any fixture cannot be generated, any pinned compiler cannot be invoked, a
  result is missing, or the independently collected status matrix disagrees
  with its recomputed counts. Compiler disagreements are retained as results,
  not failures to be hidden. Raw exit-code differences remain separate from
  accepted/rejected behavior.

# The condition that closes the experiment and the evidence it must report.
gate: >
  Verify all five repository pins, generate all ten fixtures in a gitignored
  temporary directory, obtain 30 compiler outcomes, independently recompute
  the matrix counts and preserve every disagreement and compiler diagnostic in
  the ignored run cache.

# Script that turns runs into the tables and figures in report.md.
analysis: research/experiments/E0041-do-lfortran-flang-and-gfortran-agree-on-/analyse.sh
