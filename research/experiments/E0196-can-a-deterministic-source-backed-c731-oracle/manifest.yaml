  outcomes: [ACCEPTED, REJECTED, UNRESOLVED]

# Explain whether model names form a controlled family ladder or separate
# controls. Pin revisions and runtime settings before the first run.
model_selection: "No model calls. Candidate facts are human-authored typed fixtures; retained model-origin proposals are input only."

# Name these before running anything. Choosing a metric after seeing the data
# is how an experiment becomes a demonstration.
metrics:
  - case_outcomes
  - source_binding
  - page_binding
  - semantic_canonicalization
  - mutation_controls
  - model_calls
  - semantic_promotions

# State the complete eligible set and exclusions before the first run. A rate
# over the successful subset is reported alongside the strict rate.
denominator: >-
  The complete 3-by-4 product of typed length-form states and the two
  source-named C731 contexts plus other and unknown. Source and identity
  mutations are separate controls.

# State the independent behavioral or structural oracle. Self-consistency is
# not an oracle.
independent_oracle: >-
  tests/e2e/validate_m3_c731.py computes outcomes directly from the typed
  length-form and context states using the D0145 rule table. It does not parse
  Fortran, evaluate expressions, infer context or consume model output.

# Record versions needed to reproduce each run.
toolchain:
  record_in_run: true
  fields: [compiler, fo, poppler, oracle_versions]

# What result would disappoint you? If nothing would, this is not an experiment.
falsifiable_by: >-
  Any source, page, StandardIR, semantic-item or contract identity mutation is
  accepted; the 12-state table differs from D0145; the C731 page-85 span is
  not checked; or any model call or semantic promotion is observed.

# The condition that closes the experiment and the evidence it must report.
gate: >-
  tests/e2e/run-m3-c731.sh --fresh must pass from clean central and
  standard-new checkouts, including exact source/page/StandardIR binding, the
  complete 12-state typed outcome table, mutation rejection, exact trace
  comparison and zero model calls or semantic promotions.

# Script that turns runs into the tables and figures in report.md.
analysis: tests/e2e/validate_m3_c731.py
run: tests/e2e/run-m3-c731.sh --fresh

