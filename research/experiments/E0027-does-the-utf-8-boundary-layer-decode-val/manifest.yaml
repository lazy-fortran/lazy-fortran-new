id: "E0027"
title: "UTF-8 boundary validation"
question: >
  Does the UTF-8 boundary layer decode valid scalars and reject malformed byte
  sequences?
status: reported         # draft | running | reported | abandoned
opened: "2026-08-12"
closed: "2026-08-12"

# Every commit the result depends on. Exact, not "main".
repos:
  lazy-fortran-new: "1a335a2"
  standard-new: "444b295"

# What goes in. Pinned artifacts by manifest name; profiles by ID.
inputs:
  implementation: standard-new utf8_boundary
  test: standard-new/test/test_utf8_boundary.f90

# The axes being varied. Omit the key if there is only one condition.
variables: {}

# Explain whether model names form a controlled family ladder or separate
# controls. Pin revisions and runtime settings before the first run.
model_selection: "No model calls; deterministic Fortran implementation and test."

# Name these before running anything. Choosing a metric after seeing the data
# is how an experiment becomes a demonstration.
metrics:
  - text_policy_self_test_status
  - text_policy_status
  - focused_test_status
  - full_pipeline_status
  - formatting_status
  - independent_oracle_mutation_status
  - valid_scalar_vectors
  - boundary_vectors
  - malformed_sequence_vectors

# State the complete eligible set and exclusions before the first run. A rate
# over the successful subset is reported alongside the strict rate.
denominator: >
  The complete slice consists of utf8_boundary, its fixed valid and malformed
  byte-sequence test and the standard-new full pipeline. Unicode normalization
  and language-specific lexical policy are excluded.

# State the independent behavioral or structural oracle. Self-consistency is
# not an oracle.
independent_oracle: >
  test_utf8_boundary compares decoded scalar values and widths with separately
  declared ASCII, two-byte, three-byte and four-byte vectors; it checks fixed
  start/interior/end boundaries and four malformed sequence classes. A
  controlled mutation of the two-byte scalar value was run and had to fail
  before the accepted test was restored.

# Record versions needed to reproduce each run.
toolchain:
  record_in_run: true
  fields: [compiler, fo, poppler, oracle_versions]

# What result would disappoint you? If nothing would, this is not an experiment.
falsifiable_by: >
  A valid scalar may decode to the wrong value or width, a continuation offset
  may be accepted as a boundary, a malformed sequence may be accepted, or the
  mutated scalar oracle may still pass.

# The condition that closes the experiment and the evidence it must report.
gate: >
  Pin the production commit, run the focused valid/malformed sequence test,
  observe the controlled scalar mutation fail, restore the oracle, and run
  text-policy, formatting and full fo gates successfully.

# Script that turns runs into the tables and figures in report.md.
analysis: research/experiments/E0027-does-the-utf-8-boundary-layer-decode-val/analyse.sh
