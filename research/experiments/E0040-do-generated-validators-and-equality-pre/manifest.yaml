id: "E0040"
title: "Generated schema validation and equality differential"
question: >
  Do generated validators and equality preserve the schema value contract?
status: reported         # draft | running | reported | abandoned
opened: "2026-08-12"
closed: "2026-08-12"

# Every commit the result depends on. Exact, not "main".
repos:
  lazy-fortran-new: "ac4b4f7"
  standard-new: "531e590"

# What goes in. Pinned artifacts by manifest name; profiles by ID.
inputs:
  standard: j3-24-007
  implementation: standard-new generated validators and equality APIs
  specification: standard-new/specs/schema-v0.sxs
  fixtures: standard-new/test/test_schema_generated_api.f90

# The axes being varied. Omit the key if there is only one condition.
variables: {}

# Explain whether model names form a controlled family ladder or separate
# controls. Pin revisions and runtime settings before the first run.
model_selection: "No model calls; generated Fortran APIs and deterministic semantic fixtures."

# Name these before running anything. Choosing a metric after seeing the data
# is how an experiment becomes a demonstration.
metrics:
  - text_policy_status
  - schema_parser_status
  - schema_codegen_status
  - generated_api_status
  - runtime_checked_generated_api_status
  - generated_source_byte_identity_status
  - generated_formatting_status
  - lint_zero_warnings_status
  - full_pipeline_status
  - valid_values_checked
  - invalid_values_checked
  - equality_cases_checked

# State the complete eligible set and exclusions before the first run. A rate
# over the successful subset is reported alongside the strict rate.
denominator: >
  The complete slice consists of seven valid semantic values, five invalid
  mutations with fixed expected outcomes, eight equality cases, all generated
  schema declarations, one regenerated source file and the standard-new full
  pipeline. Visitors, hashing, printers, StandardIR and ImplIR remain
  excluded.

# State the independent behavioral or structural oracle. Self-consistency is
# not an oracle.
independent_oracle: >
  The test specifies valid and invalid values independently of the generated
  implementation. It expects fixed diagnostics for invalid names, enum values,
  missing and inactive sum payloads and invalid list elements. Equality is
  checked against fixed mutation outcomes, including the canonical equivalence
  of allocated and unallocated empty lists. Source regeneration is compared
  byte-for-byte with the checked-in generated source.

# Record versions needed to reproduce each run.
toolchain:
  record_in_run: true
  fields: [compiler, fo, poppler, oracle_versions]

# What result would disappoint you? If nothing would, this is not an experiment.
falsifiable_by: >
  A validator accepts an invalid value, rejects a valid value, emits a different
  diagnostic, or fails to recurse through a record, sum, list or optional. An
  equality API disagrees with a fixed mutation outcome. Generation, formatting,
  the zero-warning lint gate or the full fo pipeline fails.

# The condition that closes the experiment and the evidence it must report.
gate: >
  Pin standard-new 531e590 and lab ac4b4f7, pass the focused parser, generator
  and generated API tests with runtime checks, pass the zero-warning lint
  check, compare regenerated source byte-for-byte, pass formatting, text
  policy and the full fo pipeline, and report all fixed-case counts.

# Script that turns runs into the tables and figures in report.md.
analysis: research/experiments/E0040-do-generated-validators-and-equality-pre/analyse.sh
