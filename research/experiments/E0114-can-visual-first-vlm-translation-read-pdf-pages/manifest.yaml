id: "E0114"
title: "Visual-first VLM translation of mechanically solved PDF rules"
question: >
  Can a vision-capable Qwen or Gemma checkpoint translate a rule directly
  from its rendered normative PDF page before canonical text processing?
status: reported          # draft | running | reported | abandoned
opened: "2026-08-13"
closed: "2026-08-13"

repos:
  lazy-fortran-new: "da9d86e"
  standard-new: "ae2ee71"

inputs:
  standard: j3-24-007
  pdf: .cache/j3-24-007.pdf
  e0110_oracle: .cache/runs/E0110/R000001/accepted-definitions.tsv
  page_renderer: pdftoppm

denominator: >
  The six E0110 strict-definition rows, frozen before model execution. Each
  receives the raw rendered PDF page containing its mechanically accepted
  rule and the candidate name, with no canonical text, OCR or retrieved
  source window.

fixed_protocol:
  image_dpi: 200
  output: name-decision-relation-target
  max_attempts_per_row: 3
  repair_attempts: 2
  repair_feedback: generic-gate-failure-only
  whitespace_normalization: collapse-and-strip

toolchain:
  runtime: "llama.cpp b10405, commit e79e4bf660e19f2ad851e06c6913f7a8c5852621"
  build: "CUDA 13.3, native SM120, static llama-server"
  local_config: "--split-mode none --main-gpu 0 --flash-attn off --ctx-size 8192 --parallel 1"
  common_generation: "seed=1101, temperature=0, top_p=1, reasoning=off"
  runtime_decision: D0055

metrics:
  - oracle_rows
  - exact_target_matches
  - normalized_target_matches
  - relation_matches
  - abstentions
  - hard_failures
  - model_errors
  - total_model_calls
  - repair_iterations
  - wall_s_total
  - inference_wall_s

independent_oracle: >
  E0110 supplies the expected relation and canonical source line. The gate
  derives the expected target from that line and compares the visual response
  after declared whitespace normalization. The PDF image is never treated as
  provenance without this comparison.

falsifiable_by: >
  Any text/OCR leakage into the prompt, omitted oracle row, uncounted call,
  unbounded repair, or target accepted without comparison to E0110 falsifies
  the visual-first protocol.

analysis: >
  python3 research/experiments/E0113-can-bounded-repair-and-translation-oracle-converge/record-results.py
  && python3 research/experiments/E0113-can-bounded-repair-and-translation-oracle-converge/plot-results.py
  --text .cache/runs/E0113/R000001/analysis/text.tsv
  --visual .cache/runs/E0113/R000001/analysis/visual.tsv
  --outdir .cache/runs/E0113/R000001/plot
runner: research/experiments/E0114-can-visual-first-vlm-translation-read-pdf-pages/run-vlm.py
