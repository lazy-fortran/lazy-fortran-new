id: "E0094"
title: "Generic predicate-form dispatcher coverage"
question: >
  Can one generic predicate dispatcher classify all accepted semantic rule forms
status: reported         # draft | running | reported | abandoned
opened: "2026-08-13"
closed: "2026-08-13"

# Every commit the result depends on. Exact, not "main".
repos:
  lazy-fortran-new: "c6f4059"
  standard-new: "c6cd889"

# What goes in. Pinned artifacts by manifest name; profiles by ID.
inputs:
  standard: j3-24-007
  predecessor: E0090-R000001
  predicate_form_oracle: research/experiments/E0094-can-one-generic-predicate-dispatcher-cla/predicate-form-oracle.tsv

# The axes being varied. Omit the key if there is only one condition.
variables:
  predecessor_table: [E0090]
  dispatcher_rule_ids: [none]
  model_calls: [zero]
  parser_projection: [none]

# Explain whether model names form a controlled family ladder or separate
# controls. Pin revisions and runtime settings before the first run.
model_selection: "No model calls. The dispatcher classifies the top-level
constructor of each predicate in the pinned generated rule table."

# Name these before running anything. Choosing a metric after seeing the data
# is how an experiment becomes a demonstration.
metrics:
  - predecessor_rule_rows
  - accepted_predicate_rows
  - dispatcher_rows
  - unique_top_level_constructors
  - dispatch_oracle_difference
  - provenance_matches
  - unsupported_constructor_rows
  - generated_dispatcher_without_rule_ids
  - parser_projection_records
  - model_calls
  - negative_control

# State the complete eligible set and exclusions before the first run. A rate
# over the successful subset is reported alongside the strict rate.
denominator: >
  All 22 accepted predicate rows emitted by E0090. Unresolved and disputed
  semantic rows are excluded by the predecessor ledger and are not silently
  classified as accepted predicates.

# State the independent behavioral or structural oracle. Self-consistency is
# not an oracle.
independent_oracle: >
  A separately maintained 22-row oracle fixes each predicate's top-level
  constructor. A generated dispatcher is compared with that oracle and its
  StandardIR source fields. A mutation replacing one constructor with an
  unknown form must be rejected. The dispatcher source is searched for all
  selected constraint IDs.

# Record versions needed to reproduce each run.
toolchain:
  record_in_run: true
  fields: [compiler, fo, poppler, oracle_versions]

# What result would disappoint you? If nothing would, this is not an experiment.
falsifiable_by: >
  The predecessor table changes, a predicate row is omitted or assigned the
  wrong constructor, provenance is lost, an unknown constructor is accepted,
  or a selected constraint ID appears in the generated dispatcher.

# The condition that closes the experiment and the evidence it must report.
gate: >
  Rerun E0090, classify all 22 accepted predicates with one generic dispatcher,
  agree with the independent constructor oracle, preserve source provenance,
  reject the mutated unknown constructor, and use zero parser projections and
  zero model calls.

# Script that turns runs into the tables and figures in report.md.
analysis: research/experiments/E0094-can-one-generic-predicate-dispatcher-cla/analyse.sh
