id: "E0121"
title: "Expanded independent source-oracle finite-case gate"
question: >
  Can the 23 mechanically reconstructed E0120 source-oracle records be
  consumed by the independent finite-case harness without source mismatches,
  evaluator errors or invented fact aliases?
status: reported         # draft | running | reported | abandoned
