  terminal_ledger: .cache/runs/E0117/R000003-full/rows.jsonl
  terminal_ledger_sha256: "1db61994f88775fb0bf79d79bfc12db147199b07e316564515330fc859d3a958"
  expanded_oracle: research/experiments/E0120-can-deterministic-normative-constraint-f/source-oracle.tsv
  expanded_oracle_sha256: "e42fc8180ca5be02e1ce8cac7554776179da3437e7209c93d254493b6c074183"
