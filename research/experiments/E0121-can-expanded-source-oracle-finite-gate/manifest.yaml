variables:
  source_oracle: [E0120-23-record]
  model_calls: [zero]
  candidate_alias_inference: [forbidden]

metrics:
  - eligible_constraint_rows
  - independent_oracle_rows
  - oracle_model_overlap_rows
  - source_case_rows
  - source_case_oracle_matches
  - source_case_oracle_mismatches
  - source_case_oracle_unavailable
  - candidate_unavailable_cases
  - evaluator_errors
  - mutation_controls
  - mutation_control_failures
  - semantic_promotions
  - model_calls
  - wall_s_total

denominator: >
  All 287 retained E0117 row keys and every one of the 23 E0120 source-oracle
  records. Rows and cases are never removed because a candidate is unavailable
  or a source constructor is outside the finite materializer.

independent_oracle: >
  E0120 source-oracle.tsv, parsed independently from the E0117 JSON predicate.
  Its SHA-256 is checked and each source-derived expected outcome is evaluated
  from the parsed predicate AST. The candidate evaluator is separate and does
  not add source facts or synonyms.

gate: >
  Retain all 287 rows, consume all 23 source-oracle records, report every
  unsupported source form and candidate-unavailable case explicitly, produce
  zero source mismatches and evaluator errors, pass mutation controls, make
  zero model calls and promote zero semantic facts.

analysis: >
  E0118's generic analyse.sh with E0118_ORACLE set to the pinned E0120
  source-oracle.tsv and E0118_OUTDIR set to .cache/runs/E0121/R000001.
