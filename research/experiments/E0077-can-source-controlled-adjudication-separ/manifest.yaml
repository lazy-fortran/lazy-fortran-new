id: "E0077"
title: "Source-controlled adjudication of E0076 candidates"
question: >
  Can source-controlled adjudication separate the three E0076 candidates from parser aliases?
status: draft            # draft | running | reported | abandoned
opened: "2026-08-12"
closed: ""

# Every commit the result depends on. Exact, not "main".
repos:
  lazy-fortran-new: "09c7173"
  standard-new: "c6cd889"

# What goes in. Pinned artifacts by manifest name; profiles by ID.
inputs:
  standard: j3-24-007
  candidate_inventory: E0076-R000001
  predecessor_adjudication: E0071-R000001
  decisions: [D0019, D0028, D0035]

# The axes being varied. Omit the key if there is only one condition.
variables:
  disposition: [accepted, retained]
  resolution_class: [semantic-role, unresolved]
  model_calls: [zero]

# Explain whether model names form a controlled family ladder or separate
# controls. Pin revisions and runtime settings before the first run.
model_selection: "No experimental model calls; the adjudication table is source-controlled and mechanically checked."

# Name these before running anything. Choosing a metric after seeing the data
# is how an experiment becomes a demonstration.
metrics:
  - candidate_spans
  - accepted_records
  - retained_records
  - accepted_semantic_role_records
  - source_hash_matches
  - source_evidence_matches
  - candidate_inventory_difference
  - independent_difference
  - negative_control

# State the complete eligible set and exclusions before the first run. A rate
# over the successful subset is reported alongside the strict rate.
denominator: >
  All three E0076 candidate spans are eligible for one source-controlled
  disposition. No candidate may enter a parser projection unless its source
  relation is accepted; retained candidates remain outside parser wiring.

# State the independent behavioral or structural oracle. Self-consistency is
# not an oracle.
independent_oracle: >
  E0076 is rerun and every candidate is joined to exactly one adjudication row.
  A separate canonical-text traversal checks each source phrase and hash and
  compares the candidate set. A controlled mutation of one retained
  disposition must fail the validator.

# Record versions needed to reproduce each run.
toolchain:
  record_in_run: true
  fields: [compiler, fo, poppler, oracle_versions]

# What result would disappoint you? If nothing would, this is not an experiment.
falsifiable_by: >
  The experiment fails if a candidate is dropped or duplicated, a retained
  contextual occurrence is promoted to a parser fact, source evidence or hash
  is absent, or the mutation control passes.

# The condition that closes the experiment and the evidence it must report.
gate: >
  Adjudicate all three candidates, retain the contextual occurrences without
  parser aliases, preserve source evidence and pass the independent inventory
  and mutation checks.

# Script that turns runs into the tables and figures in report.md.
analysis: research/experiments/E0077-can-source-controlled-adjudication-separ/analyse.sh
