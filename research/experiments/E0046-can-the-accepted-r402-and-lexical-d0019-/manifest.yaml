id: "E0046"
title: "Combined R402 and lexical D0019 resolution projection"
question: >
  Can the accepted R402 and lexical D0019 witnesses compose into one deterministic parser projection while preserving the unresolved expansion boundary?
status: draft            # draft | running | reported | abandoned
opened: "2026-08-12"
closed: ""

# Every commit the result depends on. Exact, not "main".
repos:
  lazy-fortran-new: "a4f7687"
  standard-new: "c6cd889"

# What goes in. Pinned artifacts by manifest name; profiles by ID.
inputs:
  standard: j3-24-007
  profile: "complete-core-combined-d0019-v0"
  syntax: E0013-R000002
  unresolved_audit: E0022-R000001
  base_resolution_seed: research/experiments/E0043-can-a-source-controlled-d0019-resolution/seed.tsv
  alias_pattern: research/experiments/E0044-can-the-source-controlled-r402-closure-r/alias-pattern.tsv
  lexical_seed: research/experiments/E0045-can-source-controlled-lexical-witnesses-/lexical-seed.tsv

# The axes being varied. Omit the key if there is only one condition.
variables:
  resolution_families: [r402-suffix-name, lexical-token]
  retained_boundaries: [r401-list, r403-scalar, ambiguous-unicode]

# Explain whether model names form a controlled family ladder or separate
# controls. Pin revisions and runtime settings before the first run.
model_selection: "No model calls. Accepted source-controlled witnesses are composed mechanically."

# Name these before running anything. Choosing a metric after seeing the data
# is how an experiment becomes a demonstration.
metrics:
  - resolution_records
  - alias_records
  - lexical_class_records
  - metavariable_records
  - semantic_role_records
  - unresolved_records
  - disputed_records
  - source_hash_matches
  - alias_projection_records
  - lexical_projection_records
  - unicode_exclusions_retained
  - composite_syntax_witnesses
  - composite_input_sha256
  - composite_grammar_sha256
  - independent_difference
  - negative_control

# State the complete eligible set and exclusions before the first run. A rate
# over the successful subset is reported alongside the strict rate.
denominator: >
  The eligible set is the 181 distinct unresolved names in E0022-R000001.
  E0043, E0044 and E0045 provide the accepted source-controlled witnesses.
  This experiment composes their non-expansion classes. R401 list terms, R403
  scalar terms, and the two ambiguous Unicode terms remain excluded from
  resolution.

# State the independent behavioral or structural oracle. Self-consistency is
# not an oracle.
independent_oracle: >
  Independent audit traversals reconstruct the R402 suffix-name closure and
  the E0045 lexical seed separately, then compare both sets with the combined
  typed records. Source identity is checked on every record. A controlled
  entity-name class mutation must fail, and the two Unicode exclusions must
  remain unresolved.

# Record versions needed to reproduce each run.
toolchain:
  record_in_run: true
  fields: [compiler, fo, poppler, oracle_versions]

# What result would disappoint you? If nothing would, this is not an experiment.
falsifiable_by: >
  A source family is dropped or duplicated, a selected target differs from its
  accepted seed, an explicit StandardIR definition is overridden, a source
  hash is missing, the unresolved count differs from the declared composition,
  an excluded term is normalized, or the negative control does not fail.

# The condition that closes the experiment and the evidence it must report.
gate: >
  Verify all pinned input hashes through E0044 and E0045, produce one record for
  every audit name, compose 49 R402 aliases and 21 lexical token projections,
  retain 107 unresolved records and the two Unicode exclusions, emit one
  combined grammar projection, and pass both independent closure comparisons
  and the negative control. This experiment does not claim a complete parser
  input.

# Script that turns runs into the tables and figures in report.md.
analysis: research/experiments/E0046-can-the-accepted-r402-and-lexical-d0019-/analyse.sh
