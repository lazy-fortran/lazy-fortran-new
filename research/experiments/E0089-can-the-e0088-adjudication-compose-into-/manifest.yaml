id: "E0089"
title: "E0088 successor composite semantic ledger"
question: >
  Can the E0088 adjudication compose into an accepted successor ledger
status: reported         # draft | running | reported | abandoned
opened: "2026-08-13"
closed: "2026-08-13"

# Every commit the result depends on. Exact, not "main".
repos:
  lazy-fortran-new: "edbe2eb"
  standard-new: "c6cd889"

# What goes in. Pinned artifacts by manifest name; profiles by ID.
inputs:
  standard: j3-24-007
  predecessor_ledger: E0087-R000001
  adjudication: E0088-R000001
  successor_policy: research/experiments/E0089-can-the-e0088-adjudication-compose-into-/successor-policy.tsv
  independent_oracle: research/experiments/E0089-can-the-e0088-adjudication-compose-into-/independent-oracle.tsv
  decisions: [D0028, D0035, D0036, D0037]

# The axes being varied. Omit the key if there is only one condition.
variables:
  c734_state: [resolved, disputed]
  model_calls: [zero]
  parser_projection: [none]

# Explain whether model names form a controlled family ladder or separate
# controls. Pin revisions and runtime settings before the first run.
model_selection: "No model calls. E0087 and E0088 are rerun, and the one-row
successor policy and independent oracle are fixed before composition."

# Name these before running anything. Choosing a metric after seeing the data
# is how an experiment becomes a demonstration.
metrics:
  - eligible_constraints
  - selected_rows
  - resolved_constraints
  - disputed_constraints
  - unresolved_constraints
  - accepted_predicates
  - competing_candidate_records
  - source_hash_matches
  - source_evidence_matches
  - independent_oracle_agreement
  - adjudication_gate_violations
  - required_fact_records
  - provided_fact_records
  - dependency_edges
  - topological_order_difference
  - independent_normalization_difference
  - parser_projection_records
  - model_calls
  - negative_control

# State the complete eligible set and exclusions before the first run. A rate
# over the successful subset is reported alongside the strict rate.
denominator: >
  All 287 Core 0-associated numbered constraints from E0081. The exact 23-row
  E0087 selected policy is retained. Only C734 changes state, from disputed to
  the E0088 source-witnessed resolved predicate. The remaining 264 rows remain
  outside the selected policy and C1588 remains unresolved.

# State the independent behavioral or structural oracle. Self-consistency is
# not an oracle.
independent_oracle: >
  A separately maintained 23-row oracle records every successor status, form,
  source phrase, predicate candidate, fact set and adjudication state. It is
  compared field-by-field with the generated ledger. The predecessor output is
  byte-compared on all non-C734 semantic fields, and the E0088 predicate is
  checked against its rerun adjudication. Source hashes, available evidence,
  accepted-only dependency edges and topological order are checked. Mutating
  C734's status or predicate must fail.

# Record versions needed to reproduce each run.
toolchain:
  record_in_run: true
  fields: [compiler, fo, poppler, oracle_versions]

# What result would disappoint you? If nothing would, this is not an experiment.
falsifiable_by: >
  Any predecessor row changes outside C734, C734 is duplicated or retains its
  disputed candidate, an unresolved row emits a predicate, an independent
  oracle field differs, a source hash or evidence field differs, the accepted
  dependency graph is cyclic or misordered, or a parser projection or model
  call is emitted.

# The condition that closes the experiment and the evidence it must report.
gate: >
  Rerun E0087 and E0088. Preserve all 287 rows and the 23 selected rows,
  replace only C734 with one accepted E0088 predicate, emit 22 resolved, zero
  disputed and 265 unresolved rows, derive accepted edges only from resolved
  rows, pass the independent oracle and predecessor-stability checks, and emit
  zero parser projections and zero model calls.

# Script that turns runs into the tables and figures in report.md.
analysis: research/experiments/E0089-can-the-e0088-adjudication-compose-into-/analyse.sh
