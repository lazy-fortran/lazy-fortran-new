id: "E0163"
title: "Generic role-family factoring and selected parser quality"
question: >
  Does generic role-family factoring improve selected parser quality without changing accepted language
status: reported        # draft | running | reported | abandoned
opened: "2026-08-15"
closed: "2026-08-15"

# Every commit the result depends on. Exact, not "main".
repos:
  lazy-fortran-new: "14d24258fc333a0e7282668e4de583efc3d2aa60"
  standard-new: "7d011f49e0e74e95b88a90c5894ea3358fc5ee82"
  oracle-lfortran: "caf87b660f803148f000046392a5da803f9fc630"

# What goes in. Pinned artifacts by manifest name; profiles by ID.
inputs:
  standard: j3-24-007
  profile: selected-program
  baseline_conflicts: E0159/R000329
  candidate_all_root: E0160/R000336
  candidate_selected: E0160/R000337
  language_gate: E0161/R000340

# The axes being varied. Omit the key if there is only one condition.
variables:
  transformation: data-ref-role-family-factoring
  modes: [selected-program, all-roots]

# Explain whether model names form a controlled family ladder or separate
# controls. Pin revisions and runtime settings before the first run.
model_selection: "No model calls; this is a deterministic target-projection gate."

# Name these before running anything. Choosing a metric after seeing the data
# is how an experiment becomes a demonstration.
metrics:
  - selected_shift_reduce_conflicts
  - selected_reduce_reduce_conflicts
  - all_root_shift_reduce_conflicts
  - all_root_reduce_reduce_conflicts
  - useless_bison_symbols
  - role_family_lineage_and_negative_mutation
  - bounded_positive_and_negative_language_preservation
  - promotion_decision

# State the complete eligible set and exclusions before the first run. A rate
# over the successful subset is reported alongside the strict rate.
denominator: >
  The complete selected-program and all-roots Bison conflict inventories from
  R000329/R000336/R000337, all four format role-family witnesses, and the
  complete E0161 bounded corpus of 359 positive and 636 negative cases.

# State the independent behavioral or structural oracle. Self-consistency is
# not an oracle.
independent_oracle: >
  E0159's state-header conflict recount and pinned LFortran %expect policy;
  E0160's independent role-family lineage/mutation checker and four parser
  generators; and E0161's standalone bounded EBNF recognizer with negative
  mutations. No Bison conflict count alone is treated as a language oracle.

# Record versions needed to reproduce each run.
toolchain:
  record_in_run: true
  fields: [compiler, fo, poppler, oracle_versions]

# What result would disappoint you? If nothing would, this is not an experiment.
falsifiable_by: >
  Any conflict total changes unexpectedly, the candidate loses source lineage,
  a role-family mutation is accepted, the bounded corpus truncates or
  disagrees, a useless Bison symbol appears, or the all-roots candidate is
  promoted despite a worse inventory.

# The condition that closes the experiment and the evidence it must report.
gate: >
  The selected candidate must reduce the diagnostic inventory and pass every
  independent source, role-family, parser-generator and language gate. The
  all-roots result must be reported separately; it is promoted only if it is
  no worse and preserves the same evidence. LFortran's policy is comparison
  evidence, not a production conflict budget to copy.

# Script that turns runs into the tables and figures in report.md.
analysis: >
  research/experiments/E0163-does-generic-role-family-factoring-impro/analyse.py
  <baseline-summary> <all-root-candidate-oracles>
  <selected-candidate-oracles> <role-witness> <language-report> <output>
  writes report.tsv.

replays:
  - run: R000347
    kind: deterministic-conflict-and-role-family-adjudication
    report: .cache/runs/E0163/R000347/report.tsv
