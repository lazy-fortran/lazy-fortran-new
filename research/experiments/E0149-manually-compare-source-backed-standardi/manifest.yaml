id: "E0149"
title: "Manual source-backed StandardIR versus LFortran Bison audit"
question: >
  Does a lane-based structural audit of the source-backed StandardIR Bison
  projection against the pinned LFortran Bison grammar expose remaining defects,
  projection gaps, expected architecture differences, or genuine StandardIR
  advantages?
status: reported          # draft | running | reported | abandoned
opened: "2026-08-15"
closed: "2026-08-15"

# Every commit the result depends on. Exact, not "main".
repos:
  lazy-fortran-new: "530e9ea"
  standard-new: "1cdd9490375199d93c755fb3c36bc9dcf2c285e6"
  oracle-lfortran: "caf87b660f803148f000046392a5da803f9fc630"

# What goes in. Pinned artifacts by manifest name; profiles by ID.
inputs:
  standard: j3-24-007
  profile: complete-core
  standardir_run: E0147/R000016
  standardir_bison: fortran2023.y
  lfortran_path: src/lfortran/parser/parser.yy
  lfortran_artifact: lfortran-parser-yy

# The first run is the immutable pre-repair baseline. The replay is a new
# observation, not an edit to that baseline.
replays:
  - run: R000001
    standardir_run: E0147/R000016
    standard-new: "1cdd9490375199d93c755fb3c36bc9dcf2c285e6"
  - run: R000002
    standardir_run: E0147/R000018
    standard-new: "424853273a9c424d0483303478a794090756aa80"
  - run: R000005
    standardir_run: E0147/R000022
    standard-new: "c955c23bd57a078c8fceb30de1df101280b25e2c"
    scope: selected-program

# The axes being varied. Omit the key if there is only one condition.
variables:
  lane:
    - entry-points
    - lexical-terminals
    - program-units
    - declarations-and-types
    - names-and-designators
    - expressions-and-operators
    - executable-constructs
    - io-format-and-edit-descriptors
    - coarray-sync-and-teams
    - normalization-and-provenance

# Explain whether model names form a controlled family ladder or separate
# controls. Pin revisions and runtime settings before the first run.
model_selection: >
  No model is used as a grammar oracle. The deterministic inventory is reviewed
  manually against the pinned LFortran Bison source; normative adjudication is
  against the source-backed StandardIR and the pinned standard text. A Luna
  review may challenge the classification but cannot silently change it.

# Name these before running anything. Choosing a metric after seeing the data
# is how an experiment becomes a demonstration.
metrics:
  - source_bison_nonterminals
  - source_bison_production_alternatives
  - source_bison_helper_nonterminals
  - lfortran_bison_nonterminals
  - lfortran_bison_production_alternatives
  - source_bison_shift_reduce_conflicts
  - source_bison_reduce_reduce_conflicts
  - lfortran_bison_shift_reduce_conflicts
  - lfortran_bison_reduce_reduce_conflicts
  - audited_lanes
  - audited_anchor_rows
  - findings_by_class
  - standardir_advantages_recorded
  - reference_advantages_recorded

# State the complete eligible set and exclusions before the first run. A rate
# over the successful subset is reported alongside the strict rate.
denominator: >
  Every production head and alternative in each pinned grammar is inventoried
  by the analysis script. The checked-in matrix is the manual adjudication of
  selected anchors and every observed divergence across all ten lanes; it is
  not a false one-to-one equivalence map because the grammars deliberately use
  different decompositions. The generated production-coverage.tsv makes the
  complete inventory auditable and labels unmatched heads for decomposition or
  extension review. Language equivalence remains a separate corpus gate.

# State the independent behavioral or structural oracle. Self-consistency is
# not an oracle.
independent_oracle: >
  The exact LFortran parser.yy blob and its Bison replay are an independent
  parser-architecture reference. They are not a language-conformance oracle.
  The J3-24-007 source-backed StandardIR and its source spans remain the
  normative adjudication. Neither LFortran productions nor its implementation
  actions may be copied into StandardIR.

# Record versions needed to reproduce each run.
toolchain:
  record_in_run: true
  fields: [compiler, fo, poppler, bison, oracle_versions, pinned_commits]

# What result would disappoint you? If nothing would, this is not an experiment.
falsifiable_by: >
  The pinned blobs cannot be reproduced; an anchor disagrees with the source
  text after accounting for grammar decomposition; a generated target body has
  no source lineage; a target-only defect is left unclassified; or a genuine
  StandardIR or LFortran advantage is omitted from the ledger.

# The condition that closes the experiment and the evidence it must report.
gate: >
  The script reproduces both Bison replays and inventories every production
  head and alternative. The checked-in audit matrix covers all declared lanes,
  records every direct anchor and every observed divergence, and includes both
  negative findings and positive advantages. The result reports remaining
  blockers separately from expected decomposition differences. This audit does
  not claim language equivalence merely because both grammars compile.

# Script that turns runs into the tables and figures in report.md.
analysis: >
  Run
  research/experiments/E0149-manually-compare-source-backed-standardi/analyse.sh
  <run-directory> [E0147/R000018]. Use `--scope selected` for a run produced
  with `sxgrammar --selected-root`; auto-detection recognizes the generated
  selected-root header. It writes only to the ignored run directory
  and produces summary.json, inventory.tsv, production-coverage.tsv,
  anchors.tsv, findings.tsv and Bison replay logs. The checked-in
  comparison-matrix.tsv is the manual classification ledger; the first run is
  the pre-repair baseline and the second run records the lexical repair.
