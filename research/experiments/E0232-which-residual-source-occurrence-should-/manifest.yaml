# The axes being varied. Omit the key if there is only one condition.
variables:
  initialization_operator: "equals | pointer-assign | unknown"
  pointer_attribute: "present | absent | unknown"
  allocatable_attribute: "present | absent | unknown"
  target_property: >-
    If => appears, POINTER shall appear; if = appears, neither POINTER nor
    ALLOCATABLE shall appear in the component-attr-spec-list.

# Explain whether model names form a controlled family ladder or separate
# controls. Pin revisions and runtime settings before the first run.
model_selection: >-
  No model execution. Any Luna harvest remains labelled LLM intake and is not
  source authority, an expected-outcome oracle or a promotion mechanism.

# Name these before running anything. Choosing a metric after seeing the data
# is how an experiment becomes a demonstration.
metrics:
  - residual row count and status partition
  - first residual row and constraint ID
  - canonical source lines and exact byte span
  - printed-page, PDF, ledger and page-index coordinates
  - StandardIR rule, occurrence and source-span bindings
  - model calls and semantic promotions

# State the complete eligible set and exclusions before the first run. A rate
# over the successful subset is reported alongside the strict rate.
denominator: >-
  Every witness ledger row with status disputed or unwitnessed after excluding
  bounded contracts through C763 and harvested C760.

# State the independent behavioral or structural oracle. Self-consistency is
# not an oracle.
independent_oracle: >-
  Controller byte-offset and page-index recomputation against the pinned
  canonical text, PDF, page index and StandardIR. The deterministic residual
  partition is independent of any candidate packet.

# Record versions needed to reproduce each run.
toolchain:
  record_in_run: true
  fields: [compiler, fo, poppler, oracle_versions]

# What result would disappoint you? If nothing would, this is not an experiment.
falsifiable_by: >-
  The partition is not 132 rows with 76 disputed and 56 unwitnessed, the first
  row is not C768@1, the source span or page binding fails, the StandardIR
  witness set cannot be reproduced, or a model call or semantic promotion
  occurs.

# The condition that closes the experiment and the evidence it must report.
gate: >-
  PASS only if the exact residual command yields 132 rows (76 disputed, 56
  unwitnessed) with C768@1 first, the canonical bytes and page coordinates
  bind to C768/R737, existing StandardIR R737/R738/R739/R743 witnesses are
  present, and no model call or semantic promotion occurs. This selects a
  bounded target only; it does not accept C768 as a semantic fact.

# Script that turns runs into the tables and figures in report.md.
analysis: >-
  jq -s -c 'def promoted: ["C1106","C702","C601","C603","C721","C725","C718","C723","C729","C719","C738","C1579","C1586","C717","C720","C722","C724","C726","C731","C732","C733","C735","C743","C744","C745","C746","C747","C748","C749","C750","C751","C752","C754","C757","C759","C760","C761","C762","C763"]; def is_promoted($id): any(promoted[]; . == $id); map(select((.status == "disputed" or .status == "unwitnessed") and (is_promoted(.constraint_id) | not))) | {rows: length, by_status: (group_by(.status) | map({status: .[0].status, count: length})), first_row: .[0].row_key, first_constraint: .[0].constraint_id, first_status: .[0].status}' .cache/runs/E0181/R000002/analysis/witness/witnesses.jsonl

