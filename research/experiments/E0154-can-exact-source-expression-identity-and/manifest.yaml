id: "E0154"
title: "Exact source-expression identity for parser-target lowering"
question: >
  Can exact source-expression identity and corpus witnesses close the selected parser export gate
status: running          # draft | running | reported | abandoned
opened: "2026-08-15"
closed: ""

# Every commit the result depends on. Exact, not "main".
repos:
  lazy-fortran-new: "5aaf7e1"
  standard-new: "9cd164d45a29ef325ea0751496ddd2c2d5b41fc4"
  oracle-lfortran: "caf87b660f803148f000046392a5da803f9fc630"

# What goes in. Pinned artifacts by manifest name; profiles by ID.
inputs:
  standard: j3-24-007
  profile: complete-core-selected-program
  source_run: E0147/R000022
  reference: lfortran-parser-yy

# The axes being varied. Omit the key if there is only one condition.
variables:
  target: [baseline-body-bound, source-expression-witness]
  format: [ebnf, antlr4, bison, tree-sitter]
  corpus: [all-source-alternatives, positive-negative-mutations]

# Explain whether model names form a controlled family ladder or separate
# controls. Pin revisions and runtime settings before the first run.
model_selection: >
  No model calls. The source-backed StandardIR and independent deterministic
  witnesses decide identity; LFortran remains a parser-engineering reference.

# Name these before running anything. Choosing a metric after seeing the data
# is how an experiment becomes a demonstration.
metrics:
  - source_alternative_denominator
  - exact_expression_witnesses
  - missing_expression_witnesses
  - wrong_expression_witnesses
  - helper_lineage_coverage
  - four_format_identity_status
  - positive_controls_passed
  - negative_controls_rejected
  - bison_shift_reduce_conflicts
  - bison_reduce_reduce_conflicts
  - parser_runtime_status

# State the complete eligible set and exclusions before the first run. A rate
# over the successful subset is reported alongside the strict rate.
denominator: >
  Every source-backed alternative in the selected profile, every generated
  helper or transformed target alternative, and fixed positive/negative
  mutations of the source expression or witness. No source alternative may be
  removed from the denominator because a target transformation is convenient.

# State the independent behavioral or structural oracle. Self-consistency is
# not an oracle.
independent_oracle: >
  A separately implemented SX/source-expression reader recomputes the exact
  source expression identity from the pinned StandardIR input and checks every
  generated provenance witness in EBNF, ANTLR4, Bison and tree-sitter. The
  external parser generators validate target syntax. The pinned LFortran Bison
  grammar supplies parser-engineering comparison only, never source bodies.

# Record versions needed to reproduce each run.
toolchain:
  record_in_run: true
  fields: [compiler, fo, poppler, oracle_versions]

# What result would disappoint you? If nothing would, this is not an experiment.
falsifiable_by: >
  A generated target alternative names a wrong source expression, omits an
  expression witness, loses helper lineage, accepts a mutated source/witness,
  or passes a target validator while the independent identity check fails.

# The condition that closes the experiment and the evidence it must report.
gate: >
  The source-expression identity witness covers every selected source
  alternative and every derived target/helper alternative across all four
  formats; positive controls pass, negative mutations fail, and the selected
  target remains valid under ANTLR4, Bison and tree-sitter. This closes the
  identity subgate only. Parser runtime, lexer, precedence/actions, conflict
  policy and real-source acceptance remain separate successor gates.

# Script that turns runs into the tables and figures in report.md.
analysis: >
  The run script and independent validator in this experiment create only
  ignored run artifacts. Counts and hashes are regenerated by those scripts;
  the run ledger records exact production and laboratory commits.
