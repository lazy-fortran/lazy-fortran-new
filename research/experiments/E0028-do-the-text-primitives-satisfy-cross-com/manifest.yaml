id: "E0028"
title: "Text package cross-component properties"
question: >
  Do the text primitives satisfy cross-component byte and boundary properties?
status: reported         # draft | running | reported | abandoned
opened: "2026-08-12"
closed: "2026-08-12"

# Every commit the result depends on. Exact, not "main".
repos:
  lazy-fortran-new: "b81b90b"
  standard-new: "2a05139"

# What goes in. Pinned artifacts by manifest name; profiles by ID.
inputs:
  implementation: standard-new text package
  test: standard-new/test/test_text_properties.f90

# The axes being varied. Omit the key if there is only one condition.
variables: {}

# Explain whether model names form a controlled family ladder or separate
# controls. Pin revisions and runtime settings before the first run.
model_selection: "No model calls; deterministic Fortran property test."

# Name these before running anything. Choosing a metric after seeing the data
# is how an experiment becomes a demonstration.
metrics:
  - text_policy_self_test_status
  - text_policy_status
  - focused_test_status
  - full_pipeline_status
  - formatting_status
  - independent_oracle_mutation_status
  - chunked_buffer_bytes
  - span_subranges_checked
  - builder_bytes
  - writer_bytes
  - writer_count
  - interner_identity
  - utf8_identity

# State the complete eligible set and exclusions before the first run. A rate
# over the successful subset is reported alongside the strict rate.
denominator: >
  The complete property slice consists of deterministic generated byte input,
  all tested byte-buffer and span subranges, builder and writer chunking,
  interner case identity, UTF-8 scalar decoding and the standard-new full
  pipeline. Fuzzing and malformed SX corpus work are excluded.

# State the independent behavioral or structural oracle. Self-consistency is
# not an oracle.
independent_oracle: >
  The test compares every produced byte with a separately computed reference
  byte sequence, checks all short subranges, exact writer counts, fixed case
  identity and a fixed U+1F600 scalar. The first byte is also checked against
  an independent literal oracle. Changing that literal was run and had to
  fail before the accepted test was restored.

# Record versions needed to reproduce each run.
toolchain:
  record_in_run: true
  fields: [compiler, fo, poppler, oracle_versions]

# What result would disappoint you? If nothing would, this is not an experiment.
falsifiable_by: >
  Any chunk boundary may lose or reorder a byte, a span may expose the wrong
  subrange, a writer count may differ, interner identity may split a case
  variant, UTF-8 decoding may differ, or the mutated literal oracle may pass.

# The condition that closes the experiment and the evidence it must report.
gate: >
  Pin the production commit, run the focused property test, observe the
  controlled literal mutation fail, restore the oracle, and run text-policy,
  formatting and full fo gates successfully.

# Script that turns runs into the tables and figures in report.md.
analysis: research/experiments/E0028-do-the-text-primitives-satisfy-cross-com/analyse.sh
