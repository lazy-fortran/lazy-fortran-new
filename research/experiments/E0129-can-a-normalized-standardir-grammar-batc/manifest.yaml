id: "E0129"
title: "Batch StandardIR grammar export"
question: >
  Can a normalized StandardIR grammar batch generate ordered canonical grammar exports for all declared formats?
status: reported        # draft | running | reported | abandoned
opened: "2026-08-14"
closed: "2026-08-14"
reported_run: R000238
reported_runs: [R000238]

# Every commit the result depends on. Exact, not "main".
repos:
  lazy-fortran-new: 3c66b93
  standard-new: 25486db92b0805201fa90104dc6f637ecce84942

# What goes in. Pinned artifacts by manifest name; profiles by ID.
inputs:
  standard: j3-24-007
  profile: normalized-grammar-export-witnesses

# The axes being varied. Omit the key if there is only one condition.
variables:
  formats: [ebnf, antlr4, bison, tree_sitter]
  controls: [alternative_order, malformed_rule, provenance]

# Explain whether model names form a controlled family ladder or separate
# controls. Pin revisions and runtime settings before the first run.
model_selection: "none; deterministic grammar export only"

# Name these before running anything. Choosing a metric after seeing the data
# is how an experiment becomes a demonstration.
metrics:
  - format_count
  - rule_order_preserved
  - alternative_order_preserved
  - provenance_annotations
  - malformed_rejection
  - fo_warnings

# State the complete eligible set and exclusions before the first run. A rate
# over the successful subset is reported alongside the strict rate.
denominator: "Every rule and alternative in the fixed normalized grammar batch, plus each declared malformed and provenance control."

# State the independent behavioral or structural oracle. Self-consistency is
# not an oracle.
independent_oracle: "Independently authored expected ordered productions and source annotations for each declared export format; comparison grammars are not inputs."

# Record versions needed to reproduce each run.
toolchain:
  record_in_run: true
  fields: [compiler, fo, poppler, oracle_versions]

# What result would disappoint you? If nothing would, this is not an experiment.
falsifiable_by: "Any copied comparison production, reordered rule or alternative, lost source annotation, malformed acceptance, missing format, or nonzero warning."

# The condition that closes the experiment and the evidence it must report.
gate: "All declared formats are emitted from the normalized batch with exact order/provenance agreement and explicit negative controls, and full fo passes with zero warnings."

# Script that turns runs into the tables and figures in report.md.
analysis: "research/experiments/E0129-can-a-normalized-standardir-grammar-batc/analyse.sh"
