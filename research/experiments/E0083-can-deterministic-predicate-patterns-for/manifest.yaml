id: "E0083"
title: "Deterministic bounded Core 0 constraint formalization"
question: >
  Can deterministic predicate patterns formalize a bounded Core 0 constraint set with source provenance and dependency facts?
status: draft            # draft | running | reported | abandoned
opened: "2026-08-13"
closed: ""

# Every commit the result depends on. Exact, not "main".
repos:
  lazy-fortran-new: "9c69781"

# What goes in. Pinned artifacts by manifest name; profiles by ID.
inputs:
  standard: j3-24-007
  profile: E0014-R000001
  constraint_inventory: E0082-R000001
  formalization_policy: research/experiments/E0083-can-deterministic-predicate-patterns-for/predicate-policy.tsv
  independent_oracle: research/experiments/E0083-can-deterministic-predicate-patterns-for/independent-oracle.tsv
  decisions: [D0007, D0019, D0028, D0035, D0036]

# The axes being varied. Omit the key if there is only one condition.
variables:
  predicate_forms: [maximum, existence, type-membership, nonnegative, implication, exclusion, finite-domain]
  model_calls: [zero]
  parser_projection: [none]

# Explain whether model names form a controlled family ladder or separate
# controls. Pin revisions and runtime settings before the first run.
model_selection: "No model calls. Exact source witnesses and predicate forms are predeclared."

# Name these before running anything. Choosing a metric after seeing the data
# is how an experiment becomes a demonstration.
metrics:
  - eligible_constraints
  - selected_constraints
  - normalized_predicates
  - resolved_constraints
  - unresolved_constraints
  - disputed_constraints
  - source_hash_matches
  - source_evidence_matches
  - required_fact_records
  - provided_fact_records
  - dependency_edges
  - topological_order_difference
  - independent_normalization_difference
  - parser_projection_records
  - model_calls
  - negative_control

# State the complete eligible set and exclusions before the first run. A rate
# over the successful subset is reported alongside the strict rate.
denominator: >
  All 287 Core 0-associated numbered constraints emitted by E0081 and retained
  by E0082. Eight exact single-sentence witnesses are eligible for this first
  predicate-form slice. The remaining 279 constraints are retained with
  unresolved status. No rule is accepted from a comparison grammar or from a
  parser projection.

# State the independent behavioral or structural oracle. Self-consistency is
# not an oracle.
independent_oracle: >
  A separately traversed oracle table carries the expected constraint ID,
  source phrase, normalized predicate and fact sets. It compares every output
  field, recomputes the selected and unresolved partition, checks the pinned
  source hash, and rejects a controlled mutation of both a source phrase and
  a predicate witness. The dependency graph is checked against a separately
  sorted edge traversal and topological order.

# Record versions needed to reproduce each run.
toolchain:
  record_in_run: true
  fields: [compiler, fo, poppler, oracle_versions]

# What result would disappoint you? If nothing would, this is not an experiment.
falsifiable_by: >
  A selected constraint is absent, duplicated, source-less, assigned a
  predicate not present in the policy and oracle, given the wrong source hash,
  assigned the wrong required or provided fact, placed after a dependent fact,
  or accepted after the controlled mutation. Any of the other 279 constraints
  receives resolved status, or any parser projection or model call is emitted.

# The condition that closes the experiment and the evidence it must report.
gate: >
  Rerun the E0082 inventory, match all 287 constraint IDs exactly once, emit
  eight source-provenanced resolved predicate records and 279 unresolved
  records, derive the fact dependency edges and topological order, pass the
  independent oracle and mutation checks, and emit zero parser projections and
  zero model calls.

# Script that turns runs into the tables and figures in report.md.
analysis: research/experiments/E0083-can-deterministic-predicate-patterns-for/analyse.sh
