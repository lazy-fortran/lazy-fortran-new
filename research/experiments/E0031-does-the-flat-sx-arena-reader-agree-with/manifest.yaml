id: "E0031"
title: "Flat SX arena-reader differential"
question: >
  Does the flat SX arena reader agree with the recursive seed on canonical
  bytes?
status: reported         # draft | running | reported | abandoned
opened: "2026-08-12"
closed: "2026-08-12"

# Every commit the result depends on. Exact, not "main".
repos:
  lazy-fortran-new: "989db1d"
  standard-new: "50392e7"

# What goes in. Pinned artifacts by manifest name; profiles by ID.
inputs:
  implementation: standard-new fortsx_arena and recursive fortsx
  test: standard-new/test/test_fortsx_arena.f90

# The axes being varied. Omit the key if there is only one condition.
variables: {}

# Explain whether model names form a controlled family ladder or separate
# controls. Pin revisions and runtime settings before the first run.
model_selection: "No model calls; deterministic Fortran implementation and differential test."

# Name these before running anything. Choosing a metric after seeing the data
# is how an experiment becomes a demonstration.
metrics:
  - text_policy_self_test_status
  - text_policy_status
  - focused_test_status
  - full_pipeline_status
  - formatting_status
  - differential_byte_status
  - arena_node_count
  - arena_root_kind
  - independent_oracle_mutation_status

# State the complete eligible set and exclusions before the first run. A rate
# over the successful subset is reported alongside the strict rate.
denominator: >
  The complete slice consists of the fixed canonical arena fixture, flat-node
  structure checks, differential canonical-byte comparison with the recursive
  reader/writer and the standard-new full pipeline. Generated-reader cutover
  and broader corpus coverage remain excluded.

# State the independent behavioral or structural oracle. Self-consistency is
# not an oracle.
independent_oracle: >
  test_fortsx_arena compares arena output with a separately declared canonical
  byte fixture and compares every arena byte with an independently produced
  recursive-seed byte stream. It also checks the flat node count and root kind.
  Changing one expected canonical byte was run and had to fail before the
  accepted test was restored.

# Record versions needed to reproduce each run.
toolchain:
  record_in_run: true
  fields: [compiler, fo, poppler, oracle_versions]

# What result would disappoint you? If nothing would, this is not an experiment.
falsifiable_by: >
  The arena may lose or alter a byte, disagree with the recursive seed, expose
  the wrong flat structure, or pass after the expected canonical byte changes.

# The condition that closes the experiment and the evidence it must report.
gate: >
  Pin the production commit, run the focused arena/recursive differential test,
  observe the controlled canonical-byte mutation fail, restore the fixture, and
  run text-policy, formatting and full fo gates successfully.

# Script that turns runs into the tables and figures in report.md.
analysis: research/experiments/E0031-does-the-flat-sx-arena-reader-agree-with/analyse.sh
