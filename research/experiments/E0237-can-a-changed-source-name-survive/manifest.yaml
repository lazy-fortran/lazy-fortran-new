model_selection: >-
  No model call is part of implementation or replay. The producer was prepared
  by medium-depth gpt-5.6-luna; the deterministic central oracle is authoritative.

metrics:
  - exact positive, changed-name control and negative source hashes
  - exact z variable name, type and span
  - repeated typed-AST output and path-independent trace hashes
  - component revision, toolchain and clean-checkout state
  - model calls and semantic promotions

denominator: >-
  One exact positive source with variable z, one promoted y changed-name
  control, one malformed integer :: neighbour, two identical positive
  executions, the schema-linked golden and the no-output negative control.
  General identifier/declaration parsing, semantics, MIR and executable
  behavior are excluded.

independent_oracle: >-
  tests/e2e/validate_frontend_ast_v1_name_mutation.py checks literal source
  bytes, the LLM-labelled contract witness, pinned schema/artifact hashes,
  schema/output structure, typed values, repeated output and absence of
  negative output without importing fortfront.

toolchain:
  record_in_run: true
  fields: [compiler, fo, poppler, oracle_versions]

falsifiable_by: >-
  Positive rejection, z changed to another name, y control mismatch, malformed
  neighbour acceptance, changed span/output, repeat mismatch, negative output,
  pin or trace mismatch, model call or semantic promotion.

