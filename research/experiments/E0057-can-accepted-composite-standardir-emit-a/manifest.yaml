id: "E0057"
title: "Deterministic direct-parser wiring skeleton"
question: >
  Can accepted composite StandardIR emit a provenance-bearing direct parser wiring skeleton
status: draft            # draft | running | reported | abandoned
opened: "2026-08-12"
closed: ""

# Every commit the result depends on. Exact, not "main".
repos:
  lazy-fortran-new: "e5af654"
  standard-new: "c6cd889"

# What goes in. Pinned artifacts by manifest name; profiles by ID.
inputs:
  standard: j3-24-007
  profile: accepted-composite-projection-v1
  predecessor: E0055-R000001
  decisions: [D0018, D0023, D0028, D0029]

# The axes being varied. Omit the key if there is only one condition.
variables:
  wiring_order: [source-order-within-lhs, lexical-lhs-dispatch]
  representation: [dispatch-table, generated-fortran-skeleton]

# Explain whether model names form a controlled family ladder or separate
# controls. Pin revisions and runtime settings before the first run.
model_selection: "No model calls. The dispatch and skeleton are emitted mechanically from E0055 composite-input.sx."

# Name these before running anything. Choosing a metric after seeing the data
# is how an experiment becomes a demonstration.
metrics:
  - source_syntax_records
  - composite_syntax_records
  - unique_lhs
  - dispatch_rows
  - generated_procedures
  - duplicate_dispatch_labels
  - provenance_rows
  - unresolved_references
  - fortran_compile_status
  - negative_control

# State the complete eligible set and exclusions before the first run. A rate
# over the successful subset is reported alongside the strict rate.
denominator: >
  All 522 E0013 source syntax records and all 519 E0055 composite records are
  eligible. The three R401/R402/R403 template records removed by E0055 remain
  in the source denominator and are counted separately.

# State the independent behavioral or structural oracle. Self-consistency is
# not an oracle.
independent_oracle: >
  E0055 is rerun and its composite-input hash is checked. A separate
  source-driven traversal counts records, unique left-hand sides, provenance
  fields and dispatch labels. The generated Fortran skeleton is compiled by
  the system compiler. A controlled source-lhs mutation must change the
  independent dispatch witness.

# Record versions needed to reproduce each run.
toolchain:
  record_in_run: true
  fields: [compiler, fo, poppler, oracle_versions]

# What result would disappoint you? If nothing would, this is not an experiment.
falsifiable_by: >
  The experiment fails if a composite record lacks one dispatch row or source
  citation, if two procedures share a dispatch label, if a reference remains
  unresolved, if the generated skeleton does not compile, or if the mutation
  control passes.

# The condition that closes the experiment and the evidence it must report.
gate: >
  Report whether deterministic wiring can emit a complete dispatch skeleton
  from the accepted composite input. Keep procedure bodies explicitly marked
  as local implementation holes. This experiment does not claim parser
  behavior or a complete Fortran frontend.

# Script that turns runs into the tables and figures in report.md.
analysis: research/experiments/E0057-can-accepted-composite-standardir-emit-a/analyse.sh
