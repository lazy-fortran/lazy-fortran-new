id: "E0109"
title: "Strict semantic residue ledger and M3 accounting gate"
question: >
  Can the strict semantic residue ledger close the M3 accounting gate?
status: draft            # draft | running | reported | abandoned
opened: "2026-08-13"
closed: ""

# Every commit the result depends on. Exact, not "main".
repos:
  lazy-fortran-new: "0b6f6b0"
  standard-new: "ae2ee71"

# What goes in. Pinned artifacts by manifest name; profiles by ID.
inputs:
  standard: j3-24-007
  profile: complete-core
  e0107_candidates: .cache/runs/E0107/R000001/strict-candidates.tsv
  e0108_validation: .cache/runs/E0108/R000001/independent-validation.tsv
  e0106_residue: .cache/runs/E0106/R000001/residue-classifications.tsv

# The axes being varied. Omit the key if there is only one condition.
variables:
  states: [resolved, ambiguous, unresolved]
  model_calls: [zero]

# Explain whether model names form a controlled family ladder or separate
# controls. Pin revisions and runtime settings before the first run.
model_selection: "No model calls; the accounting gate only validates pinned deterministic outputs."

# Name these before running anything. Choosing a metric after seeing the data
# is how an experiment becomes a demonstration.
metrics:
  - denominator_rows
  - resolved_rows
  - ambiguous_rows
  - unresolved_rows
  - independent_disagreements
  - model_calls
  - semantic_promotions

# State the complete eligible set and exclusions before the first run. A rate
# over the successful subset is reported alongside the strict rate.
denominator: >
  The complete 127-row E0100/E0104 residue, with the 60 E0106 unique rows
  adjudicated by E0107/E0108 and all other rows retained unresolved or
  ambiguous.

# State the independent behavioral or structural oracle. Self-consistency is
# not an oracle.
independent_oracle: >
  Compare the E0107 and E0108 row keys and source fields independently against
  the E0106 denominator; reject dropped, added, duplicated or misprovenanced
  rows and reject any accepted parser or wiring output.

# Record versions needed to reproduce each run.
toolchain:
  record_in_run: true
  fields: [compiler, fo, poppler, oracle_versions]

# What result would disappoint you? If nothing would, this is not an experiment.
falsifiable_by: >
  Any denominator difference, disagreement, source mismatch, silent promotion
  of ambiguity, model call, or parser/wiring output fails the gate.

# The condition that closes the experiment and the evidence it must report.
gate: >
  Account for all 127 residue rows exactly once, validate the strict and
  independent files, preserve ambiguous/unresolved states, and report zero
  disagreements, model calls and unvalidated semantic promotions.

# Script that turns runs into the tables and figures in report.md.
analysis: research/experiments/E0109-can-the-strict-semantic-residue-ledger-c/analyse.sh
