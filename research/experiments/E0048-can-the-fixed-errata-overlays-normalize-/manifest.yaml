id: "E0048"
title: "Fixed errata normalization and R401/R403 inventory"
question: >
  Can the fixed errata overlays normalize the remaining punctuation boundary and enumerate every R401/R403 expansion-family term without selecting its parser representation?
status: reported         # draft | running | reported | abandoned
opened: "2026-08-12"
closed: "2026-08-12"

# Every commit the result depends on. Exact, not "main".
repos:
  lazy-fortran-new: "3a954d5"
  standard-new: "c6cd889"

# What goes in. Pinned artifacts by manifest name; profiles by ID.
inputs:
  standard: j3-24-007
  profile: "complete-core-expansion-inventory-v0"
  syntax: E0013-R000002
  canonical_text: E0001-R000003
  unresolved_audit: E0022-R000001
  base_errata: research/errata/j3-24-007.json
  errata_extension: research/errata/j3-24-007-r1123.json

# The axes being varied. Omit the key if there is only one condition.
variables:
  expansion_families: [R401-list, R403-scalar]
  representation: [deferred-D0024]

# Explain whether model names form a controlled family ladder or separate
# controls. Pin revisions and runtime settings before the first run.
model_selection: "No model calls during analysis. The errata inputs are LLM-originated and accepted by D0025; inventory construction is mechanical."

# Name these before running anything. Choosing a metric after seeing the data
# is how an experiment becomes a demonstration.
metrics:
  - original_audit_unique_names
  - normalized_audit_unique_names
  - errata_records
  - errata_repairs
  - expansion_records
  - r401_records
  - r403_records
  - explicit_definition_conflicts
  - source_witness_matches
  - independent_difference
  - representation_selection
  - negative_control

# State the complete eligible set and exclusions before the first run. A rate
# over the successful subset is reported alongside the strict rate.
denominator: >
  The eligible set is the 181 distinct names in E0022-R000001. The eight
  source-repair entries normalize three punctuation collisions and leave 178
  names in the derived audit view. The selected expansion inventory contains
  80 R401 suffix-list terms and 20 R403 scalar-prefix terms. No parser
  representation is selected in this experiment.

# State the independent behavioral or structural oracle. Self-consistency is
# not an oracle.
independent_oracle: >
  The audit is normalized through the two pinned errata files. An independent
  StandardIR traversal supplies the first source occurrence for each selected
  term. The inventory is compared with a separate normalized-audit traversal,
  explicit StandardIR left-hand sides are checked, and a family mutation must
  fail.

# Record versions needed to reproduce each run.
toolchain:
  record_in_run: true
  fields: [compiler, fo, poppler, oracle_versions]

# What result would disappoint you? If nothing would, this is not an experiment.
falsifiable_by: >
  An erratum is missing or has no source witness, normalized names are dropped
  or duplicated unexpectedly, an expansion term lacks its StandardIR evidence,
  a selected term has an explicit definition, the R401/R403 counts differ, or
  the negative control does not fail.

# The condition that closes the experiment and the evidence it must report.
gate: >
  Verify all pinned input hashes and four normative excerpts, normalize the
  audit through eight fixed errata entries, inventory exactly 80 R401 and 20
  R403 terms with source provenance, find zero explicit-definition conflicts,
  and pass the independent set comparison and negative control. Defer parser
  representation to D0024.

# Script that turns runs into the tables and figures in report.md.
analysis: research/experiments/E0048-can-the-fixed-errata-overlays-normalize-/analyse.sh
