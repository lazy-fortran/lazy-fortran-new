id: "E0126"
title: "Generic grammar nullable and first-set analysis"
question: >
  Can the stored StandardIR grammar table provide deterministic generic nullable and first-set analysis without language-specific parser policy?
status: draft            # draft | running | reported | abandoned
opened: "2026-08-14"
closed: ""

# Every commit the result depends on. Exact, not "main".
repos:
  lazy-fortran-new: 49dfe76
  fortfront-new: fe3dde3d1fabf89055d7c2494892b243fd4df0b9

# What goes in. Pinned artifacts by manifest name; profiles by ID.
inputs:
  standard: j3-24-007
  profile: grammar-analysis-witnesses

# The axes being varied. Omit the key if there is only one condition.
variables:
  forms: [reference, sequence, choice, optional, repeat]
  controls: [cycle, unknown_reference, duplicate_identity, capacity]

# Explain whether model names form a controlled family ladder or separate
# controls. Pin revisions and runtime settings before the first run.
model_selection: "none; deterministic grammar analysis only"

# Name these before running anything. Choosing a metric after seeing the data
# is how an experiment becomes a demonstration.
metrics:
  - nullable_expected
  - first_set_expected
  - insertion_order_preserved
  - unresolved_status_preserved
  - fo_warnings

# State the complete eligible set and exclusions before the first run. A rate
# over the successful subset is reported alongside the strict rate.
denominator: "The complete fixed grammar-analysis witness table, including every positive form and every declared negative control."

# State the independent behavioral or structural oracle. Self-consistency is
# not an oracle.
independent_oracle: "Independently authored nullable and first-symbol sets over fixed grammar records, with explicit expected failure states."

# Record versions needed to reproduce each run.
toolchain:
  record_in_run: true
  fields: [compiler, fo, poppler, oracle_versions]

# What result would disappoint you? If nothing would, this is not an experiment.
falsifiable_by: "Any language-specific token assumption, incorrect fixed-point result, hidden acceptance of an unknown reference, or nonzero warning."

# The condition that closes the experiment and the evidence it must report.
gate: "The generic analyzer returns exact oracle results for all witnesses, retains ambiguity/unresolved states, rejects malformed graphs, and passes full fo with zero warnings."

# Script that turns runs into the tables and figures in report.md.
analysis: "research/experiments/E0126-can-the-stored-standardir-grammar-table-/analyse.sh"
