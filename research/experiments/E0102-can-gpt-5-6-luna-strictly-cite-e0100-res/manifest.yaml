id: "E0102"
title: "Strict Luna citation of E0100 residue"
question: >
  Can gpt-5.6-luna strictly cite E0100 residue without unsupported promotion?
status: reported         # draft | running | reported | abandoned
opened: "2026-08-13"
closed: "2026-08-13"

# Every commit the result depends on. Exact, not "main".
repos:
  lazy-fortran-new: "087ec6f"

# What goes in. Pinned artifacts by manifest name; profiles by ID.
inputs:
  standard: j3-24-007
  profile: complete-core
  e0100_classifications: .cache/runs/E0100/R000001/classifications.tsv
  e0100_candidate_spans: .cache/runs/E0100/R000001/candidate-spans.tsv
  residue_package: .cache/runs/E0101/R000002/residue.jsonl

# The axes being varied. Omit the key if there is only one condition.
variables:
  model: [gpt-5.6-luna]
  reasoning: [medium]
  execution: [one-shot]

# Explain whether model names form a controlled family ladder or separate
# controls. Pin revisions and runtime settings before the first run.
model_selection: >
  One bounded gpt-5.6-luna run at medium reasoning with the committed prompt
  in model-prompt.md. The model may abstain per row; the strict harness is the
  acceptance gate. Prompt SHA-256 is recorded in the run record.

# Name these before running anything. Choosing a metric after seeing the data
# is how an experiment becomes a demonstration.
metrics:
  - residue_rows
  - retained_normative_spans
  - model_calls
  - accepted_relations
  - unresolved_or_abstained
  - rejected_outputs
  - alias_promotions

# State the complete eligible set and exclusions before the first run. A rate
# over the successful subset is reported alongside the strict rate.
denominator: >
  The 127 distinct E0100 rows classified as ambiguous candidate or no
  candidate. The 54 mechanically-supported E0100 rows are excluded because
  this experiment measures model handling of the residue only.

# State the independent behavioral or structural oracle. Self-consistency is
# not an oracle.
independent_oracle: >
  E0101's citation validator independently checks every relation against the
  retained E0100 source span, requires all 127 names exactly once, and rejects
  unsupported fields, uncited relations, aliases without citations, and
  malformed JSONL.

# Record versions needed to reproduce each run.
toolchain:
  record_in_run: true
  fields: [compiler, fo, poppler, oracle_versions]

# What result would disappoint you? If nothing would, this is not an experiment.
falsifiable_by: >
  Any missing or duplicate residue row, invalid JSONL, unsupported field,
  citation not present in the retained spans, or alias without an exact
  retained citation fails the gate.

# The condition that closes the experiment and the evidence it must report.
gate: >
  Run exactly one pinned Luna invocation, validate its complete JSONL output
  through E0101, report accepted and abstained rows, and promote nothing into
  StandardIR from this experiment.

# Script that turns runs into the tables and figures in report.md.
analysis: research/experiments/E0101-can-a-strictly-cited-model-resolve-e0100/analyse.sh
