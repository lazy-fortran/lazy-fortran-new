id: "E0187"
title: "Deterministic C1579 RESULT entry-name exclusion oracle"
question: >
  Can a deterministic oracle enforce C1579 RESULT entry-name exclusion
status: running          # draft | running | reported | abandoned
opened: "2026-08-17"
closed: ""
candidate_run: R000003
candidate_runs: [R000003]

# Every commit the result depends on. Exact, not "main".
repos:
  lazy-fortran-new: "365b06aad23e9b436715666d0bc24625f3901769"
  standard-new: "f94c4c51b51fce22b533b7eeda08741970320913"

# What goes in. Pinned artifacts by manifest name; profiles by ID.
inputs:
  standard: j3-24-007
  profile: "m3-c1579-source-backed-v0"
  normative_source_sha256: 7371e889f231cfb0316d30365d5083fb5af34cbb6d5f7cb1e01855c73021bfa2
  canonical_text: .cache/runs/E0001/R000003/j3-24-007.canonical.txt
  canonical_text_sha256: 1cf538329c57e4f617adb36f2c7cd91a5a5561c78bcce16ec96f7ff1a9979f9e
  canonical_pages_index: .cache/runs/E0001/R000003/j3-24-007.pages.index
  canonical_pages_index_sha256: 49406a5aecf423555662643f07f6c2bdf72dd3df3954862231afa31505e18929
  standardir_source: .cache/runs/E0171/R000433-provenance-replay/standardir.sx
  standardir_source_sha256: 106389186689ae819783ab6742ba4a469f8d1a84ce3bbf25e9baf98a32cf25c2
  semantic_items: tests/fixtures/m3-c1579-semantic-items.sx

# The axes being varied. Omit the key if there is only one condition.
variables:
  property: result-entry-name-exclusion
  outcomes: [ACCEPTED, REJECTED, UNRESOLVED]

# Explain whether model names form a controlled family ladder or separate
# controls. Pin revisions and runtime settings before the first run.
model_selection: "No model calls. Candidate facts are human-authored fixtures; the oracle is mechanical."

# Name these before running anything. Choosing a metric after seeing the data
# is how an experiment becomes a demonstration.
metrics:
  - case_outcomes
  - source_binding
  - semantic_canonicalization
  - mutation_controls
  - model_calls
  - semantic_promotions

# State the complete eligible set and exclusions before the first run. A rate
# over the successful subset is reported alongside the strict rate.
denominator: >
  Every case in tests/fixtures/m3-c1579-source-backed-v0.json: the complete
  nine-combination typed state table with three accepted witnesses, one
  rejected declaration neighbour and five unknown unresolved controls.
  Mutation controls are a separate source-binding denominator.

# State the independent behavioral or structural oracle. Self-consistency is
# not an oracle.
independent_oracle: >
  tests/e2e/validate_m3_c1579.py computes the C1579 implication from typed
  RESULT-presence and entry-name declaration states independently of expected
  labels. It does not parse statements or infer declaration state.

# Record versions needed to reproduce each run.
toolchain:
  record_in_run: true
  fields: [compiler, fo, poppler, oracle_versions]

# What result would disappoint you? If nothing would, this is not an experiment.
falsifiable_by: >
  Any source hash, source span, rule identity or StandardIR row mutation is
  accepted; the canonical semantic-items output changes; RESULT absent is
  rejected; RESULT present with no declaration is rejected; RESULT present
  with a declaration is accepted; an unknown state is classified other than
  UNRESOLVED; or any model call or semantic promotion is observed.

# The condition that closes the experiment and the evidence it must report.
gate: >
  tests/e2e/run-m3-c1579.sh --fresh must pass from clean central and
  standard-new checkouts, including standard-new sxsemantic canonicalization,
  normative PDF/canonical-text/page-index/StandardIR hash and witness checks,
  nine independently computed cases covering the complete typed state table,
  seven observed mutation failures, exact committed trace comparison and zero
  model calls or semantic promotions.

# Script that turns runs into the tables and figures in report.md.
analysis: tests/e2e/validate_m3_c1579.py
run: tests/e2e/run-m3-c1579.sh --fresh
