id: "E0128"
title: "Whole-body target-independent MIR opcode histogram"
question: >
  Can a target-independent MIR body expose a complete deterministic opcode histogram without changing mir-v0?
status: running          # draft | running | reported | abandoned
opened: "2026-08-14"
closed: ""

# Every commit the result depends on. Exact, not "main".
repos:
  lazy-fortran-new: e5de64b
  ffc-new: 31a2b5df3d5de3486b5614a041d272e1daa6b3b1

# What goes in. Pinned artifacts by manifest name; profiles by ID.
inputs:
  standard: j3-24-007
  profile: mir-v0-function-witnesses

# The axes being varied. Omit the key if there is only one condition.
variables:
  bodies: [empty, repeated_opcodes, all_opcodes, malformed]

# Explain whether model names form a controlled family ladder or separate
# controls. Pin revisions and runtime settings before the first run.
model_selection: "none; deterministic target-independent MIR analysis only"

# Name these before running anything. Choosing a metric after seeing the data
# is how an experiment becomes a demonstration.
metrics:
  - histogram_length
  - per_opcode_count
  - total_instruction_count
  - malformed_rejection
  - fo_warnings

# State the complete eligible set and exclusions before the first run. A rate
# over the successful subset is reported alongside the strict rate.
denominator: "Every fixed valid and malformed mir-v0 body in the declared witness set."

# State the independent behavioral or structural oracle. Self-consistency is
# not an oracle.
independent_oracle: "Independently authored opcode-frequency vectors and total counts for fixed bodies, with explicit malformed and output-clearing expectations."

# Record versions needed to reproduce each run.
toolchain:
  record_in_run: true
  fields: [compiler, fo, poppler, oracle_versions]

# What result would disappoint you? If nothing would, this is not an experiment.
falsifiable_by: "Any target-specific dependency, omitted opcode, incorrect count, accepted malformed body, stale output, or nonzero warning."

# The condition that closes the experiment and the evidence it must report.
gate: "The complete histogram agrees with the independent oracle for all valid bodies, rejects malformed bodies with cleared output, leaves mir-v0 unchanged, and passes full fo with zero warnings."

# Script that turns runs into the tables and figures in report.md.
analysis: "research/experiments/E0128-can-a-target-independent-mir-body-expose/analyse.sh"
