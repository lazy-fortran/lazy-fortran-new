id: "E0043"
title: "D0019 source-controlled resolution slice"
question: >
  Can a source-controlled D0019 resolution slice classify lexical classes, aliases and metanotation without guessing?
status: reported         # draft | running | reported | abandoned
opened: "2026-08-12"
closed: "2026-08-12"

# Every commit the result depends on. Exact, not "main".
repos:
  lazy-fortran-new: "1ada0de"
  standard-new: "c6cd889"

# What goes in. Pinned artifacts by manifest name; profiles by ID.
inputs:
  standard: j3-24-007
  profile: complete-core-resolution-v0
  syntax: E0013-R000002
  unresolved_audit: E0022-R000001
  resolution_seed: research/experiments/E0043-can-a-source-controlled-d0019-resolution/seed.tsv

# The axes being varied. Omit the key if there is only one condition.
variables:
  resolution_classes: [alias, lexical-class, metavariable, semantic-role, unresolved, disputed]

# Explain whether model names form a controlled family ladder or separate
# controls. Pin revisions and runtime settings before the first run.
model_selection: "No model calls. The seed is source-controlled and the projection is mechanical."

# Name these before running anything. Choosing a metric after seeing the data
# is how an experiment becomes a demonstration.
metrics:
  - resolution_records
  - alias_records
  - lexical_class_records
  - metavariable_records
  - semantic_role_records
  - unresolved_records
  - disputed_records
  - source_hash_matches
  - alias_projection_records
  - composite_input_sha256
  - composite_grammar_sha256
  - independent_difference
  - negative_control

# State the complete eligible set and exclusions before the first run. A rate
# over the successful subset is reported alongside the strict rate.
denominator: >
  The eligible set is the 181 distinct unresolved names in the pinned E0022
  audit. Eight names have source-controlled resolution witnesses in the seed.
  The seed also carries underscore as a defined lexical witness, so the output
  has 182 records and 174 unresolved audit names. Comparison-grammar presence
  is evidence only and cannot change the denominator or a resolution class.

# State the independent behavioral or structural oracle. Self-consistency is
# not an oracle.
independent_oracle: >
  The canonical text is checked for the exact normative statements supporting
  each seeded class. An independent awk traversal checks that every audit name
  appears exactly once, every output row retains the source hash and a source
  occurrence, every alias targets name, and a controlled mutation makes the
  validator fail.

# Record versions needed to reproduce each run.
toolchain:
  record_in_run: true
  fields: [compiler, fo, poppler, oracle_versions]

# What result would disappoint you? If nothing would, this is not an experiment.
falsifiable_by: >
  A source excerpt is absent, a seeded alias has no R402 citation, a lexical
  class is emitted as a parser alias, an audit name is dropped or duplicated,
  a source hash differs, the alias projection changes an unselected term, or
  the negative control does not fail.

# The condition that closes the experiment and the evidence it must report.
gate: >
  Verify all pinned input hashes, generate one typed record for every E0022
  unresolved name plus the defined underscore witness, retain eight
  source-controlled witnesses and 174 unresolved records, derive the alias-only
  composite slice, emit its grammar projection,
  and pass the independent traversal and negative control. This experiment
  does not claim a complete parser input because lexical token rules and
  unresolved terms remain outside the selected slice.

# Script that turns runs into the tables and figures in report.md.
analysis: research/experiments/E0043-can-a-source-controlled-d0019-resolution/analyse.sh
