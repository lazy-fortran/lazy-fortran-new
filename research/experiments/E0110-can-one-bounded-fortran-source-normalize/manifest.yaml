id: "E0110"
title: "Final bounded source normalization pass for the semantic residue"
question: >
  Can one bounded Fortran source normalizer mechanically resolve the final
  semantic residue without candidate-specific procedural exceptions?
status: running          # draft | running | reported | abandoned
opened: "2026-08-13"
closed: ""

# Every commit the result depends on. Exact, not "main".
repos:
  lazy-fortran-new: "9373e18"
  standard-new: "ae2ee71"

# What goes in. Pinned artifacts by manifest name; profiles by ID.
inputs:
  standard: j3-24-007
  profile: complete-core
  e0106_structure: .cache/runs/E0106/R000001/structure.jsonl
  e0106_residue: .cache/runs/E0106/R000001/residue-classifications.tsv
  canonical_text: .cache/runs/E0001/R000003/j3-24-007.canonical.txt
  page_index: .cache/runs/E0001/R000003/j3-24-007.pages.index

# The axes being varied. Omit the key if there is only one condition.
variables:
  normalization: [trim-whitespace, join-logical-lines,
                  strip-attached-grammar-punctuation]
  definition_forms: [is, is-one-of, means, consists-of, explicit-name-heading]
  candidate_specific_rules: [none]
  model_calls: [zero]

# Explain whether model names form a controlled family ladder or separate
# controls. Pin revisions and runtime settings before the first run.
model_selection: "No model calls; this is the final deterministic discovery pass."

# Name these before running anything. Choosing a metric after seeing the data
# is how an experiment becomes a demonstration.
metrics:
  - residue_rows
  - unique_candidates
  - normalized_candidates
  - strict_definitions
  - ambiguous_definitions
  - unsupported_definitions
  - candidate_specific_branches
  - model_calls
  - semantic_promotions

# State the complete eligible set and exclusions before the first run. A rate
# over the successful subset is reported alongside the strict rate.
denominator: >
  All 127 E0106 residue rows. The 60 unique candidates, 66 ambiguous rows and
  one no-candidate row remain separately counted; no row may be dropped after
  normalization.

# State the independent behavioral or structural oracle. Self-consistency is
# not an oracle.
independent_oracle: >
  A separate byte/span traversal validates the canonical source hash, page
  partition, normalized candidate inventory, accepted subject-position forms,
  and the absence of candidate-specific branches. Negative controls mutate
  source bytes, page boundaries and the normalization rule inventory.

# Record versions needed to reproduce each run.
toolchain:
  record_in_run: true
  fields: [compiler, fo, poppler, oracle_versions]

# What result would disappoint you? If nothing would, this is not an experiment.
falsifiable_by: >
  Any candidate-specific branch, undocumented normalization, dropped residue
  row, source-span mismatch, accepted malformed control, model call or
  semantic promotion falsifies the bounded-pass claim.

# The condition that closes the experiment and the evidence it must report.
gate: >
  Run the final deterministic pass and its independent validator. Report all
  counts, the exact normalization rules, every accepted source citation and
  zero candidate-specific procedural exceptions and model calls.

# Script that turns runs into the tables and figures in report.md.
analysis: research/experiments/E0110-can-one-bounded-fortran-source-normalize/analyse.sh
