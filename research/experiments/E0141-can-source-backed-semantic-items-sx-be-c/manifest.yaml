id: "E0141"
title: "Deterministic semantic-items canonicalization"
question: >
  Can source-backed semantic-items SX be canonicalized deterministically
status: reported        # draft | running | reported | abandoned
opened: "2026-08-14"
closed: "2026-08-14"
reported_run: R000252
reported_runs: [R000252]

# Every commit the result depends on. Exact, not "main".
repos:
  lazy-fortran-new: "af0603e"
  standard-new: "5121aa5d79b988c1d0a62bae006288801449f64d"

# What goes in. Pinned artifacts by manifest name; profiles by ID.
inputs:
  standard: j3-24-007
  profile: standardir-semantic-v0

# The axes being varied. Omit the key if there is only one condition.
variables:
  records: [valid, duplicate_id, malformed_provenance, invalid_enum, preexisting_output]
  action: [validate, canonicalize, reject_transactionally]

# Explain whether model names form a controlled family ladder or separate
# controls. Pin revisions and runtime settings before the first run.
model_selection: "No model calls; deterministic typed semantic-items intake and export only."

# Name these before running anything. Choosing a metric after seeing the data
# is how an experiment becomes a demonstration.
metrics:
  - canonical output preserves insertion order and all provenance fields
  - duplicate identifiers remain representable and ambiguous queries remain ambiguous
  - malformed provenance and invalid enums are rejected
  - failed operations clear pre-existing output
  - full fo warning count

# State the complete eligible set and exclusions before the first run. A rate
# over the successful subset is reported alongside the strict rate.
denominator: "The fixed valid two-item witness and every declared malformed, duplicate, invalid-enum and stale-output control."

# State the independent behavioral or structural oracle. Self-consistency is
# not an oracle.
independent_oracle: "Independently authored expected canonical SX text plus an independent typed-table query of the emitted record; implementation self-consistency is not sufficient."

# Record versions needed to reproduce each run.
toolchain:
  record_in_run: true
  fields: [compiler, fo, poppler, oracle_versions]

# What result would disappoint you? If nothing would, this is not an experiment.
falsifiable_by: "Lost source fields or order, silently resolved duplicate identifiers, accepted malformed provenance or enums, retained stale output after failure, schema change, or nonzero fo warning."

# The condition that closes the experiment and the evidence it must report.
gate: "The canonicalizer agrees with the fixed SX and typed-table oracles for valid input, rejects every negative control transactionally, preserves the existing schema and passes full fo."

# Script that turns runs into the tables and figures in report.md.
analysis: research/experiments/E0141-can-source-backed-semantic-items-sx-be-c/analyse.sh
