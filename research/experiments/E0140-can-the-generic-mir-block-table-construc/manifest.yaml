id: "E0140"
title: "Constructed MIR block partitions"
question: >
  Can the generic MIR block table construct validated multi-block partitions
status: reported        # draft | running | reported | abandoned
opened: "2026-08-14"
closed: "2026-08-14"
reported_run: R000251
reported_runs: [R000251]

# Every commit the result depends on. Exact, not "main".
repos:
  lazy-fortran-new: "c565baf"
  ffc-new: "5ac3cef"

# What goes in. Pinned artifacts by manifest name; profiles by ID.
inputs:
  standard: not-applicable
  profile: mir-v0

# The axes being varied. Omit the key if there is only one condition.
variables:
  partitions: [single_block, two_block, empty_block, malformed]
  controls: [count_mismatch, zero_total, non_contiguous]

# Explain whether model names form a controlled family ladder or separate
# controls. Pin revisions and runtime settings before the first run.
model_selection: "No model calls; deterministic target-independent MIR table construction only."

# Name these before running anything. Choosing a metric after seeing the data
# is how an experiment becomes a demonstration.
metrics:
  - constructed block count and ordered ranges
  - coverage of the validated instruction body
  - single-block compatibility
  - malformed/count/output-clearing behavior
  - full fo warning count

# State the complete eligible set and exclusions before the first run. A rate
# over the successful subset is reported alongside the strict rate.
denominator: "Every declared partition shape over the fixed MIR witness body, including single-block compatibility and malformed/count controls."

# State the independent behavioral or structural oracle. Self-consistency is
# not an oracle.
independent_oracle: "An independently computed prefix-sum range table from the supplied block lengths; no implementation self-consistency claim is sufficient."

# Record versions needed to reproduce each run.
toolchain:
  record_in_run: true
  fields: [compiler, fo, poppler, oracle_versions]

# What result would disappoint you? If nothing would, this is not an experiment.
falsifiable_by: "Target/ABI dependency, changed mir-v0 behavior, incorrect prefix ranges, accepted empty or mismatched partitions, uncleared output, or nonzero fo warning."

# The condition that closes the experiment and the evidence it must report.
gate: "The constructor agrees with the independent prefix-sum oracle for every valid partition, rejects controls transactionally, preserves the existing single-block API and mir-v0 SX behavior, and passes full fo."

# Script that turns runs into the tables and figures in report.md.
analysis: research/experiments/E0140-can-the-generic-mir-block-table-construc/analyse.sh
