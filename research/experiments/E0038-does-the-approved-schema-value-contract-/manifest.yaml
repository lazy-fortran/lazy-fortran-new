id: "E0038"
title: "Approved schema-value contract"
question: >
  Does the approved schema-value contract survive deterministic validation and canonical writing?
status: draft            # draft | running | reported | abandoned
opened: "2026-08-12"
closed: ""

# Every commit the result depends on. Exact, not "main".
repos:
  lazy-fortran-new: "9d189d7"
  standard-new: "bb8756a"

# What goes in. Pinned artifacts by manifest name; profiles by ID.
inputs:
  standard: j3-24-007
  implementation: standard-new schema_ir, schema_codegen and schema_value
  specification: standard-new/specs/schema-v0.sxs
  fixtures: standard-new/test/test_schema_value.f90

# The axes being varied. Omit the key if there is only one condition.
variables: {}

# Explain whether model names form a controlled family ladder or separate
# controls. Pin revisions and runtime settings before the first run.
model_selection: "No model calls; deterministic schema parser, emitter and reference codec."

# Name these before running anything. Choosing a metric after seeing the data
# is how an experiment becomes a demonstration.
metrics:
  - text_policy_self_test_status
  - text_policy_status
  - schema_parser_status
  - schema_codegen_status
  - schema_value_status
  - runtime_checked_schema_value_status
  - generated_source_byte_identity_status
  - generated_formatting_status
  - full_pipeline_status
  - declaration_forms_checked
  - canonical_value_cases_checked
  - negative_value_cases_checked

# State the complete eligible set and exclusions before the first run. A rate
# over the successful subset is reported alongside the strict rate.
denominator: >
  The complete slice consists of the six schema declaration forms, one explicit
  sum payload and one payload-less sum variant, named record fields, list and
  optional values, bool/int/string primitives, nine fixed canonical outputs,
  three fixed invalid values, one regenerated source file and the standard-new
  full pipeline. Specialized generated readers and writers remain excluded.

# State the independent behavioral or structural oracle. Self-consistency is
# not an oracle.
independent_oracle: >
  The test compares fixed canonical SX lines written from the schema-value
  contract and expects three independently specified invalid-value diagnostics.
  The generated source is compared byte-for-byte with a fresh driver output.
  These expected values are separate from the implementation's emitted output.

# Record versions needed to reproduce each run.
toolchain:
  record_in_run: true
  fields: [compiler, fo, poppler, oracle_versions]

# What result would disappoint you? If nothing would, this is not an experiment.
falsifiable_by: >
  A payload type may be lost, a record field may be reordered, an optional or
  list boundary may be miswritten, a primitive may use noncanonical spelling,
  an invalid value may be accepted, regeneration may differ, or any quality
  gate may fail.

# The condition that closes the experiment and the evidence it must report.
gate: >
  Pin standard-new bb8756a, pass the parser, type emitter and value-codec
  tests with runtime checks, compare the regenerated source byte-for-byte,
  pass formatting, text-policy and full fo gates, and report all fixed-case
  counts.

# Script that turns runs into the tables and figures in report.md.
analysis: research/experiments/E0038-does-the-approved-schema-value-contract-/analyse.sh
