id: "E0047"
title: "Source-controlled punctuation boundary repair"
question: >
  Can source-controlled punctuation witnesses repair references whose comma or colon was absorbed into the StandardIR reference name without changing the source text?
status: draft            # draft | running | reported | abandoned
opened: "2026-08-12"
closed: ""

# Every commit the result depends on. Exact, not "main".
repos:
  lazy-fortran-new: "ec0b573"
  standard-new: "c6cd889"

# What goes in. Pinned artifacts by manifest name; profiles by ID.
inputs:
  standard: j3-24-007
  profile: "complete-core-punctuation-boundary-v0"
  syntax: E0013-R000002
  canonical_text: E0001-R000003
  punctuation_seed: research/experiments/E0047-can-source-controlled-punctuation-witnes/punctuation-seed.tsv

# The axes being varied. Omit the key if there is only one condition.
variables:
  punctuation_classes: [comma, colon]
  source_preservation: [lossless]

# Explain whether model names form a controlled family ladder or separate
# controls. Pin revisions and runtime settings before the first run.
model_selection: "No model calls. The repair operation and source witnesses are deterministic."

# Name these before running anything. Choosing a metric after seeing the data
# is how an experiment becomes a demonstration.
metrics:
  - source_repair_records
  - comma_repairs
  - colon_repairs
  - input_syntax_records
  - source_witness_matches
  - repair_replacements
  - repaired_input_sha256
  - repaired_grammar_sha256
  - independent_difference
  - negative_control

# State the complete eligible set and exclusions before the first run. A rate
# over the successful subset is reported alongside the strict rate.
denominator: >
  The eligible set is every reference token in the 522 complete-core StandardIR
  syntax records. The selected boundary slice contains the seven references
  whose source punctuation is attached to the ref name. All other references
  are unchanged and no Unicode normalization is attempted.

# State the independent behavioral or structural oracle. Self-consistency is
# not an oracle.
independent_oracle: >
  Each seed row is checked against an exact canonical-text source excerpt and
  exactly one attached reference in the pinned StandardIR input. The repaired
  input must contain one corresponding reference and token pair per row, keep
  522 syntax records, and reject a mutated punctuation witness.

# Record versions needed to reproduce each run.
toolchain:
  record_in_run: true
  fields: [compiler, fo, poppler, oracle_versions]

# What result would disappoint you? If nothing would, this is not an experiment.
falsifiable_by: >
  A source excerpt is absent, a selected reference is missing or duplicated,
  the repaired record count changes, a punctuation token differs from the
  source-controlled seed, the output grammar is not generated, or the
  negative control does not fail.

# The condition that closes the experiment and the evidence it must report.
gate: >
  Verify both input hashes and all seven canonical excerpts, apply exactly six
  comma and one colon repairs, preserve all 522 syntax records, generate the
  repaired grammar projection, and pass the independent boundary checks and
  negative control. This experiment does not resolve R401 or R403 semantics.

# Script that turns runs into the tables and figures in report.md.
analysis: research/experiments/E0047-can-source-controlled-punctuation-witnes/analyse.sh
