id: "E0173"
title: "Generic candidate-evidence coalescing for source boundaries"
question: >
  Can generic candidate-evidence coalescing produce one structural boundary
  per site without losing any contributing derivation?
status: running          # draft | running | reported | abandoned
opened: "2026-08-16"
closed: ""

# Every commit the result depends on. Exact, not "main".
repos:
  lazy-fortran-new: "4d1ed6109fe55814b141c2e282a7cbeb16c73f7a"
  standard-new: "03719c6ebea7dcfc3e88d2a0997ea8935209d235"

# What goes in. Pinned artifacts by manifest name; profiles by ID.
inputs:
  standard: j3-24-007
  profile: selected-program
  predecessor_experiment: E0171/R000435
  candidate_witness: .cache/runs/E0171/R000435-correspondence-replay/candidates.tsv
  candidate_witness_sha256: "6f9c0f416b76c502bec18cc27362587e0ce03ff0b40c0c1e1a38afd0410236e5"
  source_mapping: .cache/runs/E0171/R000435-correspondence-replay/mapping.tsv
  correspondence_trace: .cache/runs/E0171/R000435-correspondence-replay/correspondence.jsonl
  coalescer: research/experiments/E0171-can-current-standardir-grammar-projectio/coalesce-boundary-candidates.py

# The axes being varied. Omit the key if there is only one condition.
variables:
  projection: [structural-boundary-sites]
  evidence: [all-candidate-derivations]

# Explain whether model names form a controlled family ladder or separate
# controls. Pin revisions and runtime settings before the first run.
model_selection: "No model calls. The coalescer and its independent fixtures are deterministic."

# Name these before running anything. Choosing a metric after seeing the data
# is how an experiment becomes a demonstration.
metrics:
  - candidate_input_rows
  - structural_boundary_sites
  - duplicate_groups
  - duplicate_rows
  - evidence_rows
  - exact_duplicate_groups
  - trace_join_rows
  - trace_join_failures
  - model_calls

# State the complete eligible set and exclusions before the first run. A rate
# over the successful subset is reported alongside the strict rate.
denominator: >
  The complete 95-row candidate witness in E0171/R000435. Every candidate row
  must occur once in the evidence sidecar; only equal structural identities may
  share one output site. Non-candidate rows are retained by the generic
  projection when present, although this frozen input contains none.

# State the independent behavioral or structural oracle. Self-consistency is
# not an oracle.
independent_oracle: >
  The independently authored test-coalesce-boundary-candidates.py fixtures
  check distinct derivation preservation, non-candidate retention and exact
  duplicate rejection. The frozen R000435 correspondence trace is a separate
  structural join check; it cannot promote a target insertion or semantic fact.

# Record versions needed to reproduce each run.
toolchain:
  record_in_run: true
  fields: [compiler, fo, poppler, oracle_versions]

# What result would disappoint you? If nothing would, this is not an experiment.
falsifiable_by: >
  Any input candidate is dropped, an exact duplicate is accepted, a structural
  site has inconsistent evidence, an output site has no unique trace relation,
  or the expected source witness hash changes without a new experiment.

# The condition that closes the experiment and the evidence it must report.
gate: >
  Run the coalescer once on the pinned candidate witness, run its independent
  fixture test, and validate the output and evidence sidecar. The report must
  account for every input row and every structural duplicate, join each output
  site to exactly one source-node trace row, and make no target-insertion or
  semantic-promotion claim.

# Script that turns runs into the tables and figures in report.md.
analysis: >
  research/experiments/E0173-can-generic-candidate-evidence-coalescin/analyse.sh
  <run-directory>

run: research/experiments/E0173-can-generic-candidate-evidence-coalescin/run.sh
selftest: research/experiments/E0171-can-current-standardir-grammar-projectio/test-coalesce-boundary-candidates.py
