id: "E0155"
title: "Bidirectional comparison with LFortran's Bison parser"
question: >
  How does the corrected source-backed StandardIR compare bidirectionally with LFortran's pinned Bison parser grammar?
status: reported         # draft | running | reported | abandoned
opened: "2026-08-15"
closed: "2026-08-15"

# Every commit the result depends on. Exact, not "main".
repos:
  lazy-fortran-new: "65c7b69"
  standard-new: "83f055d"
  oracle-lfortran: "caf87b660f803148f000046392a5da803f9fc630"

# What goes in. Pinned artifacts by manifest name; profiles by ID.
inputs:
  standard: j3-24-007
  profile: complete-core-selected-program
  generated_run: E0154/R000314
  reference_file: src/lfortran/parser/parser.yy

# The axes being varied. Omit the key if there is only one condition.
variables:
  reference: [lfortran-pinned-parser-yy]
  direction: [standardir-to-reference, reference-to-standardir]

# Explain whether model names form a controlled family ladder or separate
# controls. Pin revisions and runtime settings before the first run.
model_selection: >
  No model calls. This is a manual and scripted comparison of a generated
  source-backed syntax projection with the permissively licensed LFortran
  parser grammar. No LFortran production is imported into StandardIR.

# Name these before running anything. Choosing a metric after seeing the data
# is how an experiment becomes a demonstration.
metrics:
  - generated_and_reference_rule_heads
  - source_alternatives_and_identity_coverage
  - generated_source_provenance_and_four_format_coverage
  - generated_and_reference_lexer_token_declarations
  - generated_and_reference_precedence_directives
  - generated_and_reference_parser_actions
  - generated_and_reference_conflict_budgets
  - explicit_rule_anchor_adjudications
  - bidirectional_advantage_classification

# State the complete eligible set and exclusions before the first run. A rate
# over the successful subset is reported alongside the strict rate.
denominator: >
  The 1,068 source alternatives in E0154/R000314 plus the complete pinned
  LFortran parser.yy grammar and its parser-control declarations. Every
  observed difference is classified as standardir_advantage,
  reference_advantage, scope_difference, or inconclusive; no difference is
  silently treated as a defect.

# State the independent behavioral or structural oracle. Self-consistency is
# not an oracle.
independent_oracle: >
  E0154/R000314's independent source-expression checker and ANTLR4, Bison and
  tree-sitter generation gates establish the generated artifact facts. Bison
  independently regenerates both the generated grammar and the pinned
  LFortran parser.yy. The reference grammar is comparison evidence, not an
  authority for StandardIR bodies.

# Record versions needed to reproduce each run.
toolchain:
  record_in_run: true
  fields: [compiler, fo, poppler, oracle_versions]

# What result would disappoint you? If nothing would, this is not an experiment.
falsifiable_by: >
  A claimed StandardIR source/provenance advantage is absent from the pinned
  generated file, a claimed reference advantage is absent from parser.yy or
  its Bison controls, a generated explicit rule anchor disagrees with its
  source witness, or the comparison fails to classify a listed difference.

# The condition that closes the experiment and the evidence it must report.
gate: >
  Report the scripted inventories and manually adjudicate the selected rule
  anchors R741, R843, R1103, R1307, R1315, R1416 and R1417, the selected-root
  boundary, lexical/runtime integration, actions, precedence, factoring and
  conflict policy. Record every result as bidirectional evidence. This gate
  does not claim parser language equivalence.

# Script that turns runs into the tables and figures in report.md.
analysis: >
  analyse.sh <E0154/R000314> <path-to-pinned-parser.yy> regenerates the
  inventories and Bison control result. findings.md records the manual anchor
  adjudications and the bidirectional classification.
