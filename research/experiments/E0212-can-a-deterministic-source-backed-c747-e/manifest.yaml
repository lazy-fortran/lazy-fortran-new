  source_page: 77
  source_span: "237572:183"
  standardir_rules: [R727, R732, R733]
  canonical_text: .cache/runs/E0001/R000003/j3-24-007.canonical.txt
  pages_index: .cache/runs/E0001/R000003/j3-24-007.pages.index
  standardir: .cache/runs/E0171/R000433-provenance-replay/standardir.sx

# The axes being varied. Omit the key if there is only one condition.
variables:
  derived_name_presence: [absent, present, unknown]
  definition_occurrence_cardinality: [zero, one, many, unknown]
  context: [derived-type-def, other, unknown]
  model_calls: [zero]

# Explain whether model names form a controlled family ladder or separate
# controls. Pin revisions and runtime settings before the first run.
model_selection: "No model execution; human-authored table and deterministic oracle only."

# Name these before running anything. Choosing a metric after seeing the data
# is how an experiment becomes a demonstration.
metrics:
  - complete 36-state typed product
  - ACCEPTED/REJECTED/UNRESOLVED outcome counts
  - mutation controls rejected
  - source/page/StandardIR identity
  - model calls
  - semantic promotions

# State the complete eligible set and exclusions before the first run. A rate
# over the successful subset is reported alongside the strict rate.
denominator: >-
  The complete 3-by-4-by-3 product of the typed candidate fields is required.
  Every state appears exactly once, and twelve source, contract and semantic
  identity mutations are retained as negative controls.

# State the independent behavioral or structural oracle. Self-consistency is
# not an oracle.
independent_oracle: >-
  The validator independently checks source hashes, StandardIR witnesses,
  canonical semantic-item output, the complete state product, the mutation
  controls and a separately authored HUMAN expected-outcome table. No model
  output is consumed.

# Record versions needed to reproduce each run.
toolchain:
  record_in_run: true
  fields: [compiler, fo, poppler, oracle_versions]

# What result would disappoint you? If nothing would, this is not an experiment.
falsifiable_by: >-
  Any missing state, changed expected table, accepted mutation, changed source
  binding, nonzero model call or semantic promotion fails the experiment.

# The condition that closes the experiment and the evidence it must report.
gate: >-
  From a clean checkout, run tests/e2e/run-m3-c747.sh --fresh. The validator,
  source and contract gates, semantic canonicalization, committed trace and
  final clean state must all pass.

# Script that turns runs into the tables and figures in report.md.
analysis: >-
  Controller-owned bounded C747 replay report
  artifacts/reports/M3/m3-c747-source-backed-v0.md

