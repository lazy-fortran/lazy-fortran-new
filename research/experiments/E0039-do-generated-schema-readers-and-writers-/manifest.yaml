id: "E0039"
title: "Generated schema reader and writer differential"
question: >
  Do generated schema readers and writers agree with the reference codec and fixed SX values?
status: draft            # draft | running | reported | abandoned
opened: "2026-08-12"
closed: ""

# Every commit the result depends on. Exact, not "main".
repos:
  lazy-fortran-new: "5f5301c"
  standard-new: "b52c1a2"

# What goes in. Pinned artifacts by manifest name; profiles by ID.
inputs:
  standard: j3-24-007
  implementation: standard-new generated schema APIs and schema_value_runtime
  specification: standard-new/specs/schema-v0.sxs
  fixtures: standard-new/test/test_schema_generated_api.f90

# The axes being varied. Omit the key if there is only one condition.
variables: {}

# Explain whether model names form a controlled family ladder or separate
# controls. Pin revisions and runtime settings before the first run.
model_selection: "No model calls; generated Fortran APIs and deterministic reference codec."

# Name these before running anything. Choosing a metric after seeing the data
# is how an experiment becomes a demonstration.
metrics:
  - text_policy_self_test_status
  - text_policy_status
  - schema_parser_status
  - schema_codegen_status
  - generated_api_status
  - runtime_checked_generated_api_status
  - generated_source_byte_identity_status
  - generated_formatting_status
  - full_pipeline_status
  - canonical_api_cases_checked
  - negative_api_cases_checked

# State the complete eligible set and exclusions before the first run. A rate
# over the successful subset is reported alongside the strict rate.
denominator: >
  The complete slice consists of ten generated canonical API cases covering
  records, both sum variants, lists, both optional states, enums, booleans,
  integers and strings, two invalid reader cases, the generic reference codec,
  one regenerated source file and the standard-new full pipeline. Generated
  validators, visitors, equality, hashing, printers and complete architecture
  wiring remain excluded.

# State the independent behavioral or structural oracle. Self-consistency is
# not an oracle.
independent_oracle: >
  The generated test compares fixed expected SX bytes with fresh output and
  compares each output with schema_value's independently implemented generic
  codec. It reads fixed SX trees back through the generated readers and checks
  typed fields and variants. Two malformed trees have fixed diagnostics.

# Record versions needed to reproduce each run.
toolchain:
  record_in_run: true
  fields: [compiler, fo, poppler, oracle_versions]

# What result would disappoint you? If nothing would, this is not an experiment.
falsifiable_by: >
  A generated API may emit different bytes, fail to read a fixed tree, disagree
  with the generic codec, lose a sum payload or optional state, accept a
  malformed tree, fail source regeneration or fail any quality gate.

# The condition that closes the experiment and the evidence it must report.
gate: >
  Pin standard-new b52c1a2, pass parser, generator and generated-API tests with
  runtime checks, compare regenerated source byte-for-byte, pass formatting,
  text-policy and full fo gates, and report all fixed-case counts.

# Script that turns runs into the tables and figures in report.md.
analysis: research/experiments/E0039-do-generated-schema-readers-and-writers-/analyse.sh
