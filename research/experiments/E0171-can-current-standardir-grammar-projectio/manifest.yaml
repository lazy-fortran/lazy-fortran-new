id: "E0171"
title: "Evidence-level audit of current StandardIR grammar projections"
question: >
  What evidence does the current source-backed StandardIR projection provide
  at source-fidelity, target-well-formedness, transformation, and reference-
  comparison levels, and which language-quality claims remain unproved?
status: running           # draft | running | reported | abandoned
opened: "2026-08-15"

# Every commit the result depends on. Exact, not "main".
repos:
  lazy-fortran-new: "361468f"
  standard-new: "fb6590c4885a38b0106f63112f6e024c20b927b5"
  oracle-standard: "962ee30acd806ada940beb1bf8baa95fcb7e814c"
  oracle-kaby76: "ba846bbdea9df98428d094137d2adbe156f86207"
  oracle-lfortran: "caf87b660f803148f000046392a5da803f9fc630"
  oracle-flang: "cff4ca2e51f89c992d8a1b6ce1067846ba680e2e"

# What goes in. Pinned artifacts by manifest name; profiles by ID.
inputs:
  standard: j3-24-007
  profile: selected-program
  generated_run: .cache/runs/E0164/R000385-four-format-regeneration
  profile_policy: research/experiments/E0171-can-current-standardir-grammar-projectio/profile-policy.tsv
  source_audit: .cache/runs/E0157/R000354
  statement_boundary_anchors: research/experiments/E0171-can-current-standardir-grammar-projectio/statement-boundary-anchors.tsv
  lexical_layout_contract: contracts/lexical-layout-v0.sxs
  house_antlr: ../standard/grammars/src/Fortran2023Parser.g4
  kaby76_antlr: ../kaby76-fortran/comp/Fortran2023Parser.g4
  lfortran_bison: .cache/runs/E0162/reference/parser.yy
  flang_parser: ../llvm-project/flang/lib/Parser/Fortran-parsers.cpp
  reference_sha256:
    house_antlr: d8bb1b600e30be245a2d8c87e32660a3b4ad83aa94728cf50cebf37c1e8b67ce
    kaby76_antlr: 8f1f55ee4f61f82d732d41bd9452917bc1ce293f64e19615649a5170fb2705a8
    lfortran_bison: 112ef0ce5078ccec630a893bc51b92232348c37742b1451c833928a422907936
    flang_parser: abb4126d6c0c4e516628ba9836c428f83f0ccf883439e67cbfdd061aa42d83b9

# The axes being varied. Omit the key if there is only one condition.
variables:
  formats: [ebnf, antlr4, bison, tree-sitter]
  references: [house-antlr4, kaby76-antlr4, lfortran-bison, flang-parser]
  comparison: [head-inventory, canonical-heads, source-lineage, bison-diagnostics, evidence-level]

# Explain whether model names form a controlled family ladder or separate
# controls. Pin revisions and runtime settings before the first run.
model_selection: >
  No model calls. Luna may independently review the resulting inventory, but
  no model is a source or language oracle.

# Name these before running anything. Choosing a metric after seeing the data
# is how an experiment becomes a demonstration.
metrics:
  - source_alternative_coverage
  - generated_head_counts
  - canonical_head_set_differences
  - source_lineage_set_equality
  - lexer_contract_and_generator_status
  - reference_head_counts
  - bison_shift_reduce_conflicts
  - bison_reduce_reduce_conflicts
  - useless_rules_and_nonterminals
  - transformation_witness_lineage_coverage_per_format
  - classified_discrepancies
  - evidence_level_claims

# State the complete eligible set and exclusions before the first run. A rate
# over the successful subset is reported alongside the strict rate.
denominator: >
  Every source-backed alternative and generated target head in the current
  selected run, every head in the four pinned references, every source-lineage
  row and every Bison diagnostic. Head counts are structural evidence, not a
  language-equivalence denominator; reference-only extensions and factoring
  are retained and classified.

# State the independent behavioral or structural oracle. Self-consistency is
# not an oracle.
independent_oracle: >
  The pinned source-expression, lexical and parser-generator gates from R000385,
  an independent inventory parser, SHA-256-pinned reference files, Bison's own
  state diagnostics and counterexamples, and the current E0149 correspondence
  ledger. No reference production body is copied into StandardIR or used as a
  semantic oracle. This experiment does not claim language equivalence; that
  requires a separate independent recognizer and bounded positive/negative
  corpus gate.

# Record versions needed to reproduce each run.
toolchain:
  record_in_run: true
  fields: [compiler, fo, poppler, oracle_versions]

# What result would disappoint you? If nothing would, this is not an experiment.
falsifiable_by: >
  Any current generated format loses source lineage, differs from its claimed
  canonical source-head projection without a target disposition, fails its
  declared generator gate, uses an unpinned reference, leaves a concrete
  discrepancy unclassified, or is described as behaviorally equivalent on
  structural evidence alone. A lower conflict count alone is not success.

# The condition that closes the experiment and the evidence it must report.
gate: >
  Reproduce the current four-format/reference inventory and hashes, show the
  source-backed gates pass, classify every observed structural discrepancy as
  normative defect, generic target lowering, reference-only engineering,
  expected factoring or unresolved, and retain a machine-readable witness for
  each class. Report the evidence level for every conclusion. This closes only
  the structural inventory; it does not close language equivalence, parse-tree
  equivalence, lexer completeness or semantic coverage.

# Script that turns runs into the tables and figures in report.md.
analysis: >
  Run
  research/experiments/E0162-can-all-four-standardir-grammar-projecti/analyse.py
  with explicit left/right labels, the current generated run and corrected
  E0157 audit, the four pinned reference files and an ignored output directory.
  If the same run is supplied twice this is an identity replay, not a
  candidate comparison. Run Bison independently using the producer-emitted
  selected profile and preserve state, solved-conflict and counterexample
  reports. Do not manufacture a different root by editing the generated file.
  Validate a producer-emitted transformation witness with
  validate-transformation-witness.py <target> <witness> <summary>; its lineage
  set must equal the target's source-lineage set before this gate is green.
  Source preflight, identity and lexical gates run before grammar generation.
  After the producer emits the four artifacts, validate the selected profile
  before invoking any parser generator or behavioral oracle:
  python3 validate-profile-contract.py <run> profile-policy.tsv <output>.
  The validator must reject implicit or wrong entry rules; only then may the
  parser generators and behavioral oracles run. Normalize the resulting
  Bison counterexample TSV and Tree-sitter diagnostic with
  normalise-conflict-witness.py; this produces an unclassified evidence table,
  not a conflict policy.

replays:
  - run: R000387
    mode: preliminary-structural-inventory
    superseded_by: R000388
  - run: R000388
    mode: identity-replay-evidence-level-inventory
    left_label: identity-replay-a
    right_label: identity-replay-b
    report: .cache/runs/E0171/R000388-evidence-level-inventory
  - run: R000393
    mode: selected-bison-counterexample-inventory
    report: .cache/runs/E0171/R000393-bison-evidence-audit
  - run: R000399
    lazy-fortran-new: "f89756b"
    standard-new: "2c2cc7f55640304769c431c0bfdc13961aad2daf"
    mode: producer-emitted-transformation-witness-closure
    report: .cache/runs/E0171/R000399-transformation-witness-fixed
  - run: R000400
    mode: profile-entry-eof-negative-control
    report: .cache/runs/E0171/R000400-profile-contract-negative-2/target-profile.tsv
    result: expected-failure-on-pre-fix-R000385
  - run: R000401
    standard-new: "ca210a8"
    mode: selected-profile-and-parser-oracle-replay
    report: .cache/runs/E0171/R000401-profile-contract-fixed
    result: tree-sitter-nullable-rule-failure
  - run: R000402
    standard-new: "4ffa9859a6af551a9ceb1d45bc5744a1522e135e"
    mode: selected-profile-and-nullable-treesitter-replay
    report: .cache/runs/E0171/R000402-nullable-lowering-fixed
    result: tree-sitter-unresolved-conflict
  - run: R000403
    standard-new: "4ffa9859a6af551a9ceb1d45bc5744a1522e135e"
    mode: selected-profile-and-four-format-witness-replay
    report: .cache/runs/E0171/R000403-witness-gated-replay
    result: all-witnesses-pass-tree-sitter-unresolved-conflict
  - run: R000404
    standard-new: "4ffa9859a6af551a9ceb1d45bc5744a1522e135e"
    mode: clean-committed-selected-profile-and-four-format-witness-replay
    report: .cache/runs/E0171/R000404-clean-witness-replay
    result: all-witnesses-pass-tree-sitter-unresolved-conflict
  - run: R000405
    standard-new: "4ffa9859a6af551a9ceb1d45bc5744a1522e135e"
    mode: normalized-selected-conflict-witness-inventory
    report: .cache/runs/E0171/R000404-clean-witness-replay/conflict-witnesses.tsv
    result: superseded-by-R000406-invalid-lab-pin
  - run: R000406
    standard-new: "4ffa9859a6af551a9ceb1d45bc5744a1522e135e"
    mode: corrected-normalized-selected-conflict-witness-inventory
    report: .cache/runs/E0171/R000404-clean-witness-replay/conflict-witnesses.tsv
    result: unclassified-lexer-profile-interaction-candidate
  - run: R000407
    mode: normative-statement-boundary-anchor-replay
    report: research/experiments/E0171-can-current-standardir-grammar-projectio/statement-boundary-anchors.tsv
    result: source-anchors-confirm-lexer-contract-requirement

result: >
  R000388 passes source-backed and generator structural gates and reproduces
  the same inventory under two explicitly named replay roles. It establishes
  structural evidence only. It does not establish language equivalence,
  parse-tree equivalence, complete lexer behavior, or semantic coverage.

latest_replay: >
  R000404 is the clean committed replay proving the corrected harness requests and validates one
  producer-emitted transformation witness for each generated format: all four
  cover 1,068 source lineages. Source, lexical, explicit profile and witness
  gates pass; ANTLR4 and Bison pass; tree-sitter still reports the unresolved
  SAVE/LETTER conflict after nullable lowering. Generic conflict policy,
  bounded language behavior, parse-tree equivalence and lexer completeness
  remain open.

remaining_gates:
  - standard-new must consume the pinned lexical-layout-v0 contract
  - generic tree-sitter conflict policy must pass without source loss
  - lexer/runtime statement-termination and keyword/name behavior must be
    represented before adjudicating the SAVE/LETTER witness
  - independent bounded language behavior for each declared profile
  - Bison counterexample classification and ambiguity policy
  - reference-only extension inventory with corpus witnesses
