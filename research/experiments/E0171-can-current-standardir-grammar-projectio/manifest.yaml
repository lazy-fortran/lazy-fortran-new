result: >
  The source boundary-plan and raw source-path subgates pass, but the selected
  source-target correspondence gate remains open. R000435 finds one trace row
  for each of 95 input rows while also exposing 24 duplicate structural-key
  groups (71 distinct structural keys). The selected rows are 86 mapped and
  nine explicit rule-deduplicate suppressions; this is not a one-to-one set of
  95 distinct source boundaries. The trace has 4,871 rows, including 85
  unsupported and 717 suppressed rows at whole-trace scope. Candidate identity
  must be preserved or generically coalesced before target insertion. Structural
  evidence is not language equivalence, parse-tree equivalence, complete lexer
  behavior or semantic coverage.

latest_replay: >
  R000435 is the latest mechanical replay and R000436 its independent Luna
  review. At `standard-new` commit `30c973f629fbfc68d756ec4824b2696021689222`,
  the correspondence witness has 4,871 deterministic JSONL rows and the
  exact 37-field contract. All 95 selected input rows find one trace row, but
  they contain 24 duplicate structural-key groups and only 71 distinct
  structural keys. The selected trace has 86 mapped rows and nine explicit
  rule-deduplicate suppressions; the full trace has 4,069 mapped, 717
  suppressed and 85 unsupported rows. The corrected audit fails closed on
  duplicate candidate keys. The review supports only a per-row deterministic
  lookup claim; candidate kind is not yet carried through the trace. The next
  gate is D0119: preserve candidate identity or coalesce equal structural
  boundaries while retaining all derivation evidence. Parser generators,
  separator insertion and model campaigns remain blocked.
  R000423 is the latest production projection gate before boundary mapping. The
  `standard-new`
  statement-sequence CLI at commit `4c2d8c2` agrees byte-for-byte with the
  95-row R000420 source-evidence witness: zero rows are missing or extra, and
  all source fields and canonical expression paths match. The clean full `fo`
  pipeline passes 45 tests with zero warnings. R000420 remains the latest
  source-evidence replay. It derives 95 statement-sequence
  candidates from the StandardIR expression graph and the v2 suffix fact,
  including compound and adjacent sequence items, with zero unsupported shapes
  and full per-row source document/clause/page/byte/hash lineage. R000426 is
  the latest independent source-level behavior oracle: all nine generated
  cases agree across GNU Fortran, Flang and LFortran. R000428 is the latest
  production boundary-plan gate: the typed plan validates all witness kinds,
  lineage, strict hash shape and negative controls at `standard-new` `107d7a3`,
  and generic exporters use neutral identities rather than claiming a complete
  Fortran profile. It explicitly reports that insertion is not supported yet.
  It does not yet prove that a generated lexer/runtime consumes the witness.
  D0112 governs the plan and D0113 governs truthful identity and numeric source
  ordering; target exporters may not insert separators directly from the raw
  witness. R000411 is
  the latest source-evidence and v2 projection replay: it extracts ten facts,
  including the source-backed statement-class selector, and projects them
  through `standard-new` at the pinned commit. E0157/R000371 and E0158/R000372
  already close the corrected cross-format audit and authoritative PDF-fidelity
  prerequisites for the same current source hash. R000410 remains a v1
  historical replay, while R000408 is retained as a v0 projection gate; D0108
  and D0109 record why both are not authoritative. The remaining gates are
  target lexer/runtime behavior, source-backed boundary consumption, conflict
  classification, parse-tree equivalence and complete bounded language
  behavior. No model or semantic campaign is permitted before those
  deterministic target gates close.

remaining_gates:
  - the nine selected rule-deduplicate suppressions must point explicitly to
    their retained target occurrence before any target separator insertion
  - the target token stream and later source lexer must consume the pinned
    lexical-layout-v2 contract and the audited statement-sequence witness
  - target runtime positive/negative behavior must agree with the source
    oracle R000426; the current fortfront-new runtime is token-supplied and is
    not yet evidence of raw-source lexer behavior
  - generic tree-sitter conflict policy must pass without source loss
  - lexer/runtime statement-termination and keyword/name behavior must be
    independently witnessed before adjudicating the SAVE/LETTER witness
  - independent bounded language behavior for each declared profile
  - Bison counterexample classification and ambiguity policy
  - reference-only extension inventory with corpus witnesses
