# The axes being varied. Omit the key if there is only one condition.
variables:
  formats: [ebnf, antlr4, bison, tree-sitter]
  references: [house-antlr4, kaby76-antlr4, lfortran-bison, flang-parser]
  comparison: [head-inventory, canonical-heads, source-lineage, bison-diagnostics, evidence-level]

# Explain whether model names form a controlled family ladder or separate
# controls. Pin revisions and runtime settings before the first run.
model_selection: >
  No model calls. Luna may independently review the resulting inventory, but
  no model is a source or language oracle.

# Name these before running anything. Choosing a metric after seeing the data
# is how an experiment becomes a demonstration.
metrics:
  - source_alternative_coverage
  - generated_head_counts
  - canonical_head_set_differences
  - source_lineage_set_equality
  - lexer_contract_and_generator_status
  - reference_head_counts
  - bison_shift_reduce_conflicts
  - bison_reduce_reduce_conflicts
  - useless_rules_and_nonterminals
  - transformation_witness_lineage_coverage_per_format
  - classified_discrepancies
  - evidence_level_claims

# State the complete eligible set and exclusions before the first run. A rate
# over the successful subset is reported alongside the strict rate.
denominator: >
  Every source-backed alternative and generated target head in the current
  selected run, every head in the four pinned references, every source-lineage
  row and every Bison diagnostic. Head counts are structural evidence, not a
  language-equivalence denominator; reference-only extensions and factoring
  are retained and classified.

# State the independent behavioral or structural oracle. Self-consistency is
# not an oracle.
independent_oracle: >
  The pinned source-expression, lexical and parser-generator gates from R000385,
  an independent inventory parser, SHA-256-pinned reference files, Bison's own
  state diagnostics and counterexamples, and the current E0149 correspondence
  ledger. No reference production body is copied into StandardIR or used as a
  semantic oracle. This experiment does not claim language equivalence; that
  requires a separate independent recognizer and bounded positive/negative
  corpus gate.

# Record versions needed to reproduce each run.
toolchain:
  record_in_run: true
  fields: [compiler, fo, poppler, oracle_versions]

# What result would disappoint you? If nothing would, this is not an experiment.
falsifiable_by: >
  Any current generated format loses source lineage, differs from its claimed
  canonical source-head projection without a target disposition, fails its
  declared generator gate, uses an unpinned reference, leaves a concrete
  discrepancy unclassified, or is described as behaviorally equivalent on
  structural evidence alone. A lower conflict count alone is not success.

# The condition that closes the experiment and the evidence it must report.
gate: >
  Reproduce the current four-format/reference inventory and hashes, show the
  source-backed gates pass, classify every observed structural discrepancy as
  normative defect, generic target lowering, reference-only engineering,
  expected factoring or unresolved, and retain a machine-readable witness for
  each class. Report the evidence level for every conclusion. This closes only
  the structural inventory; it does not close language equivalence, parse-tree
  equivalence, lexer completeness or semantic coverage.

# Script that turns runs into the tables and figures in report.md.
analysis: >
  Run
  research/experiments/E0162-can-all-four-standardir-grammar-projecti/analyse.py
  with explicit left/right labels, the current generated run and corrected
  E0157 audit, the four pinned reference files and an ignored output directory.
  If the same run is supplied twice this is an identity replay, not a
  candidate comparison. Run Bison independently using the producer-emitted
  selected profile and preserve state, solved-conflict and counterexample
  reports. Do not manufacture a different root by editing the generated file.
  Validate a producer-emitted transformation witness with
  validate-transformation-witness.py <target> <witness> <summary>; its lineage
  set must equal the target's source-lineage set before this gate is green.
  Source preflight, identity and lexical gates run before grammar generation.
  After the producer emits the four artifacts, validate the selected profile
  before invoking any parser generator or behavioral oracle:
  python3 validate-profile-contract.py <run> profile-policy.tsv <output>.
  The validator must reject implicit or wrong entry rules; only then may the
  parser generators and behavioral oracles run. Normalize the resulting
  Bison counterexample TSV and Tree-sitter diagnostic with
  normalise-conflict-witness.py; this produces an unclassified evidence table,
  not a conflict policy.

