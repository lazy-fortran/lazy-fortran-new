id: "E0171"
title: "Evidence-level audit of current StandardIR grammar projections"
question: >
  What evidence does the current source-backed StandardIR projection provide
  at source-fidelity, target-well-formedness, transformation, and reference-
  comparison levels, and which language-quality claims remain unproved?
status: running           # draft | running | reported | abandoned
opened: "2026-08-15"

# Every commit the result depends on. Exact, not "main".
