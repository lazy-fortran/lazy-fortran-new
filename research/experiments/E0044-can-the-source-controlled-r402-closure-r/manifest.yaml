id: "E0044"
title: "Source-controlled R402 suffix-name closure"
question: >
  Can the source-controlled R402 closure resolve every absent suffix-name term without overriding an explicit StandardIR definition?
status: draft            # draft | running | reported | abandoned
opened: "2026-08-12"
closed: ""

# Every commit the result depends on. Exact, not "main".
repos:
  lazy-fortran-new: "cf2e7b6"
  standard-new: "c6cd889"

# What goes in. Pinned artifacts by manifest name; profiles by ID.
inputs:
  standard: j3-24-007
  profile: "complete-core-r402-v0"
  syntax: E0013-R000002
  unresolved_audit: E0022-R000001
  base_resolution_seed: research/experiments/E0043-can-a-source-controlled-d0019-resolution/seed.tsv
  alias_pattern: research/experiments/E0044-can-the-source-controlled-r402-closure-r/alias-pattern.tsv

# The axes being varied. Omit the key if there is only one condition.
variables:
  resolution_pattern: [suffix-name]
  explicit_definition_guard: [required]

# Explain whether model names form a controlled family ladder or separate
# controls. Pin revisions and runtime settings before the first run.
model_selection: "No model calls. R402 is applied mechanically to the pinned unresolved audit."

# Name these before running anything. Choosing a metric after seeing the data
# is how an experiment becomes a demonstration.
metrics:
  - resolution_records
  - alias_records
  - lexical_class_records
  - metavariable_records
  - semantic_role_records
  - unresolved_records
  - disputed_records
  - source_hash_matches
  - explicit_definition_conflicts
  - alias_projection_records
  - composite_syntax_witnesses
  - composite_input_sha256
  - composite_grammar_sha256
  - independent_difference
  - negative_control

# State the complete eligible set and exclusions before the first run. A rate
# over the successful subset is reported alongside the strict rate.
denominator: >
  The eligible set is the 181 distinct unresolved names in E0022-R000001.
  The selected R402 closure is the subset whose source term ends in -name.
  The closure contains 49 terms. The four E0043 lexical/metanotation witnesses
  and the defined underscore witness remain in the output for comparison.
  Comparison-grammar presence cannot change the selected set or resolution
  class.

# State the independent behavioral or structural oracle. Self-consistency is
# not an oracle.
independent_oracle: >
  An independent traversal reconstructs the expected suffix-name closure from
  the audit and compares it with typed alias records. A separate StandardIR
  left-hand-side inventory checks that no selected term has an explicit
  definition. The canonical text is checked for the R401--R402 source witness,
  and a controlled mutation of module-name must fail validation.

# Record versions needed to reproduce each run.
toolchain:
  record_in_run: true
  fields: [compiler, fo, poppler, oracle_versions]

# What result would disappoint you? If nothing would, this is not an experiment.
falsifiable_by: >
  A selected suffix-name term has an explicit StandardIR definition, the typed
  alias set differs from the independently reconstructed closure, an alias
  target is not name, a source hash or occurrence is missing, an audit term is
  dropped or duplicated, or the negative control does not fail.

# The condition that closes the experiment and the evidence it must report.
gate: >
  Verify all pinned input hashes, produce one typed record for every audit name
  plus the defined underscore witness, classify exactly 49 suffix-name terms as
  R402 aliases to name, preserve the E0043 witnesses and 128 unresolved terms,
  derive the larger alias-only composite slice, emit its grammar projection,
  and pass the independent closure and negative-control checks. This experiment
  does not claim a complete parser input.

# Script that turns runs into the tables and figures in report.md.
analysis: research/experiments/E0044-can-the-source-controlled-r402-closure-r/analyse.sh
