# What result would disappoint you? If nothing would, this is not an experiment.
falsifiable_by: >-
  Any changed pinned input, promoted-contract list, residual count, first row,
  source/page/StandardIR binding, selected property, model call or semantic
  promotion fails the selection.

# The condition that closes the experiment and the evidence it must report.
