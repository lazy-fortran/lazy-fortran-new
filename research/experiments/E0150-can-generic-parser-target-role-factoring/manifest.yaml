id: "E0150"
title: ""
question: >
  Can generic parser-target role factoring reduce StandardIR ambiguity while preserving source roles and provenance?
status: running          # draft | running | reported | abandoned
opened: "2026-08-15"
closed: ""

# Every commit the result depends on. Exact, not "main".
repos:
  lazy-fortran-new: "14c6e890d18165cee98ad034643b0a3174a2f94e"
  standard-new: "c955c23bd57a078c8fceb30de1df101280b25e2c"
  oracle-lfortran: "caf87b660f803148f000046392a5da803f9fc630"

# What goes in. Pinned artifacts by manifest name; profiles by ID.
inputs:
  standard: j3-24-007
  profile: complete-core-selected-program
  standardir_run: E0147/R000022
  standardir_bison: fortran2023-program.y
  lfortran_path: src/lfortran/parser/parser.yy
  lfortran_artifact: lfortran-parser-yy

# The axes being varied. Omit the key if there is only one condition.
variables:
  factor_mode: [none, all-single-unit-aliases, representative-family]
  target: [bison]

# Explain whether model names form a controlled family ladder or separate
# controls. Pin revisions and runtime settings before the first run.
model_selection: >
  No model is used. The factorizer is deterministic and receives no LFortran
  production bodies. LFortran is a pinned parser-engineering reference only.

# Name these before running anything. Choosing a metric after seeing the data
# is how an experiment becomes a demonstration.
metrics:
  - source_production_heads
  - source_alternatives
  - candidate_unit_aliases
  - factored_unit_aliases
  - merged_role_families
  - bison_status
  - shift_reduce_conflicts
  - reduce_reduce_conflicts
  - useless_nonterminals
  - useless_rules
  - provenance_mapping_rows
  - unmapped_factored_aliases

# State the complete eligible set and exclusions before the first run. A rate
# over the successful subset is reported alongside the strict rate.
denominator: >
  Every production head and alternative in E0147/R000019's selected Bison
  grammar. Every factored alias gets one deterministic mapping row; aliases
  that cannot be safely factored remain in the target and are counted.

# State the independent behavioral or structural oracle. Self-consistency is
# not an oracle.
independent_oracle: >
  Bison 3.8.2 replay of the unmodified and factored outputs, the selected-root
  source/provenance inventory, and the pinned LFortran Bison replay. Bison
  acceptance and conflict counts are target diagnostics, not language
  equivalence.

# Record versions needed to reproduce each run.
toolchain:
  record_in_run: true
  fields: [compiler, fo, poppler, oracle_versions]

# What result would disappoint you? If nothing would, this is not an experiment.
falsifiable_by: >
  The factorized grammar fails Bison, loses a source alias mapping, changes a
  target body without a deterministic mapping, or increases the conflict and
  useless-rule metrics without a documented reason. A lower conflict count
  without complete role/provenance mapping is not a success.

# The condition that closes the experiment and the evidence it must report.
gate: >
  The deterministic factorizer emits a valid Bison grammar and a complete
  alias/provenance mapping without editing StandardIR. The report compares
  both targets and retains any regression. This experiment may establish a
  useful target transformation but cannot close M2 without independent
  language-preservation witnesses.

# Script that turns runs into the tables and figures in report.md.
analysis: >
  Run
  research/experiments/E0150-can-generic-parser-target-role-factoring/analyse.sh
  <run-directory> [REPRESENTATIVE]. It writes only to the ignored run
  directory and produces transformed grammar, alias mapping, Bison logs and
  summary metrics. The optional representative selects one mechanically
  discovered alias family; no Fortran names are encoded in the script.
