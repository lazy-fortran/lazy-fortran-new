# Explain whether model names form a controlled family ladder or separate
# controls. Pin revisions and runtime settings before the first run.
model_selection: "No model execution; retained model-origin rows are input only."

# Name these before running anything. Choosing a metric after seeing the data
# is how an experiment becomes a demonstration.
metrics:
  - residual row count
  - residual status partition
  - first residual row key
  - semantic promotions
  - model calls

# State the complete eligible set and exclusions before the first run. A rate
# over the successful subset is reported alongside the strict rate.
denominator: >-
  Every E0181/R000002 witness row whose status is disputed or unwitnessed and
  whose constraint_id is outside the exact seventeen-entry promoted set.

# State the independent behavioral or structural oracle. Self-consistency is
# not an oracle.
independent_oracle: >-
  The exact jq promoted-contract partition in TASK_POOL.yaml, independently
  recomputed from the pinned witnesses JSONL; source lines, page boundaries
  and StandardIR rows are checked from the pinned artifacts.

# Record versions needed to reproduce each run.
toolchain:
  record_in_run: true
  fields: [compiler, fo, poppler, oracle_versions]

# What result would disappoint you? If nothing would, this is not an experiment.
falsifiable_by: >-
  The experiment fails if the exact partition is not 154 rows with 88
  disputed, 66 unwitnessed and C726@1 first, if the source or StandardIR pins
  differ, or if any model call or semantic promotion occurs.

# The condition that closes the experiment and the evidence it must report.
gate: >-
  Run the exact jq verifier, source extraction and StandardIR inspection
  commands in the selection report; retain the result and update the central
  task only on exact agreement.

# Script that turns runs into the tables and figures in report.md.
analysis: >-
  artifacts/reports/M3/m3-core0-next-property-selection-v5.md and the
  corresponding append-only research/runs/2026-08.jsonl record.

