id: "E0131"
title: "Batch source-record normalization into TargetIR"
question: >
  Can existing RISC-V and AArch64 source records normalize into one transactional TargetIR table batch?
status: reported        # draft | running | reported | abandoned
opened: "2026-08-14"
closed: "2026-08-14"
reported_run: R000239
reported_runs: [R000239]

# Every commit the result depends on. Exact, not "main".
repos:
  lazy-fortran-new: c86ed6c
  fortback-new: 576c7a4b55aa772e0723b274333dcf411f35071d

# What goes in. Pinned artifacts by manifest name; profiles by ID.
inputs:
  standard: j3-24-007
  profile: targetir-source-batch-witnesses

# The axes being varied. Omit the key if there is only one condition.
variables:
  source_families: [riscv_i, aarch64, mixed]
  controls: [malformed_record, wrong_target, capacity, output_clearing]

# Explain whether model names form a controlled family ladder or separate
# controls. Pin revisions and runtime settings before the first run.
model_selection: "none; deterministic source normalization only"

# Name these before running anything. Choosing a metric after seeing the data
# is how an experiment becomes a demonstration.
metrics:
  - normalized_record_count
  - source_order_preserved
  - source_provenance_preserved
  - targetir_table_validation
  - failure_transactionality
  - fo_warnings

# State the complete eligible set and exclusions before the first run. A rate
# over the successful subset is reported alongside the strict rate.
denominator: "Every source record in the fixed RISC-V I-format and AArch64 witness batches, plus all declared malformed, wrong-target and capacity controls."

# State the independent behavioral or structural oracle. Self-consistency is
# not an oracle.
independent_oracle: "Independently authored normalized record fields, table order, source references and expected rejection states; existing single-record normalizers are a differential check, not the sole oracle."

# Record versions needed to reproduce each run.
toolchain:
  record_in_run: true
  fields: [compiler, fo, poppler, oracle_versions]

# What result would disappoint you? If nothing would, this is not an experiment.
falsifiable_by: "Any dropped/reordered source record, lost provenance, partial table after failure, source-family dispatch branch, malformed acceptance, or nonzero warning."

# The condition that closes the experiment and the evidence it must report.
gate: "Both source families and their mixed batch normalize transactionally into the existing TargetIR table, agree with independent normalized witnesses, preserve provenance, reject all controls, and pass full fo with zero warnings without changing a shared contract."

# Script that turns runs into the tables and figures in report.md.
analysis: "research/experiments/E0131-can-existing-risc-v-and-aarch64-source-r/analyse.sh"
