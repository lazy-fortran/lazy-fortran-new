id: "E0227"
title: "Which residual source occurrence should follow C759 and C760?"
question: >
  Which residual source occurrence should follow C759 and C760?
status: reported        # draft | running | reported | abandoned
opened: "2026-08-17"
closed: ""

# Every commit the result depends on. Exact, not "main".
repos:
  lazy-fortran-new: "c7041685dc0a0a35394cc2b37b34616b2a626929"
  standard-new: "f94c4c51b51fce22b533b7eeda08741970320913"

# What goes in. Pinned artifacts by manifest name; profiles by ID.
inputs:
  standard: j3-24-007
  profile: m3-core0-residual-v0

# The axes being varied. Omit the key if there is only one condition.
variables:
  residual_partition: "exclude bounded contracts through C759 and harvested C760"

# Explain whether model names form a controlled family ladder or separate
# controls. Pin revisions and runtime settings before the first run.
model_selection: "No model. Luna harvest material is intake only and is not source authority."

# Name these before running anything. Choosing a metric after seeing the data
# is how an experiment becomes a demonstration.
metrics:
  - residual row count and status counts
  - first residual row and constraint ID
  - canonical source line and exact byte span
  - printed-page, ledger-page and page-index coordinates
  - StandardIR rule, occurrence and source span
  - source artifact hashes

# State the complete eligible set and exclusions before the first run. A rate
# over the successful subset is reported alongside the strict rate.
denominator: >-
  Every witness ledger row with status disputed or unwitnessed after excluding
  the bounded contracts C1106, C702, C601, C603, C721, C725, C718, C723,
  C729, C719, C738, C1579, C1586, C717, C720, C722, C724, C726, C731,
  C732, C733, C735, C743, C744, C745, C746, C747, C748, C749, C750, C751,
  C752, C754, C757, C759 and harvested C760.

# State the independent behavioral or structural oracle. Self-consistency is
# not an oracle.
independent_oracle: >-
  Controller byte-offset and page-index recomputation against the pinned
  canonical text, normative PDF, page index and StandardIR; no model output
  is an oracle.

# Record versions needed to reproduce each run.
toolchain:
  record_in_run: true
  fields: [compiler, fo, poppler, oracle_versions]

# What result would disappoint you? If nothing would, this is not an experiment.
falsifiable_by: >-
  The deterministic partition is not 135 rows with 79 disputed and 56
  unwitnessed, the first row is not C761@1, or the pinned source cannot bind
  C761/R741 to the recorded canonical, page and StandardIR coordinates.

# The condition that closes the experiment and the evidence it must report.
gate: >-
  PASS only if the partition yields 135 rows (79 disputed, 56 unwitnessed),
  C761@1 is first, the source coordinates and hashes match, and no model call
  or semantic promotion occurs. This selects a source occurrence and bounded
  property target only; it does not accept a semantic fact.

# Script that turns runs into the tables and figures in report.md.
analysis: >-
  jq -s -c 'def promoted: ["C1106","C702","C601","C603","C721","C725","C718","C723","C729","C719","C738","C1579","C1586","C717","C720","C722","C724","C726","C731","C732","C733","C735","C743","C744","C745","C746","C747","C748","C749","C750","C751","C752","C754","C757","C759","C760"]; def is_promoted($id): any(promoted[]; . == $id); map(select((.status == "disputed" or .status == "unwitnessed") and (is_promoted(.constraint_id) | not))) | {rows: length, by_status: (group_by(.status) | map({status: .[0].status, count: length})), first_row: .[0].row_key, first_constraint: .[0].constraint_id, first_status: .[0].status}' .cache/runs/E0181/R000002/analysis/witness/witnesses.jsonl
