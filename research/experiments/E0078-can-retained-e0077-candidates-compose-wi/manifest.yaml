id: "E0078"
title: "Composition of retained E0077 candidates with unresolved residue"
question: >
  Can retained E0077 candidates compose with the 148-name residue without entering parser wiring?
status: draft            # draft | running | reported | abandoned
opened: "2026-08-12"
closed: ""

# Every commit the result depends on. Exact, not "main".
repos:
  lazy-fortran-new: "1a813b2"
  standard-new: "c6cd889"

# What goes in. Pinned artifacts by manifest name; profiles by ID.
inputs:
  standard: j3-24-007
  full_integration: E0074-R000001
  residue_classification: E0075-R000001
  candidate_adjudication: E0077-R000001
  decisions: [D0019, D0028, D0029]

# The axes being varied. Omit the key if there is only one condition.
variables:
  residue_disposition: [retained-contextual, unresolved-no-evidence]
  parser_projection: [unchanged-from-E0074]
  model_calls: [zero]

# Explain whether model names form a controlled family ladder or separate
# controls. Pin revisions and runtime settings before the first run.
model_selection: "No experimental model calls; residue composition and parser-separation checks are deterministic."

# Name these before running anything. Choosing a metric after seeing the data
# is how an experiment becomes a demonstration.
metrics:
  - residue_records
  - retained_candidate_records
  - unresolved_no_evidence_records
  - source_hash_matches
  - parser_target_records
  - parser_leaks
  - integrated_syntax_records
  - dispatch_rows
  - dispatch_provenance_rows
  - integrated_hash_difference
  - dispatch_hash_difference
  - export_antlr_validator_status
  - export_bison_validator_status
  - export_treesitter_validator_status
  - direct_fortran_status
  - independent_difference
  - negative_control

# State the complete eligible set and exclusions before the first run. A rate
# over the successful subset is reported alongside the strict rate.
denominator: >
  The complete 151-name unresolved set from E0075 is eligible. The three E0077
  retained candidates and the 148 names without bounded evidence must appear
  exactly once. None is eligible for parser projection.

# State the independent behavioral or structural oracle. Self-consistency is
# not an oracle.
independent_oracle: >
  E0074, E0075 and E0077 are rerun. An independent name-set traversal rebuilds
  the 151-name denominator and its two dispositions. The E0074 integrated SX
  and dispatch hashes must remain unchanged, every dispatch row must retain
  provenance, and no retained term may appear in parser projection. A mutation
  of one retained disposition must fail the composition validator.

# Record versions needed to reproduce each run.
toolchain:
  record_in_run: true
  fields: [compiler, fo, poppler, oracle_versions]

# What result would disappoint you? If nothing would, this is not an experiment.
falsifiable_by: >
  The experiment fails if a residue name is dropped or duplicated, a retained
  term enters parser wiring, integration hashes change, direct dispatch loses
  provenance, or the mutation control passes. Target-validator rejection from
  the retained unresolved residue remains reportable evidence.

# The condition that closes the experiment and the evidence it must report.
gate: >
  Compose all 151 unresolved names into retained-contextual or
  unresolved-no-evidence records, add no parser fact, rerun full integration,
  preserve direct wiring, and report target-validator statuses.

# Script that turns runs into the tables and figures in report.md.
analysis: research/experiments/E0078-can-retained-e0077-candidates-compose-wi/analyse.sh
