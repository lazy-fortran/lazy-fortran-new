id: "E0045"
title: "Source-controlled lexical operator and literal-marker witnesses"
question: >
  Can source-controlled lexical witnesses close the unresolved operator and literal-marker references without normalizing Unicode or punctuation by guesswork?
status: draft            # draft | running | reported | abandoned
opened: "2026-08-12"
closed: ""

# Every commit the result depends on. Exact, not "main".
repos:
  lazy-fortran-new: "cf2e7b6"
  standard-new: "c6cd889"

# What goes in. Pinned artifacts by manifest name; profiles by ID.
inputs:
  standard: j3-24-007
  profile: "complete-core-lexical-witness-v0"
  syntax: E0013-R000002
  unresolved_audit: E0022-R000001
  base_resolution_seed: research/experiments/E0043-can-a-source-controlled-d0019-resolution/seed.tsv
  lexical_seed: research/experiments/E0045-can-source-controlled-lexical-witnesses-/lexical-seed.tsv

# The axes being varied. Omit the key if there is only one condition.
variables:
  lexical_classes: [special-character, intrinsic-operator, logical-literal, nil-token]
  unicode_exclusions: [en-dash, right-single-quotation-mark]

# Explain whether model names form a controlled family ladder or separate
# controls. Pin revisions and runtime settings before the first run.
model_selection: "No model calls. Lexical records are source-controlled and projected mechanically."

# Name these before running anything. Choosing a metric after seeing the data
# is how an experiment becomes a demonstration.
metrics:
  - resolution_records
  - alias_records
  - lexical_class_records
  - metavariable_records
  - semantic_role_records
  - unresolved_records
  - disputed_records
  - source_hash_matches
  - lexical_projection_records
  - unicode_exclusions_retained
  - composite_syntax_witnesses
  - composite_input_sha256
  - composite_grammar_sha256
  - independent_difference
  - negative_control

# State the complete eligible set and exclusions before the first run. A rate
# over the successful subset is reported alongside the strict rate.
denominator: >
  The eligible set is the 181 distinct unresolved names in E0022-R000001.
  The selected lexical witness set contains 21 terms with direct source
  witnesses. The E0043 aliases and lexical/metanotation witnesses remain in
  the output for comparison. The en dash and right single quotation mark stay
  unresolved because this slice does not choose a Unicode-to-Fortran-token
  normalization.

# State the independent behavioral or structural oracle. Self-consistency is
# not an oracle.
independent_oracle: >
  The canonical text is checked for the selected table, token, operator and
  literal rules. An independent traversal compares the lexical seed with the
  typed records, verifies source identity on every row, and checks that the two
  excluded Unicode terms remain unresolved. A controlled .AND. mutation must
  fail validation.

# Record versions needed to reproduce each run.
toolchain:
  record_in_run: true
  fields: [compiler, fo, poppler, oracle_versions]

# What result would disappoint you? If nothing would, this is not an experiment.
falsifiable_by: >
  A lexical seed term lacks its cited source witness, a selected term is
  dropped or duplicated, a token target is empty, a source hash differs, an
  excluded Unicode term is normalized, the independent lexical set differs,
  or the negative control does not fail.

# The condition that closes the experiment and the evidence it must report.
gate: >
  Verify all pinned input hashes, preserve the E0043 witnesses, classify the 21
  selected lexical terms, retain the two excluded Unicode terms as unresolved,
  derive a lexical token projection, emit its grammar projection, and pass the
  independent traversal and negative control. This experiment does not claim a
  complete parser input.

# Script that turns runs into the tables and figures in report.md.
analysis: research/experiments/E0045-can-source-controlled-lexical-witnesses-/analyse.sh
