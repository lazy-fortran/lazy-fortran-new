# State the complete eligible set and exclusions before the first run. A rate
# over the successful subset is reported alongside the strict rate.
denominator: >-
  The complete 3-by-3 product of typed kind-parameter states and context
  states. Source and identity mutations are separate controls.

# State the independent behavioral or structural oracle. Self-consistency is
# not an oracle.
independent_oracle: >-
  tests/e2e/validate_m3_c732.py computes outcomes directly from the typed
  kind-parameter and context states using D0146's finite rule table. It does
  not inspect a processor, parse literals, infer context or consume model
  output.

# Record versions needed to reproduce each run.
toolchain:
  record_in_run: true
  fields: [compiler, fo, poppler, oracle_versions]

# What result would disappoint you? If nothing would, this is not an experiment.
falsifiable_by: >-
  Any source, page, StandardIR, semantic-item or contract identity mutation
  is accepted; the 9-state table differs from D0146; the C732 page-85 span is
  not checked; or any model call or semantic promotion is observed.

# The condition that closes the experiment and the evidence it must report.
gate: >-
  tests/e2e/run-m3-c732.sh --fresh must pass from the clean central checkout,
  including exact source/page/StandardIR binding, the complete 9-state typed
  outcome table, mutation rejection, exact trace comparison and zero model
  calls or semantic promotions.

# Script that turns runs into the tables and figures in report.md.
analysis: tests/e2e/validate_m3_c732.py
run: tests/e2e/run-m3-c732.sh --fresh

