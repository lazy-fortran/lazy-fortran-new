id: "E0056"
title: "Deterministic target-export structural normalization"
question: >
  Can deterministic target normalizers remove the E0055 structural export boundary?
status: draft            # draft | running | reported | abandoned
opened: "2026-08-12"
closed: ""

# Every commit the result depends on. Exact, not "main".
repos:
  lazy-fortran-new: "ec23bf3"
  standard-new: "c6cd889"

# What goes in. Pinned artifacts by manifest name; profiles by ID.
inputs:
  standard: j3-24-007
  profile: accepted-composite-projection-v1
  predecessor: E0055-R000001
  decisions: [D0018, D0016, D0024, D0026, D0027, D0028]

# The axes being varied. Omit the key if there is only one condition.
variables:
  target_normalizers: [antlr-recursion, treesitter-nullability, bison-warning-policy]

# Explain whether model names form a controlled family ladder or separate
# controls. Pin revisions and runtime settings before the first run.
model_selection: "No model calls. Fixed target normalizers are generated mechanically from E0055 output."

# Name these before running anything. Choosing a metric after seeing the data
# is how an experiment becomes a demonstration.
metrics:
  - normalized_antlr_status
  - normalized_bison_status
  - normalized_treesitter_status
  - left_recursion_groups
  - nullable_rules_inlined
  - treesitter_conflict_groups
  - treesitter_first_unresolved_conflict
  - antlr_warnings
  - bison_warnings
  - normalized_unresolved_names
  - target_boundary
  - negative_control

# State the complete eligible set and exclusions before the first run. A rate
# over the successful subset is reported alongside the strict rate.
denominator: >
  The three E0055 target validators and their reported structural boundaries
  are the complete eligible set. All three receive projections from the same
  E0055 composite input.

# State the independent behavioral or structural oracle. Self-consistency is
# not an oracle.
independent_oracle: >
  E0055 is rerun and its composite-input hash is checked. Independent scans
  verify that the normalizer changes only the declared recursion and nullable
  wrappers. Each target validator is run, and mutations of the normalizer
  witness must fail.

# Record versions needed to reproduce each run.
toolchain:
  record_in_run: true
  fields: [compiler, fo, poppler, oracle_versions]

# What result would disappoint you? If nothing would, this is not an experiment.
falsifiable_by: >
  The experiment fails if a target output changes outside the declared
  normalization witnesses, an accepted source reference reappears, or the
  mutation control passes. A remaining target-specific conflict is a reported
  boundary, not a reason to alter StandardIR.

# The condition that closes the experiment and the evidence it must report.
gate: >
  Report whether the generic target normalizers close the E0055 structural
  boundary. Preserve any remaining target-specific failure as the next
  explicit boundary. Do not modify StandardIR or source provenance.

# Script that turns runs into the tables and figures in report.md.
analysis: research/experiments/E0056-can-deterministic-target-normalizers-rem/analyse.sh
