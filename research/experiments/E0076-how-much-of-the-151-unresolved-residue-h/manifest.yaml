id: "E0076"
title: "Deterministic normative-prose evidence for unresolved residue"
question: >
  How much of the 151 unresolved residue has exact deterministic normative-prose evidence?
status: reported         # draft | running | reported | abandoned
opened: "2026-08-12"
closed: "2026-08-12"

# Every commit the result depends on. Exact, not "main".
repos:
  lazy-fortran-new: "003b2ce"
  standard-new: "c6cd889"

# What goes in. Pinned artifacts by manifest name; profiles by ID.
inputs:
  standard: j3-24-007
  unresolved_residue: E0075-R000001
  bounded_prose: E0070-R000001
  decisions: [D0019, D0035]

# The axes being varied. Omit the key if there is only one condition.
variables:
  evidence: [exact-patterns, bounded-sentence-and-table]
  model_calls: [zero]

# Explain whether model names form a controlled family ladder or separate
# controls. Pin revisions and runtime settings before the first run.
model_selection: "No experimental model calls; this is a deterministic evidence inventory before adjudication."

# Name these before running anything. Choosing a metric after seeing the data
# is how an experiment becomes a demonstration.
metrics:
  - unresolved_denominator
  - logical_units
  - candidate_spans
  - candidate_names
  - alias_candidates
  - lexical_candidates
  - metavariable_candidates
  - semantic_role_candidates
  - unresolved_after_patterns
  - source_linked_candidates
  - independent_difference
  - negative_control

# State the complete eligible set and exclusions before the first run. A rate
# over the successful subset is reported alongside the strict rate.
denominator: >
  The eligible set is the 151 names classified unresolved by E0075 after the
  accepted E0072 aliases. Logical sentence and table units are scanned for
  exact deterministic patterns only. Candidates are evidence and do not become
  StandardIR facts or parser aliases in this experiment.

# State the independent behavioral or structural oracle. Self-consistency is
# not an oracle.
independent_oracle: >
  E0070 and E0075 are rerun from pinned inputs. The primary bounded-unit scan
  is filtered to the 151-name denominator. A separate traversal rescans the
  same units for candidate term/kind pairs and compares the set. A controlled
  source-unit mutation must remove an expected witness.

# Record versions needed to reproduce each run.
toolchain:
  record_in_run: true
  fields: [compiler, fo, poppler, oracle_versions]

# What result would disappoint you? If nothing would, this is not an experiment.
falsifiable_by: >
  The experiment fails if the denominator changes, a candidate lacks source
  hash or unit coordinates, the independent set differs, or the mutation
  control passes. An empty or small candidate set is a valid result.

# The condition that closes the experiment and the evidence it must report.
gate: >
  Report exact source-linked candidates for all deterministic patterns over the
  151-name residue, retain the rest unresolved, make no model calls and pass
  the independent set and negative-control checks.

# Script that turns runs into the tables and figures in report.md.
analysis: research/experiments/E0076-how-much-of-the-151-unresolved-residue-h/analyse.sh
