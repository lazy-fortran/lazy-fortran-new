id: "E0054"
title: "Deterministic comparison of lexical projection candidates"
question: >
  Can deterministic lexical projection candidates expose the D0027 tradeoff without selecting one?
status: reported            # draft | running | reported | abandoned
opened: "2026-08-12"
closed: "2026-08-12"

# Every commit the result depends on. Exact, not "main".
repos:
  lazy-fortran-new: "6050fb1"

# What goes in. Pinned artifacts by manifest name; profiles by ID.
inputs:
  standard: j3-24-007
  profile: source-provenance-residue-E0053

# The axes being varied. Omit the key if there is only one condition.
variables: {}

# Explain whether model names form a controlled family ladder or separate
# controls. Pin revisions and runtime settings before the first run.
model_selection: "No model calls; one fixed lexical residue set and three deterministic candidate strategies."

# Name these before running anything. Choosing a metric after seeing the data
# is how an experiment becomes a demonstration.
metrics:
  - candidate_strategies
  - residue_terms
  - candidate_rows
  - lexical_rows
  - unicode_rows
  - primitive_export_rows
  - schema_export_rows
  - unresolved_rows
  - complete_projection_candidates
  - negative_control

# State the complete eligible set and exclusions before the first run. A rate
# over the successful subset is reported alongside the strict rate.
denominator: >
  The five lexical or ambiguous-Unicode names in E0053 are the complete
  eligible residue. Every name is evaluated under all three candidates.

# State the independent behavioral or structural oracle. Self-consistency is
# not an oracle.
independent_oracle: >
  E0053 is rerun and its residual-bucket hash is checked. An independent
  source-driven traversal reconstructs the five-term residue. The candidate
  matrix has exact row and property counts, and a controlled candidate-label
  mutation must fail the matrix validator.

# Record versions needed to reproduce each run.
toolchain:
  record_in_run: true
  fields: [compiler, fo, poppler, oracle_versions]

# What result would disappoint you? If nothing would, this is not an experiment.
falsifiable_by: >
  The comparison fails if a residue term is omitted or duplicated, if any
  candidate row loses the source fact, if the expected tradeoff counts differ,
  or if the controlled mutation passes.

# The condition that closes the experiment and the evidence it must report.
gate: >
  Report the three candidate strategies and their lossless/parser-projection
  tradeoffs. Leave D0027 proposed and do not apply a candidate to the parser
  input.

# Script that turns runs into the tables and figures in report.md.
analysis: research/experiments/E0054-can-deterministic-lexical-projection-can/analyse.sh
