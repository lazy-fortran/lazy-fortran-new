  pages_index: .cache/runs/E0001/R000003/j3-24-007.pages.index
  standardir: .cache/runs/E0171/R000433-provenance-replay/standardir.sx

# The axes being varied. Omit the key if there is only one condition.
variables:
  promoted_contracts: [C1106, C702, C601, C603, C721, C725, C718, C723, C729, C719, C738, C1579, C1586, C717, C720, C722, C724, C726, C731, C732, C733, C735, C743, C744, C745]

# Explain whether model names form a controlled family ladder or separate
# controls. Pin revisions and runtime settings before the first run.
model_selection: "No model execution; source-backed mechanical selection only."

# Name these before running anything. Choosing a metric after seeing the data
# is how an experiment becomes a demonstration.
metrics:
  - residual row count and status partition
  - first residual row and constraint
  - canonical source/page/StandardIR binding
  - model calls
  - semantic promotions

# State the complete eligible set and exclusions before the first run. A rate
# over the successful subset is reported alongside the strict rate.
denominator: >-
  Every disputed or unwitnessed row in the pinned E0181 witness ledger after
  exactly the twenty-five bounded contracts listed in promoted_contracts are
  excluded; no successful subset or model-selected subset is substituted.

# State the independent behavioral or structural oracle. Self-consistency is
# not an oracle.
independent_oracle: >-
  The pinned witness ledger and canonical source/page/StandardIR hashes are
  checked mechanically. The residual partition command is deterministic and
  does not infer or promote a semantic fact.

# Record versions needed to reproduce each run.
toolchain:
  record_in_run: true
  fields: [compiler, fo, poppler, oracle_versions]

# What result would disappoint you? If nothing would, this is not an experiment.
falsifiable_by: >-
  Any changed pinned input, promoted-contract list, residual count, first row,
  source/page/StandardIR binding, model call or semantic promotion fails the
  selection.

# The condition that closes the experiment and the evidence it must report.
gate: >-
  Run the exact jq partition command in the next task contract against the
  pinned witness ledger, then inspect the first residual row's source and
  existing StandardIR witnesses. Select exactly one next bounded property or
  record that no eligible row is source-backed.

# Script that turns runs into the tables and figures in report.md.
analysis: >-
  Controller-owned post-C745 residual selection report
  artifacts/reports/M3/m3-core0-next-property-selection-v15.md

