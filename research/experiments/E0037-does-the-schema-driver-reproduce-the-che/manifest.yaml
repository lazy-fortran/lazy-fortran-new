id: "E0037"
title: "Schema driver source-tree regeneration"
question: >
  Does the schema driver reproduce the checked-in Fortran source tree byte-for-byte?
status: reported         # draft | running | reported | abandoned
opened: "2026-08-12"
closed: "2026-08-12"

# Every commit the result depends on. Exact, not "main".
repos:
  lazy-fortran-new: "ad4bf22"
  standard-new: "672f44c"

# What goes in. Pinned artifacts by manifest name; profiles by ID.
inputs:
  standard: j3-24-007
  implementation: standard-new sxschema and schema_codegen
  specification: standard-new/specs/schema-v0.sxs
  generated: standard-new/generated/schema_v0_generated.f90

# The axes being varied. Omit the key if there is only one condition.
variables: {}

# Explain whether model names form a controlled family ladder or separate
# controls. Pin revisions and runtime settings before the first run.
model_selection: "No model calls; deterministic driver and byte comparison."

# Name these before running anything. Choosing a metric after seeing the data
# is how an experiment becomes a demonstration.
metrics:
  - text_policy_self_test_status
  - text_policy_status
  - driver_status
  - regeneration_byte_identity_status
  - generated_formatting_status
  - full_pipeline_status
  - generated_source_bytes
  - generated_source_sha256
  - independent_oracle_mutation_status

# State the complete eligible set and exclusions before the first run. A rate
# over the successful subset is reported alongside the strict rate.
denominator: >
  The complete slice is the one committed v0 schema, one checked-in generated
  Fortran module, one fresh regeneration, one byte-for-byte comparison, the
  generated-source formatting check, and the standard-new full pipeline.
  Generated readers, writers, validators, visitors, hashing, printer APIs and
  complete wiring remain excluded.

# State the independent behavioral or structural oracle. Self-consistency is
# not an oracle.
independent_oracle: >
  The checked-in generated file is an independently retained source artifact;
  a fresh driver output is compared byte-for-byte with it, while fo compiles
  the generated module as part of the normal source graph. A controlled
  expected-line mutation in the preceding E0036 test was observed to fail.

# Record versions needed to reproduce each run.
toolchain:
  record_in_run: true
  fields: [compiler, fo, poppler, oracle_versions]

# What result would disappoint you? If nothing would, this is not an experiment.
falsifiable_by: >
  The driver may reject the committed schema, produce different bytes, emit a
  file that is not formatting-clean, fail to enter the build graph, or any
  quality gate may fail.

# The condition that closes the experiment and the evidence it must report.
gate: >
  Pin standard-new 672f44c, regenerate the source, compare it byte-for-byte
  with the checked-in artifact, pass its formatting check and pass text-policy
  and full fo gates.

# Script that turns runs into the tables and figures in report.md.
analysis: research/experiments/E0037-does-the-schema-driver-reproduce-the-che/analyse.sh
