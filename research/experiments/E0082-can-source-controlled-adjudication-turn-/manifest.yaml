id: "E0082"
title: "Source-controlled semantic candidate adjudication"
question: >
  Can source-controlled adjudication turn semantic candidates into typed evidence without promoting constraint mentions to aliases?
status: draft            # draft | running | reported | abandoned
opened: "2026-08-13"
closed: ""

# Every commit the result depends on. Exact, not "main".
repos:
  lazy-fortran-new: "dda9c1a"
  standard-new: "c6cd889"

# What goes in. Pinned artifacts by manifest name; profiles by ID.
inputs:
  standard: j3-24-007
  profile: E0014-R000001
  inventory: E0081-R000001
  canonical_text: artifacts/runs/E0001/R000003-canonical-text.toml
  adjudication_policy: research/experiments/E0082-can-source-controlled-adjudication-turn-/adjudication-policy.tsv
  decisions: [D0019, D0028, D0035]

# The axes being varied. Omit the key if there is only one condition.
variables:
  positive_forms: [definition, relation]
  modal_constraint_policy: [retain-unresolved-body]
  parser_projection: [none]
  model_calls: [zero]

# Explain whether model names form a controlled family ladder or separate
# controls. Pin revisions and runtime settings before the first run.
model_selection: "No model calls; exact source forms and the retention policy are deterministic."

# Name these before running anything. Choosing a metric after seeing the data
# is how an experiment becomes a demonstration.
metrics:
  - candidate_spans
  - accepted_records
  - accepted_lexical_class_records
  - accepted_metavariable_records
  - accepted_semantic_role_records
  - retained_constraint_candidates
  - ambiguous_candidate_names
  - unresolved_body_constraint_records
  - source_linked_candidates
  - source_linked_constraints
  - accepted_standardir_resolution_facts
  - formalized_constraint_bodies
  - parser_projection_records
  - independent_candidate_difference
  - independent_constraint_difference
  - negative_control

# State the complete eligible set and exclusions before the first run. A rate
# over the successful subset is reported alongside the strict rate.
denominator: >
  Every candidate span emitted by E0081, plus every Core 0-associated numbered
  constraint record emitted by E0081. Every candidate receives exactly one
  disposition. Exact definitions and relations become typed resolution facts.
  A modal occurrence that does not itself define a relation is retained as
  constraint evidence with an unresolved body. No parser projection is in the
  denominator or output.

# State the independent behavioral or structural oracle. Self-consistency is
# not an oracle.
independent_oracle: >
  Rerun E0081 and join every candidate key to the adjudicated output. A
  separate traversal recomputes the positive-policy and retained-modal counts,
  compares all candidate and constraint keys, checks source substrings and
  source hashes, and rejects a controlled mutation of one accepted source
  phrase. The output is compared with the source inventory, not only with
  itself.

# Record versions needed to reproduce each run.
toolchain:
  record_in_run: true
  fields: [compiler, fo, poppler, oracle_versions]

# What result would disappoint you? If nothing would, this is not an experiment.
falsifiable_by: >
  A candidate is missing, duplicated, source-less or assigned a class without
  an exact policy witness, a modal occurrence is promoted to a parser alias,
  a Core 0 constraint loses its unresolved-body state, the independent joins
  differ, or the source mutation is accepted.

# The condition that closes the experiment and the evidence it must report.
gate: >
  Rerun E0081; adjudicate all 266 candidate spans; retain every non-definitional
  modal occurrence; emit all 287 Core 0 constraint records with unresolved
  bodies; preserve source provenance; emit zero parser projections and zero
  formalized constraint bodies; and pass independent inventory and mutation
  checks.

# Script that turns runs into the tables and figures in report.md.
analysis: research/experiments/E0082-can-source-controlled-adjudication-turn-/analyse.sh
