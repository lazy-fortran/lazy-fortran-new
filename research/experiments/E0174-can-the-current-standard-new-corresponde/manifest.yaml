id: "E0174"
title: "Current StandardIR correspondence replay with coalesced boundaries"
question: >
  Can the current standard-new correspondence producer consume coalesced boundary sites without duplicate relations?
status: running          # draft | running | reported | abandoned
opened: "2026-08-16"
closed: ""

# Every commit the result depends on. Exact, not "main".
repos:
  lazy-fortran-new: "4d1ed6109fe55814b141c2e282a7cbeb16c73f7a"
  standard-new: "f94c4c51b51fce22b533b7eeda08741970320913"

# What goes in. Pinned artifacts by manifest name; profiles by ID.
inputs:
  standard: j3-24-007
  profile: selected-program
  source_input: .cache/runs/E0171/R000433-provenance-replay/standardir.sx
  source_input_sha256: 106389186689ae819783ab6742ba4a469f8d1a84ce3bbf25e9baf98a32cf25c2
  classifications: .cache/runs/E0171/R000404-clean-witness-replay/input/classifications.sx
  roots: .cache/runs/E0171/R000404-clean-witness-replay/input/roots.sx
  lexical_facts: .cache/runs/E0171/R000404-clean-witness-replay/input/lexical-facts-v0.sx
  candidate_witness: .cache/runs/E0171/R000435-correspondence-replay/candidates.tsv
  predecessor: E0173/R000457

# The axes being varied. Omit the key if there is only one condition.
variables:
  target: [current-standard-new]
  format: [bison]
  boundary_input: [coalesced-sites-with-evidence]

# Explain whether model names form a controlled family ladder or separate
# controls. Pin revisions and runtime settings before the first run.
model_selection: "No model calls. The producer and relation validator are deterministic."

# Name these before running anything. Choosing a metric after seeing the data
# is how an experiment becomes a demonstration.
metrics:
  - candidate_input_rows
  - structural_boundary_sites
  - producer_mapping_rows
  - correspondence_trace_rows
  - trace_join_rows
  - trace_join_failures
  - duplicate_structural_groups
  - unsupported_rows
  - ambiguous_rows
  - source_node_kind_groups
  - cache_output_hashes
  - model_calls

# State the complete eligible set and exclusions before the first run. A rate
# over the successful subset is reported alongside the strict rate.
denominator: >
  The 95-row E0171 source-boundary candidate witness and every row emitted by
  the current producer for the pinned selected-program input. Coalesced sites
  are the relation denominator; all contributing candidate evidence remains in
  the sidecar.

# State the independent behavioral or structural oracle. Self-consistency is
# not an oracle.
independent_oracle: >
  The current standard-new source-boundary mapper and correspondence witness
  are checked by an independent Python validator that recomputes structural
  identity including source-node kind, trace cardinality and retained evidence.
  The E0173 fixture remains the independent candidate-evidence oracle. No
  target insertion or semantic promotion is inferred from producer output.

# Record versions needed to reproduce each run.
toolchain:
  record_in_run: true
  fields: [compiler, fo, poppler, oracle_versions]

# What result would disappoint you? If nothing would, this is not an experiment.
falsifiable_by: >
  The pinned production checkout is dirty or at another commit, a producer
  row is lost, a coalesced site maps to zero or multiple trace rows, source-node
  kinds disagree inside one site, a cache input or output hash differs, or an
  ambiguous/unsupported selected relation is silently accepted.

# The condition that closes the experiment and the evidence it must report.
gate: >
  Build and fully verify the pinned standard-new checkout in a cold replay,
  regenerate the source-boundary map and correspondence trace, coalesce the
  exact candidate witness, and run the independent validator. Later iterations
  may reuse only an exact-input and exact-output trace cache; they must rerun
  source-boundary mapping and evidence coalescing. The result must retain all
  candidate evidence and report the current producer relation without claiming
  target insertion or language behavior.

# Script that turns runs into the tables and figures in report.md.
analysis: >
  research/experiments/E0174-can-the-current-standard-new-corresponde/analyse.sh
  <run-directory>

run: research/experiments/E0174-can-the-current-standard-new-corresponde/run.sh
selftest: research/experiments/E0173-can-generic-candidate-evidence-coalescin/analyse.sh
