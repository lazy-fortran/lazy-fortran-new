model_selection: "No model calls. Candidate facts are human-authored fixtures; the oracle is mechanical."

metrics:
  - case_outcomes
  - source_binding
  - semantic_canonicalization
  - mutation_controls
  - model_calls
  - semantic_promotions

denominator: >
  Every case in tests/fixtures/m3-c719-source-backed-v0.json: one accepted
  absent-kind-param witness, one accepted nonnegative witness, one rejected
  negative neighbour and one unknown-value unresolved control. Mutation
  controls are a separate source-binding denominator.

independent_oracle: >
  tests/e2e/validate_m3_c719.py computes C719 from typed kind-param presence
  and value states independently of expected labels. It checks only the
  bounded nonnegative restriction over the R709 kind-param shape; it does not
  parse numeric literals, evaluate constant expressions or consume model
  output.

toolchain:
  record_in_run: true
  fields: [compiler, fo, poppler, oracle_versions]

falsifiable_by: >
  Any source hash, source span, rule identity or semantic-item provenance
  mutation is accepted; the canonical semantic-items output changes; an
  absent kind-param is rejected; a present nonnegative value is rejected; a
  present negative value is accepted; an unknown state is classified other
  than UNRESOLVED; or any model call or semantic promotion is observed.

gate: >
  tests/e2e/run-m3-c719.sh --fresh must pass from clean central and
  standard-new checkouts, including standard-new sxsemantic canonicalization,
  normative PDF/canonical-text/StandardIR hash and witness checks, four
  independently computed outcomes, five observed mutation failures, exact
  committed trace comparison and zero model calls or semantic promotions.

analysis: tests/e2e/validate_m3_c719.py
run: tests/e2e/run-m3-c719.sh --fresh
