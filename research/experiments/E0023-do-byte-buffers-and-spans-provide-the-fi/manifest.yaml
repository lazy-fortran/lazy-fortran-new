id: "E0023"
title: "First byte buffer and span text slice"
question: >
  Does standard-new provide an owning byte buffer and non-owning span with
  fixed-byte behavior, bounds rejection and copy isolation?
status: reported         # draft | running | reported | abandoned
opened: "2026-08-12"
closed: "2026-08-12"

# Every commit the result depends on. Exact, not "main".
repos:
  lazy-fortran-new: "0740592"
  standard-new: "f81fd52"

# What goes in. Pinned artifacts by manifest name; profiles by ID.
inputs:
  implementation: standard-new byte_buffer and byte_span
  test: standard-new/test/test_byte_text.f90

# The axes being varied. Omit the key if there is only one condition.
variables: {}

# Explain whether model names form a controlled family ladder or separate
# controls. Pin revisions and runtime settings before the first run.
model_selection: "No model calls; deterministic Fortran implementation and test."

# Name these before running anything. Choosing a metric after seeing the data
# is how an experiment becomes a demonstration.
metrics:
  - text_policy_self_test_status
  - text_policy_status
  - focused_test_status
  - full_pipeline_status
  - formatting_status
  - independent_oracle_mutation_status

# State the complete eligible set and exclusions before the first run. A rate
# over the successful subset is reported alongside the strict rate.
denominator: >
  The complete first slice consists of the byte_buffer and byte_span modules,
  their fixed-byte behavioral test, the text-policy gate and the standard-new
  full pipeline. The later byte_builder, writer, interner and utf8_boundary
  modules are excluded and remain unchecked in ROADMAP.md.

# State the independent behavioral or structural oracle. Self-consistency is
# not an oracle.
independent_oracle: >
  test_byte_text.f90 feeds a fixed input byte array to the implementation and
  compares the result with a separately declared expected byte array,
  including signed boundary values, a sliced suffix and rejected out-of-range
  operations. A controlled mutation of the expected first byte was run and
  had to fail before the unmutated test was restored.

# Record versions needed to reproduce each run.
toolchain:
  record_in_run: true
  fields: [compiler, fo, poppler, oracle_versions]

# What result would disappoint you? If nothing would, this is not an experiment.
falsifiable_by: >
  The focused test, its controlled oracle mutation, text-policy checks or the
  full standard-new pipeline may pass incorrectly, fail to compile, or report
  a shallow-copy mutation of the original buffer.

# The condition that closes the experiment and the evidence it must report.
gate: >
  Pin the production commit, run the focused test, observe the controlled
  oracle mutation fail, restore the oracle, and run the text-policy checks plus
  the full fo pipeline with no changed-file formatting failure.

# Script that turns runs into the tables and figures in report.md.
analysis: research/experiments/E0023-do-byte-buffers-and-spans-provide-the-fi/analyse.sh
