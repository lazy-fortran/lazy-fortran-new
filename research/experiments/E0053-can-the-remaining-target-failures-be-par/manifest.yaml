id: "E0053"
title: "Source-provenance partition of the remaining target failures"
question: >
  Can the remaining target failures be partitioned into source-provenance decision buckets without guessing resolutions?
status: reported            # draft | running | reported | abandoned
opened: "2026-08-12"
closed: "2026-08-12"

# Every commit the result depends on. Exact, not "main".
repos:
  lazy-fortran-new: "55334b1"

# What goes in. Pinned artifacts by manifest name; profiles by ID.
inputs:
  standard: j3-24-007
  profile: grouped-partial-composite-E0052

# The axes being varied. Omit the key if there is only one condition.
variables: {}

# Explain whether model names form a controlled family ladder or separate
# controls. Pin revisions and runtime settings before the first run.
model_selection: "No model calls; deterministic source-provenance classification only."

# Name these before running anything. Choosing a metric after seeing the data
# is how an experiment becomes a demonstration.
metrics:
  - unresolved_target_names
  - r401_unresolved
  - r403_unresolved
  - lexical_unresolved
  - metavariable_unresolved
  - unicode_unresolved
  - source_metadata_records
  - negative_control

# State the complete eligible set and exclusions before the first run. A rate
# over the successful subset is reported alongside the strict rate.
denominator: >
  The 103 unresolved target names reported by E0052 are the complete eligible
  set. No name is dropped because its bucket is inconvenient or unresolved.

# State the independent behavioral or structural oracle. Self-consistency is
# not an oracle.
independent_oracle: >
  E0052 is rerun and its target unresolved-name hash and status are checked.
  Independent pattern classification partitions every target name. A second
  traversal of E0049 normalized records checks the 80 R401 and 17 R403
  unresolved-family denominators. Lexical, metavariable and Unicode records
  are checked against their source-cited normalized records. A controlled
  bucket mutation must fail the exact-count validator.

# Record versions needed to reproduce each run.
toolchain:
  record_in_run: true
  fields: [compiler, fo, poppler, oracle_versions]

# What result would disappoint you? If nothing would, this is not an experiment.
falsifiable_by: >
  The partition fails if any target name is unclassified or classified twice,
  if the independent family counts differ, if source metadata is absent for
  non-expansion records, or if the controlled mutation passes.

# The condition that closes the experiment and the evidence it must report.
gate: >
  Report the complete partition and its source decision mapping. Preserve
  D0024, D0026 and D0027 as unaccepted decisions. The experiment may not
  rewrite an unresolved name into a parser symbol.

# Script that turns runs into the tables and figures in report.md.
analysis: research/experiments/E0053-can-the-remaining-target-failures-be-par/analyse.sh
