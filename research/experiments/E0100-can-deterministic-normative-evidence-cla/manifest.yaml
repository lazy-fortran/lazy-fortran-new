id: "E0100"
title: "Deterministic normative evidence for unresolved names"
question: >
  Can deterministic normative evidence classify every E0022 unresolved name without promoting aliases?
status: reported         # draft | running | reported | abandoned
opened: "2026-08-13"
closed: "2026-08-13"

# Every commit the result depends on. Exact, not "main".
repos:
  lazy-fortran-new: "adeaedc"

# What goes in. Pinned artifacts by manifest name; profiles by ID.
inputs:
  standard: j3-24-007
  profile: complete-core
  standardir: artifacts/runs/E0013/R000002-standardir.toml
  canonical_text: artifacts/runs/E0001/R000003-canonical-text.toml
  unresolved_audit: artifacts/runs/E0022/R000001-reference-audit.toml

# The axes being varied. Omit the key if there is only one condition.
variables:
  source_patterns: [name-headed, is-definition, means-definition, one-of, list-table, nearby-reference]
  model_calls: [zero]

# Explain whether model names form a controlled family ladder or separate
# controls. Pin revisions and runtime settings before the first run.
model_selection: "No LLM calls; all extraction, matching, classification, and checks are deterministic."

# Name these before running anything. Choosing a metric after seeing the data
# is how an experiment becomes a demonstration.
metrics:
  - standardir_unresolved_names
  - audit_unresolved_names
  - denominator_difference
  - candidate_spans
  - mechanically_supported_candidates
  - ambiguous_candidates
  - no_candidates
  - model_calls
  - alias_promotions

# State the complete eligible set and exclusions before the first run. A rate
# over the successful subset is reported alongside the strict rate.
denominator: >
  Every distinct unresolved reference name independently extracted from the
  committed E0013 StandardIR input, cross-checked against the 181-row
  committed E0022 audit. No historical comparison repository or comparison
  column is an input or result.

# State the independent behavioral or structural oracle. Self-consistency is
# not an oracle.
independent_oracle: >
  A separate StandardIR token traversal derives unresolved names and compares
  the sorted set with E0022. A separate canonical-text traversal recomputes
  candidate name/class pairs from the same rows and compares them with the
  primary span traversal. The committed E0022 audit is an input comparison,
  not a source of the denominator.

# Record versions needed to reproduce each run.
toolchain:
  record_in_run: true
  fields: [compiler, fo, poppler, oracle_versions]

# What result would disappoint you? If nothing would, this is not an experiment.
falsifiable_by: >
  Any missing pinned input, hash mismatch, denominator other than 181, set
  difference from E0022, incomplete row output, disagreement between the two
  candidate traversals, or nonzero alias promotion fails the gate.

# The condition that closes the experiment and the evidence it must report.
gate: >
  Verify the three pinned payloads; independently reproduce the 181-name
  denominator from E0013; emit all 181 classifications and retained spans;
  report counts and examples; and leave every name a candidate classification
  only, never a StandardIR alias.

# Script that turns runs into the tables and figures in report.md.
analysis: research/experiments/E0100-can-deterministic-normative-evidence-cla/analyse.sh
