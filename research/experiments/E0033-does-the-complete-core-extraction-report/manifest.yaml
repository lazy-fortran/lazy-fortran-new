id: "E0033"
title: "Complete-core extraction denominator audit"
question: >
  Does the complete core extraction report every page and failure category?
status: reported         # draft | running | reported | abandoned
opened: "2026-08-12"
closed: "2026-08-12"

# Every commit the result depends on. Exact, not "main".
repos:
  lazy-fortran-new: "7832172"
  standard-new: "65b0549"

# What goes in. Pinned artifacts by manifest name; profiles by ID.
inputs:
  standard: j3-24-007
  pages: [1, 688]
  selected_pages: [45, 580]
  profile: complete-core-v1

# The axes being varied. Omit the key if there is only one condition.
variables: {}

# Explain whether model names form a controlled family ladder or separate
# controls. Pin revisions and runtime settings before the first run.
model_selection: "No model calls; existing mechanical extraction and independent shell/JQ accounting."

# Name these before running anything. Choosing a metric after seeing the data
# is how an experiment becomes a demonstration.
metrics:
  - document_pages
  - indexed_pages
  - selected_pages
  - selected_page_skips
  - eligible_productions
  - extracted_productions
  - parse_failures
  - invalid_json_records
  - provenance_failures
  - scope_difference
  - independent_oracle_mutation_status

# State the complete eligible set and exclusions before the first run. A rate
# over the successful subset is reported alongside the strict rate.
denominator: >
  All 688 physical pages reported by the canonical page index, with the
  selected extraction span pages 45--580 and every numbered production start
  in that span. The full-document production-start set is the scope oracle.

# State the independent behavioral or structural oracle. Self-consistency is
# not an oracle.
independent_oracle: >
  The page-index header and independently counted page records establish the
  document and selected-page denominators. jq validates every JSONL record,
  independent set comparison checks full-document scope equality, and every
  StandardIR record is checked for its source hash. Mutating the expected
  production-start count must make the metric comparison fail.

# Record versions needed to reproduce each run.
toolchain:
  record_in_run: true
  fields: [compiler, fo, poppler, oracle_versions]

# What result would disappoint you? If nothing would, this is not an experiment.
falsifiable_by: >
  A page may be absent from the index, a selected page may be skipped, a
  production start may be omitted or added, a JSON record may be invalid, a
  StandardIR record may lack provenance, the scope sets may differ, or the
  independent expected-count mutation may pass.

# The condition that closes the experiment and the evidence it must report.
gate: >
  Run the pinned complete-core extraction, report every denominator and
  failure category, require zero skips/failures and zero scope difference,
  observe the controlled expected-count mutation fail, and pass the full fo
  pipeline and formatting gate.

# Script that turns runs into the tables and figures in report.md.
analysis: research/experiments/E0033-does-the-complete-core-extraction-report/analyse.sh
