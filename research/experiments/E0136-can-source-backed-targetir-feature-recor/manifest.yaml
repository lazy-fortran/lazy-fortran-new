id: "E0136"
title: "Source-backed TargetIR provenance records"
question: >
  Can source-backed TargetIR records expose generic provenance queries without ISA branches
status: reported        # draft | running | reported | abandoned
opened: "2026-08-14"
closed: "2026-08-14"
reported_run: R000246
reported_runs: [R000246]

# Every commit the result depends on. Exact, not "main".
repos:
  lazy-fortran-new: "22abb55"
  fortback-new: "403a1ba"

# What goes in. Pinned artifacts by manifest name; profiles by ID.
inputs:
  standard: not-applicable
  profile: targetir-v0

# The axes being varied. Omit the key if there is only one condition.
variables:
  sources: [riscv, aarch64]
  records: [mixed_family, duplicate, unknown_source, malformed]

# Explain whether model names form a controlled family ladder or separate
# controls. Pin revisions and runtime settings before the first run.
model_selection: "No model calls; deterministic source-record normalization only."

# Name these before running anything. Choosing a metric after seeing the data
# is how an experiment becomes a demonstration.
metrics:
  - accepted records by source identity
  - order and provenance preservation
  - duplicate/unknown/malformed rejection states
  - full fo warning count

# State the complete eligible set and exclusions before the first run. A rate
# over the successful subset is reported alongside the strict rate.
denominator: "The existing bounded RISC-V and AArch64 source records plus declared duplicate, unknown-source, unknown-family and malformed controls; no new ISA payload is assumed."

# State the independent behavioral or structural oracle. Self-consistency is
# not an oracle.
independent_oracle: "A separately constructed expected table with source identity and provenance fields, including transactional failure controls."

# Record versions needed to reproduce each run.
toolchain:
  record_in_run: true
  fields: [compiler, fo, poppler, oracle_versions]

# What result would disappoint you? If nothing would, this is not an experiment.
falsifiable_by: "Any ISA-specific dispatch branch, lost source identity/order, silent duplicate acceptance, accepted unknown family, uncleared failure output, or nonzero fo warning."

# The condition that closes the experiment and the evidence it must report.
gate: "A generic source-backed provenance query passes the complete mixed-family witness matrix and full fo without changing the TargetIR contract or adding mnemonic-specific logic."

# Script that turns runs into the tables and figures in report.md.
analysis: research/experiments/E0136-can-source-backed-targetir-feature-recor/analyse.sh
