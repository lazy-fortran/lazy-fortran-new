# The axes being varied. Omit the key if there is only one condition.
variables:
  source_case: "one named free-form main program with one integer declaration"
  negative_case: "same source with the integer declaration entity omitted"
  stages: "raw source | typed frontend AST v1"
  model_calls: 0
  semantic_promotions: 0

# Explain whether model names form a controlled family ladder or separate
# controls. Pin revisions and runtime settings before the first run.
model_selection: >-
  No model call is part of implementation or replay. The production worker was
  medium-depth gpt-5.6-luna; the deterministic central oracle is authoritative.

# Name these before running anything. Choosing a metric after seeing the data
# is how an experiment becomes a demonstration.
metrics:
  - exact positive and negative source hashes
  - typed AST v1 output and repeated-output hashes
  - root name, declaration counts, variable type/name and source spans
  - component revision, toolchain and clean-checkout state
  - model calls and semantic promotions

# State the complete eligible set and exclusions before the first run. A rate
# over the successful subset is reported alongside the strict rate.
denominator: >-
  One exact positive source, one malformed declaration neighbour, two identical
  positive executions, the committed typed-AST golden and the no-output
  negative control. General declarations, attributes, expressions, symbols,
  MIR lowering and arbitrary Fortran are excluded.

# State the independent behavioral or structural oracle. Self-consistency is
# not an oracle.
independent_oracle: >-
  tests/e2e/validate_frontend_ast_v1.py independently checks exact source and
  negative bytes, pinned contract and artifact hashes, the typed-AST golden,
  repeat equality and absence of negative output. It does not import the
  fortfront implementation.

# Record versions needed to reproduce each run.
toolchain:
  record_in_run: true
  fields: [compiler, fo, poppler, oracle_versions]

# What result would disappoint you? If nothing would, this is not an experiment.
falsifiable_by: >-
  Positive rejection, malformed-neighbour acceptance, changed AST output,
  repeat mismatch, negative output creation, pin mismatch, dirty checkout,
  trace mismatch, model call or semantic promotion.

# The condition that closes the experiment and the evidence it must report.
gate: >-
  From a clean checkout run
  AST_EXPECTED_CENTRAL_COMMIT=<pinned-central>
  tests/e2e/run-frontend-ast-v1.sh --fresh. The first bootstrap creates the
  committed trace; subsequent replays compare it byte for byte.

# Script that turns runs into the tables and figures in report.md.
analysis: >-
  AST_EXPECTED_CENTRAL_COMMIT=<pinned-central>
  tests/e2e/run-frontend-ast-v1.sh --fresh

