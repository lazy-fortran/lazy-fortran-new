id: "E0090"
title: "Generated semantic rule table and C601 source-linked diagnostic"
question: >
  Can accepted predicates generate a semantic rule table and a source-linked diagnostic
status: reported         # draft | running | reported | abandoned
opened: "2026-08-13"
closed: "2026-08-13"

# Every commit the result depends on. Exact, not "main".
repos:
  lazy-fortran-new: "db9ff9c"
  standard-new: "c6cd889"

# What goes in. Pinned artifacts by manifest name; profiles by ID.
inputs:
  standard: j3-24-007
  predecessor_ledger: E0089-R000001
  table_oracle: research/experiments/E0090-can-accepted-predicates-generate-a-seman/table-oracle.tsv
  witness_oracle: research/experiments/E0090-can-accepted-predicates-generate-a-seman/witness-oracle.tsv

# The axes being varied. Omit the key if there is only one condition.
variables:
  accepted_rule_set: [E0089]
  witness_constraint: [C601]
  model_calls: [zero]
  parser_projection: [none]

# Explain whether model names form a controlled family ladder or separate
# controls. Pin revisions and runtime settings before the first run.
model_selection: "No model calls. The rule table and the C601 checker are
generated mechanically from the pinned E0089 ledger."

# Name these before running anything. Choosing a metric after seeing the data
# is how an experiment becomes a demonstration.
metrics:
  - accepted_predecessor_rows
  - generated_rule_rows
  - generated_dispatch_rows
  - table_oracle_difference
  - unique_rule_ids
  - provenance_matches
  - source_evidence_matches
  - unresolved_rows_emitted
  - c1588_rows_emitted
  - c601_checker_positive_status
  - c601_checker_negative_status
  - c601_positive_diagnostic_rows
  - c601_negative_diagnostic_rows
  - c601_positive_gfortran_status
  - c601_negative_gfortran_status
  - c601_positive_source_linked
  - c601_negative_source_linked
  - parser_projection_records
  - model_calls
  - negative_control

# State the complete eligible set and exclusions before the first run. A rate
# over the successful subset is reported alongside the strict rate.
denominator: >
  The 22 resolved rows in the E0089 successor ledger. The 265 unresolved rows,
  including C1588, are excluded from the generated table by policy and must not
  emit rule or dispatch rows. C601 is the one real-source witness constraint.

# State the independent behavioral or structural oracle. Self-consistency is
# not an oracle.
independent_oracle: >
  A separately maintained table oracle records every accepted constraint's
  predicate, required facts and provided fact. A separate witness oracle fixes
  the expected C601 checker and gfortran outcomes, name lengths, and source
  provenance. The table projection and witness results are compared against
  those records; source, status, and predicate mutations must fail.

# Record versions needed to reproduce each run.
toolchain:
  record_in_run: true
  fields: [compiler, fo, poppler, oracle_versions]

# What result would disappoint you? If nothing would, this is not an experiment.
falsifiable_by: >
  Any accepted E0089 row is omitted, an unresolved row is emitted, a table field
  differs from the independent oracle, provenance is lost, the generated C601
  checker accepts the 64-character name or rejects the one-character name,
  either source-linked diagnostic lacks C601 and its J3 citation, gfortran
  disagrees with the fixed witness oracle, or a table mutation passes.

# The condition that closes the experiment and the evidence it must report.
gate: >
  Rerun E0089, emit exactly 22 provenance-bearing rule rows and 22 generated
  dispatch rows, agree with the independent table oracle, emit no unresolved or
  C1588 rows, and compile/run positive and negative C601 Fortran witnesses. The
  generated checker must accept the one-character name, reject the
  64-character name with a C601/J3/24-007 p.67 diagnostic, and agree with
  gfortran's syntax-only outcomes. Emit zero parser projections and zero model
  calls.

# Script that turns runs into the tables and figures in report.md.
analysis: research/experiments/E0090-can-accepted-predicates-generate-a-seman/analyse.sh
