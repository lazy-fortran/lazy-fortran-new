id: "E0050"
title: "Pending representation candidate comparison"
question: >
  Can deterministic candidate representations expose the D0024 and D0026 tradeoff without accepting one?
status: reported         # draft | running | reported | abandoned
opened: "2026-08-12"
closed: "2026-08-12"

# Every commit the result depends on. Exact, not "main".
repos:
  lazy-fortran-new: "90b4707"
  standard-new: "c6cd889"

# What goes in. Pinned artifacts by manifest name; profiles by ID.
inputs:
  standard: j3-24-007
  profile: "complete-core-resolution-overlap-v0"
  predecessor: E0049-R000001
  normalized_records: .cache/runs/E0049/R000001/normalized-resolution-records.tsv
  conflicts: .cache/runs/E0049/R000001/family-resolution-conflicts.tsv
  expansion_inventory: E0048-R000001

# The axes being varied. Omit the key if there is only one condition.
variables:
  candidate_strategies: [alias-precedence, expansion-precedence, unresolved-composite]
  decision_state: [deferred-D0024-D0026]

# Explain whether model names form a controlled family ladder or separate
# controls. Pin revisions and runtime settings before the first run.
model_selection: "No model calls. The candidate matrix is generated mechanically and makes no representation selection."

# Name these before running anything. Choosing a metric after seeing the data
# is how an experiment becomes a demonstration.
metrics:
  - candidate_strategies
  - overlap_terms
  - r401_records
  - r403_records
  - candidate_rows
  - lossy_alias_precedence_rows
  - lossless_expansion_precedence_rows
  - lossless_unresolved_composite_rows
  - parser_ready_candidates
  - representation_selection
  - independent_difference
  - negative_control
  - candidate_matrix_sha256
  - family_denominator_sha256

# State the complete eligible set and exclusions before the first run. A rate
# over the successful subset is reported alongside the strict rate.
denominator: >
  The eligible set is the three R402/R403 overlap terms identified by E0049,
  compared under three explicitly named candidate strategies. The complete
  expansion denominator remains 80 R401 and 20 R403 terms. This experiment
  excludes acceptance of any candidate and does not claim parser completeness.

# State the independent behavioral or structural oracle. Self-consistency is
# not an oracle.
independent_oracle: >
  E0049 is rerun and its normalized/conflict/inventory hashes are checked. An
  independent inventory traversal verifies the 80/20 family denominator. A
  fixed candidate matrix checks the expected lossless/lossy properties and a
  mutation of the candidate label must fail.

# Record versions needed to reproduce each run.
toolchain:
  record_in_run: true
  fields: [compiler, fo, poppler, oracle_versions]

# What result would disappoint you? If nothing would, this is not an experiment.
falsifiable_by: >
  The overlap count differs, the family denominator differs, a candidate loses
  the wrong fact, more than one candidate is parser-ready, the decision state
  is silently accepted, or the negative control does not fail.

# The condition that closes the experiment and the evidence it must report.
gate: >
  Generate nine comparison rows for the three overlap terms and three
  strategies. Show that alias precedence is parser-ready but lossy, while
  expansion precedence and unresolved composite retain both facts. Keep the
  selection deferred to D0024/D0026 and pass the independent checks.

# Script that turns runs into the tables and figures in report.md.
analysis: research/experiments/E0050-can-deterministic-candidate-representati/analyse.sh
