id: "E0020"
title: "Structural comparison of StandardIR syntax representations"
question: >
  How do the deterministic StandardIR syntax exports compare structurally with the pinned standard, kaby76, LFortran and Flang representations?
status: reported         # draft | running | reported | abandoned
opened: "2026-08-12"
closed: "2026-08-12"

# Every commit the result depends on. Exact, not "main".
repos:
  lazy-fortran-new: "24d3b26"
  standard-new: "27406a7"
  oracle-standard: "160032a"
  oracle-kaby76: "ba846bb"
  oracle-lfortran: "caf87b6"
  oracle-flang: "cff4ca2"

# What goes in. Pinned artifacts by manifest name; profiles by ID.
inputs:
  standard: j3-24-007
  profile: complete-core
  standardir: artifacts/runs/E0013/R000002-standardir.toml
  generated_exports:
    - artifacts/runs/E0017/R000001-antlr.toml
    - artifacts/runs/E0018/R000001-bison.toml
    - artifacts/runs/E0019/R000001-treesitter.toml
  comparison_sources:
    - artifacts/grammars/standard-fortran2023-parser.toml
    - artifacts/grammars/kaby76-fortran2023-parser.toml
    - artifacts/grammars/lfortran-parser-yy.toml
    - artifacts/grammars/flang-fortran-parsers.toml

# The axes being varied. Omit the key if there is only one condition.
variables: {}

# Explain whether model names form a controlled family ladder or separate
# controls. Pin revisions and runtime settings before the first run.
model_selection: ""

# Name these before running anything. Choosing a metric after seeing the data
# is how an experiment becomes a demonstration.
metrics:
  - standardir_unique_rules
  - standard_parser_rules
  - standard_overlap
  - kaby76_parser_rules
  - kaby76_overlap
  - lfortran_parser_rules
  - lfortran_overlap
  - flang_rule_ids
  - flang_overlap
  - independent_difference

# State the complete eligible set and exclusions before the first run. A rate
# over the successful subset is reported alongside the strict rate.
denominator: >
  The 502 unique R-numbered syntax rules and lhs names in the pinned E0013
  complete-core StandardIR input. Each comparison source has its own declared
  rule inventory; missing or additional names are reported, never discarded.

# State the independent behavioral or structural oracle. Self-consistency is
# not an oracle.
independent_oracle: >
  The primary adapter extracts normalized lhs or rule-ID sets with one awk
  traversal per source. A separate awk traversal recomputes the same set
  counts and fixed witnesses from the raw source files; its summary must agree
  with the primary comparison. This is a structural comparison, not a claim
  that different parser technologies have identical acceptance behavior.

# Record versions needed to reproduce each run.
toolchain:
  record_in_run: true
  fields: [compiler, fo, poppler, oracle_versions]

# What result would disappoint you? If nothing would, this is not an experiment.
falsifiable_by: >
  A pinned source cannot be read or hashed, a source set differs between the
  two extraction passes, a fixed shared witness is absent, or a comparison
  output cannot account for every source rule as shared or source-only.

# The condition that closes the experiment and the evidence it must report.
gate: >
  Verify all external source pins, extract normalized structural inventories
  for the house grammar, kaby76, LFortran and Flang, independently reproduce
  the counts and witnesses, and record all differences for later normative
  adjudication. gfortran is excluded here because its GPL boundary permits
  behavioral comparison only.

# Script that turns runs into the tables and figures in report.md.
analysis: research/experiments/E0020-how-do-the-deterministic-standardir-synt/analyse.sh
