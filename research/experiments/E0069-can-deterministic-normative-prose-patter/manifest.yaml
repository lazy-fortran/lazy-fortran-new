id: "E0069"
title: "Deterministic normative-prose resolution before model escalation"
question: >
  Can deterministic normative-prose patterns classify unresolved StandardIR names before model escalation?
status: running          # draft | running | reported | abandoned
opened: "2026-08-12"
closed: ""

# Every commit the result depends on. Exact, not "main".
repos:
  lazy-fortran-new: "0542511"
  standard-new: "c6cd889"

# What goes in. Pinned artifacts by manifest name; profiles by ID.
inputs:
  standard: j3-24-007
  profile: complete-core
  standardir: artifacts/runs/E0013/R000002-standardir.toml
  unresolved_audit: artifacts/runs/E0022/R000001-reference-audit.toml
  canonical_text: artifacts/runs/E0001/R000003-canonical-text.toml
  witness_oracle: research/experiments/E0069-can-deterministic-normative-prose-patter/witness-oracle.tsv

# The axes being varied. Omit the key if there is only one condition.
variables:
  recognizer: [exact-normative-patterns]
  model_calls: [zero]

# Explain whether model names form a controlled family ladder or separate
# controls. Pin revisions and runtime settings before the first run.
model_selection: "No model calls; deterministic extraction is the measured first stage."

# Name these before running anything. Choosing a metric after seeing the data
# is how an experiment becomes a demonstration.
metrics:
  - unresolved_names
  - candidate_spans
  - alias_names
  - lexical_class_names
  - metavariable_names
  - semantic_role_names
  - ambiguous_names
  - unresolved_after_patterns
  - source_linked_candidates
  - independent_difference
  - negative_control

# State the complete eligible set and exclusions before the first run. A rate
# over the successful subset is reported alongside the strict rate.
denominator: >
  Every distinct unresolved reference name in the pinned E0022 audit, including
  punctuation-bearing residue and names with no candidate passage. No name is
  discarded because it lacks a match. Candidate spans are searched in the
  complete pinned canonical text, including non-syntax prose; index and table
  occurrences are retained as evidence but do not become StandardIR facts.

# State the independent behavioral or structural oracle. Self-consistency is
# not an oracle.
independent_oracle: >
  The primary awk recognizer scans canonical lines and derives page numbers
  from form-feed boundaries. A separate grep/awk witness traversal checks the
  fixed source substrings and the candidate term set for the four recognized
  pattern families. The checked witness-oracle.tsv is an independently
  annotated source subset; a controlled source mutation must remove its
  expected lexical-class witness and fail the validation gate.

# Record versions needed to reproduce each run.
toolchain:
  record_in_run: true
  fields: [compiler, fo, poppler, oracle_versions]

# What result would disappoint you? If nothing would, this is not an experiment.
falsifiable_by: >
  The E0022 denominator or source hash changes, a recognized witness is not
  source-linked, the primary and independent candidate sets differ, a
  punctuation-bearing term is silently dropped, a candidate is promoted to a
  StandardIR fact, or the negative control passes after its normative marker is
  removed.

# The condition that closes the experiment and the evidence it must report.
gate: >
  Verify the pinned inputs; emit one typed row for every E0022 term and every
  recognized candidate span; independently verify the fixed witnesses and
  candidate-set accounting; retain ambiguous and unresolved states; and write
  a summary suitable for a later source-controlled adjudication. This run
  measures evidence recovery, not semantic acceptance.

# Script that turns runs into the tables and figures in report.md.
analysis: research/experiments/E0069-can-deterministic-normative-prose-patter/analyse.sh
