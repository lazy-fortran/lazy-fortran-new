id: "E0101"
title: "Strictly cited model harness for E0100 residue"
question: >
  Can a strictly cited model resolve E0100 residue without unsupported citations or alias promotion?
status: reported         # draft | running | reported | abandoned
opened: "2026-08-13"
closed: "2026-08-13"

# Every commit the result depends on. Exact, not "main".
repos:
  lazy-fortran-new: "29a369a"

# What goes in. Pinned artifacts by manifest name; profiles by ID.
inputs:
  standard: j3-24-007
  profile: complete-core
  e0100_classifications: artifacts/runs/E0100/R000001/classifications.tsv
  e0100_candidate_spans: artifacts/runs/E0100/R000001/candidate-spans.tsv

# The axes being varied. Omit the key if there is only one condition.
variables:
  model_calls: [zero-when-runner-absent, one-when-explicit-runner-present]

model_selection: "The runner is supplied only through the explicit MODEL_RUNNER environment variable; no coordinator or frontier model fallback exists."

# Name these before running anything. Choosing a metric after seeing the data
# is how an experiment becomes a demonstration.
metrics:
  - residue_rows
  - retained_normative_spans
  - model_calls
  - accepted_relations
  - unresolved_or_abstained
  - rejected_outputs
  - alias_promotions

# State the complete eligible set and exclusions before the first run. A rate
# over the successful subset is reported alongside the strict rate.
denominator: "The 46 ambiguous-candidate and 81 no-candidate rows emitted by E0100, exactly 127 distinct names."

# State the independent behavioral or structural oracle. Self-consistency is
# not an oracle.
independent_oracle: "A schema-and-citation validator independently checks row coverage, exact retained-span membership, source hashes, and the no-runner zero-call condition."

# Record versions needed to reproduce each run.
toolchain:
  record_in_run: true
  fields: [compiler, fo, poppler, oracle_versions]

# What result would disappoint you? If nothing would, this is not an experiment.
falsifiable_by: "Any dropped or duplicated residue row, missing provenance, unsupported citation, relation without an exact cited span, alias promotion without a cited span, or call when MODEL_RUNNER is absent fails the gate."

# The condition that closes the experiment and the evidence it must report.
gate: "Package all 127 residue rows with retained E0100 spans and provenance; require strict JSONL model output; reject every unsupported or uncited relation; and report an execution blocker without a runner while making syntax and negative tests pass."

# Script that turns runs into the tables and figures in report.md.
analysis: research/experiments/E0101-can-a-strictly-cited-model-resolve-e0100/analyse.sh
