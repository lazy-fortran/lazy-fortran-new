id: "E0098"
title: "Mechanical closure of the complete StandardIR parser references"
question: >
  Can the current complete StandardIR projection close every parser reference mechanically?
status: draft            # draft | running | reported | abandoned
opened: "2026-08-13"
closed: ""

# Every commit the result depends on. Exact, not "main".
repos:
  lazy-fortran-new: "bb5b46482afb0c0701bf84a1056247980d8a0348"
  standard-new: "c6cd889"

# What goes in. Pinned artifacts by manifest name; profiles by ID.
inputs:
  standard: j3-24-007
  profile: complete-core
  syntax: E0013-R000002
  prior_projection: E0055-R000001
  decisions: [D0024, D0026, D0027, D0041]

# The axes being varied. Omit the key if there is only one condition.
variables:
  closure_layers: [explicit, assumed-expansion, lexical, erratum, semantic-only]
  model_calls: [none]

# Explain whether model names form a controlled family ladder or separate
# controls. Pin revisions and runtime settings before the first run.
model_selection: "No model calls; this is the mechanical closure control."

# Name these before running anything. Choosing a metric after seeing the data
# is how an experiment becomes a demonstration.
metrics:
  - explicit_reference_records
  - assumed_expansion_records
  - lexical_fact_records
  - erratum_records
  - semantic_only_records
  - unresolved_parser_names
  - disputed_records
  - target_provenance_records
  - independent_difference
  - negative_control

# State the complete eligible set and exclusions before the first run. A rate
# over the successful subset is reported alongside the strict rate.
denominator: >
  Every distinct reference in the pinned complete-core syntax projection that
  lacks an explicit lhs before resolution. No name is removed because it is
  absent from a comparison grammar or inconvenient to classify.

# State the independent behavioral or structural oracle. Self-consistency is
# not an oracle.
independent_oracle: >
  A primary composition rebuilds the current complete input from E0013,
  E0055, D0024, D0026, D0027 and the fixed errata. An independent traversal
  recomputes every reference, resolution layer, parser target and source hash.
  The four exports and direct Fortran wiring validate the resulting target
  inputs. A controlled removal of one assumed expansion must change the
  unresolved set.

# Record versions needed to reproduce each run.
toolchain:
  record_in_run: true
  fields: [compiler, fo, poppler, oracle_versions]

# What result would disappoint you? If nothing would, this is not an experiment.
falsifiable_by: >
  The experiment fails if an accepted prior expansion is omitted, a reference
  is silently dropped, repetition/separators or scalar facts are lost,
  provenance differs, an unclassified parser name remains without an explicit
  state, the independent rebuild differs, or the negative control does not
  fail.

# The condition that closes the experiment and the evidence it must report.
gate: >
  Reintegrate the accepted deterministic layers, classify every complete-core
  parser reference, preserve all source facts, emit the four grammar targets
  and direct wiring, and report zero unclassified parser names. Any explicit
  semantic-only or unresolved residue remains visible and source-linked.

# Script that turns runs into the tables and figures in report.md.
analysis: research/experiments/E0098-can-the-current-complete-standardir-proj/analyse.sh
