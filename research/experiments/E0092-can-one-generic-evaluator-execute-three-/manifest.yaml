id: "E0092"
title: "Generic evaluator for C601, C603 and C719"
question: >
  Can one generic evaluator execute three accepted semantic predicate forms
status: reported         # draft | running | reported | abandoned
opened: "2026-08-13"
closed: "2026-08-13"

# Every commit the result depends on. Exact, not "main".
repos:
  lazy-fortran-new: "2e084fe"
  standard-new: "c6cd889"

# What goes in. Pinned artifacts by manifest name; profiles by ID.
inputs:
  standard: j3-24-007
  predecessor: E0090-R000001
  target_oracle: research/experiments/E0092-can-one-generic-evaluator-execute-three-/target-oracle.tsv
  witness_oracle: research/experiments/E0092-can-one-generic-evaluator-execute-three-/witness-oracle.tsv

# The axes being varied. Omit the key if there is only one condition.
variables:
  predecessor_table: [E0090]
  predicate_targets: [C601, C603, C719]
  model_calls: [zero]
  parser_projection: [none]

# Explain whether model names form a controlled family ladder or separate
# controls. Pin revisions and runtime settings before the first run.
model_selection: "No model calls. A generic evaluator is generated from the
pinned E0090 rule table and supports the declared predicate constructors."

# Name these before running anything. Choosing a metric after seeing the data
# is how an experiment becomes a demonstration.
metrics:
  - predecessor_rule_rows
  - selected_rule_rows
  - generic_constructor_forms
  - target_oracle_difference
  - provenance_matches
  - fact_matches
  - evaluator_cases
  - positive_checker_accepts
  - negative_checker_rejects
  - diagnostic_rows
  - gfortran_agreement
  - source_linked_results
  - parser_projection_records
  - model_calls
  - negative_control

# State the complete eligible set and exclusions before the first run. A rate
# over the successful subset is reported alongside the strict rate.
denominator: >
  The 22 accepted E0090 rule rows, with C601, C603 and C719 selected as the
  evaluator targets. The 265 unresolved E0089 rows remain excluded. Each
  selected predicate is exercised with one positive and one negative source.

# State the independent behavioral or structural oracle. Self-consistency is
# not an oracle.
independent_oracle: >
  A separately maintained target oracle fixes the three selected predicates,
  fact fields, source locations and constructor forms. A separate six-row
  witness oracle fixes checker status, gfortran status and source shape. The
  generated evaluator and all source-linked results are compared with those
  records; mutating a selected predicate must fail.

# Record versions needed to reproduce each run.
toolchain:
  record_in_run: true
  fields: [compiler, fo, poppler, oracle_versions]

# What result would disappoint you? If nothing would, this is not an experiment.
falsifiable_by: >
  Any selected row differs, an unresolved row is emitted, the target oracle
  differs, a constructor is handled by a rule-specific branch rather than the
  generic evaluator, a positive witness is rejected, a negative witness is
  accepted, gfortran disagrees, a diagnostic loses its C constraint or J3
  location, or a predicate mutation passes.

# The condition that closes the experiment and the evidence it must report.
gate: >
  Rerun E0090, select exactly C601, C603 and C719, agree with the target oracle,
  generate one evaluator supporting `le`, `ge`, `exists` and `ne`, and run six
  witnesses. All three positive cases must be accepted and all three negative
  cases rejected by both the generic evaluator and gfortran. Every result must
  retain its C ID, source line, page and hash. Emit zero parser projections and
  zero model calls.

# Script that turns runs into the tables and figures in report.md.
analysis: research/experiments/E0092-can-one-generic-evaluator-execute-three-/analyse.sh
