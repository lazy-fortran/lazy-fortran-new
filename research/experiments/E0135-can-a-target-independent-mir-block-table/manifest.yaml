id: "E0135"
title: "Target-independent MIR block table"
question: >
  Can a target-independent MIR block table scale beyond the single-block witness without target details
status: running          # draft | running | reported | abandoned
opened: "2026-08-14"
closed: ""

# Every commit the result depends on. Exact, not "main".
repos:
  lazy-fortran-new: "22abb55"
  ffc-new: "998ab62d180b4f2940e25d2f987f4f99317c5771"

# What goes in. Pinned artifacts by manifest name; profiles by ID.
inputs:
  standard: not-applicable
  profile: mir-v0

# The axes being varied. Omit the key if there is only one condition.
variables:
  body_shapes: [single_block_control, multi_block_candidate, malformed]
  contract_action: [additive_only, stop_before_revision]

# Explain whether model names form a controlled family ladder or separate
# controls. Pin revisions and runtime settings before the first run.
model_selection: "No model calls; production implementation is a deterministic Fortran slice."

# Name these before running anything. Choosing a metric after seeing the data
# is how an experiment becomes a demonstration.
metrics:
  - validated block count and ordered instruction ranges
  - preservation of existing single-block behavior
  - malformed-input and output-clearing behavior
  - full fo warning count

# State the complete eligible set and exclusions before the first run. A rate
# over the successful subset is reported alongside the strict rate.
denominator: "The declared single-block mir-v0 witness, a bounded multi-block candidate if representable without changing mir-v0, and malformed/capacity controls."

# State the independent behavioral or structural oracle. Self-consistency is
# not an oracle.
independent_oracle: "A separately constructed block-range table and canonical SX/field oracle; no implementation self-consistency claim is sufficient."

# Record versions needed to reproduce each run.
toolchain:
  record_in_run: true
  fields: [compiler, fo, poppler, oracle_versions]

# What result would disappoint you? If nothing would, this is not an experiment.
falsifiable_by: "Any target or ABI dependency, silent mir-v0 change, lost instruction order, accepted malformed body, uncleared failure output, or nonzero fo warning."

# The condition that closes the experiment and the evidence it must report.
gate: "Either an additive target-independent block table passes the complete witness matrix and full fo, or the agent records a clean no-change boundary explaining why a contract revision is required."

# Script that turns runs into the tables and figures in report.md.
analysis: ""
