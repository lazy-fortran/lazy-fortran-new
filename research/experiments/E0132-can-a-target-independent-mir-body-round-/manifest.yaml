id: "E0132"
title: "Canonical MIR body round trip"
question: >
  Can a target-independent MIR body round-trip through a stable canonical SX boundary?
status: running          # draft | running | reported | abandoned
opened: "2026-08-14"
closed: ""

# Every commit the result depends on. Exact, not "main".
repos:
  lazy-fortran-new: c41eda3
  ffc-new: 7691adc1a7b96fef171f9fd0059c89401ad1c4f1

# What goes in. Pinned artifacts by manifest name; profiles by ID.
inputs:
  standard: j3-24-007
  profile: mir-v0-roundtrip-witnesses

# The axes being varied. Omit the key if there is only one condition.
variables:
  bodies: [empty, multi_block, typed_results, source_linked]
  controls: [malformed, invalid_opcode, count_mismatch, stale_output]

# Explain whether model names form a controlled family ladder or separate
# controls. Pin revisions and runtime settings before the first run.
model_selection: "none; deterministic MIR serialization only"

# Name these before running anything. Choosing a metric after seeing the data
# is how an experiment becomes a demonstration.
metrics:
  - body_roundtrip
  - typed_fields_preserved
  - source_identity_preserved
  - malformed_rejection
  - output_clearing
  - fo_warnings

# State the complete eligible set and exclusions before the first run. A rate
# over the successful subset is reported alongside the strict rate.
denominator: "Every currently representable validated mir-v0 body in the fixed witness matrix, plus every declared malformed and stale-output control."

# State the independent behavioral or structural oracle. Self-consistency is
# not an oracle.
independent_oracle: "Independently authored expected canonical SX fields and reconstructed typed bodies; serializer self-consistency is not the sole oracle."

# Record versions needed to reproduce each run.
toolchain:
  record_in_run: true
  fields: [compiler, fo, poppler, oracle_versions]

# What result would disappoint you? If nothing would, this is not an experiment.
falsifiable_by: "Any lost typed field, changed instruction order, changed source identity, accepted malformed body, stale output, or nonzero warning."

# The condition that closes the experiment and the evidence it must report.
gate: "The canonical MIR SX boundary round-trips every valid witness against the independent field oracle, rejects all controls with cleared output, preserves mir-v0, and passes full fo with zero warnings."

# Script that turns runs into the tables and figures in report.md.
analysis: research/experiments/E0132-can-a-target-independent-mir-body-round-/analyse.sh
