id: "E0051"
title: "Independent target-tool validation of the E0049 partial composite input"
question: >
  Do ANTLR4, Bison and tree-sitter independently expose the same remaining boundary in the E0049 partial candidate?
status: reported            # draft | running | reported | abandoned
opened: "2026-08-12"
closed: "2026-08-12"

# Every commit the result depends on. Exact, not "main".
repos:
  lazy-fortran-new: "90b4707"

# What goes in. Pinned artifacts by manifest name; profiles by ID.
inputs:
  standard: j3-24-007
  profile: complete-core-partial-composite-E0049

# The axes being varied. Omit the key if there is only one condition.
variables: {}

# Explain whether model names form a controlled family ladder or separate
# controls. Pin revisions and runtime settings before the first run.
model_selection: "No model calls; one deterministic E0049 candidate and three installed target validators."

# Name these before running anything. Choosing a metric after seeing the data
# is how an experiment becomes a demonstration.
metrics:
  - final_syntax_records
  - target_definition_counts
  - target_duplicate_definitions
  - antlr_status
  - antlr_unresolved_rule_names
  - bison_status
  - bison_unresolved_symbol_names
  - treesitter_status
  - treesitter_structural_error
  - antlr_bison_unresolved_set_difference
  - negative_control

# State the complete eligible set and exclusions before the first run. A rate
# over the successful subset is reported alongside the strict rate.
denominator: >
  The one E0049 partial candidate is eligible. All three target validators
  are run once against that same candidate; a nonzero target-tool exit is a
  retained verification failure, not an omitted observation.

# State the independent behavioral or structural oracle. Self-consistency is
# not an oracle.
independent_oracle: >
  E0049 is rerun and its candidate hash is checked. Independent awk/grep
  traversals count the 502 generated lhs definitions in each target format.
  ANTLR and Bison diagnostics are independently normalized and their
  unresolved-name sets are compared. The tree-sitter failure is independently
  classified by the malformed generated sequence witness. A controlled
  deletion of one generated definition must change the independent count.

# Record versions needed to reproduce each run.
toolchain:
  record_in_run: true
  fields: [compiler, fo, poppler, oracle_versions]

# What result would disappoint you? If nothing would, this is not an experiment.
falsifiable_by: >
  The candidate would pass this experiment only if all three target validators
  accepted it and the independent scans found no missing definitions. A
  disagreement between the ANTLR and Bison unresolved sets would also falsify
  the expected common boundary.

# The condition that closes the experiment and the evidence it must report.
gate: >
  Report the validator statuses, exact unresolved-name counts, target
  definition counts, tree-sitter structural failure, hashes, and retained
  verification-failure status. Do not select D0024 or D0026 from this run.

# Script that turns runs into the tables and figures in report.md.
analysis: research/experiments/E0051-do-antlr4-bison-and-tree-sitter-independ/analyse.sh
