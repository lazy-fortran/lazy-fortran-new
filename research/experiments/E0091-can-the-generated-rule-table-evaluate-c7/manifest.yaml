id: "E0091"
title: "Table-driven C719 kind-param evaluator"
question: >
  Can the generated rule table evaluate C719 kind-param bounds
status: reported         # draft | running | reported | abandoned
opened: "2026-08-13"
closed: "2026-08-13"

# Every commit the result depends on. Exact, not "main".
repos:
  lazy-fortran-new: "85350b0"
  standard-new: "c6cd889"

# What goes in. Pinned artifacts by manifest name; profiles by ID.
inputs:
  standard: j3-24-007
  predecessor: E0090-R000001
  witness_oracle: research/experiments/E0091-can-the-generated-rule-table-evaluate-c7/witness-oracle.tsv
  target_oracle: research/experiments/E0091-can-the-generated-rule-table-evaluate-c7/target-oracle.tsv

# The axes being varied. Omit the key if there is only one condition.
variables:
  predecessor_table: [E0090]
  witness_constraint: [C719]
  model_calls: [zero]
  parser_projection: [none]

# Explain whether model names form a controlled family ladder or separate
# controls. Pin revisions and runtime settings before the first run.
model_selection: "No model calls. The C719 evaluator is generated from the
pinned E0090 table row."

# Name these before running anything. Choosing a metric after seeing the data
# is how an experiment becomes a demonstration.
metrics:
  - predecessor_rule_rows
  - target_rule_rows
  - target_table_difference
  - target_provenance_matches
  - target_fact_matches
  - generated_bound
  - checker_positive_status
  - checker_negative_status
  - positive_diagnostic_rows
  - negative_diagnostic_rows
  - positive_gfortran_status
  - negative_gfortran_status
  - positive_source_linked
  - negative_source_linked
  - parser_projection_records
  - model_calls
  - negative_control

# State the complete eligible set and exclusions before the first run. A rate
# over the successful subset is reported alongside the strict rate.
denominator: >
  The 22 accepted E0090 rule rows, with C719 selected as the one evaluator
  target. The 265 unresolved E0089 rows remain excluded by the predecessor
  table. The C719 witness varies only the integer kind parameter: 1 versus -1.

# State the independent behavioral or structural oracle. Self-consistency is
# not an oracle.
independent_oracle: >
  A separately maintained target oracle fixes C719's predicate, fact fields and
  J3 source location. A separate witness oracle fixes the generated checker and
  gfortran outcomes, kind values and source-link expectation. Predicate and
  source-location mutations must fail.

# Record versions needed to reproduce each run.
toolchain:
  record_in_run: true
  fields: [compiler, fo, poppler, oracle_versions]

# What result would disappoint you? If nothing would, this is not an experiment.
falsifiable_by: >
  The predecessor table changes, C719 is absent or has a different predicate,
  required fact or source location, the generated checker accepts kind -1 or
  rejects kind 1, gfortran disagrees with the fixed outcomes, either result
  loses C719/J3 provenance, or a target mutation passes.

# The condition that closes the experiment and the evidence it must report.
gate: >
  Rerun E0090, select exactly C719 from its generated table, agree with the
  independent target oracle, derive the nonnegative bound from its predicate,
  and generate a checker that accepts integer(kind=1) and rejects
  integer(kind=-1) with a C719/J3/24-007 p.80 diagnostic. The checker and
  gfortran must agree, with zero parser projections and zero model calls.

# Script that turns runs into the tables and figures in report.md.
analysis: research/experiments/E0091-can-the-generated-rule-table-evaluate-c7/analyse.sh
