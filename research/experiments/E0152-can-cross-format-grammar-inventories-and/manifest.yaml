id: "E0152"
title: "Cross-format grammar inventories and pinned reference comparison"
question: >
  Can cross-format grammar inventories and pinned references expose projection gaps without conflating parser factoring
status: reported         # draft | running | reported | abandoned
opened: "2026-08-15"
closed: "2026-08-15"

# Every commit the result depends on. Exact, not "main".
repos:
  lazy-fortran-new: "36b5570"
  standard-new: "dc75e7f4905e58d9b89d04c77f4f09223b57a579"
  oracle-lfortran: "caf87b660f803148f000046392a5da803f9fc630"
  oracle-kaby76: "ba846bbdea9df98428d094137d2adbe156f86207"
  oracle-standard: "160032ae38d8bd239fbb943142fdee95bda49ae2"
  oracle-flang: "cff4ca2e51f89c992d8a1b6ce1067846ba680e2e"

# What goes in. Pinned artifacts by manifest name; profiles by ID.
inputs:
  standard: j3-24-007
  profile: complete-core-selected-program
  generated_run: E0151/R000002-candidate
  references:
    - lfortran-parser-yy
    - kaby76-fortran2023-parser
    - standard-fortran2023-parser
    - flang-fortran-parsers

# The axes being varied. Omit the key if there is only one condition.
variables:
  generated_format: [ebnf, antlr4, bison, tree-sitter]
  comparison_reference: [lfortran-bison, kaby76-antlr4, house-antlr4, flang-rule-comments]

# Explain whether model names form a controlled family ladder or separate
# controls. Pin revisions and runtime settings before the first run.
model_selection: >
  No model is used. This is a deterministic inventory and reference
  adjudication. Luna review is a separate independent review, never a source
  of productions or a replacement for the source/projection gates.

# Name these before running anything. Choosing a metric after seeing the data
# is how an experiment becomes a demonstration.
metrics:
  - generated_rule_heads
  - generated_alternatives
  - generated_provenance_headers
  - cross_format_head_disagreement
  - cross_format_provenance_disagreement
  - reference_rule_heads
  - reference_alternatives
  - source_projection_covered
  - source_projection_explicitly_skipped
  - validator_status
  - reference_advantages
  - standardir_advantages

# State the complete eligible set and exclusions before the first run. A rate
# over the successful subset is reported alongside the strict rate.
denominator: >
  Every generated rule head and provenance-bearing alternative in the four
  E0151/R000002 candidate exports, plus every rule head and alternative
  discoverable by the pinned LFortran Bison, kaby76 ANTLR4, house ANTLR4 and
  Flang rule-comment inventories. Reference inventories are comparison
  denominators, not normative source records, and are never merged into
  StandardIR.

# State the independent behavioral or structural oracle. Self-consistency is
# not an oracle.
independent_oracle: >
  The exact E0151 validator report (ANTLR4 4.13.2, Bison 3.8.2 and
  tree-sitter 0.26.9), its source-projection report, SHA-256-verified
  generated and reference artifacts, exact lineage-set comparison and a
  separate structural parser for each inventory. This experiment does not
  rerun the validators or prove source RHS equivalence. No single reference
  grammar is treated as a language oracle.

# Record versions needed to reproduce each run.
toolchain:
  record_in_run: true
  fields: [compiler, fo, poppler, oracle_versions]

# What result would disappoint you? If nothing would, this is not an experiment.
falsifiable_by: >
  The four generated formats disagree on a source-backed head or provenance
  alternative without an explicit target transformation, a pinned artifact
  cannot be reproduced, a validator status differs from the recorded result,
  or the analysis silently treats reference-only parser factoring as a
  StandardIR defect.

# The condition that closes the experiment and the evidence it must report.
gate: >
  All four generated inventories are reproducible from the exact E0151
  candidate hashes, the inherited validator and source-projection reports are
  hash-pinned, exact generated lineage sets agree, every reference inventory
  is hash-pinned, and the report records both genuine StandardIR and genuine
  reference advantages. This gate does not rerun validators, prove source RHS
  equivalence, or close M2 by itself.

# Script that turns runs into the tables and figures in report.md.
analysis: >
  Run
  `research/experiments/E0152-can-cross-format-grammar-inventories-and/analyse.sh
  <run-directory>`. It writes only to the ignored run directory and produces
  `inventories.tsv`, `head-diffs.tsv` and `summary.json`.
