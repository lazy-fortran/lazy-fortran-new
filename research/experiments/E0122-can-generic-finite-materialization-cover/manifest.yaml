denominator: >
  All 287 retained E0117 rows, the 23 E0120 oracle records, and every finite
  case generated for an accepted model/oracle overlap. Missing model rows and
  unavailable candidate fact names remain counted rather than filtered.

independent_oracle: >
  The E0120 source-oracle AST and its SHA-256 are parsed separately from the
  E0117 JSON predicates. Generic derived fact names represent count and
  containment terms; no source-specific synonym or candidate-specific branch
  is introduced.

gate: >
  Retain all rows, materialize every source form available for an overlap,
  report no source mismatches or evaluator errors, retain candidate-unavailable
  and no-overlap outcomes explicitly, pass mutation controls, make zero model
  calls and promote zero semantic facts.

analysis: >
  E0118's generic analyse.sh with E0118_ORACLE set to the pinned E0120
  source-oracle.tsv and E0118_OUTDIR set to .cache/runs/E0122/R000001.
