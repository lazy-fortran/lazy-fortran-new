id: "E0095"
title: "Nested implication evaluator for C721"
question: >
  Can one generic evaluator execute a nested implies predicate with source facts
status: draft            # draft | running | reported | abandoned
opened: "2026-08-13"
closed: ""

# Every commit the result depends on. Exact, not "main".
repos:
  lazy-fortran-new: "276db1e"
  standard-new: "c6cd889"

# What goes in. Pinned artifacts by manifest name; profiles by ID.
inputs:
  standard: j3-24-007
  predecessor: E0090-R000001
  target_oracle: research/experiments/E0095-can-one-generic-evaluator-execute-a-nest/target-oracle.tsv
  witness_oracle: research/experiments/E0095-can-one-generic-evaluator-execute-a-nest/witness-oracle.tsv

# The axes being varied. Omit the key if there is only one condition.
variables:
  predecessor_table: [E0090]
  predicate: [C721]
  model_calls: [zero]
  parser_projection: [none]

# Explain whether model names form a controlled family ladder or separate
# controls. Pin revisions and runtime settings before the first run.
model_selection: "No model calls. The evaluator interprets the generic
implies, and, present and eq constructors from the pinned predicate row."

# Name these before running anything. Choosing a metric after seeing the data
# is how an experiment becomes a demonstration.
metrics:
  - predecessor_rule_rows
  - selected_rule_rows
  - generic_constructor_forms
  - target_oracle_difference
  - provenance_matches
  - fact_matches
  - evaluator_cases
  - implication_accepts
  - implication_rejects
  - gfortran_agreement
  - diagnostic_rows
  - source_linked_results
  - parser_projection_records
  - model_calls
  - negative_control

# State the complete eligible set and exclusions before the first run. A rate
# over the successful subset is reported alongside the strict rate.
denominator: >
  The C721 row selected from the 22 accepted E0090 predicates. Three source
  witnesses exercise implication with a true antecedent and true consequent,
  a true antecedent and false consequent, and a false antecedent. The other 21
  accepted rows and all 265 unresolved rows are excluded.

# State the independent behavioral or structural oracle. Self-consistency is
# not an oracle.
independent_oracle: >
  A separately maintained target oracle fixes C721's predicate, facts and J3
  location. A separate three-row witness oracle fixes evaluator outcomes,
  antecedent/consequent truth values and gfortran outcomes for real Fortran
  sources. A predicate mutation must change the positive witness result.

# Record versions needed to reproduce each run.
toolchain:
  record_in_run: true
  fields: [compiler, fo, poppler, oracle_versions]

# What result would disappoint you? If nothing would, this is not an experiment.
falsifiable_by: >
  The predecessor table or C721 row changes, the evaluator mishandles either
  implication truth case, a source loses provenance, gfortran disagrees, or a
  predicate mutation leaves the positive result unchanged.

# The condition that closes the experiment and the evidence it must report.
gate: >
  Rerun E0090, select exactly C721, interpret the nested generic constructors,
  agree with the independent target and witness oracles on three real-source
  cases, retain source-linked diagnostics, observe the predicate mutation, and
  use zero parser projections and zero model calls.

# Script that turns runs into the tables and figures in report.md.
analysis: research/experiments/E0095-can-one-generic-evaluator-execute-a-nest/analyse.sh
