id: "E0055"
title: "Accepted deterministic projections and composite parser validation"
question: >
  Can the accepted D0024, D0026 and D0027 projections produce target-valid composite parser inputs?
status: reported        # draft | running | reported | abandoned
opened: "2026-08-12"
closed: "2026-08-12"

# Every commit the result depends on. Exact, not "main".
repos:
  lazy-fortran-new: "f5dc131"
  standard-new: "c6cd889"

# What goes in. Pinned artifacts by manifest name; profiles by ID.
inputs:
  standard: j3-24-007
  profile: accepted-composite-projection-v1
  predecessor: E0054-R000001
  decisions: [D0024, D0026, D0027, D0028]

# The axes being varied. Omit the key if there is only one condition.
variables:
  target: [antlr4, bison, tree-sitter]
  lexical_representation: [target-independent-schema]

# Explain whether model names form a controlled family ladder or separate
# controls. Pin revisions and runtime settings before the first run.
model_selection: "No model calls. One fixed StandardIR input, accepted decisions, and three deterministic target exporters."

# Name these before running anything. Choosing a metric after seeing the data
# is how an experiment becomes a demonstration.
metrics:
  - source_syntax_records
  - generated_syntax_records
  - r401_expansions
  - r403_expansions
  - compositional_overlaps
  - lexical_schema_records
  - lexical_schema_projected
  - unresolved_schema_records
  - antlr_status
  - bison_status
  - treesitter_status
  - antlr_unresolved
  - bison_unresolved
  - treesitter_structural_error
  - antlr_warnings
  - bison_warnings
  - target_boundary
  - negative_control

# State the complete eligible set and exclusions before the first run. A rate
# over the successful subset is reported alongside the strict rate.
denominator: >
  The 522 source syntax records and the 100 R401/R403 inventory records are
  complete. The lexical schema denominator is the five E0053 residue terms.
  Every target receives the same generated projection.

# State the independent behavioral or structural oracle. Self-consistency is
# not an oracle.
independent_oracle: >
  E0049 and E0048 are rerun and their source hashes are checked. Independent
  source-driven traversals count every expansion, overlap, lexical and
  unresolved record. ANTLR4, Bison and tree-sitter validators compile the
  same projected input, and a controlled expansion mutation must fail.

# Record versions needed to reproduce each run.
toolchain:
  record_in_run: true
  fields: [compiler, fo, poppler, oracle_versions]

# What result would disappoint you? If nothing would, this is not an experiment.
falsifiable_by: >
  The experiment fails if a source record is dropped, an R401 separator or
  R403 scalar fact is not represented, an overlap loses either fact, a lexical
  source citation is absent, any target validator rejects the generated
  projection, or the controlled mutation passes.

# The condition that closes the experiment and the evidence it must report.
gate: >
  Generate one provenance-bearing composite input under D0024, D0026 and
  D0027. Report target validation and any deliberately unresolved lexical
  policy. A structural target rejection remains a valid reported boundary.

# Script that turns runs into the tables and figures in report.md.
analysis: research/experiments/E0055-can-accepted-projection-decisions-produc/analyse.sh
