id: "E0030"
title: "Canonical SX content hashing"
question: >
  Does canonical SX hashing remain stable after validation and writer
  serialization?
status: reported         # draft | running | reported | abandoned
opened: "2026-08-12"
closed: "2026-08-12"

# Every commit the result depends on. Exact, not "main".
repos:
  lazy-fortran-new: "74dd08c"
  standard-new: "f221edf"

# What goes in. Pinned artifacts by manifest name; profiles by ID.
inputs:
  implementation: standard-new fortsx, writer and sha256
  test: standard-new/test/test_fortsx_hash.f90

# The axes being varied. Omit the key if there is only one condition.
variables: {}

# Explain whether model names form a controlled family ladder or separate
# controls. Pin revisions and runtime settings before the first run.
model_selection: "No model calls; deterministic Fortran implementation and test."

# Name these before running anything. Choosing a metric after seeing the data
# is how an experiment becomes a demonstration.
metrics:
  - text_policy_self_test_status
  - text_policy_status
  - focused_test_status
  - full_pipeline_status
  - formatting_status
  - independent_oracle_mutation_status
  - validation_status
  - canonical_byte_count
  - sha256_status
  - invalid_node_rejection_status

# State the complete eligible set and exclusions before the first run. A rate
# over the successful subset is reported alongside the strict rate.
denominator: >
  The complete slice consists of SX parse, structural validation, writer-backed
  canonical serialization, fixed SHA-256 comparison, byte count and invalid
  node rejection. Arena storage and generated SX readers remain excluded.

# State the independent behavioral or structural oracle. Self-consistency is
# not an oracle.
independent_oracle: >
  test_fortsx_hash compares the canonical writer output with a SHA-256 digest
  independently computed from the canonical bytes and checks its exact byte
  count. It also supplies an invalid node and expects validation rejection. A
  controlled mutation of the first digest byte was run and had to fail before
  the accepted test was restored.

# Record versions needed to reproduce each run.
toolchain:
  record_in_run: true
  fields: [compiler, fo, poppler, oracle_versions]

# What result would disappoint you? If nothing would, this is not an experiment.
falsifiable_by: >
  Validation may accept an invalid node, serialization may add or lose bytes,
  the digest may differ from the fixed external vector, or the mutated digest
  oracle may still pass.

# The condition that closes the experiment and the evidence it must report.
gate: >
  Pin the production commit, run the focused hashing test, observe the
  controlled digest mutation fail, restore the oracle, and run text-policy,
  formatting and full fo gates successfully.

# Script that turns runs into the tables and figures in report.md.
analysis: research/experiments/E0030-does-canonical-sx-hashing-remain-stable-/analyse.sh
